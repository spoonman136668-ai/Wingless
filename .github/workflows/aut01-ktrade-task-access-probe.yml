name: AUT01 temporary KTRADE task access probe

on:
  push:
    branches:
      - ops/aut01-ktrade-maintenance-probe-20261002
    paths:
      - .github/workflows/aut01-ktrade-task-access-probe.yml
      - .github/aut01/AUT01-KTRADE-TASK-ACCESS-PROBE.ps1

permissions:
  contents: read

concurrency:
  group: aut01-ktrade-task-access-probe-wingless-up-b
  cancel-in-progress: false

jobs:
  probe:
    timeout-minutes: 5
    runs-on: [self-hosted, Windows, X64, wingless-up-b]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Probe KTRADE task access
        shell: cmd
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File "%GITHUB_WORKSPACE%\.github\aut01\AUT01-KTRADE-TASK-ACCESS-PROBE.ps1"
