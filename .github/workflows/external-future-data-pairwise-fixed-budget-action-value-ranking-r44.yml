name: Wingless pairwise fixed-budget action-value ranking R44
on:
  push:
    branches:
      - research/external-hosted-wingless-future-data-pairwise-fixed-budget-action-value-ranking-r44
    paths:
      - 'docs/experiments/wlm-lm-external-future-data-pairwise-fixed-budget-action-value-ranking-r44.json'
      - 'docs/experiments/wlm-lm-r44-successor-policy.json'
      - 'unitary/wlm_lm_external_future_data_pairwise_fixed_budget_action_value_ranking_r44.go'
      - 'cmd/wlm-lm-external-future-data-pairwise-fixed-budget-action-value-ranking-r44/main.go'
      - '.github/workflows/external-future-data-pairwise-fixed-budget-action-value-ranking-r44.yml'
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Validate frozen package
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 'fb911b5193e6b8e45b42dcd301e040beab90d0d5' HEAD
          git merge-base --is-ancestor 'cefd03d658d531e8089bafb69c02cca1f247066d' HEAD
          changed="$(git diff --name-only 'fb911b5193e6b8e45b42dcd301e040beab90d0d5..HEAD' | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/external-future-data-pairwise-fixed-budget-action-value-ranking-r44.yml' \
            'cmd/wlm-lm-external-future-data-pairwise-fixed-budget-action-value-ranking-r44/main.go' \
            'docs/experiments/wlm-lm-external-future-data-pairwise-fixed-budget-action-value-ranking-r44.json' \
            'docs/experiments/wlm-lm-r44-successor-policy.json' \
            'unitary/wlm_lm_external_future_data_pairwise_fixed_budget_action_value_ranking_r44.go' | sort)"
          test "$changed" = "$expected"
          test "$(git rev-parse 'cefd03d658d531e8089bafb69c02cca1f247066d:docs/experiments/wlm-lm-external-future-data-pairwise-fixed-budget-action-value-ranking-r44.json')" = '0e3dfaa0d89df6399e9e72202d4cb6d0426da353'
          test "$(git rev-parse 'cefd03d658d531e8089bafb69c02cca1f247066d:docs/experiments/wlm-lm-r44-successor-policy.json')" = 'd66ddc0e9fd416c12fad115e898af414d9340e97'
      - name: Verify exact READY_RESEARCH receipt
        shell: bash
        env:
          AUTHORITY_RECEIPT_SHA256: '8c982878a6348f613f048dae19d86bbd3ec392a0b106f21369fcb85d1f9cec8f'
          AUTHORITY_RECEIPT_B64: ''
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,hashlib,json,os,pathlib
          raw=base64.b64decode(os.environ["AUTHORITY_RECEIPT_B64"],validate=True)
          assert hashlib.sha256(raw).hexdigest()==os.environ["AUTHORITY_RECEIPT_SHA256"]
          r=json.loads(raw)
          assert r["schema"]=="ckb-plane.external-exposure-ready-research-receipt.v1"
          assert r["project"]=="Wingless"
          assert r["experiment"]=="WLM-LM-EXTERNAL-FUTURE-DATA-PAIRWISE-FIXED-BUDGET-ACTION-VALUE-RANKING-R44"
          assert r["preregistration_sha"]=="cefd03d658d531e8089bafb69c02cca1f247066d"
          assert r["manifest_sha256"]=="bf580dc3cfb748bf6306938b12cee2b2a89b27b76f76c86952744cda68a9d66f"
          assert r["ckb_plane_main_sha"]=="24ebf7a0e84bee2876a72de9442e7a2f625a8d97"
          assert r["plan_decision"]["disposition"]=="READY_PLAN"
          assert r["fetch_decision"]["disposition"]=="READY_FETCH"
          assert r["research_decision"]["disposition"]=="READY_RESEARCH"
          pathlib.Path("/tmp/authority.json").write_bytes(raw)
          PY
      - name: Fetch historical and unseen sealed manifests
        shell: bash
        run: |
          set -euo pipefail
          for n in transfer third fourth fifth sixth seventh eighth; do mkdir -p "$RUNNER_TEMP/r44-$n"; done
          python3 - <<'PY'
          import hashlib,pathlib,urllib.request,urllib.parse,os
          roots={n:pathlib.Path(os.environ["RUNNER_TEMP"])/("r44-"+n) for n in ("transfer","third","fourth","fifth","sixth","seventh","eighth")}
          historical={
            "transfer":[
              ("code","https://raw.githubusercontent.com/python/cpython/ebf955df7a89ed0c7968f79faec1de49f61ed7cb/Lib/statistics.py",61896,"3023ec949802c2e880a000775bfd1a6b70c21b5423881118141e3ec69d8e3336",41453,"66bb25b24a0316b4965c64798494de93a1d7332672b15b5f430ab6a2fb4b9d45"),
              ("structured","https://raw.githubusercontent.com/json-schema-org/JSON-Schema-Test-Suite/5b0ee1613e45fcc2bddac00e07c19cd49b00d8a8/tests/draft2020-12/uniqueItems.json",14490,"ed84ef6ddc827659e257ba64cbe9679f06932b6320bea5c07622bf3d2cc4daa5",14365,"95ddbd0eaef29aad5ecfc74f9da21b795481f58b2c59380324a445fcd4d08932"),
              ("technical-prose","https://raw.githubusercontent.com/golang/go/6f5c275ebdc454197fff5f1496521c8f81e20eef/doc/README.md",3124,"c1bf000e7a873b3afed329c5b9f9c07f7692b1d7fb2bfca2d7600cec8b1d1407",1454,"48c3d95b8b03864a4af41d892710675956cde85afd0d5d6c331594de9f17881b")],
            "third":[
              ("code","https://raw.githubusercontent.com/torvalds/linux/a74306e2e676f9775457366fc047a660fbf02f26/kernel/sched/core.c",303863,"9297982652b9810b3508993c06d3c6e097ebca5cbe1ef3a6246bccfa0c1128b1",41453,"50744a9e70d67d62c97f3f434f4f05788b6b8514c6bce46cf7dafbaf49e2abff"),
              ("structured","https://raw.githubusercontent.com/SchemaStore/schemastore/de76181a2ab215431d3e9314bc14f83cc3b01ad2/src/schemas/json/github-workflow.json",118601,"d10c9f4656e1bd5bc6727e9b35080e017dc167154726fca93da33c7a6bd1c4f3",14365,"2a97ba02bc5e479b1738f6f0c3e09318bb5a255350c84de014ddbcebea46af56"),
              ("technical-prose","https://raw.githubusercontent.com/rust-lang/book/1500248d8f230566e4ec9f27fcbb8fe9e2898ab1/src/ch01-03-hello-cargo.md",11025,"61369f359b84b646fc3773eb569a26bc18ba6edb4cf2be06a84472c7054c0e39",1454,"23c002a1984ed065abfdbafa82100ed54d6bf6276a947676e710a30c75d96017")],
            "fourth":[
              ("code","https://raw.githubusercontent.com/kubernetes/kubernetes/e7967bb9b76d43a6388abb7a4e90d2f899ef97ff/pkg/kubelet/kubelet.go",156626,"e0f247ef45cb281166b58ba1a013dc6925023388193bd74c1f126c695b770d34",41453,"283073d9f6c0dd868c39a913364bce6744ff1e29c038f6920197c0d33e0c2ac1"),
              ("structured","https://raw.githubusercontent.com/microsoft/TypeScript/50d70a3f5f453a79a4323b263165da51f656a4e3/package-lock.json",143844,"52b6c9bd0a26ef1b0fc27dfbfaa00df6a047cdddd587d07c4f6c1c3345faf5cf",14365,"a46fcfb7d862b03b750b61a5f667d4ac25a064df9ccb746e395db7e864068933"),
              ("technical-prose","https://raw.githubusercontent.com/django/django/a461af8ce48762d7ec602260aaff81014ddccbcb/docs/intro/tutorial01.txt",10844,"1cf1817e6211b7c0fa9e8044ee808fde1e8f16ca5f9d5ab5358510a5c9591b96",1454,"5d0c2efd139bd6094098bc893ed746020f03e0860a25f278348f43f47c236222")],
            "fifth":[
              ("code","https://raw.githubusercontent.com/pytorch/pytorch/496340f06ef7bda2800522429ba3f4e3473a92fa/torch/_inductor/scheduler.py",539420,"b13a89d0fd77430e2a637dae41980086909c4ad4a855b8418dc17286c39953b8",41453,"504b68653b5478b88216f6342a74bacc5982549657005fb486dd00d753b4ea9a"),
              ("structured","https://raw.githubusercontent.com/microsoft/vscode/6fad7188e7dbf7db564e5e4a85960eb2bf69bdf4/package-lock.json",784171,"73224989048e176e7eeafa8aa729df7e4d510f4bd453018902d95345db0fe886",14365,"5c0f3a215ba35b7fbcaae212d27a33ba5109e16d89809987d16fa89072534281"),
              ("technical-prose","https://raw.githubusercontent.com/numpy/numpy/2f1eca306857b641fb0fef0ab854a2d4137e1581/doc/source/user/absolute_beginners.rst",52653,"945a0a598d080ee7526c9bd5459ce615a5b49fe0331adfdf8bbd8812e908e7e3",1454,"527e21110a7f84a1939ccf6063fdfeb77905d9ec180e5fde18488d21b90c4f49")]}
          for group,sources in historical.items():
            for name,url,full_n,full_h,prefix_n,prefix_h in sources:
              data=urllib.request.urlopen(urllib.request.Request(url,headers={"User-Agent":"wingless-r44"}),timeout=90).read(full_n+1)
              assert len(data)==full_n and hashlib.sha256(data).hexdigest()==full_h
              p=data[:prefix_n];assert hashlib.sha256(p).hexdigest()==prefix_h
              (roots[group]/(name+".bin")).write_bytes(p)
          unseen={
            "sixth":[
              ("code","redis/redis","b540ca49cba815f3fbe634363c3df68d4f4f127a","src/server.c","0ddd2c4241d259c1e8ed91d7ea30b30e255c6c67",41453),
              ("structured","rust-lang/rust","28221559263a3976766cf305940e80e30cf9ba8a","Cargo.lock","49ab9451ba5e00d0f04bb3efdec5bff2512219b8",14365),
              ("technical-prose","postgres/postgres","3ff475ac12ec8d8d07cf3fd86144659285a59d83","doc/src/sgml/ref/select.sgml","18392f7caec3667c3e2e510715c62fa90256980d",1454)],
            "seventh":[
              ("code","llvm/llvm-project","9c8979d1bb551949cf7985bf36c53e55aaf57ee2","clang/lib/Sema/SemaExpr.cpp","9b3384cdbdac8cf1a2ced41109b35f292fdf9861",41453),
              ("structured","webpack/webpack","63f2330a19e7dfd3ec683265171f48c2e617ea6e","yarn.lock","9bac271a65bbd760da305f12aa16f943b8537ea9",14365),
              ("technical-prose","curl/curl","6d013631195b1c349e5f783ac8b58ad376c0bdde","docs/libcurl/curl_easy_setopt.md","23eda35203339b36d08956d1c17d8ea8924ae65d",1454)],
            "eighth":[
              ("code","rust-lang/rust","28221559263a3976766cf305940e80e30cf9ba8a","compiler/rustc_hir_typeck/src/fn_ctxt/_impl.rs","1ad6225a8c467e4b0d8eb101faf62023949c353e",41453),
              ("structured","vitejs/vite","10033218d239c927cdc375970b5741cce408e81b","pnpm-lock.yaml","1429512d32326cad970a993ab6832080e5579292",14365),
              ("technical-prose","git/git","8103b446517e0c44e67561b9d0ccce56efa60a71","Documentation/git.adoc","3abb4701c308f0956a4058061352fae7fdba7884",1454)]}
          for group,sources in unseen.items():
            for name,repo,commit,path,blob,prefix_n in sources:
              url=f"https://raw.githubusercontent.com/{repo}/{commit}/{urllib.parse.quote(path)}"
              data=urllib.request.urlopen(urllib.request.Request(url,headers={"User-Agent":"wingless-r44"}),timeout=90).read()
              got=hashlib.sha1((f"blob {len(data)}\0").encode()+data).hexdigest()
              assert got==blob and len(data)>=prefix_n,(group,name,got,blob,len(data))
              (roots[group]/(name+".bin")).write_bytes(data[:prefix_n])
          PY
          for n in transfer third fourth fifth sixth seventh eighth; do
            key="$(echo "$n" | tr '[:lower:]' '[:upper:]')_ROOT"
            echo "$key=$RUNNER_TEMP/r44-$n" >> "$GITHUB_ENV"
          done
      - name: Full Go regression
        run: go test ./... -count=1
      - name: Run frozen pairwise ranking twice
        shell: bash
        run: |
          set -euo pipefail
          args=(--transfer-root "$TRANSFER_ROOT" --third-root "$THIRD_ROOT" --fourth-root "$FOURTH_ROOT" --fifth-root "$FIFTH_ROOT" --sixth-root "$SIXTH_ROOT" --seventh-root "$SEVENTH_ROOT" --eighth-root "$EIGHTH_ROOT")
          go run ./cmd/wlm-lm-external-future-data-pairwise-fixed-budget-action-value-ranking-r44 "${args[@]}" > /tmp/result1.json
          go run ./cmd/wlm-lm-external-future-data-pairwise-fixed-budget-action-value-ranking-r44 "${args[@]}" > /tmp/result2.json
          cmp /tmp/result1.json /tmp/result2.json
          cat /tmp/result1.json
      - name: Classify
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,math,pathlib
          r=json.loads(pathlib.Path("/tmp/result1.json").read_text());m=r["metrics"]
          valid=(m["historical_manifest_count"]==4 and m["unseen_manifest_count"]==3 and m["candidate_action_count"]==9 and
                 m["candidate_pair_count"]==108 and m["non_tie_pair_count"]>=72 and
                 m["fit_failure_count"]==0 and m["state_stratum_insufficient_count"]==0 and
                 m["state_definition_mismatch_count"]==0 and m["fixed_budget_mismatch_count"]==0 and
                 m["heldout_outcome_use_before_pair_freeze"]==0 and m["post_result_pair_or_threshold_choice_count"]==0 and
                 m["source_identity_mismatch_count"]==0 and m["capacity_growth_event_count"]==0 and
                 m["tokenizer_use_count"]==0 and m["external_model_call_count"]==0 and
                 m["counter_overflow_count"]==0 and m["invalid_row_count"]==0 and all(math.isfinite(float(v)) for v in m.values()))
          per_all=all(m[n+"_r43_minus_action_only_accuracy"]>0 for n in ("sixth","seventh","eighth"))
          supported=(valid and m["r43_pairwise_winner_accuracy"]>=0.65 and m["r43_minus_action_only_accuracy"]>=0.10 and
                     per_all and m["r43_mean_decision_regret"]<m["action_only_mean_decision_regret"])
          mixed=(valid and not supported and m["r43_minus_action_only_accuracy"]>=0.05 and
                 m["r43_mean_decision_regret"]<m["action_only_mean_decision_regret"])
          cls="invalid" if not valid else "supported" if supported else "mixed" if mixed else "negative"
          out={"schema":"wingless.research-classification.v1","experiment":"WLM-LM-EXTERNAL-FUTURE-DATA-PAIRWISE-FIXED-BUDGET-ACTION-VALUE-RANKING-R44",
               "classification":cls,"validity_pass":valid,"pairwise_ranking_support":supported,"mixed_signal":mixed,
               "authority_receipt_sha256":"8c982878a6348f613f048dae19d86bbd3ec392a0b106f21369fcb85d1f9cec8f","rsi_success":False,
               "rsi_success_reason":"R44 is bounded ordinal intervention-choice attribution on three disjoint unseen manifests; no richer allocator is authorized by this result alone.","metrics":m}
          pathlib.Path("/tmp/classification.json").write_text(json.dumps(out,separators=(",",":")),encoding="utf-8")
          print(json.dumps(out,separators=(",",":")))
          if cls=="invalid": raise SystemExit(2)
          PY
      - name: Delete external bytes
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP"/r44-*
      - name: Upload evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: wingless-pairwise-fixed-budget-action-value-ranking-r44
          path: |
            /tmp/authority.json
            /tmp/result1.json
            /tmp/result2.json
            /tmp/classification.json
          if-no-files-found: error
