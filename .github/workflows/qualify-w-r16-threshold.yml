name: Wingless W-R16 frozen threshold scientific validation
on:
  push:
    branches: [research/w-r16-train-threshold-r1]
permissions:
  contents: read
jobs:
  science:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify frozen parent, prereg, and code identity
        run: |
          set -euo pipefail
          git merge-base --is-ancestor cd9ed8c98e655e9ebf77204750f9ca733ced83e5 HEAD
          test "$(git hash-object research/contrib/chatgpt/20261012-w-r15-noisy-positive/execute.py)" = 0a5a6f6c2993a04ca46c3ec918dd8fbdaac8bda5
          test "$(git hash-object research/contrib/chatgpt/20261012-w-r16-threshold/prereg.json)" = 63b0946d7ab00137b764021e263c64e5025f273b
          test "$(git hash-object research/contrib/chatgpt/20261012-w-r16-threshold/execute.py)" = bff80fd603f88cb586a31143d09de987a1f5c2b4
          python3 -m json.tool research/contrib/chatgpt/20261012-w-r16-threshold/prereg.json >/dev/null
          python3 -m py_compile research/contrib/chatgpt/20261012-w-r16-threshold/execute.py
      - name: Original frozen train-only threshold science
        run: |
          set -euo pipefail
          python3 -B research/contrib/chatgpt/20261012-w-r16-threshold/execute.py > /tmp/W-R16-original.json
          python3 -m json.tool /tmp/W-R16-original.json
      - uses: actions/upload-artifact@v4
        with:
          name: W-R16-original-threshold
          path: /tmp/W-R16-original.json
          if-no-files-found: error
          retention-days: 90
      - name: Final full Wingless regression
        run: go test ./... && go build ./...
