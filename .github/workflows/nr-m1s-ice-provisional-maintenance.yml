name: NR-M1S Wingless Source-Reviewed Baseline and Provisional Atlas Maintenance
on:
  pull_request:
    paths:
      - '.github/workflows/nr-m1s-ice-provisional-maintenance.yml'
      - 'scripts/nr_m1s_provisional_source_receipts.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  source-index-only:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'research/itd02-nr-m1q-selected-task-effect-20261030'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out exact same-repo research source without switching base
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up frozen original Wingless Go version
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: '1.25.5'
          cache: false

      - name: Set up Python for existing G28 source-aware generator
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Verify exact authorized PR head and clean original source
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain)"
          test "$(git remote get-url origin | grep -c 'spoonman136668-ai/Wingless')" = '1'

      - name: Run existing ICE and source-review checks first
        id: current
        shell: bash
        run: |
          set -euo pipefail
          if go run ./cmd/ice validate; then
            go run ./cmd/ice relationships > "$RUNNER_TEMP/wingless-relationships.json"
            if python -B scripts/validate_code_atlas.py --root . --relationships "$RUNNER_TEMP/wingless-relationships.json"; then
              echo 'refresh=false' >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo 'refresh=true' >> "$GITHUB_OUTPUT"

      - name: Rebuild canonical Wingless syntax index from exact source
        if: steps.current.outputs.refresh == 'true'
        run: go run ./cmd/ice build

      - name: Derive explicit unreviewed receipts for newly declared symbols
        if: steps.current.outputs.refresh == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python -B scripts/nr_m1s_provisional_source_receipts.py --output "$RUNNER_TEMP/nr-m1s-provisional.json"
          python -B scripts/maintain_code_atlas.py --root . --receipts "$RUNNER_TEMP/nr-m1s-provisional.json"

      - name: Enforce unchanged historical source-reviewed labels and native source
        if: steps.current.outputs.refresh == 'true'
        shell: bash
        run: |
          set -euo pipefail
          go run ./cmd/ice validate
          go run ./cmd/ice relationships > "$RUNNER_TEMP/wingless-relationships.json"
          python -B scripts/validate_code_atlas.py --root . --relationships "$RUNNER_TEMP/wingless-relationships.json"
          git diff --name-only | grep -v '^.ice/' && { echo 'NON_ICE_CHANGE_REJECTED'; exit 1; } || true
          test -z "$(git ls-files --others --exclude-standard)"
          python -B - <<'PY'
          import json
          x=json.load(open('.ice/code-intelligence.json',encoding='utf8'))
          assert x['coverage']['source_reviewed_labels']>=352
          assert x['coverage']['lexical_provisional_labels']>=1
          assert all(n.get('review_evidence') is None for n in x['nodes'] if n['evidence_basis']=='lexical-provisional')
          print('NRM1S_352_HISTORICAL_REVIEWS_PRESERVED_NEW_SYMBOLS_UNREVIEWED')
          PY

      - name: Commit only canonical ICE artifacts on same unmerged research branch
        if: steps.current.outputs.refresh == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- .ice/
          git diff --cached --name-only | grep -v '^.ice/' && exit 1 || true
          git diff --cached --quiet && { echo 'EMPTY_INDEX_UPDATE'; exit 1; }
          git commit -m 'chore(nr-m1s): source-bind provisional symbols and preserve reviewed ICE'
          git push origin HEAD:refs/heads/research/itd02-nr-m1q-selected-task-effect-20261030

      - name: Requalify original ICE on committed source plus only index changes
        shell: bash
        run: |
          set -euo pipefail
          go run ./cmd/ice validate
          go run ./cmd/ice relationships > "$RUNNER_TEMP/wingless-relationships.json"
          python -B scripts/validate_code_atlas.py --root . --relationships "$RUNNER_TEMP/wingless-relationships.json"
          test -z "$(git status --porcelain)"

# THIS JOB NEVER confers independent source review or changes the native model.
# G28 provisional means UNREVIEWED. Existing ICE and semantic checks stay intact.
