name: Wingless W-R30 frozen observed marker alias boundary
on:
  push:
    branches: [research/w-r30-marker-alias-impossibility-r1]
permissions:
  contents: read
jobs:
  science:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify immutable prereg and exact source lineage
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 5617fd5f5a7ac4ec07b084ac08ede17e5c66f96d HEAD
          test "$(git hash-object research/contrib/chatgpt/20261013-w-r25-marker-invariance/execute.py)" = de39401c8db92ddbe5019277c1e6a21786d9a994
          test "$(git hash-object research/contrib/chatgpt/20261013-w-r30-marker-alias/prereg.json)" = f177443c1d66d6032e92abeb375cbb0ef9f9c811
          test "$(git hash-object research/contrib/chatgpt/20261013-w-r30-marker-alias/execute.py)" = 4dd2510a89fd8d142f62724dea529499530b221d
          python3 -m json.tool research/contrib/chatgpt/20261013-w-r30-marker-alias/prereg.json > /dev/null
          python3 -m py_compile research/contrib/chatgpt/20261013-w-r30-marker-alias/execute.py
      - name: First-use scientific evaluation on sealed latent-world cohort
        run: |
          set -euo pipefail
          python3 -B research/contrib/chatgpt/20261013-w-r30-marker-alias/execute.py > /tmp/W-R30-original.json
          python3 -m json.tool /tmp/W-R30-original.json > /dev/null
          python3 - <<'PY'
          import json
          a=json.load(open("/tmp/W-R30-original.json"))
          assert a["sealed_heldout_seeds"]==list(range(1000,1016))
          assert a["distinct_observed_samples"]==2592
          assert len(a["cells"])==18
          print("CLASSIFICATION",a["classification"])
          for c in a["cells"]:
              print("CELL",c["generator"],c["encoding"],c["tick"],
                    [(k,v["erasure_recall"],v["legitimate_false_mask_rate"],
                      v["balanced_latent_mask_accuracy"]) for k,v in c["arms"].items()])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: W-R30-original-latent-marker-alias
          path: /tmp/W-R30-original.json
          if-no-files-found: error
          retention-days: 90
      - name: Full Wingless regression and build
        run: go test ./... && go build ./...
