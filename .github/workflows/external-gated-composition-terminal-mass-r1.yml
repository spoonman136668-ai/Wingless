name: Wingless gated composition terminal mass R1

on:
  push:
    branches:
      - research/external-hosted-wingless-gated-terminal-mass-r1
    paths:
      - 'unitary/wlm_lm_external_gated_composition_terminal_mass_r1.go'
      - 'cmd/wlm-lm-external-gated-composition-terminal-mass-r1/main.go'
      - '.github/workflows/external-gated-composition-terminal-mass-r1.yml'

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 3
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Validate frozen package
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "5022c0395aadf2ce86fca4c4ecc29334f357a742"
          test "$(git rev-parse HEAD^^)" = "0b332964af73eef8b74d78e0eb5e0be194e13418"
          test "$(git rev-parse HEAD^^^)" = "75e49e3e402c66c8af21e060a4162d369f3ed1ec"
      - name: Verify READY_RESEARCH receipt
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib,json,pathlib
          raw=r'''{"schema":"ckb-plane.external-exposure-ready-research-receipt.v1","project":"Wingless","experiment":"WLM-LM-EXTERNAL-GATED-COMPOSITION-TERMINAL-MASS-R1","preregistration_sha":"0b332964af73eef8b74d78e0eb5e0be194e13418","research_host":"runnervm8df0l","runner_id":"GitHub Actions 1000001399","manifest_sha256":"75cdb3b97dbb7017299f573d506f07095ed89c06264b29724b78f29c909d4da4","plan_decision":{"schema":"ckb-plane.external-exposure.v1","disposition":"READY_PLAN","scope":"plan-only","reasons":null},"fetch_decision":{"schema":"ckb-plane.external-exposure-fetch.v1","disposition":"READY_FETCH","scope":"fetch-verify-only","reasons":null},"research_decision":{"schema":"ckb-plane.external-exposure-research.v1","disposition":"READY_RESEARCH","scope":"research-consume-once","reasons":null},"ckb_plane_main_sha":"36d99a0257120ede57bb96638660d35014dd529e"}'''
          assert hashlib.sha256(raw.encode()).hexdigest()=="5ead5f9b6ed64354eb65034e7dfbaadb2822128e1766d25dcf51bf9c1f0ccd39"
          assert json.loads(raw)["research_decision"]["disposition"]=="READY_RESEARCH"
          pathlib.Path("/tmp/authority.json").write_text(raw)
          PY
      - name: Fetch exact external sources
        shell: bash
        run: |
          set -euo pipefail
          export EXTERNAL_ROOT="$RUNNER_TEMP/wingless-terminal-mass-r1"; mkdir -p "$EXTERNAL_ROOT"
          python3 - <<'PY'
          import hashlib,os,pathlib,urllib.request
          sources=[
            ("code","https://raw.githubusercontent.com/python/cpython/ebf955df7a89ed0c7968f79faec1de49f61ed7cb/Lib/fractions.py","7a95f1c506c9ac4b2277df5f2bdd9d61cc67b520c45021a5a961939770221ef6",41453),
            ("structured","https://raw.githubusercontent.com/json-schema-org/JSON-Schema-Test-Suite/5b0ee1613e45fcc2bddac00e07c19cd49b00d8a8/tests/draft2020-12/type.json","4c5cbe6cbcd28af73761091367b20e07d0403847e236c06c31fc27061bd81192",14365),
            ("technical-prose","https://raw.githubusercontent.com/golang/go/6f5c275ebdc454197fff5f1496521c8f81e20eef/README.md","8247b7c5de1e74854aac1a08aa5894444d1d33b4045c70d5cc3367ad0e25c3f3",1454),
          ]
          root=pathlib.Path(os.environ["EXTERNAL_ROOT"])
          for d,u,h,n in sources:
              b=urllib.request.urlopen(urllib.request.Request(u,headers={"User-Agent":"wingless-terminal-mass-r1"}),timeout=30).read(n+1)
              assert len(b)==n and hashlib.sha256(b).hexdigest()==h
              (root/(d+".bin")).write_bytes(b)
          PY
          echo "EXTERNAL_ROOT=$EXTERNAL_ROOT" >> "$GITHUB_ENV"
      - name: Full Go regression
        run: go test ./... -count=1
      - name: Run frozen terminal-mass probe twice
        shell: bash
        run: |
          set -euo pipefail
          go run ./cmd/wlm-lm-external-gated-composition-terminal-mass-r1 --code "$EXTERNAL_ROOT/code.bin" --structured "$EXTERNAL_ROOT/structured.bin" --technical-prose "$EXTERNAL_ROOT/technical-prose.bin" > /tmp/result1.json
          go run ./cmd/wlm-lm-external-gated-composition-terminal-mass-r1 --code "$EXTERNAL_ROOT/code.bin" --structured "$EXTERNAL_ROOT/structured.bin" --technical-prose "$EXTERNAL_ROOT/technical-prose.bin" > /tmp/result2.json
          cmp /tmp/result1.json /tmp/result2.json
          cat /tmp/result1.json
      - name: Classify
        shell: bash
        run: |
          python3 - <<'PY'
          import json,math,pathlib
          r=json.loads(pathlib.Path("/tmp/result1.json").read_text());m=r["metrics"]
          valid=(m["source_identity_mismatch_count"]==0 and m["source_count"]==3 and m["total_source_bytes"]==57272 and m["selected_motif_count"]==512 and m["intermediate_runtime_pair_state_cap"]==512 and m["depth2_query_count"]>0 and m["depth3_query_count"]>0 and m["minimum_intermediate_beam_retained_mass"]>=0.75 and m["maximum_probability_mass_error"]<=1e-9 and m["terminal_prune_event_count"]==0 and m["capacity_growth_event_count"]==0 and m["tokenizer_use_count"]==0 and m["external_model_call_count"]==0 and m["invalid_row_count"]==0 and m["counter_overflow_count"]==0 and all(math.isfinite(float(v)) for v in m.values()))
          thresholds=(m["depth2_pooled_gated_minus_first_order_accuracy"]>=0.002 and m["depth3_pooled_gated_minus_first_order_accuracy"]>=0.002 and m["depth2_minimum_source_gated_minus_first_order_accuracy"]>=-0.01 and m["depth3_minimum_source_gated_minus_first_order_accuracy"]>=-0.01)
          positive=(m["depth2_pooled_gated_minus_first_order_accuracy"]>0 or m["depth3_pooled_gated_minus_first_order_accuracy"]>0)
          cls="invalid" if not valid else ("supported" if thresholds else ("mixed" if positive else "negative"))
          out={"schema":"wingless.research-classification.v1","experiment":"WLM-LM-EXTERNAL-GATED-COMPOSITION-TERMINAL-MASS-R1","classification":cls,"validity_pass":valid,"thresholds_pass":thresholds,"authority_receipt_sha256":"5ead5f9b6ed64354eb65034e7dfbaadb2822128e1766d25dcf51bf9c1f0ccd39","metrics":m}
          pathlib.Path("/tmp/classification.json").write_text(json.dumps(out,separators=(",",":")));print(json.dumps(out,separators=(",",":")))
          if not valid: raise SystemExit(2)
          PY
      - name: Delete external bytes
        if: always()
        run: rm -rf "$RUNNER_TEMP/wingless-terminal-mass-r1"
      - name: Upload evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: wingless-external-gated-composition-terminal-mass-r1
          path: |
            /tmp/authority.json
            /tmp/result1.json
            /tmp/result2.json
            /tmp/classification.json
          if-no-files-found: error
