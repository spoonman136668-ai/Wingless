name: DK15 original public mission native source-selected actor
on:
  pull_request:
    paths:
      - 'research/native/itd02/dk15/**'
      - '.github/workflows/itd02-dk15-native-genuine-mission-actor.yml'
permissions:
  contents: read
jobs:
  selected-native-source-only:
    name: DK15 genuine public mission Go native actor / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.5'
          cache: false
      - name: Original DK13 parity, genuine-mission DK15 actor, strict source-only receipts
        shell: bash
        run: |
          set -euo pipefail
          go test -count=1 -v ./research/native/itd02/dk15/... ./research/native/itd02/dk14/... ./research/native/itd02/dk13/...
          go vet ./research/native/itd02/dk15/...
          go build ./research/native/itd02/dk15/...
          echo DK15_NATIVE_ACTOR_GENUINE_MISSION_SOURCEONLY=PASS
          echo DK15_ORIGINAL_FARAMA_EPISODES=ZERO
          echo DK15_SCIENTIFIC_FIRST_USE=NO
