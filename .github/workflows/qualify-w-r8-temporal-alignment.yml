name: Wingless W-R8 temporal-alignment science
on:
  push:
    branches: [research/w-r8-temporal-alignment-r1]
permissions:
  contents: read
jobs:
  science:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Frozen source and deterministic experiment
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 9e406e12c46523ce9ca8e522a5668bf95bd440e2 HEAD
          python3 -B research/contrib/chatgpt/20261012-w-r8-temporal-alignment/execute.py > "$RUNNER_TEMP/wr8.json"
          python3 -m json.tool "$RUNNER_TEMP/wr8.json"
      - uses: actions/upload-artifact@v4
        with:
          name: w-r8-original-temporal-alignment
          path: ${{ runner.temp }}/wr8.json
          if-no-files-found: error
          retention-days: 90
      - name: Full Wingless regression
        run: |
          go test ./...
          go build ./...
