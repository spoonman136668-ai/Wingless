name: Research Sidecar R6 Status Sample 3

on:
  push:
    branches:
      - ops/research-autonomy-provider-probe-r1
    paths:
      - .github/workflows/research-sidecar-r6-status-sample.yml

permissions:
  contents: read

jobs:
  sample:
    runs-on: [self-hosted, Windows, X64, wingless-research-safe]
    timeout-minutes: 3
    steps:
      - name: Read r6 status without mutation
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference='Stop'
          $Root='C:\ProgramData\CKBR\research-sidecar'
          $Exe=Join-Path $Root 'bin\research-sidecar.exe'
          $Config=Join-Path $Root 'config\autonomy.yaml'
          $Expected='4761896dd6467f2ecf8b8bd825b78b48a9c615edd07cf3bbac78946ca1d7447f'
          if((Get-FileHash -LiteralPath $Exe -Algorithm SHA256).Hash.ToLowerInvariant()-cne$Expected){throw 'R6_STATUS_BINARY_MISMATCH'}
          $Task=Get-ScheduledTask -TaskName 'CKBPlane Research Sidecar' -ErrorAction Stop
          Write-Host "task_state=$($Task.State)"
          Write-Host "task_principal=$($Task.Principal.UserId)"
          $Raw=& $Exe -mode status -config $Config 2>&1
          if($LASTEXITCODE-ne0){throw "R6_STATUS_FAILED output=$($Raw -join ' ')"}
          $Raw|ForEach-Object{Write-Host ([string]$_)}
          $Procs=@(Get-Process -Name 'research-sidecar' -ErrorAction SilentlyContinue)
          Write-Host "sidecar_process_count=$($Procs.Count)"
          foreach($P in $Procs){
            Write-Host "sidecar_pid=$($P.Id)"
            $Conns=@(Get-NetTCPConnection -OwningProcess $P.Id -ErrorAction SilentlyContinue)
            Write-Host "sidecar_tcp_connection_count=$($Conns.Count)"
            foreach($Conn in $Conns){
              Write-Host "tcp state=$($Conn.State) remote=$($Conn.RemoteAddress):$($Conn.RemotePort)"
            }
          }
          Write-Host 'RESEARCH_SIDECAR_R6_STATUS_SAMPLE=PASS'
