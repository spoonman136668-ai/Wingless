name: Wingless external raw representation compositional reasoning R1

on:
  push:
    branches:
      - research/external-hosted-wingless-reasoning-r1
    paths:
      - 'unitary/wlm_lm_external_raw_rep_compositional_reasoning_r1.go'
      - 'cmd/wlm-lm-external-raw-rep-compositional-reasoning-r1/main.go'
      - '.github/workflows/external-raw-rep-compositional-reasoning-r1.yml'

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 3

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Validate frozen two-commit package
        shell: bash
        run: |
          set -euo pipefail
          parent='13bf0de18304d199d5f712f88ae92f489b579c60'
          prereg='76e0afd9085dce51639b66e4fe7c10977b28ebe2'
          test "$(git rev-parse HEAD^)" = "$prereg"
          test "$(git rev-parse HEAD^^)" = "$parent"
          mapfile -t first_files < <(git diff-tree --no-commit-id --name-only -r "$prereg")
          test "${#first_files[@]}" -eq 1
          test "${first_files[0]}" = 'docs/experiments/wlm-lm-external-raw-rep-compositional-reasoning-r1.json'
          mapfile -t final_files < <(git diff-tree --no-commit-id --name-only -r HEAD)
          test "${#final_files[@]}" -eq 3
          printf '%s\n' "${final_files[@]}" | grep -Fx 'unitary/wlm_lm_external_raw_rep_compositional_reasoning_r1.go'
          printf '%s\n' "${final_files[@]}" | grep -Fx 'cmd/wlm-lm-external-raw-rep-compositional-reasoning-r1/main.go'
          printf '%s\n' "${final_files[@]}" | grep -Fx '.github/workflows/external-raw-rep-compositional-reasoning-r1.yml'
          python3 - <<'PY'
          import json
          p=json.load(open('docs/experiments/wlm-lm-external-raw-rep-compositional-reasoning-r1.json',encoding='utf-8'))
          assert p['schema']=='wingless.direct-preregistration.v1'
          assert p['experiment']=='WLM-LM-EXTERNAL-RAW-REP-COMPOSITIONAL-REASONING-R1'
          assert p['exact_parent_sha']=='13bf0de18304d199d5f712f88ae92f489b579c60'
          assert p['north_star_sha256']=='e9a7b9b7371d6636d791e47fb1fb166c143687d8d41013a8fb5826ef3a6ac465'
          PY
          echo 'WINGLESS_EXTERNAL_REASONING_R1_FROZEN_PACKAGE=PASS'

      - name: Verify exact CKB-plane READY_RESEARCH receipt
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,pathlib
          raw=r'''{"schema":"ckb-plane.external-exposure-ready-research-receipt.v1","project":"Wingless","experiment":"WLM-LM-EXTERNAL-RAW-REP-COMPOSITIONAL-REASONING-R1","preregistration_sha":"76e0afd9085dce51639b66e4fe7c10977b28ebe2","research_host":"runnervm8df0l","runner_id":"GitHub Actions 1000001357","manifest_sha256":"75cdb3b97dbb7017299f573d506f07095ed89c06264b29724b78f29c909d4da4","plan_decision":{"schema":"ckb-plane.external-exposure.v1","disposition":"READY_PLAN","scope":"plan-only","reasons":null},"fetch_decision":{"schema":"ckb-plane.external-exposure-fetch.v1","disposition":"READY_FETCH","scope":"fetch-verify-only","reasons":null},"research_decision":{"schema":"ckb-plane.external-exposure-research.v1","disposition":"READY_RESEARCH","scope":"research-consume-once","reasons":null},"ckb_plane_main_sha":"36d99a0257120ede57bb96638660d35014dd529e"}'''
          assert hashlib.sha256(raw.encode()).hexdigest()=='73ba709e489f2c1ae7f01ccc33228639238df66a004584a3df6a6fbbcd5a5b46'
          r=json.loads(raw)
          assert r['project']=='Wingless'
          assert r['experiment']=='WLM-LM-EXTERNAL-RAW-REP-COMPOSITIONAL-REASONING-R1'
          assert r['preregistration_sha']=='76e0afd9085dce51639b66e4fe7c10977b28ebe2'
          assert r['research_decision']['disposition']=='READY_RESEARCH'
          assert r['research_decision']['scope']=='research-consume-once'
          pathlib.Path('/tmp/wingless-external-reasoning-r1-authority.json').write_text(raw,encoding='utf-8')
          PY

      - name: Fetch exact external sources into ephemeral scratch
        shell: bash
        run: |
          set -euo pipefail
          export EXTERNAL_ROOT="$RUNNER_TEMP/wingless-external-reasoning-r1"
          mkdir -p "$EXTERNAL_ROOT"
          python3 - <<'PY'
          import hashlib,json,os,pathlib,urllib.parse,urllib.request
          sources=[
            ('code','https://raw.githubusercontent.com/python/cpython/ebf955df7a89ed0c7968f79faec1de49f61ed7cb/Lib/fractions.py','7a95f1c506c9ac4b2277df5f2bdd9d61cc67b520c45021a5a961939770221ef6',41453),
            ('structured','https://raw.githubusercontent.com/json-schema-org/JSON-Schema-Test-Suite/5b0ee1613e45fcc2bddac00e07c19cd49b00d8a8/tests/draft2020-12/type.json','4c5cbe6cbcd28af73761091367b20e07d0403847e236c06c31fc27061bd81192',14365),
            ('technical-prose','https://raw.githubusercontent.com/golang/go/6f5c275ebdc454197fff5f1496521c8f81e20eef/README.md','8247b7c5de1e74854aac1a08aa5894444d1d33b4045c70d5cc3367ad0e25c3f3',1454),
          ]
          root=pathlib.Path(os.environ['EXTERNAL_ROOT'])
          rows=[]
          for domain,url,want_sha,want_bytes in sources:
              u=urllib.parse.urlparse(url)
              assert u.scheme=='https' and u.hostname=='raw.githubusercontent.com'
              req=urllib.request.Request(url,headers={'User-Agent':'wingless-external-reasoning-r1'})
              with urllib.request.urlopen(req,timeout=30) as response:
                  data=response.read(want_bytes+1)
              assert len(data)==want_bytes
              actual=hashlib.sha256(data).hexdigest()
              assert actual==want_sha
              (root/(domain+'.bin')).write_bytes(data)
              rows.append({'domain':domain,'bytes':len(data),'sha256':actual})
          assert sum(x['bytes'] for x in rows)==57272
          pathlib.Path('/tmp/wingless-external-reasoning-r1-sources.json').write_text(json.dumps(rows,separators=(',',':')),encoding='utf-8')
          PY
          echo "EXTERNAL_ROOT=$EXTERNAL_ROOT" >> "$GITHUB_ENV"

      - name: Full Go regression
        shell: bash
        run: |
          set -euo pipefail
          go test ./... -count=1

      - name: Run frozen external representation reasoning probe twice
        shell: bash
        run: |
          set -euo pipefail
          go run ./cmd/wlm-lm-external-raw-rep-compositional-reasoning-r1 \
            --code "$EXTERNAL_ROOT/code.bin" \
            --structured "$EXTERNAL_ROOT/structured.bin" \
            --technical-prose "$EXTERNAL_ROOT/technical-prose.bin" > /tmp/result1.json
          go run ./cmd/wlm-lm-external-raw-rep-compositional-reasoning-r1 \
            --code "$EXTERNAL_ROOT/code.bin" \
            --structured "$EXTERNAL_ROOT/structured.bin" \
            --technical-prose "$EXTERNAL_ROOT/technical-prose.bin" > /tmp/result2.json
          cmp /tmp/result1.json /tmp/result2.json
          echo 'WINGLESS_EXTERNAL_REASONING_R1_DUPLICATE_BYTE_IDENTICAL=PASS'
          cat /tmp/result1.json

      - name: Classify from frozen preregistration
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,math,pathlib
          result=json.loads(pathlib.Path('/tmp/result1.json').read_text(encoding='utf-8'))
          assert result['schema']=='wingless.research-scientific-result.v1'
          assert result['experiment']=='WLM-LM-EXTERNAL-RAW-REP-COMPOSITIONAL-REASONING-R1'
          m=result['metrics']
          assert all(math.isfinite(float(v)) for v in m.values())
          validity=(
              m['source_identity_mismatch_count']==0 and
              m['source_count']==3 and
              m['total_source_bytes']==57272 and
              m['external_representation_pool_count']==512 and
              m['reasoning_value_count']==8 and
              m['reasoning_value_distinct_count']==8 and
              m['training_record_count']==1536 and
              m['heldout_pair_count']==16 and
              m['training_representation_decode_failure_count']==0 and
              m['heldout_representation_decode_failure_count']==0 and
              m['heldout_context_leak_count']==0 and
              m['factorized_bit_coverage_missing_count']==0 and
              m['factorized_counter_count']==24 and
              m['lookup_counter_count']==512 and
              m['tokenizer_use_count']==0 and
              m['external_model_call_count']==0 and
              m['capacity_growth_event_count']==0 and
              m['invalid_row_count']==0 and
              m['counter_overflow_count']==0 and
              m['counter_overflow_rows']==0
          )
          thresholds=(
              m['factorized_heldout_accuracy']>=0.95 and
              m['lookup_heldout_accuracy']<=0.25 and
              m['raw_output_exact_accuracy']>=0.95
          )
          if not validity:
              cls='invalid'
          elif thresholds:
              cls='supported'
          elif m['factorized_heldout_accuracy']>m['lookup_heldout_accuracy']:
              cls='mixed'
          else:
              cls='negative'
          out={
              'schema':'wingless.research-classification.v1',
              'experiment':'WLM-LM-EXTERNAL-RAW-REP-COMPOSITIONAL-REASONING-R1',
              'classification':cls,
              'validity_pass':validity,
              'thresholds_pass':thresholds,
              'authority_receipt_sha256':'73ba709e489f2c1ae7f01ccc33228639238df66a004584a3df6a6fbbcd5a5b46',
              'metrics':m
          }
          pathlib.Path('/tmp/classification.json').write_text(json.dumps(out,separators=(',',':')),encoding='utf-8')
          print(json.dumps(out,separators=(',',':')))
          if not validity:
              raise SystemExit('FROZEN_EXTERNAL_REASONING_VALIDITY_FAILED')
          PY

      - name: Delete external bytes
        if: always()
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/wingless-external-reasoning-r1"
          test ! -e "$RUNNER_TEMP/wingless-external-reasoning-r1"

      - name: Upload evidence only
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: wingless-external-raw-rep-compositional-reasoning-r1
          path: |
            /tmp/wingless-external-reasoning-r1-authority.json
            /tmp/wingless-external-reasoning-r1-sources.json
            /tmp/result1.json
            /tmp/result2.json
            /tmp/classification.json
          if-no-files-found: error
