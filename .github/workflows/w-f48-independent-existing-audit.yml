name: W-F48 independent existing TRAIN-only evidence audit (NO new science)
on:
  push:
    branches:
      - science/w-f48-frozen-train-20261015-r1
permissions:
  contents: read
  actions: read
jobs:
  existing-only:
    if: "${{ github.event.head_commit.message == 'audit(w-f48): verify frozen existing TRAIN artifact exactly once' && github.run_attempt == 1 }}"
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Bind to original source and frozen prereg identity
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 0bad6a035e4257f0bc18f593a25e0770d378d17d HEAD
          test "$(git hash-object research/foundational/20261015-w-f48/prereg-candidate.json)" = 3a8e4814b9d178b9ad77bd463dbc0e2676e67435
          test "$(git hash-object research/foundational/20261015-w-f48/source_pilot.py)" = 5aab57c8238e24032132f9439ef9e9cb9a072898
          python3 -m py_compile research/foundational/20261015-w-f48/audit_existing.py
      - name: Verify original source run and artifact identity through GitHub GET only
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run=$(curl -fSs --retry 2 --max-time 20 -H "Accept: application/vnd.github+json"             -H "Authorization: Bearer $GH_TOKEN"             "https://api.github.com/repos/spoonman136668-ai/Wingless/actions/runs/38805703700")
          echo "$run" | jq -e --arg head "0bad6a035e4257f0bc18f593a25e0770d378d17d"             '.head_sha==$head and .status=="completed" and .conclusion=="success" and .run_attempt==1'
          art=$(curl -fSs --retry 2 --max-time 20 -H "Accept: application/vnd.github+json"             -H "Authorization: Bearer $GH_TOKEN"             "https://api.github.com/repos/spoonman136668-ai/Wingless/actions/runs/38805703700/artifacts")
          echo "$art" | jq -e --arg h "0bad6a035e4257f0bc18f593a25e0770d378d17d" --arg name "W-F48-disjoint-trained-query-value-train-NO-ORIGINAL"             --arg dig "sha256:36ca9fb84f73c8816d2658bdf9631ba235f89ef57eeccf6b8c79618216740b48"             '[.artifacts[]|select(.id==12005084367 and .name==$name and .digest==$dig and (.expired|not) and .workflow_run.id==38805703700 and .workflow_run.head_sha==$h)]|length==1'
      - uses: actions/download-artifact@v4
        with:
          name: W-F48-disjoint-trained-query-value-train-NO-ORIGINAL
          run-id: 38805703700
          github-token: ${{ github.token }}
          repository: spoonman136668-ai/Wingless
          path: ${{ runner.temp }}/evidence
      - name: Reconstruct and audit existing result only
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat "$RUNNER_TEMP/evidence/SOURCE_SHA")" = "0bad6a035e4257f0bc18f593a25e0770d378d17d"
          (cd "$RUNNER_TEMP/evidence" && sha256sum -c result.sha256)
          python3 -B research/foundational/20261015-w-f48/audit_existing.py             "$RUNNER_TEMP/evidence/result.json" > "$RUNNER_TEMP/w-f48-audit.json"
          cat "$RUNNER_TEMP/w-f48-audit.json"
          sha256sum "$RUNNER_TEMP/w-f48-audit.json"             > "$RUNNER_TEMP/w-f48-audit.sha256"
          git rev-parse HEAD > "$RUNNER_TEMP/w-f48-audit-head.txt"
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: W-F48-existing-TRAIN-only-independent-audit
          path: |
            ${{ runner.temp }}/w-f48-audit.json
            ${{ runner.temp }}/w-f48-audit.sha256
            ${{ runner.temp }}/w-f48-audit-head.txt
          retention-days: 90
          if-no-files-found: error
      - name: Scientific authority boundary
        run: echo "EXISTING_TRAIN_ARTIFACT_AUDIT_ONLY=TRUE; NEW_ORIGINALS=0; F3_UNQUALIFIED=TRUE"
