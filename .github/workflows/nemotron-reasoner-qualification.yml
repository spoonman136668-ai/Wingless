name: Nemotron reasoner qualification

on:
  workflow_dispatch:
    inputs:
      run_remote_smoke:
        description: Perform one bounded OpenRouter smoke request after local tests
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WINGLESS_REMOTE_REASONER_ENABLE: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/nemotron-openrouter-reasoner-r1
          persist-credentials: false

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.5'
          cache: false

      - name: Unit qualification
        run: |
          set -euo pipefail
          go test ./reasoner ./cmd/research-reasoner -count=1

      - name: Verify dedicated secret binding
        shell: bash
        env:
          WINGLESS_REASONER_OPENROUTER_API_KEY: ${{ secrets.WINGLESS_REASONER_OPENROUTER_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${WINGLESS_REASONER_OPENROUTER_API_KEY:-}" ]; then
            echo "WINGLESS_REASONER_SECRET_BINDING_FAIL"
            exit 1
          fi
          echo "WINGLESS_REASONER_SECRET_BINDING_PASS"

      - name: Remote smoke remains opt-in
        if: ${{ inputs.run_remote_smoke == true }}
        shell: bash
        env:
          WINGLESS_REMOTE_REASONER_ENABLE: "1"
          WINGLESS_REASONER_OPENROUTER_API_KEY: ${{ secrets.WINGLESS_REASONER_OPENROUTER_API_KEY }}
        run: |
          set -euo pipefail
          echo "Remote smoke is deliberately not implemented in this staging workflow."
          echo "Historical blind-replay qualification must be added first."
          exit 1
