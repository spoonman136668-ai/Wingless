name: Research Sidecar R3 Safety Recovery Prep

on:
  push:
    branches:
      - ops/research-autonomy-provider-probe-r1
    paths:
      - .github/workflows/research-sidecar-r3-safety-recovery.yml

permissions:
  contents: read

concurrency:
  group: wingless-research-sidecar-recovery
  cancel-in-progress: false

jobs:
  recover:
    runs-on: [self-hosted, Windows, X64, wingless-up-b]
    timeout-minutes: 10
    steps:
      - name: Stop and archive second pre-execution planner failure
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference='Stop'
          Set-StrictMode -Version 2.0
          $Root='C:\ProgramData\CKBR\research-sidecar'
          $Lifecycle=Join-Path $Root 'ops\Lifecycle.ps1'
          $Exe=Join-Path $Root 'bin\research-sidecar.exe'
          $State=Join-Path $Root 'state'
          $Db=Join-Path $State 'research-sidecar.db'
          $Archive=Join-Path $Root 'evidence\planner-schema-recovery-r2'
          $Expected='4c80b5ab543632aa269d5022c8fcca3a544bbbed351cd8ad17e6ef9772bc3a05'
          $Identity=[Security.Principal.WindowsIdentity]::GetCurrent().Name
          if($Identity-cne'NT AUTHORITY\NETWORK SERVICE'){throw "RECOVERY_R2_IDENTITY_MISMATCH observed=$Identity"}
          if(-not(Test-Path -LiteralPath $Lifecycle -PathType Leaf)){throw 'RECOVERY_R2_LIFECYCLE_MISSING'}
          if((Get-FileHash -LiteralPath $Exe -Algorithm SHA256).Hash.ToLowerInvariant()-cne$Expected){throw 'RECOVERY_R2_BINARY_HASH_MISMATCH'}

          & $Lifecycle -Mode stop
          if($LASTEXITCODE-ne0){throw "RECOVERY_R2_STOP_FAILED exit=$LASTEXITCODE"}
          Start-Sleep -Seconds 1
          if(Get-Process -Name 'research-sidecar' -ErrorAction SilentlyContinue){throw 'RECOVERY_R2_PROCESS_STILL_RUNNING'}
          if(-not(Test-Path -LiteralPath $Db -PathType Leaf)){throw 'RECOVERY_R2_DB_MISSING'}

          $Probe=Join-Path $env:RUNNER_TEMP 'r3-recovery-probe.go'
          @'
          package main
          import (
              "database/sql"
              "encoding/json"
              "fmt"
              "os"
              "strings"
              _ "modernc.org/sqlite"
          )
          type event struct {
              State string `json:"state"`
              Reason string `json:"reason"`
          }
          func tableCount(db *sql.DB, table string) int {
              var exists int
              if err:=db.QueryRow("SELECT count(*) FROM sqlite_master WHERE type='table' AND name=?",table).Scan(&exists);err!=nil{panic(err)}
              if exists==0 { fmt.Printf("%s_count=0 table_absent=true\\n",table); return 0 }
              var n int
              if err:=db.QueryRow("SELECT count(*) FROM "+table).Scan(&n);err!=nil{panic(err)}
              fmt.Printf("%s_count=%d\\n",table,n)
              return n
          }
          func main(){
              if len(os.Args)!=2 { panic("db path required") }
              db,err:=sql.Open("sqlite","file:"+os.Args[1]+"?mode=ro")
              if err!=nil { panic(err) }
              defer db.Close()
              for _,t:=range []string{"research_sidecar_results","research_implementation_bundles","research_implementation_freezes"}{
                  if tableCount(db,t)!=0 { panic("scientific state exists in "+t) }
              }
              var raw []byte
              if err:=db.QueryRow("SELECT raw FROM research_controller_events ORDER BY created DESC,id DESC LIMIT 1").Scan(&raw);err!=nil{panic(err)}
              var e event
              if err:=json.Unmarshal(raw,&e);err!=nil{panic(err)}
              if e.State!="FAILED" || !strings.Contains(e.Reason,"RESEARCH_PLANNER_EXECUTION_REQUEST_REFUSED"){
                  panic("unexpected controller terminal state")
              }
              fmt.Printf("controller_state=%s\\ncontroller_reason=%s\\n",e.State,e.Reason)
              var cycles int
              if err:=db.QueryRow("SELECT count(*) FROM research_cycles").Scan(&cycles);err!=nil{panic(err)}
              if cycles!=1 { panic("unexpected cycle count") }
              fmt.Printf("cycle_count=%d\\n",cycles)
          }
          '@|Set-Content -LiteralPath $Probe -Encoding UTF8

          Push-Location 'C:\Users\camar\GolandProjects\ckb-plane\snapshot\source'
          try{
            $env:GOFLAGS='-buildvcs=false'
            & go run $Probe $Db
            if($LASTEXITCODE-ne0){throw "RECOVERY_R2_DB_PROBE_FAILED exit=$LASTEXITCODE"}
          }finally{Pop-Location}

          if(Test-Path -LiteralPath $Archive){throw 'RECOVERY_R2_ARCHIVE_ALREADY_EXISTS'}
          New-Item -ItemType Directory -Force -Path $Archive|Out-Null
          $Files=@('research-sidecar.db','research-sidecar.db-wal','research-sidecar.db-shm')
          $Hashes=[ordered]@{}
          foreach($Name in $Files){
            $Source=Join-Path $State $Name
            if(Test-Path -LiteralPath $Source -PathType Leaf){
              Copy-Item -LiteralPath $Source -Destination (Join-Path $Archive $Name) -Force
              $Hashes[$Name]=(Get-FileHash -LiteralPath $Source -Algorithm SHA256).Hash.ToLowerInvariant()
            }
          }
          if(-not$Hashes.Contains('research-sidecar.db')){throw 'RECOVERY_R2_ARCHIVE_DB_MISSING'}

          $Receipt=[ordered]@{
            schema='ckb-plane.research-sidecar-planner-schema-recovery.v2'
            reason='planner tool response rejected before preregistration or execution: execution_requested=true'
            bootstrap_cycle='WINGLESS-LM-LM9C-AUTONOMY-BOOTSTRAP'
            experiment_executed=$false
            result_sealed=$false
            implementation_bundle_sealed=$false
            implementation_freeze_sealed=$false
            db_hashes=$Hashes
            archived_at_utc=[DateTimeOffset]::UtcNow.ToString('o')
          }
          [IO.File]::WriteAllText((Join-Path $Archive 'recovery-receipt.json'),($Receipt|ConvertTo-Json -Depth 8),(New-Object Text.UTF8Encoding($false)))

          foreach($Name in $Files){
            Remove-Item -LiteralPath (Join-Path $State $Name) -Force -ErrorAction SilentlyContinue
          }
          if(Test-Path -LiteralPath $Db){throw 'RECOVERY_R2_DB_CLEAR_FAILED'}

          $Task=Get-ScheduledTask -TaskName 'CKBPlane Research Sidecar' -ErrorAction SilentlyContinue
          if($null-ne$Task -and $Task.State-eq'Running'){throw 'RECOVERY_R2_TASK_STILL_RUNNING'}
          Write-Host "archive=$Archive"
          foreach($K in $Hashes.Keys){Write-Host "archive_sha256[$K]=$($Hashes[$K])"}
          Write-Host "task_state=$(if($null-eq$Task){'UNREGISTERED'}else{$Task.State})"
          Write-Host 'experiment_executed=False'
          Write-Host 'result_sealed=False'
          Write-Host 'RESEARCH_SIDECAR_R3_SAFETY_RECOVERY=PASS'
