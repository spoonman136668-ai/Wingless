name: Wingless W-R27 causal second-order forecast
on:
  push:
    branches: [research/w-r27-second-order-forecast-r1]
permissions:
  contents: read
jobs:
  science:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Exact frozen source verification
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 7b36200f66fc9ea766a6451190637a5a57c47ccb HEAD
          test "$(git hash-object research/contrib/chatgpt/20261013-w-r26-next-prediction/execute.py)" = 63478c803be8a9312dbeeee8d8532ba019375fb7
          test "$(git hash-object research/contrib/chatgpt/20261013-w-r27-second-order/prereg.json)" = cc753db87e4a464fb64ba78c21bbd1ca6c7370d4
          test "$(git hash-object research/contrib/chatgpt/20261013-w-r27-second-order/execute.py)" = 3a1b97bc63a78e57227c9d7799678b7d39d698bc
          python3 -m json.tool research/contrib/chatgpt/20261013-w-r27-second-order/prereg.json >/dev/null
          python3 -m py_compile research/contrib/chatgpt/20261013-w-r27-second-order/execute.py
      - name: Original frozen causal prediction science
        run: |
          set -euo pipefail
          python3 -B research/contrib/chatgpt/20261013-w-r27-second-order/execute.py > /tmp/W-R27-original.json
          python3 -m json.tool /tmp/W-R27-original.json >/dev/null
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/W-R27-original.json'))
          assert len(x['arms'])==3 and x['sealed_heldout_seeds']==list(range(432,448))
          print('CLASSIFICATION',x['classification'],'QUADRATIC_DELTA_GAIN',x['quadratic_delta_gain'])
          for arm in x['arms']:
              print(arm['arm'],[(v['generator'],v['accuracy']) for v in arm['generators']])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: W-R27-original-causal-second-order
          path: /tmp/W-R27-original.json
          if-no-files-found: error
          retention-days: 90
      - name: One full Wingless regression
        run: go test ./... && go build ./...
