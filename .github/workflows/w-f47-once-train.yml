name: W-F47 one frozen learned-value-of-computation TRAIN-only experiment
on:
  push:
    branches:
      - research/w-f47-learned-compute-allocation-20261015-r1
permissions:
  contents: read
jobs:
  frozen-train:
    if: "${{ github.event.head_commit.message == 'science(w-f47): execute frozen source once train-only' && github.run_attempt == 1 }}"
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Verify parent and frozen pre-code study before consuming TRAIN source
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor bd7f18a31369cd913d353477e60b7be6d0d87876 HEAD
          git merge-base --is-ancestor ffef5bd27c72b3fe4bfc74f1f473a16ceb7b452b HEAD
          test "$(git hash-object research/foundational/20261015-w-f47/prereg-candidate.json)" = 6b1e3080f0c702528ead97fad179e753f522f90b
          test "$(git hash-object research/foundational/20261015-w-f47/source_pilot.py)" = cb21fbd51a80084e322202e6ed867190851c7f94
          python3 -m json.tool research/foundational/20261015-w-f47/prereg-candidate.json >/dev/null
          python3 -B -m unittest discover -s research/foundational/20261015-w-f47 -p test_preflight.py -v
      - name: Single full Go regression and build
        shell: bash
        run: |
          set -euo pipefail
          go test -count=1 ./...
          go build ./...
      - name: Exactly one disjoint-fit / unseen-topology synthetic TRAIN-only cohort
        shell: bash
        run: |
          set -euo pipefail
          python3 -B research/foundational/20261015-w-f47/source_pilot.py > /tmp/w-f47-source.json
          python3 -m json.tool /tmp/w-f47-source.json >/dev/null
          sha256sum /tmp/w-f47-source.json > /tmp/w-f47-source.sha256
          git rev-parse HEAD > /tmp/w-f47-head.txt
      - name: Read-only recount of 96 cases, receipt costs, unseen families and frozen thresholds
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,math
          d=json.load(open('/tmp/w-f47-source.json'))
          p=json.load(open('research/foundational/20261015-w-f47/prereg-candidate.json'))
          t=p['train_only']; a=p['acceptance']; arms=p['controls']
          assert d['schema']=='wingless.f47.learned-value-of-compute.trainonly.v1'
          assert d['stage']=='TRAIN_ONLY_LEARNED_GATE_NO_PRIMARY_ORIGINAL'
          assert d['fit_seeds']==t['fit_seeds'] and d['diagnostic_seeds']==t['diagnostic_seeds']
          assert d['fit_families']==t['fit_families'] and d['diagnostic_families']==t['diagnostic_families']
          assert set(d['fit_families']).isdisjoint(d['diagnostic_families'])
          assert d['questions']==t['expected_diagnostic_cases']==96 and len(d['rows'])==96
          assert d['fit_training_examples']==96 and d['feature_count']==9
          assert len(d['learned_feature_weights'])==9
          assert d['chosen_deep_count']==d['hash_deep_count']==4
          assert d['chosen_deep_count']<=t['deep_cases_max']==8
          assert d['proposed_original_seeds_NOT_RESERVED']==p['future_original_proposal_NOT_RESERVED']['seeds']
          assert not d['source_independent_F3_custody'] and not d['original_executed']
          assert not d['native_576_bytes_residency_qualified']
          assert not d['accepted_ref_mutation'] and d['paid_api_calls']==0
          rows=d['rows']; seen=set()
          for row in rows:
              key=row['seed'],row['family'],row['length']
              assert key not in seen
              seen.add(key)
              assert 421100<=row['seed']<421112
              assert row['family'] in t['diagnostic_families']
              assert row['length'] in t['lengths'] and 0<=row['truth']<6
              assert set(row['answers'])==set(arms)
              assert set(row['receipts'])==set(arms)-{'private_oracle_unfair'}
              assert set(row['work'])==set(row['receipts'])
              assert row['answers']['private_oracle_unfair']==row['truth']
              for arm,receipts in row['receipts'].items():
                  assert len(receipts)<=2
                  assert not receipts if arm=='no_purchase' else True
                  assert len({(r,x) for r,x,y in receipts})==len(receipts)
                  assert all(0<=r<4 and 0<=x<6 and 0<=y<6 for r,x,y in receipts)
                  assert isinstance(row['work'][arm],int) and row['work'][arm]>=0
          assert len(seen)==96
          assert sum(x['learned_deep_used'] for x in rows)==4
          assert sum(x['hash_deep_used'] for x in rows)==4
          correct={}
          for arm in arms:
              count=sum(r['answers'][arm]==r['truth'] for r in rows)
              correct[arm]=count
              assert d['scores'][arm]['correct']==count
              assert d['scores'][arm]['total']==96
              assert math.isclose(d['scores'][arm]['accuracy'],count/96,abs_tol=1e-12)
          assert correct['private_oracle_unfair']==96
          for fam in t['diagnostic_families']:
              subset=[r for r in rows if r['family']==fam]
              assert len(subset)==24
              for arm in arms:
                  assert d['by_family'][str(fam)][arm]==sum(r['answers'][arm]==r['truth'] for r in subset)
          for arm in arms[:-1]:
              assert d['posterior_world_work'][arm]==sum(r['work'][arm] for r in rows)
          fair=('one_step_value','exact_entropy','query_frontier',
                'static_F46_query_edge','fixed_public_hash_deep_gate')
          best=max(fair,key=lambda arm:(correct[arm],-d['posterior_world_work'][arm]))
          gain=(correct['learned_deep_gate']-correct[best])/96
          positive=correct['learned_deep_gate']>correct['fixed_public_hash_deep_gate']
          no_reg=all(d['by_family'][str(f)]['learned_deep_gate']>=
            max(d['by_family'][str(f)][arm] for arm in fair) for f in t['diagnostic_families'])
          ratio=d['posterior_world_work']['learned_deep_gate']/max(d['posterior_world_work'][best],1)
          passed=gain>=a['min_gain_vs_strongest_fair'] and positive and no_reg and ratio<=a['max_posterior_work_ratio']
          assert d['strongest_fair_control']==best
          assert math.isclose(d['candidate_gain'],gain,abs_tol=1e-12)
          assert d['positive_gain_vs_hash_gate']==positive
          assert d['family_nondegradation']==no_reg
          assert math.isclose(d['posterior_work_ratio'],ratio,abs_tol=1e-12)
          assert d['frozen_criterion_met']==passed
          assert d['verdict']==('TRAIN_ONLY_LEARNED_COMPUTE_GATE_SUPPORTED' if passed else 'TRAIN_ONLY_LEARNED_COMPUTE_GATE_NEGATIVE')
          print('W_F47',d['verdict'],'correct',correct,'gain',gain,'work_ratio',ratio,
            'family_no_regression',no_reg,'learned_vs_hash',positive)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: W-F47-one-new-learned-gate-TRAIN-only
          path: |
            /tmp/w-f47-source.json
            /tmp/w-f47-source.sha256
            /tmp/w-f47-head.txt
          retention-days: 90
          if-no-files-found: error
      - name: Scientific limits
        run: |
          echo "PRIMARY_ORIGINALS_EXECUTED=0"
          echo "F3_INDEPENDENT_CUSTODY=NOT_QUALIFIED"
          echo "FORGE_SCIENTIFIC_AUTHORITY_UNCHANGED=TRUE"
