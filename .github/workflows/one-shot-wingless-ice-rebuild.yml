name: One-shot Wingless ICE regeneration at reviewed PR head
on:
  push:
    branches: [maintenance/one-shot-ice-rebuild-20261020]
    paths: ['.github/workflows/one-shot-wingless-ice-rebuild.yml']

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: d312f2ada99cce4d994f271bbed54cbe7d52027e
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.5'
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regenerate existing canonical ICE and reviewed atlas
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $target = 'd312f2ada99cce4d994f271bbed54cbe7d52027e'
          $branch = 'docs/northstar-nontransformer-governance-20261020'
          if ((git rev-parse HEAD).Trim() -cne $target) { throw 'SOURCE_IDENTITY_DRIFT' }
          git fetch origin $branch --quiet
          if ($LASTEXITCODE -ne 0 -or (git rev-parse "origin/$branch").Trim() -cne $target) {
            throw 'TARGET_BRANCH_MOVED'
          }
          go run ./cmd/ice build
          if ($LASTEXITCODE -ne 0) { throw 'ICE_BUILD_FAILED' }
          go run ./cmd/ice validate
          if ($LASTEXITCODE -ne 0) { throw 'ICE_VALIDATION_FAILED' }
          python -B scripts/maintain_code_atlas.py --root .
          if ($LASTEXITCODE -ne 0) { throw 'ATLAS_MAINTENANCE_FAILED' }
          go run ./cmd/ice relationships > "$env:RUNNER_TEMP\wingless-typed.json"
          if ($LASTEXITCODE -ne 0) { throw 'TYPED_EXTRACTION_FAILED' }
          python -B scripts/validate_code_atlas.py --root . --relationships "$env:RUNNER_TEMP\wingless-typed.json"
          if ($LASTEXITCODE -ne 0) { throw 'ATLAS_VALIDATION_FAILED' }
          $dirty = @(git status --porcelain --untracked-files=all | Where-Object { $_ -and $_.Trim() })
          if ($dirty.Count -eq 0) { throw 'EXPECTED_GENERATED_DELTA_MISSING' }
          foreach ($line in $dirty) {
            $path = $line.Substring(3).Trim().Replace('\','/')
            if (-not $path.StartsWith('.ice/',[StringComparison]::Ordinal)) {
              throw "UNEXPECTED_WRITE $path"
            }
          }
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'GENERATED_DIFF_INVALID' }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- .ice
          git commit -m 'build: regenerate Wingless ICE and semantic atlas for North Star docs'
          if ($LASTEXITCODE -ne 0) { throw 'GENERATED_COMMIT_FAILED' }
          git push origin "HEAD:refs/heads/$branch"
          if ($LASTEXITCODE -ne 0) { throw 'GUARDED_PUSH_FAILED' }
          Write-Host "WINGLESS_ICE_REGENERATION_PUBLISHED=PASS"
          Write-Host "NEW_HEAD=$((git rev-parse HEAD).Trim())"
