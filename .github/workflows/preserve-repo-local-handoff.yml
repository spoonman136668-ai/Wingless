name: Preserve Wingless repo-local handoff

on:
  push:
    branches:
      - cutover/repo-local-autonomy-r1
    paths:
      - '.github/workflows/preserve-repo-local-handoff.yml'
      - 'scripts/Preserve-RepoLocalHandoff.ps1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  preserve:
    runs-on: [self-hosted, Windows, X64, wingless-up-b]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Preserve exact sealed Wingless commit
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./scripts/Preserve-RepoLocalHandoff.ps1
