name: Wingless NCI05 prospective bounded multiedge memory science
on:
  push:
    branches: [research/w-nci05-multiedge-native-memory-20261014-r1]
permissions:
  contents: read
jobs:
  science:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Verify exact precursor and frozen original science source
        run: |
          set -euo pipefail
          git merge-base --is-ancestor e2931315bb498c30d9313dd7a8ccbdea74aea2e9 HEAD
          test "$(git hash-object unitary/nci02_learned_relation_join.go)" = 6086ceb3d252dd82a6b5bbd36d70432de19b59fb
          test "$(git hash-object unitary/nci04_multivalued_memory.go)" = b7f8ba8f2866946319d9ae128867be98bbdcd898
          test "$(git hash-object unitary/nci05_multiedge_memory.go)" = b6a89e193f3afbe0a8ee6b670f473a9bd5cc5774
          test "$(git hash-object cmd/nci-05-wingless/main.go)" = 02305e446ac8419eac9aba6e5a5643ce2a0720c6
          test "$(git hash-object research/contrib/chatgpt/20261014-w-nci05/prereg.json)" = b7df2cd436e51a8793a4ed122b95bbd15d57c494
          python3 -m json.tool research/contrib/chatgpt/20261014-w-nci05/prereg.json >/dev/null
      - name: Development-only native model and code qualification
        run: |
          set -euo pipefail
          go run ./cmd/nci-05-wingless -phase=development > /tmp/w05-dev.json
          python3 - <<'PY'
          import json
          d=json.load(open("/tmp/w05-dev.json"))
          assert d["phase"]=="development" and d["sealed_seed_range"]==[24320,24344]
          assert d["native_join_weights"]==6 and d["experimental_edge_cap"]==7
          assert not d["nci01_full_acceptance"]
          print("W05_DEV_QUALIFIED",d["join_dev_accuracy"])
          PY
      - name: One frozen original prospective sealed first-use
        run: |
          set -euo pipefail
          start=$(date +%s%N)
          go run ./cmd/nci-05-wingless -phase=sealed > /tmp/w05-original.json
          end=$(date +%s%N)
          printf '{"elapsed_wall_ms":%s,"runner":"ubuntu-latest","cost_usd":"unverified"}\n' "$(((end-start)/1000000))" > /tmp/w05-resource.json
          python3 -m json.tool /tmp/w05-original.json >/dev/null
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: W-NCI05-original-frozen-multiedge
          path: |
            /tmp/w05-original.json
            /tmp/w05-resource.json
          if-no-files-found: error
          retention-days: 90
      - name: Evaluate frozen preregistered outcome after archive
        run: |
          python3 - <<'PY'
          import json,collections
          d=json.load(open("/tmp/w05-original.json"))
          assert d["phase"]=="sealed" and d["sealed_seed_range"]==[24320,24344]
          assert len(d["records"])==96
          assert collections.Counter(x["motif"] for x in d["records"])=={m:24 for m in d["motifs"]}
          assert d["checkpoint_restores"]==96 and d["peak_multiedge_entries"]<=7
          assert d["verdict"] in ("BOUNDED_MULTIEDGE_STORAGE_RESTORES_CODED_COMPOSITION",
            "MULTIEDGE_COMPONENT_TRANSFER_WITHOUT_BASELINE_CONTRAST",
            "BOUNDED_MULTIEDGE_STORAGE_DID_NOT_RESTORE_COMPOSITION")
          assert not d["nci01_full_acceptance"] and d["external_llm_calls"]==0
          assert not d["accepted_ref_mutation"]
          print("W05_CLASSIFICATION",d["verdict"])
          print("W05_MOTIF_RESULTS",d["accuracy_by_motif"])
          print("W05_JOIN_EVALUATIONS",d["multi_join_candidate_evaluations"],d["baseline_join_candidate_evaluations"])
          PY
      - name: Full final original Wingless Go regression and build
        run: go test ./... && go build ./...
