name: Wingless external context factor ablation R1

on:
  push:
    branches:
      - research/external-hosted-wingless-context-factor-ablation-r1
    paths:
      - 'unitary/wlm_lm_external_context_factor_ablation_r1.go'
      - 'cmd/wlm-lm-external-context-factor-ablation-r1/main.go'
      - '.github/workflows/external-context-factor-ablation-r1.yml'

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 3
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Validate frozen package
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "423fbecafd18bee0527209b83060c58915a6923e"
          test "$(git rev-parse HEAD^^)" = "a9b8313e8d57145e08208caa4d3c3ca6e6ba12e9"
      - name: Verify READY_RESEARCH receipt
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib,json,pathlib
          raw=r'''{"schema":"ckb-plane.external-exposure-ready-research-receipt.v1","project":"Wingless","experiment":"WLM-LM-EXTERNAL-CONTEXT-FACTOR-ABLATION-R1","preregistration_sha":"423fbecafd18bee0527209b83060c58915a6923e","research_host":"runnervm8df0l","runner_id":"GitHub Actions 1000001384","manifest_sha256":"75cdb3b97dbb7017299f573d506f07095ed89c06264b29724b78f29c909d4da4","plan_decision":{"schema":"ckb-plane.external-exposure.v1","disposition":"READY_PLAN","scope":"plan-only","reasons":null},"fetch_decision":{"schema":"ckb-plane.external-exposure-fetch.v1","disposition":"READY_FETCH","scope":"fetch-verify-only","reasons":null},"research_decision":{"schema":"ckb-plane.external-exposure-research.v1","disposition":"READY_RESEARCH","scope":"research-consume-once","reasons":null},"ckb_plane_main_sha":"36d99a0257120ede57bb96638660d35014dd529e"}'''
          assert hashlib.sha256(raw.encode()).hexdigest()=="b1091503c2dd48f78098466b5cd31b5b4b1a09059e1ba20f56c568fdf82c4933"
          r=json.loads(raw); assert r["research_decision"]["disposition"]=="READY_RESEARCH"
          pathlib.Path("/tmp/authority.json").write_text(raw)
          PY
      - name: Fetch exact external sources
        shell: bash
        run: |
          set -euo pipefail
          export EXTERNAL_ROOT="$RUNNER_TEMP/wingless-factor-r1"; mkdir -p "$EXTERNAL_ROOT"
          python3 - <<'PY'
          import hashlib,os,pathlib,urllib.request
          sources=[
            ("code","https://raw.githubusercontent.com/python/cpython/ebf955df7a89ed0c7968f79faec1de49f61ed7cb/Lib/fractions.py","7a95f1c506c9ac4b2277df5f2bdd9d61cc67b520c45021a5a961939770221ef6",41453),
            ("structured","https://raw.githubusercontent.com/json-schema-org/JSON-Schema-Test-Suite/5b0ee1613e45fcc2bddac00e07c19cd49b00d8a8/tests/draft2020-12/type.json","4c5cbe6cbcd28af73761091367b20e07d0403847e236c06c31fc27061bd81192",14365),
            ("technical-prose","https://raw.githubusercontent.com/golang/go/6f5c275ebdc454197fff5f1496521c8f81e20eef/README.md","8247b7c5de1e74854aac1a08aa5894444d1d33b4045c70d5cc3367ad0e25c3f3",1454),
          ]
          root=pathlib.Path(os.environ["EXTERNAL_ROOT"])
          for d,u,h,n in sources:
              b=urllib.request.urlopen(urllib.request.Request(u,headers={"User-Agent":"wingless-factor-r1"}),timeout=30).read(n+1)
              assert len(b)==n and hashlib.sha256(b).hexdigest()==h
              (root/(d+".bin")).write_bytes(b)
          PY
          echo "EXTERNAL_ROOT=$EXTERNAL_ROOT" >> "$GITHUB_ENV"
      - name: Full Go regression
        run: go test ./... -count=1
      - name: Run frozen factor probe twice
        shell: bash
        run: |
          set -euo pipefail
          go run ./cmd/wlm-lm-external-context-factor-ablation-r1 --code "$EXTERNAL_ROOT/code.bin" --structured "$EXTERNAL_ROOT/structured.bin" --technical-prose "$EXTERNAL_ROOT/technical-prose.bin" > /tmp/result1.json
          go run ./cmd/wlm-lm-external-context-factor-ablation-r1 --code "$EXTERNAL_ROOT/code.bin" --structured "$EXTERNAL_ROOT/structured.bin" --technical-prose "$EXTERNAL_ROOT/technical-prose.bin" > /tmp/result2.json
          cmp /tmp/result1.json /tmp/result2.json
          cat /tmp/result1.json
      - name: Classify
        shell: bash
        run: |
          python3 - <<'PY'
          import json,math,pathlib
          r=json.loads(pathlib.Path("/tmp/result1.json").read_text());m=r["metrics"]
          valid=(m["source_identity_mismatch_count"]==0 and m["source_count"]==3 and m["total_source_bytes"]==57272 and m["selected_motif_count"]==512 and m["previous_alias_count"]==16 and m["current_alias_count"]==32 and m["previous_predictive_counter_capacity"]==8192 and m["current_alias_predictive_counter_capacity"]==16384 and m["cartesian_alias_reference_accuracy"]>0 and m["capacity_growth_event_count"]==0 and m["tokenizer_use_count"]==0 and m["external_model_call_count"]==0 and m["invalid_row_count"]==0 and m["counter_overflow_count"]==0 and all(math.isfinite(float(v)) for v in m.values()))
          recovered=m["maximum_factor_minus_cartesian_accuracy"]>=0.05
          dominant=m["factor_dominance_gap"]>=0.02
          if not valid: cls="invalid"; attribution="invalid"
          elif recovered and dominant:
              cls="supported"
              attribution="previous_factor_dominant" if m["pooled_previous_factor_accuracy"]>m["pooled_current_alias_factor_accuracy"] else "current_factor_dominant"
          elif recovered: cls="mixed"; attribution="mixed_or_shared"
          else: cls="negative"; attribution="no_factor_recovery"
          out={"schema":"wingless.research-classification.v1","experiment":"WLM-LM-EXTERNAL-CONTEXT-FACTOR-ABLATION-R1","classification":cls,"validity_pass":valid,"attribution":attribution,"authority_receipt_sha256":"b1091503c2dd48f78098466b5cd31b5b4b1a09059e1ba20f56c568fdf82c4933","metrics":m}
          pathlib.Path("/tmp/classification.json").write_text(json.dumps(out,separators=(",",":")));print(json.dumps(out,separators=(",",":")))
          if not valid: raise SystemExit(2)
          PY
      - name: Delete external bytes
        if: always()
        run: rm -rf "$RUNNER_TEMP/wingless-factor-r1"
      - name: Upload evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: wingless-external-context-factor-ablation-r1
          path: |
            /tmp/authority.json
            /tmp/result1.json
            /tmp/result2.json
            /tmp/classification.json
          if-no-files-found: error
