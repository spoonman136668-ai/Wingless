name: T28 original TRAIN-only learned incremental belief qualification
on:
  push:
    branches: [research/t28-incremental-belief-dictionary-20261019]
    paths: ['.github/workflows/north-star-t28-TRAIN-only.yml']
permissions:
  contents: read
concurrency:
  group: wingless-t28-TRAIN-original
  cancel-in-progress: false
jobs:
  exact-belief:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify T28 prereg and fresh source/compiler chronology
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if((git rev-parse HEAD).Trim() -cne $env:GITHUB_SHA){throw 'T28_TRAIN_HEAD_DRIFT'}
          $expect=@{
            'research/north-star-transfer/20261019-wingless-t28-incremental-precode.json'='e1444373f9f9453c69c574b65101676da2b84262'
            'research/north-star-transfer/20261019-wingless-t28-new-streams.py'='66e8219c10b4932af776924f31ea1422a7d4835b'
            'research/north-star-transfer/20261019-wingless-t28-incremental-belief.py'='d80f7f02af96f77720119eef4511b25eefec7234'
          }
          foreach($path in $expect.Keys){
            if((git hash-object -- $path).Trim() -cne $expect[$path]){throw "T28_FROZEN_BLOB_DRIFT:$path"}
          }
          git merge-base --is-ancestor 12fe1a9f699402e34bc464d3fd61c35cf418f140 2149bfabeeab093e38792d6ba4d8521feaf12daa
          if($LASTEXITCODE -ne 0){throw 'T28_SOURCE_PRECEDES_PRECODE'}
          git merge-base --is-ancestor 2149bfabeeab093e38792d6ba4d8521feaf12daa 8ebfc5bc6bcec4d881db36b4f6847a86834ba2d0
          if($LASTEXITCODE -ne 0){throw 'T28_MODEL_PRECEDES_NEW_SOURCE'}
          python -m py_compile research/north-star-transfer/20261019-wingless-t28-new-streams.py research/north-star-transfer/20261019-wingless-t28-incremental-belief.py
          if($LASTEXITCODE -ne 0){throw 'T28_PYTHON_SYNTAX_FAILED'}
          Write-Output 'T28_FROZEN_PRECODE_AND_SOURCE_CHRONOLOGY=PASS'
      - name: Qualify TRAIN-only incremental posterior and fully trained exact comparators
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          python research/north-star-transfer/20261019-wingless-t28-incremental-belief.py --train-only > t28-TRAIN-original.json
          if($LASTEXITCODE -ne 0){throw 'T28_TRAIN_BELIEF_PROOF_FAILED'}
          python -c "import json;x=json.load(open('t28-TRAIN-original.json',encoding='utf-8-sig'));assert x['status']=='PASS_TRAIN_ONLY_DEV_UNOPENED' and x['TRAIN_cases']==40 and x['DEV_generated']==0 and x['TRAIN_true_persistent_worlds_retained']==40 and x['TRAIN_counterfactual_target_questions']==120 and x['TRAIN_exact_posterior_and_answer_equivalences']==120 and 0.2<=x['TRAIN_ambiguity_fraction']<=0.85 and x['TRAIN_dictionary_entries']>=8 and x['TRAIN_learned_cache_hits']>0 and x['independent_exact_macro_verification'] and x['no_predictive_signature_atlas'] and x['old_DEV_not_replayed'] and not x['optimizer_admission'];print('T28_TRAIN_ONLY_QUALIFIED=PASS');print('T28_TRAIN_EVIDENCE='+json.dumps(x,sort_keys=True))"
          if($LASTEXITCODE -ne 0){throw 'T28_FROZEN_TRAIN_ADMISSION_FAILED'}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: t28-original-TRAIN-${{ matrix.os }}
          path: t28-TRAIN-original.json
          if-no-files-found: ignore
          retention-days: 90
