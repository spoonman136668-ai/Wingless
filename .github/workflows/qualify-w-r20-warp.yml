name: Wingless W-R20 frozen temporal warp
on:
  push:
    branches: [research/w-r20-temporal-warp-r1]
permissions:
  contents: read
jobs:
  science:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify immutable predecessor, preregistration and source
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 3e96d6f45819abf75ed3d99dbf68b85f8792f098 HEAD
          test "$(git hash-object research/contrib/chatgpt/20261013-w-r19-sparse-transition/execute.py)" = 7b4c77d4aa56795cafa6ed0a428c2e5984600616
          test "$(git hash-object research/contrib/chatgpt/20261013-w-r20-temporal-warp/prereg.json)" = 6062eafbe8d344c12593c28a41335292b6b71d8d
          test "$(git hash-object research/contrib/chatgpt/20261013-w-r20-temporal-warp/execute.py)" = 161363043fe56cc7b03dd1679439331b62cbe256
          python3 -m json.tool research/contrib/chatgpt/20261013-w-r20-temporal-warp/prereg.json >/dev/null
          python3 -m py_compile research/contrib/chatgpt/20261013-w-r20-temporal-warp/execute.py
      - name: First-use original scientific experiment
        run: |
          set -euo pipefail
          python3 -B research/contrib/chatgpt/20261013-w-r20-temporal-warp/execute.py > /tmp/wr20-original.json
          python3 -m json.tool /tmp/wr20-original.json
      - uses: actions/upload-artifact@v4
        with:
          name: W-R20-first-use
          path: /tmp/wr20-original.json
          retention-days: 90
          if-no-files-found: error
      - name: One final full repository regression
        run: go test ./... && go build ./...
