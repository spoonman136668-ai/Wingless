name: T11 wingless source-frozen learned causal mechanism qualification
on:
  push:
    branches: [research/north-star-transfer-wingless-20261018]
    paths: ['.github/workflows/north-star-t11-wingless.yml']
permissions:
  contents: read
concurrency:
  group: t11-wingless-new-synthetic-source-only
  cancel-in-progress: false
jobs:
  focused-independent-source:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 60
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Freeze-before-code and original baseline source identity
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if((git rev-parse HEAD).Trim() -cne $env:GITHUB_SHA){throw 'T11_HEAD_CHANGED'}
          if((git hash-object 'research/north-star-transfer/20261019-wingless-t11-freeze.json').Trim() -cne 'fea57838444ba59c0cba8269a65bad7c9a5dcc8f'){throw 'T11_PREIMPLEMENTATION_BLOB_DRIFT'}
          if((git log -1 --format=%H -- 'research/north-star-transfer/20261019-wingless-t11-freeze.json').Trim() -cne '70a0b0e752b22b0ccd0c0da1bfe8966871894f4f'){throw 'T11_FROZEN_PROTOCOL_NOT_ORIGINAL'}
          git merge-base --is-ancestor 70a0b0e752b22b0ccd0c0da1bfe8966871894f4f HEAD
          if($LASTEXITCODE -ne 0){throw 'T11_PROTOCOL_NOT_BEFORE_MODEL'}
          if((git hash-object 'research/north-star-transfer/20261019-wingless-t11-mechanism.py').Trim() -cne '0536f6907d48c1a083c39b68020407a34648a7cb'){throw 'T11_LEARNER_SOURCE_DRIFT'}
          if((git hash-object 'research/north-star-transfer/20261019-wingless-t10-learned-query.py').Trim() -cne '87cd2b01bbc4eedba18c8ab09a732d091b19a346'){throw 'T11_ORIGINAL_CONTROL_MODIFIED'}
          Write-Output 'T11_WINGLESS_IMMUTABLE_PROTOCOL_AND_CONTROLS=PASS'
      - name: Execute new source-neutral causal mechanism and report negatives faithfully
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $py=if($IsWindows){'python'}else{'python3'}
          & $py -B 'research/north-star-transfer/20261019-wingless-t11-mechanism.py' | Tee-Object -FilePath 't11-wingless-original.json'
          if($LASTEXITCODE -ne 0){throw 'T11_WINGLESS_MECHANISM_OR_SOURCE_FAILED'}
          $j=Get-Content 't11-wingless-original.json' -Raw | ConvertFrom-Json
          if($j.'science_accepted' -ne $false){throw 'T11_SCIENTIFIC_PROMOTION_NOT_AUTHORIZED'}
          if($j.'original_protected_or_consumed_cohorts_used' -ne $false -and $j.'original_protected_or_consumed_cohorts_used' -ne 0){throw 'T11_PROTECTED_FIRST_USE_OR_REPLAY'}
          Write-Output 'T11_WINGLESS_NONPROTECTED_SCIENTIFIC_DIAGNOSTIC=PASS'
          Write-Output 'T11_WINGLESS_SIGNED_SCIENTIFIC_ACCEPTANCE=false'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: t11-wingless-original-${{ matrix.os }}-${{ github.sha }}
          path: t11-wingless-original.json
          if-no-files-found: warn
          retention-days: 90
