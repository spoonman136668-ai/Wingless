name: Wingless W-R44 frozen blind local counterfactual screen
on:
  push:
    branches: [research/w-r44-blind-contrastive-screen-r1]
permissions:
  contents: read
jobs:
  science:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Exact predecessor, preregistration and executor gate
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 4721050ee908cb8461f26ec2ea1ac30588a59228 HEAD
          test "$(git hash-object research/contrib/chatgpt/20261013-w-r43-paired-ranking/execute.py)" = 84cb39fbc1d41bc8e94873493f9f021d10bdde82
          test "$(git hash-object research/contrib/chatgpt/20261013-w-r44-blind-scan/prereg.json)" = 6c49c5d827d40d56e0c4f7eac9da646b137710cc
          test "$(git hash-object research/contrib/chatgpt/20261013-w-r44-blind-scan/execute.py)" = 35fb11b5ec143589b486cd9c81ec251df79e7bf0
          python3 -m json.tool research/contrib/chatgpt/20261013-w-r44-blind-scan/prereg.json >/dev/null
          python3 -m py_compile research/contrib/chatgpt/20261013-w-r44-blind-scan/execute.py
      - name: One original first-use blind inference experiment
        run: |
          set -euo pipefail
          python3 -B research/contrib/chatgpt/20261013-w-r44-blind-scan/execute.py >/tmp/W-R44-original.json
          python3 -m json.tool /tmp/W-R44-original.json >/dev/null
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/W-R44-original.json'))
          assert x['development_seeds']==list(range(2224,2240))
          assert x['sealed_heldout_seeds']==list(range(2240,2256))
          assert len(x['results'])==6 and all(len(r['cells'])==6 for r in x['results'])
          assert x['local_scan_sites']==list(range(14))
          print('CLASSIFICATION',x['classification'])
          print('BEST_BLIND',x['best_blind_accuracy'])
          print('KNOWN_SITE_ORACLE',x['known_site_oracle_accuracy'])
          for r in x['results']:
              print('ARM',r['arm'],r['condition'],r['accuracy'],r['model_comparisons'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: W-R44-original-blind-scan
          path: /tmp/W-R44-original.json
          retention-days: 90
          if-no-files-found: error
      - name: One full required Wingless regression and build
        run: go test ./... && go build ./...
