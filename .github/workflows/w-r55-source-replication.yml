name: Wingless W-R55 frozen unseen-source replication
on:
  push:
    branches: [research/w-r55-unseen-affine-feature-test-r1]
permissions:
  contents: read
jobs:
  science:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Validate immutable preregistration and original
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 2e1fc9d5ce47c7c469c3f5f7fade8313aab0d5a9 HEAD
          test "$(git hash-object research/contrib/chatgpt/20261013-w-r54-loso/execute.py)" = f30f8ebfb13b7df49187e7ae95dd0f00d3a0d8d6
          test "$(git hash-object research/contrib/chatgpt/20261013-w-r55-loso-replication/prereg.json)" = 9bd439df3eceecee94bf02628b3a418b5e948888
          test "$(git hash-object research/contrib/chatgpt/20261013-w-r55-loso-replication/execute.py)" = 533ed93a54113e4bb586886c8a613aafcc7c9fdf
          python3 -m py_compile research/contrib/chatgpt/20261013-w-r55-loso-replication/execute.py
      - name: One original sealed source-replication experiment
        run: |
          set -euo pipefail
          python3 -B research/contrib/chatgpt/20261013-w-r55-loso-replication/execute.py >/tmp/W-R55-original.json
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/W-R55-original.json'))
          assert x['development_blocks']==[list(range(5408,5424)),list(range(5440,5456)),list(range(5472,5488))]
          assert x['sealed_heldout_seeds']==list(range(5520,5568))
          assert len(x['source_specific_xorshift_accuracy'])==3
          print('CLASSIFICATION',x['classification'])
          print('XORSHIFT_UNSEEN',x['source_specific_xorshift_accuracy'])
          print('GENERALIZATION',x['broad_source_transfer_gate'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: W-R55-original-unseen-source-replication
          path: /tmp/W-R55-original.json
          retention-days: 90
          if-no-files-found: error
      - name: One full Wingless regression and build
        run: go test ./... && go build ./...
