name: Wingless isolated G26 Windows repair exact-head qualification
on:
  push:
    branches: [experiment/atlas-parallel-timing-20261104]
    paths: ['.github/workflows/atlas-g26-windows-exact-head.yml']
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 715e53ae638497c8d7e53a94a0a7b954dac984b2
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: '1.25.5'
          cache: false
      - name: Execute original full native qualification at exact candidate SHA
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git rev-parse HEAD).Trim() -ne '715e53ae638497c8d7e53a94a0a7b954dac984b2') { throw 'SOURCE_IDENTITY_DRIFT' }
          if (git status --porcelain) { throw 'SOURCE_DIRTY' }
          ./scripts/Test-Native.ps1
          if ($LASTEXITCODE -ne 0) { throw 'FULL_NATIVE_FAILED' }
          if (git status --porcelain) { throw 'SOURCE_MUTATED' }
  atlas:
    name: Original full Windows Atlas acceptance at exact candidate SHA
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 715e53ae638497c8d7e53a94a0a7b954dac984b2
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: '1.25.5'
          cache: false
      - name: Execute original Atlas scope/ICE/typed/negative/browser/full integration acceptance
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git rev-parse HEAD).Trim() -ne '715e53ae638497c8d7e53a94a0a7b954dac984b2') { throw 'SOURCE_IDENTITY_DRIFT' }
          if (git status --porcelain) { throw 'SOURCE_DIRTY' }
          python -B scripts/atlas_ci_scope.py --root . --self-test
          if ($LASTEXITCODE -ne 0) { throw 'ATLAS_SCOPE_FAILED' }
          go run ./cmd/ice validate
          if ($LASTEXITCODE -ne 0) { throw 'ICE_VALIDATE_FAILED' }
          go run ./cmd/ice relationships > "$env:RUNNER_TEMP\wingless-g26-rel.json"
          if ($LASTEXITCODE -ne 0) { throw 'RELATIONSHIPS_FAILED' }
          python -B scripts/validate_code_atlas.py --root . --relationships "$env:RUNNER_TEMP\wingless-g26-rel.json"
          if ($LASTEXITCODE -ne 0) { throw 'ATLAS_SEMANTIC_FAILED' }
          python -B scripts/test_code_atlas_tamper.py --root . --relationships "$env:RUNNER_TEMP\wingless-g26-rel.json" --scratch-parent "$env:RUNNER_TEMP"
          if ($LASTEXITCODE -ne 0) { throw 'FULL_ATLAS_TAMPER_FAILED' }
          python -m pip install --disable-pip-version-check --quiet "selenium==4.35.0"
          if ($LASTEXITCODE -ne 0) { throw 'SELENIUM_INSTALL_FAILED' }
          python -B scripts/test_atlas_browser.py --root .
          if ($LASTEXITCODE -ne 0) { throw 'BROWSER_ACCEPTANCE_FAILED' }
          go test ./ice
          if ($LASTEXITCODE -ne 0) { throw 'FOCUSED_ICE_FAILED' }
          go test ./...
          if ($LASTEXITCODE -ne 0) { throw 'FULL_INTEGRATION_FAILED' }
          go vet ./...
          if ($LASTEXITCODE -ne 0) { throw 'GO_VET_FAILED' }
          go build -o "$env:RUNNER_TEMP\wingless-ice-qualification.exe" ./cmd/ice
          if ($LASTEXITCODE -ne 0) { throw 'ICE_BUILD_FAILED' }
          if (git status --porcelain) { throw 'SOURCE_MUTATED' }
          Write-Host 'ORIGINAL_WINDOWS_ATLAS_QUALIFICATION_PASS 715e53ae638497c8d7e53a94a0a7b954dac984b2'
