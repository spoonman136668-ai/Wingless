name: Wingless static research fanout observer
run-name: Wingless fanout observer ${{ github.event.workflow_run.id }}

on:
  workflow_run:
    workflows:
      - CKB static research runner
    types:
      - in_progress

permissions:
  contents: read
  actions: read

jobs:
  prepare:
    if: ${{ github.event.workflow_run.event == 'workflow_dispatch' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      enabled: ${{ steps.manifest.outputs.enabled }}
      matrix: ${{ steps.matrix.outputs.matrix }}
      manifest_path: ${{ steps.manifest.outputs.path }}
      package_sha: ${{ steps.identity.outputs.package_sha }}
      sidecar_sha: ${{ steps.identity.outputs.sidecar_sha }}
    steps:
      - name: Parse exact static research package identity
        id: identity
        shell: bash
        env:
          DISPLAY_TITLE: ${{ github.event.workflow_run.display_title }}
          SIDECAR_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$DISPLAY_TITLE" =~ ^CKB\ static\ research\ ([0-9a-f]{32})\ ([0-9a-f]{40})$ ]]; then
            REQUEST_ID="${BASH_REMATCH[1]}"
            PACKAGE_SHA="${BASH_REMATCH[2]}"
          else
            echo "STATIC_FANOUT_TRIGGER_IDENTITY_INVALID:$DISPLAY_TITLE" >&2
            exit 1
          fi
          [[ "$SIDECAR_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "STATIC_FANOUT_SIDECAR_SHA_INVALID" >&2; exit 1; }
          echo "request_id=$REQUEST_ID" >> "$GITHUB_OUTPUT"
          echo "package_sha=$PACKAGE_SHA" >> "$GITHUB_OUTPUT"
          echo "sidecar_sha=$SIDECAR_SHA" >> "$GITHUB_OUTPUT"

      - name: Checkout exact trusted sidecar implementation
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.identity.outputs.sidecar_sha }}
          path: sidecar
          persist-credentials: false
          fetch-depth: 1

      - name: Checkout exact frozen research package
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.identity.outputs.package_sha }}
          path: frozen-package
          persist-credentials: false
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Resolve optional package-bound fanout manifest
        id: manifest
        shell: bash
        env:
          PACKAGE_SHA: ${{ steps.identity.outputs.package_sha }}
        run: |
          set -euo pipefail
          if [[ ! -d frozen-package/research/fanout ]]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "path=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mapfile -t manifests < <(
            python - "$PACKAGE_SHA" <<'PY'
          import json
          import pathlib
          import sys

          package_sha = sys.argv[1]
          root = pathlib.Path("frozen-package/research/fanout")
          matches = []
          for path in sorted(root.glob("*.manifest.json")):
              with path.open("r", encoding="utf-8") as handle:
                  manifest = json.load(handle)
              if manifest.get("package_sha") in (package_sha, "BOUND_AT_DISPATCH"):
                  matches.append(path.as_posix().removeprefix("frozen-package/"))
          for path in matches:
              print(path)
          PY
          )
          if (( ${#manifests[@]} == 0 )); then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "path=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if (( ${#manifests[@]} != 1 )); then
            echo "STATIC_FANOUT_PACKAGE_BOUND_MANIFEST_COUNT_${#manifests[@]}" >&2
            exit 1
          fi
          MANIFEST_PATH="${manifests[0]}"
          case "$MANIFEST_PATH" in
            research/fanout/*.manifest.json) ;;
            *) echo "STATIC_FANOUT_MANIFEST_PATH_INVALID" >&2; exit 1 ;;
          esac
          [[ "$MANIFEST_PATH" != *".."* ]] || { echo "STATIC_FANOUT_MANIFEST_PATH_INVALID" >&2; exit 1; }
          src="frozen-package/$MANIFEST_PATH"
          [[ -f "$src" && ! -L "$src" ]] || { echo "STATIC_FANOUT_MANIFEST_MISSING_OR_SYMLINK" >&2; exit 1; }
          root="$(realpath frozen-package)"
          resolved="$(realpath "$src")"
          [[ "$resolved" == "$root"/research/fanout/* ]] || { echo "STATIC_FANOUT_MANIFEST_ESCAPE" >&2; exit 1; }
          echo "enabled=true" >> "$GITHUB_OUTPUT"
          echo "path=$MANIFEST_PATH" >> "$GITHUB_OUTPUT"

      - name: Build bounded candidate matrix
        if: ${{ steps.manifest.outputs.enabled == 'true' }}
        id: matrix
        shell: bash
        env:
          PACKAGE_SHA: ${{ steps.identity.outputs.package_sha }}
          MANIFEST_PATH: ${{ steps.manifest.outputs.path }}
        run: |
          set -euo pipefail
          mkdir -p sidecar/research/fanout
          cp -- "frozen-package/$MANIFEST_PATH" sidecar/research/fanout/controller.manifest.json
          cd sidecar
          MATRIX="$(python scripts/free_fanout_sidecar.py prepare             --manifest research/fanout/controller.manifest.json             --program Wingless             --package-sha "$PACKAGE_SHA")"
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

  screen:
    needs: prepare
    if: ${{ needs.prepare.outputs.enabled == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - name: Checkout exact trusted sidecar implementation
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sidecar_sha }}
          path: sidecar
          persist-credentials: false
          fetch-depth: 1

      - name: Checkout exact frozen research package
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.package_sha }}
          path: frozen-package
          persist-credentials: false
          fetch-depth: 1

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.5'
          cache: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Run one historical/replay-only candidate
        shell: bash
        env:
          PACKAGE_SHA: ${{ needs.prepare.outputs.package_sha }}
          MANIFEST_PATH: ${{ needs.prepare.outputs.manifest_path }}
          CANDIDATE_ID: ${{ matrix.id }}
        run: |
          set -euo pipefail
          mkdir -p sidecar/research/fanout
          cp -- "frozen-package/$MANIFEST_PATH" sidecar/research/fanout/controller.manifest.json
          cd sidecar
          python scripts/free_fanout_sidecar.py run             --manifest research/fanout/controller.manifest.json             --program Wingless             --package-sha "$PACKAGE_SHA"             --package-root ../frozen-package             --candidate-id "$CANDIDATE_ID"             --output "../fanout-output/$CANDIDATE_ID"

      - name: Upload external-evidence-only candidate artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wingless-static-fanout-${{ matrix.id }}-${{ github.run_id }}
          path: fanout-output/${{ matrix.id }}/
          if-no-files-found: error
          retention-days: 14

  aggregate:
    if: ${{ always() && needs.prepare.outputs.enabled == 'true' }}
    needs: [prepare, screen]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact trusted sidecar implementation
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sidecar_sha }}
          path: sidecar
          persist-credentials: false
          fetch-depth: 1

      - name: Checkout exact frozen research package
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.package_sha }}
          path: frozen-package
          persist-credentials: false
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - uses: actions/download-artifact@v4
        with:
          pattern: wingless-static-fanout-*-${{ github.run_id }}
          path: fanout-artifacts

      - name: Aggregate evidence without classification or promotion
        shell: bash
        env:
          PACKAGE_SHA: ${{ needs.prepare.outputs.package_sha }}
          MANIFEST_PATH: ${{ needs.prepare.outputs.manifest_path }}
        run: |
          set -euo pipefail
          mkdir -p sidecar/research/fanout
          cp -- "frozen-package/$MANIFEST_PATH" sidecar/research/fanout/controller.manifest.json
          cd sidecar
          python scripts/free_fanout_sidecar.py aggregate             --manifest research/fanout/controller.manifest.json             --program Wingless             --package-sha "$PACKAGE_SHA"             --artifacts ../fanout-artifacts             --output ../fanout-summary/summary.json

      - uses: actions/upload-artifact@v4
        with:
          name: wingless-static-fanout-summary-${{ github.run_id }}
          path: fanout-summary/
          if-no-files-found: error
          retention-days: 14
