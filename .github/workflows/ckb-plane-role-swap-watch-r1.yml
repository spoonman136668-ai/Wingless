name: CKB Plane Role Swap Watch R1

on:
  push:
    branches:
      - diagnostic/ckb-plane-role-swap-watch-r1
    paths:
      - '.github/ckb-plane-role-swap-watch-r1-request.json'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: [self-hosted, Windows, X64, wingless-research-safe]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Inspect CKB-plane research cutover read only
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference='Stop'
          Set-StrictMode -Version 2.0

          foreach($Item in @(
            @{Name='wing';Root='C:\ProgramData\CKBR\research-sidecar';Task='CKBPlane Research Sidecar'},
            @{Name='ygg';Root='C:\ProgramData\CKBR\research-sidecar-yggdrasil';Task='CKBPlane Research Sidecar Yggdrasil'}
          )){
            $Exe=Join-Path $Item.Root 'bin\research-sidecar.exe'
            $Cfg=Join-Path $Item.Root 'config\autonomy.yaml'
            $Policy=Join-Path $Item.Root 'config\research-sidecar.yaml'
            $Runtime=Join-Path $Item.Root 'config\research-runtime.yaml'
            $Life=Join-Path $Item.Root 'ops\Lifecycle.ps1'
            Write-Host "=== $($Item.Name) ==="
            $Task=Get-ScheduledTask -TaskName $Item.Task -ErrorAction SilentlyContinue
            $TaskState=if($null-eq$Task){'MISSING'}else{[string]$Task.State}
            Write-Host "$($Item.Name)_task=$TaskState"
            if(Test-Path -LiteralPath $Exe -PathType Leaf){
              Write-Host "$($Item.Name)_binary=$((Get-FileHash -LiteralPath $Exe -Algorithm SHA256).Hash.ToLowerInvariant())"
            }
            if(Test-Path -LiteralPath $Policy -PathType Leaf){
              foreach($Line in Get-Content -LiteralPath $Policy){
                if($Line -match '^\s*(planner_model|codex_default_model):'){Write-Host "$($Item.Name)_policy_$($Line.Trim())"}
              }
            }
            if(Test-Path -LiteralPath $Runtime -PathType Leaf){
              $Lines=Get-Content -LiteralPath $Runtime
              $Section=''
              foreach($Line in $Lines){
                if($Line -match '^(planner|implementation):\s*$'){$Section=$Matches[1];continue}
                if($Section -and $Line -match '^\s+model:\s*(.+?)\s*$'){
                  Write-Host "$($Item.Name)_runtime_$($Section)_model=$($Matches[1])"
                  $Section=''
                }
              }
            }
            if(Test-Path -LiteralPath $Life -PathType Leaf){
              foreach($Line in Get-Content -LiteralPath $Life){
                if($Line -match '^\s*\$Expected(Head|Binary|WinglessBinary)='){Write-Host "$($Item.Name)_$($Line.Trim())"}
              }
            }
            if((Test-Path -LiteralPath $Exe -PathType Leaf) -and (Test-Path -LiteralPath $Cfg -PathType Leaf)){
              try{
                $Raw=& $Exe -mode status -config $Cfg 2>$null
                if($LASTEXITCODE-eq0){
                  $S=(($Raw|ForEach-Object{[string]$_})-join[Environment]::NewLine)|ConvertFrom-Json
                  Write-Host "$($Item.Name)_status=$($S.status)"
                  Write-Host "$($Item.Name)_cycles=$($S.cycle_count)"
                  Write-Host "$($Item.Name)_blocked=$($S.blocked_cycle_count)"
                  Write-Host "$($Item.Name)_last_cycle_id=$($S.last_cycle_id)"
                  Write-Host "$($Item.Name)_last_cycle_status=$($S.last_cycle_status)"
                }else{Write-Host "$($Item.Name)_status_exec_exit=$LASTEXITCODE"}
              }catch{Write-Host "$($Item.Name)_status_error=$($_.Exception.Message)"}
            }
            $Archive=Join-Path $Item.Root 'state\archive'
            if(Test-Path -LiteralPath $Archive -PathType Container){
              $Latest=Get-ChildItem -LiteralPath $Archive -Directory -ErrorAction SilentlyContinue|Sort-Object LastWriteTimeUtc -Descending|Select-Object -First 3
              foreach($A in $Latest){Write-Host "$($Item.Name)_archive=$($A.Name) time=$($A.LastWriteTimeUtc.ToString('o'))"}
            }
          }

          $Procs=@(Get-CimInstance Win32_Process -ErrorAction SilentlyContinue)
          $ById=@{};foreach($P in $Procs){$ById[[int]$P.ProcessId]=$P}
          foreach($P in $Procs){
            $Cmd=[string]$P.CommandLine
            $Name=[string]$P.Name
            $Interesting=($Name -in @('research-sidecar.exe','codex.exe','powershell.exe','go.exe')) -or
              ($Cmd -match 'role-swap|rearm|go-build|actions-runner-ktrade')
            if(-not$Interesting){continue}
            $ParentName='unknown'
            if($ById.ContainsKey([int]$P.ParentProcessId)){$ParentName=[string]$ById[[int]$P.ParentProcessId].Name}
            if($Cmd.Length-gt700){$Cmd=$Cmd.Substring(0,700)}
            Write-Host "proc name=$Name pid=$($P.ProcessId) parent=$($P.ParentProcessId) parent_name=$ParentName cmd=$Cmd"
          }
          foreach($TaskName in @('CKBPlane Research Sidecar','CKBPlane Research Sidecar Yggdrasil')){
            $Info=Get-ScheduledTaskInfo -TaskName $TaskName -ErrorAction SilentlyContinue
            if($null-ne$Info){Write-Host "task_info name=$TaskName last_run=$($Info.LastRunTime.ToUniversalTime().ToString('o')) last_result=$($Info.LastTaskResult)"}
          }
          Write-Host 'CKB_PLANE_ROLE_SWAP_WATCH_R1=PASS'
