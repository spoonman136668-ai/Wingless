name: Wingless W-R12 frozen nuisance-invariance science
on:
  push:
    branches: [research/w-r12-offset-invariant-temporal-r1]
permissions:
  contents: read
jobs:
  science:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify immutable predecessor and preregistered source
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 4f7da44d03544559bbb7753052811b93f7d6d823 HEAD
          test "$(git hash-object research/contrib/chatgpt/20261012-w-r11-learned-temporal/execute.py)" = 7a4090770da7aade66f2ce68afe0fe530cd2e32a
          test "$(git hash-object research/contrib/chatgpt/20261012-w-r12-offset-invariance/prereg.json)" = 167aa343aa77d34d3542fc6c0b929676edef4838
          test "$(git hash-object research/contrib/chatgpt/20261012-w-r12-offset-invariance/execute.py)" = 01a028114864c249a240130b9de59fc2ee7ec794
          python3 -m json.tool research/contrib/chatgpt/20261012-w-r12-offset-invariance/prereg.json > /dev/null
          python3 -m py_compile research/contrib/chatgpt/20261012-w-r12-offset-invariance/execute.py
      - name: Original frozen independent science
        run: |
          set -euo pipefail
          python3 -B research/contrib/chatgpt/20261012-w-r12-offset-invariance/execute.py > /tmp/W-R12-original.json
          python3 -m json.tool /tmp/W-R12-original.json
      - uses: actions/upload-artifact@v4
        with:
          name: W-R12-original-frozen-shift
          path: /tmp/W-R12-original.json
          retention-days: 90
          if-no-files-found: error
      - name: One full Wingless regression and build
        run: go test ./... && go build ./...
