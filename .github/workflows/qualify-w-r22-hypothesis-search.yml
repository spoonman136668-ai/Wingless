name: Wingless W-R22 frozen hypothesis validation and original science
on:
  push:
    branches: [research/w-r22-validated-hypothesis-search-r1]
permissions:
  contents: read
jobs:
  science:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Freeze identity and inspect fixture-only binding
        run: |
          set -euo pipefail
          git merge-base --is-ancestor baa8e1eadde3fd10bba761735a50ff4d6944a82b HEAD
          test "$(git hash-object research/contrib/chatgpt/20261013-w-r22-hypothesis-prereg/prereg.json)" = 01e4674a8b97a0ab4153f54642e1b95c6d66533c
          test "$(git hash-object research/contrib/chatgpt/20261013-w-r22-hypothesis-prereg/execute.py)" = ad20dbfb02c06e799fc16834caa87a478a8b9294
          python3 -m json.tool research/contrib/chatgpt/20261013-w-r22-hypothesis-prereg/prereg.json >/dev/null
          python3 -m py_compile research/contrib/chatgpt/20261013-w-r22-hypothesis-prereg/execute.py
          python3 -B -c "import runpy; m=runpy.run_path('research/contrib/chatgpt/20261013-w-r22-hypothesis-prereg/execute.py', run_name='fixture_only'); m['smoke_fixture_only']()"
      - name: New original W-R22 frozen research first-use
        run: |
          set -euo pipefail
          python3 -B research/contrib/chatgpt/20261013-w-r22-hypothesis-prereg/execute.py > /tmp/W-R22-original.json
          python3 -m json.tool /tmp/W-R22-original.json
      - uses: actions/upload-artifact@v4
        with:
          name: W-R22-original-fresh-hypothesis
          path: /tmp/W-R22-original.json
          retention-days: 90
          if-no-files-found: error
      - name: Full Wingless Go test/build
        run: go test ./... && go build ./...
