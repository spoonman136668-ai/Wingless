name: Wingless F56 frozen public-source FIT-only feasibility
on:
  push:
    branches:
      - research/w-f56-partial-observable-algebra-20261015-r1
permissions:
  contents: read
jobs:
  fit-source:
    if: "${{ github.event.head_commit.message == 'science(w-f56): one FIT-only noisy posterior feasibility and full regression' && github.run_attempt == 1 }}"
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Assert precode prereg and exact FIT-only model/test/audit blobs
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 230965c55e504cb27e1e6139e593b108d470718a HEAD
          test "$(git hash-object research/foundational/20261015-w-f56/prereg-candidate.json)" = 843b919605f6ad4522db6d474ff969da22c180f8
          test "$(git hash-object research/foundational/20261015-w-f56/source_feasibility.py)" = cc2a4502471dc47d1ed62f2cb36720ff3b280804
          test "$(git hash-object research/foundational/20261015-w-f56/test_fit_preflight.py)" = 42a1bad1530861d866b54afeb333a395db211a9e
          test "$(git hash-object research/foundational/20261015-w-f56/audit_fit.py)" = 2c5043a741ece9b827a507ede4af68ea5315fc6a
          python3 -m json.tool research/foundational/20261015-w-f56/prereg-candidate.json >/dev/null
          python3 -B -m unittest discover -s research/foundational/20261015-w-f56 -p test_fit_preflight.py -v
      - name: One complete existing repository regression
        shell: bash
        run: |
          set -euo pipefail
          go test -count=1 ./...
          go vet ./...
          go build ./...
      - name: Consume FIT-only source, independently audit and preserve negative if any
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/w56"
          git rev-parse HEAD > "$RUNNER_TEMP/w56/source-head.txt"
          python3 -B research/foundational/20261015-w-f56/source_feasibility.py --fit-only > "$RUNNER_TEMP/w56/fit-result.json"
          python3 -m json.tool "$RUNNER_TEMP/w56/fit-result.json" >/dev/null
          python3 -B research/foundational/20261015-w-f56/audit_fit.py             "$RUNNER_TEMP/w56/fit-result.json"             research/foundational/20261015-w-f56/prereg-candidate.json             > "$RUNNER_TEMP/w56/fit-independent-audit.txt"
          cat "$RUNNER_TEMP/w56/fit-independent-audit.txt"
          (cd "$RUNNER_TEMP/w56" && sha256sum fit-result.json fit-independent-audit.txt > manifest.sha256)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Wingless-F56-FIT-only-source-and-independent-audit
          path: ${{ runner.temp }}/w56/
          retention-days: 90
          if-no-files-found: error
      - name: Source authority guard
        run: echo "FIT_ONLY=true DIAGNOSTIC_ORIGINAL_CONSUMED=false F3_CUSTODY=false NATIVE_TOTAL_576B=false ACCEPTED_REF_MUTATION=false"
