name: Wingless W-R21 frozen eight-hypothesis compositional search
on:
  push:
    branches: [research/w-r21-hypothesis-selection-r1]
permissions:
  contents: read
jobs:
  science:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify frozen scientific identity
        run: |
          set -euo pipefail
          git merge-base --is-ancestor baa8e1eadde3fd10bba761735a50ff4d6944a82b HEAD
          test "$(git hash-object research/contrib/chatgpt/20261013-w-r21-hypothesis-search/prereg.json)" = 76b654c9e9924c37b41fdcd6bb7b6ce499f30ef3
          test "$(git hash-object research/contrib/chatgpt/20261013-w-r21-hypothesis-search/execute.py)" = f80de9528f3df9477110e11dbbd219014333961f
          python3 -m json.tool research/contrib/chatgpt/20261013-w-r21-hypothesis-search/prereg.json >/dev/null
          python3 -m py_compile research/contrib/chatgpt/20261013-w-r21-hypothesis-search/execute.py
      - name: Original frozen eight-hypothesis experiment
        run: |
          set -euo pipefail
          python3 -B research/contrib/chatgpt/20261013-w-r21-hypothesis-search/execute.py > /tmp/W-R21-original.json
          python3 -m json.tool /tmp/W-R21-original.json
      - uses: actions/upload-artifact@v4
        with:
          name: W-R21-original-hypothesis-search
          path: /tmp/W-R21-original.json
          retention-days: 90
          if-no-files-found: error
      - name: One full Wingless test and build
        run: go test ./... && go build ./...
