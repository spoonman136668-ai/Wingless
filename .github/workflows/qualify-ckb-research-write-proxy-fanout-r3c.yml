name: Qualify Wingless CKB research write proxy fanout R3C
on:
  push:
    branches:
      - repair/ckb-research-write-proxy-fanout-r3c-prepared
permissions:
  contents: read
jobs:
  qualify:
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.5'
          cache: false
      - name: Verify bounded R3 delta
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop';Set-StrictMode -Version 3.0
          $base='0dfe5ca8d83046cf088aee9ab412e40e8a3ac11a'
          git merge-base --is-ancestor $base HEAD
          if($LASTEXITCODE-ne0){throw 'PROXY_R3_BASE_DRIFT'}
          $changed=@(git diff --name-only "$base...HEAD")
          if('research/transport/Invoke-CKBResearchWriteProxy.ps1' -notin $changed){throw 'PROXY_R3_SCRIPT_MISSING'}
          $runtimeBad=@($changed|Where-Object{$_ -notlike '.ice/*' -and $_ -ne 'research/transport/Invoke-CKBResearchWriteProxy.ps1' -and $_ -like 'research/transport/*' -and $_ -ne 'research/transport/Prepare-ProxyFanoutR3.ps1'})
          if($runtimeBad.Count){throw ('PROXY_R3_RUNTIME_SCOPE:'+($runtimeBad-join','))}
      - name: Proxy semantics
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop';Set-StrictMode -Version 3.0
          $p='research/transport/Invoke-CKBResearchWriteProxy.ps1';$raw=Get-Content $p -Raw
          foreach($n in @('PROXY_FANOUT_RUN_DISCOVERY_TIMEOUT','fanout_status=[string]$run.status','operation -ne "fanout_dispatch"','run_id=$runId')){if(!$raw.Contains($n)){throw ('PROXY_R3_MARKER:'+ $n)}}
          $t=$null;$e=$null;[void][Management.Automation.Language.Parser]::ParseFile((Resolve-Path $p),[ref]$t,[ref]$e)
          if(@($e).Count){throw ('PROXY_R3_PARSE:'+(@($e|ForEach-Object{$_.Message})-join'|'))}
          pwsh -NoProfile -File $p -Lane Wingless -Repository spoonman136668-ai/Wingless -RepositoryPath 'C:\ProgramData\CKBR\research\repos\Wingless' -SelfTest
          if($LASTEXITCODE-ne0){throw 'PROXY_R3_SELFTEST'}
          gh run list --repo spoonman136668-ai/Wingless --workflow free-fanout-sidecar.yml --event workflow_dispatch --limit 10 --json databaseId,displayTitle,status,conclusion,createdAt | Out-Null
          if($LASTEXITCODE-ne0){throw 'PROXY_R3_RUN_LIST_PROBE'}
      - name: Full native regression
        shell: pwsh
        run: |
          ./scripts/Test-Native.ps1
