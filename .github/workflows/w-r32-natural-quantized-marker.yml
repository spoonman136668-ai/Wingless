name: Wingless W-R32 frozen natural quantized marker collisions
on:
  push:
    branches: [research/w-r32-natural-quantized-marker-collision-r1]
permissions:
  contents: read
jobs:
  science:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Exact frozen source identity and first-use gate
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 0c8679500be0322dcaeb17637eb56867744e73b6 HEAD
          test "$(git hash-object research/contrib/chatgpt/20261013-w-r31-legitimate-markers/execute.py)" = f6aa5ebeca31093df08e2818efd6032cc4f14c94
          test "$(git hash-object research/contrib/chatgpt/20261013-w-r32-quantized-marker/prereg.json)" = 2ddd0e2fb41fda787a7aac2b062d5e04fa7eceb4
          test "$(git hash-object research/contrib/chatgpt/20261013-w-r32-quantized-marker/execute.py)" = bb61423ff8dd9324c04c15d9e0add1f568051698
          python3 -m json.tool research/contrib/chatgpt/20261013-w-r32-quantized-marker/prereg.json > /dev/null
          python3 -m py_compile research/contrib/chatgpt/20261013-w-r32-quantized-marker/execute.py
      - name: First original heldout experiment - no replay
        run: |
          set -euo pipefail
          python3 -B research/contrib/chatgpt/20261013-w-r32-quantized-marker/execute.py > /tmp/W-R32-original.json
          python3 -m json.tool /tmp/W-R32-original.json > /dev/null
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/W-R32-original.json'))
          assert x['sealed_heldout_seeds']==list(range(1080,1096))
          assert len(x['arms'])==3 and all(len(a['cells'])==24 for a in x['arms'])
          print('CLASSIFICATION',x['classification'])
          print('NATURAL_ALIAS_RATE',x['genuine_marker_incidence_by_bits'])
          print('ACCURACY',x['downstream_accuracy_by_bits'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: W-R32-original-quantized-marker-collision
          path: /tmp/W-R32-original.json
          retention-days: 90
          if-no-files-found: error
      - name: One full Wingless test and build
        run: go test ./... && go build ./...
