name: Wingless W-R24 isolated corrupted-label catalogue qualification
on:
  push:
    branches: [research/chatgpt-isolated-w24-noisy-evidence-r1]
permissions:
  contents: read
jobs:
  science:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify frozen parent and first-use source blobs
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 51304a86f4291036e87f22716397881f24ea652e HEAD
          test "$(git hash-object research/contrib/chatgpt/20261013-w23-catalog-abstention/execute.py)" = 39a89607b25001e78b68e8cafd622218081e2093
          test "$(git hash-object research/contrib/chatgpt/20261013-w24-noisy-catalog/prereg.json)" = dc8ddfca806c12499ebacbb59a2f37818c0ddef7
          test "$(git hash-object research/contrib/chatgpt/20261013-w24-noisy-catalog/execute.py)" = b47358a6d460f442fcc00551ca825972bdd83d87
          python3 -m json.tool research/contrib/chatgpt/20261013-w24-noisy-catalog/prereg.json >/dev/null
          python3 -m py_compile research/contrib/chatgpt/20261013-w24-noisy-catalog/execute.py
      - name: First-use frozen one-label corruption and OOD science
        run: |
          set -euo pipefail
          python3 -B research/contrib/chatgpt/20261013-w24-noisy-catalog/execute.py > /tmp/W-R24-original.json
          python3 -m json.tool /tmp/W-R24-original.json
      - uses: actions/upload-artifact@v4
        with:
          name: W-R24-original-one-label-noise
          path: /tmp/W-R24-original.json
          retention-days: 90
          if-no-files-found: error
      - name: Complete Wingless regression and build
        run: go test ./... && go build ./...
