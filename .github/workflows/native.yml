        if: always()
        with:
          name: g9n-one-original-expert
          path: evidence/
          retention-days: 14

  g9w_runtime_provision:
    # One-shot authorized host environment provisioning; never on routine pushes.
    needs: native
    if: ${{ github.event_name == 'push' && github.repository == 'spoonman136668-ai/Wingless' && github.ref == 'refs/heads/research/cnc01q-direct-expert-development-20261103' && contains(github.event.head_commit.message, '[g9w-provision]') }}
    runs-on: [self-hosted, Windows, X64, wingless-up-b]
    timeout-minutes: 55
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Verify authorized runner, source, and isolated toolcache
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_NAME -ne 'WINGLESS-UP-B' -or $env:RUNNER_ENVIRONMENT -ne 'self-hosted' -or $env:RUNNER_OS -ne 'Windows') { throw 'Wrong GPU runner' }
          if ($env:GITHUB_REPOSITORY -ne 'spoonman136668-ai/Wingless' -or $env:GITHUB_REF -ne 'refs/heads/research/cnc01q-direct-expert-development-20261103') { throw 'Wrong source scope' }
          if ((git rev-parse HEAD).Trim() -ne $env:GITHUB_SHA) { throw 'Source SHA mismatch' }
          $dirty = @(git status --porcelain --untracked-files=all)
          if ($LASTEXITCODE -ne 0 -or $dirty.Count -ne 0) { throw 'Dirty checkout or failed git status' }
          if (-not $env:RUNNER_TOOL_CACHE -or -not (Test-Path -LiteralPath $env:RUNNER_TOOL_CACHE -PathType Container)) { throw 'Persistent runner tool cache unavailable' }
          if (-not (Get-Command nvidia-smi -ErrorAction SilentlyContinue)) { throw 'GPU telemetry unavailable' }
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.7'
          architecture: x64
          cache: ''
      - name: Provision pinned CUDA Torch in dedicated persistent venv
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference = 'Stop'
          $venv = Join-Path $env:RUNNER_TOOL_CACHE 'wingless-g9w-py3127-torch210-cu128'
          $exe = Join-Path $venv 'Scripts\python.exe'
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) {
            & python -m venv $venv
            if ($LASTEXITCODE -ne 0) { throw 'Isolated venv creation failed' }
          }
          & $exe -m pip install --disable-pip-version-check --no-cache-dir --only-binary=:all: --index-url https://download.pytorch.org/whl/cu128 'torch==2.10.0'
          if ($LASTEXITCODE -ne 0) { throw 'Pinned CUDA wheel installation failed' }
          & $exe -c 'import sys,torch; assert sys.version_info[:3] == (3,12,7); assert torch.__version__.startswith("2.10.0+cu128"); assert torch.version.cuda is not None and torch.version.cuda.startswith("12.8"); print("G9W_PINNED_CUDA_TORCH_IMPORT_PASS")'
          if ($LASTEXITCODE -ne 0) { throw 'Pinned CUDA wheel provenance or import verification failed' }
          # Installation verifies import and CUDA build metadata only; no GPU kernels.
          New-Item -ItemType Directory -Force evidence | Out-Null
          & $exe -m pip freeze --all | Out-File -Encoding utf8 evidence/g9w-pip-freeze.txt
          @{schema='wingless.gcen.g9w.runtime-provision.v1'; source_sha=$env:GITHUB_SHA; status='PYTHON312_CUDA_TORCH_IMPORT_PASS'; cuda_kernel_executed=$false; model_forward=$false; model_weights_downloaded=$false} | ConvertTo-Json -Compress | Set-Content -Encoding utf8 evidence/g9w-runtime-status.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g9w-isolated-runtime-provision
          path: evidence/g9w-*
          retention-days: 14

  g9t_existing_wingless_gpu_preflight:
    # Existing automatic preflight waits for native qualification and, only on
    # the one-shot provisioning commit, the isolated runtime installation.
    needs: [native, g9w_runtime_provision]
    if: ${{ always() && needs.native.result == 'success' && (needs.g9w_runtime_provision.result == 'success' || needs.g9w_runtime_provision.result == 'skipped') && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.g9t_gpu_preflight == true)) && github.repository == 'spoonman136668-ai/Wingless' && github.ref == 'refs/heads/research/cnc01q-direct-expert-development-20261103' }}
    runs-on: [self-hosted, Windows, X64, wingless-up-b]
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Assert exact self-hosted runner identity and clean checkout
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_REPOSITORY -ne 'spoonman136668-ai/Wingless') { throw 'Wrong repository' }
          if ($env:RUNNER_NAME -ne 'WINGLESS-UP-B' -or $env:RUNNER_ENVIRONMENT -ne 'self-hosted' -or $env:RUNNER_OS -ne 'Windows') { throw 'Unverified Wingless runner' }
          if ($env:GITHUB_REF -ne 'refs/heads/research/cnc01q-direct-expert-development-20261103') { throw 'Wrong branch' }
          if ((git rev-parse HEAD).Trim() -ne $env:GITHUB_SHA) { throw 'Wrong exact source SHA' }
          $dirty = @(git status --porcelain --untracked-files=all)
          if ($LASTEXITCODE -ne 0) { throw 'Git status failed' }
          if ($dirty.Count -ne 0) { throw 'Dirty source checkout' }
          if (-not (Get-Command nvidia-smi -ErrorAction SilentlyContinue)) { throw 'No NVIDIA telemetry' }
          New-Item -ItemType Directory -Force evidence | Out-Null
          $status = @{'schema'='wingless.gcen.g9t.optional-preflight.v1';'status'='NOT_ADMITTED';'source_sha'=$env:GITHUB_SHA;'gpu_kernel_executed'=$false;'model_forward'=$false}
          $status | ConvertTo-Json -Compress | Set-Content -Encoding utf8 evidence/g9t-status.json
          # Discover only pre-existing Python 3 commands. Never install, download or alter PATH.
          $candidates = @(
            @{name=(Join-Path $env:RUNNER_TOOL_CACHE 'wingless-g9w-py3127-torch210-cu128\Scripts\python.exe'); flag=''},
            @{name='python'; flag=''},
            @{name='python3'; flag=''},
            @{name='py'; flag='-3'}
          )
          # Also inspect standard machine-wide installations and HKLM PythonCore.
          # This avoids assuming service PATH matches an interactive user's PATH.
          $roots = @('C:\Program Files', 'C:\Program Files (x86)', 'C:\')
          foreach ($root in $roots) {
            $pattern = if ($root -eq 'C:\') { 'Python3*' } else { 'Python*' }
            foreach ($dir in @(Get-ChildItem -LiteralPath $root -Directory -Filter $pattern -ErrorAction SilentlyContinue)) {
              $exe = Join-Path $dir.FullName 'python.exe'
              if (Test-Path -LiteralPath $exe -PathType Leaf) { $candidates += @{name=$exe; flag=''} }
            }
          }
          # Read-only scan of existing versions in the machine-managed CI Python root.
          # Do not modify PATH, install packages, or search user profiles.
          $machinePythonRoot = 'C:\ckb-ci-tools\python'
          if (Test-Path -LiteralPath $machinePythonRoot -PathType Container) {
            foreach ($dir in @(Get-ChildItem -LiteralPath $machinePythonRoot -Directory -ErrorAction SilentlyContinue)) {
              $exe = Join-Path $dir.FullName 'python.exe'
              if (Test-Path -LiteralPath $exe -PathType Leaf) {
                $candidates += @{name=$exe; flag=''}
              }
            }
          }
          foreach ($registry in @('HKLM:\SOFTWARE\Python\PythonCore', 'HKLM:\SOFTWARE\WOW6432Node\Python\PythonCore')) {
            foreach ($version in @(Get-ChildItem -LiteralPath $registry -ErrorAction SilentlyContinue)) {
              $install = Join-Path $version.PSPath 'InstallPath'
              $exe = (Get-ItemProperty -LiteralPath $install -Name ExecutablePath -ErrorAction SilentlyContinue).ExecutablePath
              if ($exe -and (Test-Path -LiteralPath $exe -PathType Leaf)) { $candidates += @{name=$exe; flag=''} }
            }
          }
          $selected = $null
          foreach ($candidate in $candidates) {
            $cmd = if (Test-Path -LiteralPath $candidate.name -PathType Leaf -ErrorAction SilentlyContinue) {
              Get-Command -Name $candidate.name -CommandType Application -ErrorAction SilentlyContinue | Select-Object -First 1
            } else {
              Get-Command -Name $candidate.name -CommandType Application -ErrorAction SilentlyContinue | Select-Object -First 1
            }
            if ($null -eq $cmd) { continue }
            $python = $cmd.Source
            $args = @()
            if ($candidate.flag) { $args += $candidate.flag }
            # Broken interpreters may write to stderr. Under ErrorActionPreference
            # Stop, PowerShell 5.1 turns that into a terminating NativeCommandError.
            # Treat a failed candidate as an ordinary negative probe and continue.
            $probe = $null
            $probeExit = 1
            $previousPreference = $ErrorActionPreference
            try {
              $ErrorActionPreference = 'Continue'
              $probe = & $python @args -c 'import sys; print(sys.version_info.major)' 2>$null
              $probeExit = $LASTEXITCODE
            } catch {
              $probeExit = 1
            } finally {
              $ErrorActionPreference = $previousPreference
            }
            if ($probeExit -ne 0 -or $probe -ne '3') { continue }
            # Prefer an already-installed CUDA-built Torch, without installing anything.
            # Keep the first valid Python as a diagnostic fallback if none is available.
            if ($null -eq $selected) { $selected = @{path=$python; flag=$candidate.flag} }
            $torchProbe = $null
            $torchExit = 1
            try {
              $ErrorActionPreference = 'Continue'
              $torchProbe = & $python @args -c 'import torch; print(int(torch.version.cuda is not None))' 2>$null
              $torchExit = $LASTEXITCODE
            } catch {
              $torchExit = 1
            } finally {
              $ErrorActionPreference = $previousPreference
            }
            if ($torchExit -eq 0 -and $torchProbe -eq '1') {
              $selected = @{path=$python; flag=$candidate.flag}
              break
            }
          }
          if ($null -eq $selected) {
            $status.discovery = 'PATH_AND_SYSTEM_WIDE'
            $status.status = 'PYTHON_RUNTIME_UNAVAILABLE'
            $status | ConvertTo-Json -Compress | Set-Content -Encoding utf8 evidence/g9t-status.json
            throw 'PYTHON_RUNTIME_UNAVAILABLE: no working existing Python 3 command for the runner service account'
          }
          "G9T_PYTHON_EXE=$($selected.path)" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "G9T_PYTHON_FLAG=$($selected.flag)" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          # The optional Torch capability probes may legitimately exit nonzero.
          # GitHub's Windows PowerShell wrapper exits using LASTEXITCODE even after
          # a successful Out-File. Reset it only after the required identity,
          # version, and selected-interpreter checks succeeded.
          $global:LASTEXITCODE = 0
      - name: Current G9T CUDA admission on existing runtime only
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference = 'Stop'
          # No software installation, weight download, or benchmark execution.
          if (-not $env:G9T_PYTHON_EXE -or -not (Test-Path -LiteralPath $env:G9T_PYTHON_EXE -PathType Leaf)) { throw 'G9T selected Python runtime missing' }
          $pythonArgs = @()
          if ($env:G9T_PYTHON_FLAG) { $pythonArgs += $env:G9T_PYTHON_FLAG }
          # A child process captures the full error without PowerShell 5.1 turning
          # stderr into a terminating NativeCommandError before classification.
          $pythonArgs += @('research/nr1/gcen/g9t_gpu_admission.py', '--source-sha', $env:GITHUB_SHA)
          $stderrPath = Join-Path $env:RUNNER_TEMP 'g9t-python-stderr.txt'
          $proc = Start-Process -FilePath $env:G9T_PYTHON_EXE -ArgumentList $pythonArgs -Wait -PassThru -NoNewWindow -RedirectStandardOutput 'evidence/g9t-stdout.txt' -RedirectStandardError $stderrPath
          $stderrText = if (Test-Path -LiteralPath $stderrPath -PathType Leaf) { Get-Content -LiteralPath $stderrPath -Raw } else { '' }
          Remove-Item -LiteralPath $stderrPath -Force -ErrorAction SilentlyContinue
          if ($proc.ExitCode -ne 0) {
            $reason = 'PYTHON_OR_CUDA_PROBE_FAILED'
            if ($stderrText -match 'No module named [\x27\x22]torch[\x27\x22]') { $reason = 'TORCH_MODULE_UNAVAILABLE' }
            elseif ($stderrText -match 'DLL load failed') { $reason = 'TORCH_DLL_LOAD_FAILED' }
            elseif ($stderrText -match 'CPU-only or incomplete Torch CUDA build') { $reason = 'TORCH_CUDA_BUILD_UNAVAILABLE' }
            elseif ($stderrText -match 'CUDA unavailable') { $reason = 'CUDA_DEVICE_UNAVAILABLE' }
            @{'schema'='wingless.gcen.g9t.optional-preflight.v1';'status'=$reason;'source_sha'=$env:GITHUB_SHA;'gpu_kernel_executed'=$false;'model_forward'=$false} | ConvertTo-Json -Compress | Set-Content -Encoding utf8 evidence/g9t-status.json
            throw "G9T CUDA admission failed: $reason (exit $($proc.ExitCode)); no model executed"
          }
          $matches = @(Get-Content evidence/g9t-stdout.txt | Where-Object { $_ -match '^G9T_CURRENT_GPU_ADMISSION ' })
          if ($matches.Count -ne 1) { throw 'Missing unique admission receipt' }
          $r = ($matches[0] -replace '^G9T_CURRENT_GPU_ADMISSION ', '') | ConvertFrom-Json
          if ($r.schema -ne 'wingless.gcen.g9t.current-gpu-admission.v1' -or $r.source_repo -ne 'spoonman136668-ai/Wingless' -or $r.exact_source_sha -ne $env:GITHUB_SHA -or $r.device_index -ne 0 -or $r.currently_free_vram_bytes -lt 1073741824 -or $r.historical_gpu_receipt_used_for_current_admission -ne $false -or $r.cuda_kernel_executed -ne $false -or $r.runner_use_authorized_by_probe -ne $false) { throw 'Admission receipt identity or safety mismatch' }
          @{'schema'='wingless.gcen.g9t.optional-preflight.v1';'status'='CURRENT_CUDA_CAPACITY_ADMITTED_ONLY';'source_sha'=$env:GITHUB_SHA;'gpu_kernel_executed'=$false;'model_forward'=$false} | ConvertTo-Json -Compress | Set-Content -Encoding utf8 evidence/g9t-status.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g9t-wingless-existing-runner-preflight
          path: evidence/
          retention-days: 14
