    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify isolated exact source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
      - name: Pin CPU BF16 runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet 'torch==2.10.0' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check --quiet 'numpy==2.2.6' 'safetensors==0.5.3'
          if [[ "$G9R" == "true" ]]; then python -m pip install --disable-pip-version-check --quiet 'numba==0.62.1'; fi
        env:
          G9R: ${{ contains(github.event.head_commit.message, '[g9r-original-kernel]') }}
      - name: Admit one authenticated original expert tensor
        shell: bash
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
          G9R: ${{ contains(github.event.head_commit.message, '[g9r-original-kernel]') }}
          G9U: ${{ contains(github.event.head_commit.message, '[g9u-original-custody]') }}
        run: |
          set -euo pipefail
          mkdir -p evidence
          printf '{"status":"NOT_ACCEPTED","source":"ONE_ORIGINAL_SHARD_ONLY"}\n' > evidence/g9n-original-status.json
          if [[ "$G9R" == "true" ]]; then KERNEL_FLAG="--g9r-kernel"; else KERNEL_FLAG=""; fi
          if [[ "$G9U" == "true" ]]; then G9U_FLAG="--g9u-custody"; else G9U_FLAG=""; fi
          python research/nr1/gcen/g9n_one_original_tensor.py \
            --manifest research/nr1/gcen/upstream_full_manifest_unverified_weights.json \
            --scratch-root "$RUNNER_TEMP" \
            --source-sha "$GITHUB_SHA" \
            --output evidence/g9n-original-expert.json $KERNEL_FLAG $G9U_FLAG
          python - <<'PY'
          import json,os
          from pathlib import Path
          j=json.loads(Path("evidence/g9n-original-expert.json").read_text())
          assert j["source_sha"]==os.environ["GITHUB_SHA"]
          assert j["schema"]=="wingless.gcen.g9n.one-original-tensor-development.v1"
          assert j["one_original_shard_authenticated"] and not j["all_16_shards_authenticated"]
          assert j["disk_integrity_receipt"]["disk_content_verified"]
          c=j["original_full_expert_operator_comparison"]
          assert c["schema"]=="wingless.gcen.g9p.one-original-full-expert-comparison.v1"
          assert c["comparison_count"]==14 and len(c["comparisons"])==14
          assert {x["seed"] for x in c["comparisons"]}=={751,811}
          arms={x["arm"] for x in c["comparisons"]}
          assert len(arms)==7
          assert {"mixed_uniform_eighth_INT4","mixed_ranked_eighth_INT4","mixed_ranked_quarter_INT4"} <= arms
          for seed in (751,811):
            rows={x["arm"]:x for x in c["comparisons"] if x["seed"]==seed}
            assert len(rows)==7
            assert rows["mixed_ranked_eighth_INT4"]["encoded_bytes_including_accounted_metadata"]==rows["mixed_uniform_eighth_INT4"]["encoded_bytes_including_accounted_metadata"]
          if os.getenv("G9U")=="true":
            bridge=j["g9u_independent_original_loader_custody"]
            assert bridge["result"]=="G9U_ORIGINAL_BF16_CPU_LOADER_PARITY_VERIFIED"
            assert bridge["original_shard_authenticated"]
            assert bridge["tensor_name"]==j["selected_tensor"]
            assert bridge["shard_sha256"]==j["original_shard_sha256"]
            assert not bridge["cuda_executed"] and not bridge["model_forward"]
          if os.getenv("G9R")=="true":
            receipt=j["g9r_packed_cpu_benchmark"]
            assert receipt["schema"]=="wingless.gcen.g9r.original-packed-int2-numba-cpu.v1"
            assert {v["seed"] for v in receipt["comparisons"]}=={751,811}
            assert len(receipt["comparisons"])==2
            assert not receipt["uses_original_activations"] and not receipt["uses_gpu"]
          assert c["probe_inputs"]=="SYNTHETIC_GAUSSIAN_NOT_QWEN_ACTIVATIONS"
          assert not c["full_model_forward"] and not c["gpu_vram_measured"]
          assert j["source_and_sink_files_after_cleanup"]==0
          assert not j["full_model_forward"] and not j["gpu_vram_measured"]
          PY
          printf '{"status":"G9N_ONE_ORIGINAL_BF16_EXPERT_VERIFIED","scope":"ONE_SHARD_NO_FORWARD"}\n' > evidence/g9n-original-status.json
