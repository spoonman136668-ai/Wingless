name: Wingless native validation
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'research/nr1/gcen/**'
      - '.github/workflows/native.yml'
      - 'scripts/Test-Native.ps1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Record checked-out source identity
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force evidence | Out-Null
          git rev-parse HEAD | Out-File -Encoding utf8 evidence/source-sha.txt
          git status --porcelain | Out-File -Encoding utf8 evidence/source-status.txt
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.5'
          cache: false
      - name: Native tests and evidence
        shell: pwsh
        run: ./scripts/Test-Native.ps1
      - name: Set up GCEN Python
        if: ${{ hashFiles('research/nr1/gcen/run_focused.py') != '' }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: GCEN development-only focused tests
        if: ${{ hashFiles('research/nr1/gcen/run_focused.py') != '' }}
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check "numpy==2.2.6" "safetensors==0.5.3"
          python research/nr1/gcen/run_focused.py
          if ($LASTEXITCODE -ne 0) { throw "GCEN focused tests failed" }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-${{ matrix.os }}
          path: evidence/
          retention-days: 14
