name: Wingless native validation
on:
  push:
    branches:
      - main
      - research/nr1-gcen-g4c-development-20261102
  pull_request:
    paths:
      - 'research/nr1/gcen/**'
      - '.github/workflows/native.yml'
      - 'scripts/Test-Native.ps1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Record checked-out source identity
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force evidence | Out-Null
          $expected = '${{ github.event.pull_request.head.sha || github.sha }}'
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $expected) { throw "Exact-head checkout mismatch" }
          $actual | Out-File -Encoding utf8 evidence/source-sha.txt
          git status --porcelain | Out-File -Encoding utf8 evidence/source-status.txt
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.5'
          cache: false
      - name: Native tests and evidence
        shell: pwsh
        run: ./scripts/Test-Native.ps1
      - name: Diagnose stale ICE without accepting regenerated output
        if: failure()
        shell: pwsh
        run: |
          & go run -buildvcs=false ./cmd/ice build
          if ($LASTEXITCODE -ne 0) { throw "ICE diagnostic regeneration failed" }
          git status --short | Out-File -Encoding utf8 evidence/ice-regenerated-status.txt
          git diff --binary -- .ice | Out-File -Encoding utf8 evidence/ice-regenerated.patch
          & go run -buildvcs=false ./cmd/ice validate
          if ($LASTEXITCODE -ne 0) { throw "Regenerated ICE still invalid" }
          Write-Output "ICE_DIAGNOSTIC_ONLY_NOT_QUALIFIED"
          # Export only six reproducible generated ICE files for bounded repair.
          # Diagnostic runs remain FAILED; these log records are not acceptance.
          $paths = @(
            '.ice/architecture-map.json',
            '.ice/dependency-map.json',
            '.ice/integration-seams.json',
            '.ice/manifest.json',
            '.ice/symbol-map.json',
            '.ice/test-map.json'
          )
          foreach ($path in $paths) {
            $bytes = [System.IO.File]::ReadAllBytes((Join-Path (Get-Location) $path))
            $encoded = [Convert]::ToBase64String($bytes)
            Write-Output "GCEN_ICE_EXPORT_BEGIN $path $($bytes.Length)"
            for ($offset = 0; $offset -lt $encoded.Length; $offset += 512) {
              $length = [Math]::Min(512, $encoded.Length - $offset)
              Write-Output ("GCEN_ICE_EXPORT_DATA " + $encoded.Substring($offset, $length))
            }
            Write-Output "GCEN_ICE_EXPORT_END $path"
          }
      - name: Set up GCEN Python
        if: ${{ hashFiles('research/nr1/gcen/run_focused.py') != '' }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: GCEN development-only focused tests
        if: ${{ hashFiles('research/nr1/gcen/run_focused.py') != '' }}
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check "numpy==2.2.6" "safetensors==0.5.3"
          python research/nr1/gcen/run_focused.py
          if ($LASTEXITCODE -ne 0) { throw "GCEN focused tests failed" }
      - name: GCEN pinned upstream metadata custody probe (diagnostic only)
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/research/nr1-gcen-g4c-development-20261102' && matrix.os == 'ubuntu-latest' && success() }}
        continue-on-error: true
        timeout-minutes: 3
        shell: pwsh
        run: |
          # Read-only API and small metadata-file retrieval: NO model weights or inference.
          # Network failure is a custody blocker, not a native regression failure.
          python research/nr1/gcen/collect_upstream_manifest.py --output evidence/gcen-upstream-manifest.json
          if ($LASTEXITCODE -ne 0) {
            'UPSTREAM_CUSTODY_RETRIEVAL_FAILED_NOT_ACCEPTED' | Out-File -Encoding utf8 evidence/gcen-upstream-status.txt
            throw 'upstream metadata retrieval failed; no scientific custody admitted'
          }
          'UPSTREAM_METADATA_ONLY_LOCAL_WEIGHTS_UNVERIFIED' | Out-File -Encoding utf8 evidence/gcen-upstream-status.txt
      - name: GCEN one-shot four-shard custody batch (2-5; no weight storage)
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/research/nr1-gcen-g4c-development-20261102' && matrix.os == 'ubuntu-latest' && contains(github.event.head_commit.message, '[gcen-batch-2-5]') && success() }}
        continue-on-error: true
        timeout-minutes: 13
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json, pathlib, time, urllib.request
          from urllib.parse import quote
          root=pathlib.Path("evidence")
          root.mkdir(exist_ok=True)
          rev="ad44e777bcd18fa416d9da3bd8f70d33ebb85d39"
          manifest=json.loads(pathlib.Path("research/nr1/gcen/upstream_full_manifest_unverified_weights.json").read_text())
          assert manifest["revision"]==rev and manifest["model"]=="Qwen/Qwen3-30B-A3B"
          names=[f"model-{i:05d}-of-00016.safetensors" for i in range(2,6)]
          receipts=[]
          try:
              for name in names:
                  expected=manifest["files"][name]
                  receipt={"file":name,"source_revision":rev,"expected_sha256":expected,"status":"FAILED_NOT_ACCEPTED"}
                  receipts.append(receipt)
                  url="https://huggingface.co/Qwen/Qwen3-30B-A3B/resolve/"+rev+"/"+quote(name)
                  started=time.monotonic()
                  req=urllib.request.Request(url,headers={"Accept-Encoding":"identity","User-Agent":"Wingless-GCEN-Bounded-Custody/1"})
                  sha=hashlib.sha256()
                  count=0
                  with urllib.request.urlopen(req,timeout=90) as response:
                      if response.status!=200 or response.headers.get("Content-Range"):
                          raise ValueError("noncomplete response")
                      length=response.headers.get("Content-Length")
                      length=int(length) if length is not None else None
                      if length is not None and (length<=0 or length>6*1024**3):
                          raise ValueError("invalid content length")
                      while True:
                          chunk=response.read(4*1024*1024)
                          if not chunk: break
                          count+=len(chunk)
                          if count>6*1024**3:
                              raise ValueError("shard exceeds six-GiB limit")
                          sha.update(chunk)
                      if length is not None and length!=count:
                          raise ValueError("incomplete transfer")
                  digest=sha.hexdigest()
                  receipt.update(bytes_streamed=count,observed_sha256=digest,elapsed_seconds=round(time.monotonic()-started,2))
                  if digest!=expected:
                      raise ValueError("SHA256 mismatch: "+name)
                  receipt["status"]="ORIGINAL_SHARD_BYTES_MATCH_PINNED_UPSTREAM_SHA256"
          except Exception as e:
              if receipts:
                  receipts[-1]["error_type"]=type(e).__name__
              raise
          finally:
              (root/"gcen-shards-2-5-custody.json").write_text(json.dumps({"source_revision":rev,"records":receipts},indent=2,sort_keys=True)+"\\n")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-${{ matrix.os }}
          path: evidence/
          retention-days: 14
