name: Wingless native validation
on:
  push:
    branches:
      - main
      - research/nr1-route-residency-r1-20261103
  pull_request:
    paths:
      - 'research/nr1/residency/**'
      - '.github/workflows/native.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.5'
          cache: false
      - name: Native tests and evidence
        shell: pwsh
        run: ./scripts/Test-Native.ps1
      - name: R1 exact source identity
        shell: pwsh
        run: |
          $expected = '${{ github.event.pull_request.head.sha || github.sha }}'
          $actual = (git rev-parse HEAD).Trim()
          if ($expected -ne $actual) { throw 'Wrong exact checkout identity' }
          $actual | Out-File -Encoding utf8 evidence/source-sha.txt
          git status --porcelain | Out-File -Encoding utf8 evidence/source-status.txt
          if ((Get-Content evidence/source-status.txt | Out-String).Trim()) { throw 'Dirty checkout' }
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: R1 frozen router-cache tests and simulated receipt
        shell: pwsh
        run: |
          python -m unittest discover -s research/nr1/residency -p 'test_*.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Residency focused tests failed' }
          python research/nr1/residency/route_cache_r1.py --output evidence/residency-r1.json
          if ($LASTEXITCODE -ne 0) { throw 'Residency frozen screen failed' }
      - name: R2 bounded real synthetic file-read controls
        shell: pwsh
        run: |
          python research/nr1/residency/route_io_r2.py --output evidence/residency-r2.json
          if ($LASTEXITCODE -ne 0) { throw 'R2 physical synthetic file-read pilot failed' }
      - name: R1 ICE diagnostic only (not qualification)
        if: failure()
        shell: pwsh
        run: |
          & go run -buildvcs=false ./cmd/ice build
          if ($LASTEXITCODE -ne 0) { throw 'ICE diagnostic build failed' }
          & go run -buildvcs=false ./cmd/ice validate
          if ($LASTEXITCODE -ne 0) { throw 'ICE diagnostic validation failed' }
          Write-Output 'R1_ICE_DIAGNOSTIC_NOT_QUALIFIED'
          $paths = @('.ice/architecture-map.json', '.ice/dependency-map.json', '.ice/integration-seams.json', '.ice/manifest.json', '.ice/symbol-map.json', '.ice/test-map.json')
          foreach ($path in $paths) {
            $bytes = [System.IO.File]::ReadAllBytes((Join-Path (Get-Location) $path))
            $encoded = [Convert]::ToBase64String($bytes)
            Write-Output "R1_ICE_BEGIN $path $($bytes.Length)"
            for ($offset = 0; $offset -lt $encoded.Length; $offset += 512) {
              Write-Output ("R1_ICE_DATA " + $encoded.Substring($offset, [Math]::Min(512, $encoded.Length - $offset)))
            }
            Write-Output "R1_ICE_END $path"
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-${{ matrix.os }}
          path: evidence/
          retention-days: 14
