# One-shot exact-candidate advisory ICE and semantic Atlas regeneration.
# Preserves reviewed symbol evidence; no models, controllers or scientific claims.
name: Wingless draft source ICE regeneration
on:
  push:
    branches:
      - engineering/optin-free-research-executor-20261028
    paths:
      - .github/workflows/wingless-draft-ice-refresh.yml
permissions:
  contents: write
jobs:
  regenerate:
    if: github.repository == 'spoonman136668-ai/Wingless'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.5'
          cache: false
      - name: Attest exact parent and known development and ICE delta
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'engineering/optin-free-research-executor-20261028'
          test "$(git rev-parse HEAD^)" = '9569a02b61a2d1d65ffd357e4e194cbee770c268'
          test "$(git rev-parse origin/main)" = '48ba343b403bc9b4389ce1777130e546b3c446bd'
          python3 - <<'PY'
          import subprocess
          allowed={
            '.github/workflows/wingless-draft-ice-refresh.yml',
            '.github/workflows/free-research-isolation-qualify.yml',
            '.github/workflows/repo-local-autonomy-qualify.yml',
            '.research-autonomy/config.json',
            'scripts/Invoke-NemotronRepoAgent.ps1',
            'scripts/Invoke-RepoLocalResearchCycle.ps1',
            '.ice/architecture-map.json',
            '.ice/manifest.json',
          }
          actual=set(subprocess.check_output(
              ['git','diff','--name-only','origin/main...HEAD'],text=True
          ).splitlines())
          if actual != allowed:
              raise SystemExit('WINGLESS_SEMANTIC_ATLAS_SCOPE_MISMATCH '+repr(sorted(actual^allowed)))
          print('WINGLESS_SEMANTIC_ATLAS_SOURCE_SCOPE_PASS')
          PY
      - name: Preserve reviews and rebind semantic Atlas to exact source
        shell: bash
        run: |
          set -euo pipefail
          go run ./cmd/ice build
          go run ./cmd/ice validate
          python3 -B scripts/maintain_code_atlas.py --root .
          python3 - <<'PY'
          import subprocess
          changed=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          allowed={
            '.ice/architecture-map.json',
            '.ice/manifest.json',
            '.ice/code-intelligence.json',
            '.ice/code-intelligence.html',
            '.ice/code-intelligence.ice',
          }
          required={
            '.ice/code-intelligence.json',
            '.ice/code-intelligence.html',
            '.ice/code-intelligence.ice',
          }
          if not changed.issubset(allowed) or not required.issubset(changed):
              raise SystemExit('WINGLESS_SEMANTIC_ATLAS_OUTPUT_MISMATCH '+repr(sorted(changed)))
          print('WINGLESS_SEMANTIC_ATLAS_BOUNDED_OUTPUT_PASS')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .ice/architecture-map.json .ice/manifest.json .ice/code-intelligence.json .ice/code-intelligence.html .ice/code-intelligence.ice
          git commit -m 'ICE: rebind semantic source Atlas preserving historical reviews'
          go run ./cmd/ice validate
          go run ./cmd/ice relationships > "$RUNNER_TEMP/wingless-relationships.json"
          python3 -B scripts/validate_code_atlas.py --root . --relationships "$RUNNER_TEMP/wingless-relationships.json"
          test -z "$(git status --porcelain)"
          git push origin HEAD:refs/heads/engineering/optin-free-research-executor-20261028
          echo 'WINGLESS_SEMANTIC_ATLAS_REANCHOR=PASS'
