name: W-F39 archived source first-use evidence audit only
on:
  push:
    branches:
      - research/w-f39-active-evidence-headroom-20261015-r1
permissions:
  contents: read
  actions: read
jobs:
  archived_verification:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch immutable existing run artifact WITHOUT running source
        uses: actions/download-artifact@v4
        with:
          name: W-F39-frozen-once-source-headroom
          run-id: 38771690104
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: existing-run
      - name: Revalidate archived bytes, budget and registered source verdict
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,hashlib,math
          from pathlib import Path
          data=Path('existing-run/w-f39-source.json').read_bytes()
          d=json.loads(data)
          audit=json.load(open('research/foundational/20261015-w-f39/posthoc-archived-evidence-audit.json'))
          digest=hashlib.sha256(data).hexdigest()
          assert digest==audit['original_json_sha256']==Path('existing-run/w-f39-source.sha256').read_text().split()[0]
          assert Path('existing-run/w-f39-source-head.txt').read_text().strip()==audit['original_head']
          assert d['schema']=='wingless.f39.paid-relationship-source.trainonly.v1'
          assert d['stage']=='ACTIVE_SOURCE_HEADROOM_NO_LEARNED_ORIGINAL'
          assert d['questions']==72==len(d['rows'])
          assert len({(r['seed'],r['family'],r['depth']) for r in d['rows']})==72
          assert d['seeds']==[291000,291012] and d['families']==[290,291,292]
          assert d['reserved_seeds']==[292000,292016] and d['reserved_families']==[294,295,296,297]
          assert d['source_same_repo_not_F3'] and d['primary_original_not_executed']
          assert d['no_learned_policy_deployed'] and not d['accepted_ref_mutation']
          for arm,score in d['scores'].items():
            correct=sum(r['answers'][arm]==r['truth'] for r in d['rows'])
            assert score['correct']==correct and score['total']==72
            assert math.isclose(score['accuracy'],correct/72,abs_tol=1e-12)
          assert d['scores']['privileged_complete_map_oracle_unfair']['correct']==72
          for row in d['rows']:
            for arm,traces in row['receipts'].items():
              assert 0<=len(traces)<=2
              if arm=='no_purchase':assert len(traces)==0
              assert len({(role,subject) for role,subject,value in traces})==len(traces)
              assert all(0<=role<8 and 0<=subject<8 and 0<=value<8 for role,subject,value in traces)
          for family,arms in d['per_family_correct'].items():
            cohort=[r for r in d['rows'] if str(r['family'])==family]
            assert len(cohort)==24
            for arm,correct in arms.items():
              assert correct==sum(r['answers'][arm]==r['truth'] for r in cohort)
          for arm,delta in d['mean_answer_entropy_reduction_bits'].items():
            mean=sum(r['entropy_before'][arm]-r['entropy_after'][arm] for r in d['rows'])/72
            assert math.isclose(mean,delta,abs_tol=1e-12)
          fair=('posterior_information_gain','query_frontier','random_eligible','fixed_acquisition')
          gain=max(d['scores'][a]['accuracy'] for a in fair)-d['scores']['no_purchase']['accuracy']
          expected='TRAIN_ONLY_ACTIVE_SOURCE_FEASIBLE' if gain>=.04 and max(d['mean_answer_entropy_reduction_bits'][a] for a in fair)>0 else 'TRAIN_ONLY_ACTIVE_SOURCE_INSUFFICIENT_HEADROOM'
          assert d['verdict']==expected==audit['scientific_verdict']
          assert audit['rerun_original_forbidden']
          print('W_F39_ARCHIVED_ONLY_AUDIT_PASS',expected,{a:v['correct'] for a,v in d['scores'].items()})
          PY
      - name: No original execution
        run: |
          echo "Read-only audit of original run 38771690104. Original workflow remains red. Never replay source."
