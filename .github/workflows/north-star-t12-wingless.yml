name: T12 wingless learned causal evidence frozen original
on:
  push:
    branches: [research/north-star-transfer-wingless-20261018]
    paths: ['.github/workflows/north-star-t12-wingless.yml']
permissions:
  contents: read
concurrency:
  group: northstar-t12-wingless-first-new-source
  cancel-in-progress: false
jobs:
  exact-science-source-qualification:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 65
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify original science freeze before new mechanism and unchanged control
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if((git rev-parse HEAD).Trim() -cne $env:GITHUB_SHA){throw 'T12_EXACT_HEAD_DRIFT'}
          if((git hash-object 'research/north-star-transfer/20261019-wingless-t12-freeze.json').Trim() -cne 'cceea2290dd7d085063b9c86e578892a437909fb'){throw 'T12_ORIGINAL_PREREG_CHANGED'}
          if((git log -1 --format=%H -- 'research/north-star-transfer/20261019-wingless-t12-freeze.json').Trim() -cne '09890a6e366bf37ba2628f56610ec6f91eea83da'){throw 'T12_FREEZE_NOT_FIRST'}
          git merge-base --is-ancestor 09890a6e366bf37ba2628f56610ec6f91eea83da HEAD
          if($LASTEXITCODE -ne 0){throw 'T12_SOURCE_FREEZE_NOT_ANCESTOR'}
          if((git hash-object 'research/north-star-transfer/20261019-wingless-t12-mechanism.py').Trim() -cne 'c229a8b33f70797f6ca2854f19cb999b2737730c'){throw 'T12_ORIGINAL_MECHANISM_CHANGED'}
          if((git hash-object 'research/north-star-transfer/20261019-wingless-t11-mechanism.py').Trim() -cne '0536f6907d48c1a083c39b68020407a34648a7cb'){throw 'T12_STRONGEST_CONTROL_DRIFT'}
          Write-Output 'T12_WINGLESS_PRIOR_RUN_PRE_SOURCE_IMPORT_FAILURE=39186174072'
          Write-Output 'T12_WINGLESS_SOURCE_AND_FREEZE=PASS'
      - name: Measure new public causal mechanism; no accepted science promotion
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $py=if($IsWindows){'python'}else{'python3'}
          & $py -B 'research/north-star-transfer/20261019-wingless-t12-mechanism.py' | Tee-Object 't12-wingless-original.json'
          if($LASTEXITCODE -ne 0){throw 'T12_WINGLESS_MECHANISM_FAILED'}
          $out=Get-Content 't12-wingless-original.json' -Raw | ConvertFrom-Json
          if($out.'science_accepted' -ne $false){throw 'T12_UNAUTHORIZED_SCIENCE_ADMISSION'}
          if($out.'protected_original_source_used' -ne $false -and $out.'protected_original_source_used' -ne 0){throw 'T12_PROTECTED_OR_CONSUMED_SOURCE'}
          Write-Output 'T12_WINGLESS_SOURCE_NEUTRAL_EVIDENCE=PASS'
          Write-Output 'T12_WINGLESS_INDEPENDENT_SCIENTIFIC_ACCEPTANCE=false'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: t12-wingless-new-source-${{ matrix.os }}-${{ github.sha }}
          path: t12-wingless-original.json
          retention-days: 90
          if-no-files-found: warn
