name: Wingless W-R24 frozen sentinel transfer
on:
  push:
    branches: [research/w-r24-missingness-format-transfer-r1]
permissions:
  contents: read
jobs:
  science:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Immutable prior and prereg checks
        run: |
          set -euo pipefail
          git merge-base --is-ancestor c572851852e4ae6c2eb5ba8d028a47cdc5fcb903 HEAD
          test "$(git hash-object research/contrib/chatgpt/20261013-w-r23-observability/execute.py)" = 0fcf7265f845dafefd6a693724480c207f08ae85
          test "$(git hash-object research/contrib/chatgpt/20261013-w-r24-format/prereg.json)" = 53de08e342453a9ef2e083669e59b907a15fd483
          test "$(git hash-object research/contrib/chatgpt/20261013-w-r24-format/execute.py)" = ae443b249b26376ddc9637b59aa88a1222130e05
          python3 -m json.tool research/contrib/chatgpt/20261013-w-r24-format/prereg.json >/dev/null
          python3 -m py_compile research/contrib/chatgpt/20261013-w-r24-format/execute.py
      - name: First original sealed 18-cell missingness-format experiment
        run: |
          set -euo pipefail
          python3 -B research/contrib/chatgpt/20261013-w-r24-format/execute.py > /tmp/W-R24-original.json
          python3 -m json.tool /tmp/W-R24-original.json >/dev/null
          python3 - <<'PY'
          import json
          j=json.load(open('/tmp/W-R24-original.json'))
          assert len(j['arms'])==4 and all(len(a['cells'])==18 for a in j['arms'])
          assert j['sealed_heldout_seeds']==list(range(288,304))
          print('CLASSIFICATION',j['classification'])
          for a in j['arms']:
              print('ARM',a['arm'],[(f,round(sum(x['accuracy'] for x in a['cells'] if x['format']==f)/6,4)) for f in ('all_zero','all_255','carry_forward')])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: W-R24-original-format-transfer
          path: /tmp/W-R24-original.json
          retention-days: 90
          if-no-files-found: error
      - name: Full Wingless regression and build
        run: go test ./... && go build ./...
