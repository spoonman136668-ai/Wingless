name: ITD-02 shared public-world Wingless native custody
on:
  push:
    branches: [research/itd02-crossmodel-public-contract-20261028]
permissions:
  contents: read
jobs:
  wingless-native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version-file: go.mod
      - name: Verify independent native public-action contract and source
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,pathlib
          d=json.loads(pathlib.Path('research/itd02_crossmodel_public_contract.json').read_text())
          assert d['schema']=='itd02.crossmodel.public_environment_contract.v1'
          assert d['environment']['id']=='MiniGrid-Empty-5x5-v0'
          assert d['restrictions']['reserved_q1_q2_q3_sealed']
          assert d['restrictions']['do_not_copy_architectures']
          print('SHARED_CONTRACT_SCHEMA_PASS')
          PY
          go test ./research/native/itd02/r8bridge ./research/native/itd02/r8
          test -z "$(git status --porcelain --untracked-files=all)"
