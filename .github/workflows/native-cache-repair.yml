name: Wingless one-shot native cache repair retirement
on:
  push:
    branches: [engineering/native-cache-repair-retire-20261104]
    paths:
      - '.github/workflows/native-cache-repair.yml'
permissions:
  contents: write
concurrency:
  group: wingless-native-cache-repair-retire-20261104
  cancel-in-progress: false
jobs:
  retire-and-reindex:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.5'
          cache: false
      - name: Delete this temporary workflow and regenerate canonical source-bound advisory evidence
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'engineering/native-cache-repair-retire-20261104'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -- .github/workflows/native-cache-repair.yml
          test "$(git diff --cached --name-only)" = '.github/workflows/native-cache-repair.yml'
          git commit -m 'ci: retire isolated native cache repair workflow'
          source_sha="$(git rev-parse HEAD)"
          test -z "$(git status --porcelain)"
          go run -buildvcs=false ./cmd/ice build
          go run -buildvcs=false ./cmd/ice validate
          python3 -B scripts/maintain_code_atlas.py --root .
          go run -buildvcs=false ./cmd/ice relationships > "$RUNNER_TEMP/wingless-native-retirement-relationships.json"
          python3 -B scripts/validate_code_atlas.py --root . --relationships "$RUNNER_TEMP/wingless-native-retirement-relationships.json"
          git add -- .ice/manifest.json .ice/architecture-map.json .ice/symbol-map.json .ice/dependency-map.json .ice/test-map.json .ice/implementations.json .ice/code-intelligence.json .ice/code-intelligence.ice .ice/code-intelligence.html
          test -n "$(git diff --cached --name-only)"
          if git status --porcelain | grep -Ev '^([ MARCUD?!]{2}) \.ice/'; then echo 'NON_ICE_MUTATION_DENIED'; exit 1; fi
          git commit -m 'ci: qualify canonical ICE and advisory atlas after repair retirement'
          test -z "$(git status --porcelain)"
          git push origin HEAD:refs/heads/engineering/native-cache-repair-retire-20261104
          echo "REPAIR_RETIREMENT=PASS source=$source_sha head=$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
