name: Research Sidecar Planner Schema Recovery Prep

on:
  push:
    branches:
      - ops/research-autonomy-provider-probe-r1
    paths:
      - .github/workflows/research-sidecar-planner-schema-recovery-prep.yml

permissions:
  contents: read

concurrency:
  group: wingless-research-sidecar-lifecycle
  cancel-in-progress: false

jobs:
  recover:
    runs-on: [self-hosted, Windows, X64, wingless-research-safe]
    timeout-minutes: 8
    steps:
      - name: Stop sidecar and archive failed planner-attempt state
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference='Stop'
          Set-StrictMode -Version 2.0
          $Root='C:\ProgramData\CKBR\research-sidecar'
          $Lifecycle=Join-Path $Root 'ops\Lifecycle.ps1'
          $State=Join-Path $Root 'state'
          $Db=Join-Path $State 'research-sidecar.db'
          $Archive=Join-Path $Root 'evidence\planner-schema-recovery-r1'
          $Identity=[Security.Principal.WindowsIdentity]::GetCurrent().Name
          if($Identity-cne'NT AUTHORITY\NETWORK SERVICE'){throw "RECOVERY_IDENTITY_MISMATCH observed=$Identity"}
          if(-not(Test-Path -LiteralPath $Lifecycle -PathType Leaf)){throw 'RECOVERY_LIFECYCLE_MISSING'}

          & $Lifecycle -Mode stop
          if($LASTEXITCODE-ne0){throw "RECOVERY_STOP_FAILED exit=$LASTEXITCODE"}
          Start-Sleep -Seconds 2
          if(Get-Process -Name 'research-sidecar' -ErrorAction SilentlyContinue){throw 'RECOVERY_SIDECAR_PROCESS_STILL_RUNNING'}

          if(-not(Test-Path -LiteralPath $Db -PathType Leaf)){throw 'RECOVERY_DB_MISSING'}
          if(Test-Path -LiteralPath $Archive){throw 'RECOVERY_ARCHIVE_ALREADY_EXISTS'}
          New-Item -ItemType Directory -Force -Path $Archive|Out-Null

          $Files=@('research-sidecar.db','research-sidecar.db-wal','research-sidecar.db-shm')
          $Hashes=[ordered]@{}
          foreach($Name in $Files){
            $Source=Join-Path $State $Name
            if(Test-Path -LiteralPath $Source -PathType Leaf){
              Copy-Item -LiteralPath $Source -Destination (Join-Path $Archive $Name) -Force
              $Hashes[$Name]=(Get-FileHash -LiteralPath $Source -Algorithm SHA256).Hash.ToLowerInvariant()
            }
          }
          if(-not$Hashes.Contains('research-sidecar.db')){throw 'RECOVERY_ARCHIVE_DB_MISSING'}

          $Receipt=[ordered]@{
            schema='ckb-plane.research-sidecar-planner-schema-recovery.v1'
            reason='planner output rejected before experiment execution: unknown top-level experiment_id'
            controller_db_probe_run_id=36645173607
            bootstrap_cycle='WINGLESS-LM-LM9C-AUTONOMY-BOOTSTRAP'
            experiment_executed=$false
            result_sealed=$false
            db_hashes=$Hashes
            archived_at_utc=[DateTimeOffset]::UtcNow.ToString('o')
          }
          [IO.File]::WriteAllText((Join-Path $Archive 'recovery-receipt.json'),($Receipt|ConvertTo-Json -Depth 8),(New-Object Text.UTF8Encoding($false)))

          foreach($Name in $Files){
            Remove-Item -LiteralPath (Join-Path $State $Name) -Force -ErrorAction SilentlyContinue
          }
          if(Test-Path -LiteralPath $Db){throw 'RECOVERY_DB_CLEAR_FAILED'}

          $Task=Get-ScheduledTask -TaskName 'CKBPlane Research Sidecar' -ErrorAction SilentlyContinue
          Write-Host "archive=$Archive"
          foreach($K in $Hashes.Keys){Write-Host "archive_sha256[$K]=$($Hashes[$K])"}
          Write-Host "task_state=$(if($null-eq$Task){'UNREGISTERED'}else{$Task.State})"
          Write-Host 'experiment_executed=False'
          Write-Host 'result_sealed=False'
          Write-Host 'RESEARCH_SIDECAR_PLANNER_SCHEMA_RECOVERY_PREP=PASS'
