name: Qualify exact immutable Wingless proxy R3C
on:
  push:
    branches:
      - qualify/ckb-research-write-proxy-fanout-r3c-exact
permissions:
  contents: read
jobs:
  qualify:
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 8a718756ec2a2268422ed7ad684f0a3a4fe793f2
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.5'
          cache: false
      - name: Verify exact prepared identity
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop';Set-StrictMode -Version 3.0
          $head=(git rev-parse HEAD).Trim()
          if($head-ne'8a718756ec2a2268422ed7ad684f0a3a4fe793f2'){throw ('PROXY_R3_IDENTITY:'+ $head)}
          $base='0dfe5ca8d83046cf088aee9ab412e40e8a3ac11a'
          git merge-base --is-ancestor $base HEAD
          if($LASTEXITCODE-ne0){throw 'PROXY_R3_BASE_DRIFT'}
          $raw=Get-Content -LiteralPath research/transport/Invoke-CKBResearchWriteProxy.ps1 -Raw
          foreach($n in @('PROXY_FANOUT_RUN_DISCOVERY_TIMEOUT','fanout_status=[string]$run.status','operation -ne "fanout_dispatch"','run_id=$runId')){if(!$raw.Contains($n)){throw ('PROXY_R3_MARKER:'+ $n)}}
      - name: Full native regression
        shell: pwsh
        run: |
          ./scripts/Test-Native.ps1
