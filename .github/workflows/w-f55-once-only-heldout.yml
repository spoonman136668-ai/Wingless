name: Wingless F55 one frozen synthetic heldout TRAIN science (not F3)
on:
  push:
    branches:
      - science/w-f55-once-only-heldout-20261015-r1
permissions:
  contents: read
  actions: read
jobs:
  one-source:
    if: "${{ github.event.head_commit.message == 'science(w-f55): single frozen heldout TRAIN diagnostic and source-free audit' && github.run_attempt == 1 }}"
    runs-on: ubuntu-latest
    timeout-minutes: 115
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Fail closed on original source and precode controls identities
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 6361386c1c45077b23b31eebeef809b01b950ecd HEAD
          test "$(git hash-object research/foundational/20261015-w-f55/prereg-candidate.json)" = 47515bea8590e3a5c849ce058587fa1852d991a7
          test "$(git hash-object research/foundational/20261015-w-f55/source_pilot.py)" = d02fc933b52fc44d537ed45b061aef56ccd90a7f
          test "$(git hash-object research/foundational/20261015-w-f55/audit_result.py)" = 77bf4346d5772d4077a739b445a265a49df936ca
          python3 -m json.tool research/foundational/20261015-w-f55/prereg-candidate.json >/dev/null
          python3 -B -m unittest discover -s research/foundational/20261015-w-f55 -p test_fit_preflight.py -v
          python3 -B -m unittest discover -s research/foundational/20261015-w-f55 -p test_model_fit.py -v
      - name: Verify exact FIT qualification before first-use
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          d=$(curl --fail --silent --show-error --retry 2 --max-time 25             -H "Accept: application/vnd.github+json"             -H "Authorization: Bearer $GH_TOKEN"             "https://api.github.com/repos/spoonman136668-ai/Wingless/actions/runs/38832557749")
          echo "$d" | jq -e --arg source "6361386c1c45077b23b31eebeef809b01b950ecd"             '.head_sha==$source and .status=="completed" and .conclusion=="success" and .run_attempt==1'
      - name: One full original repository regression before scientific source
        shell: bash
        run: |
          set -euo pipefail
          go test -count=1 ./...
          go vet ./...
          go build ./...
      - name: Exactly one new frozen TRAIN diagnostic and independent source-free recount
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/w55"
          git rev-parse HEAD > "$RUNNER_TEMP/w55/FROZEN_EXACT_HEAD"
          python3 -B research/foundational/20261015-w-f55/source_pilot.py --diagnostic-train              > "$RUNNER_TEMP/w55/one-source-result.json"
          python3 -m json.tool "$RUNNER_TEMP/w55/one-source-result.json" >/dev/null
          python3 -B research/foundational/20261015-w-f55/audit_result.py              "$RUNNER_TEMP/w55/one-source-result.json"              research/foundational/20261015-w-f55/prereg-candidate.json              > "$RUNNER_TEMP/w55/independent-audit.json"
          cat "$RUNNER_TEMP/w55/independent-audit.json"
          (cd "$RUNNER_TEMP/w55" && sha256sum one-source-result.json independent-audit.json > manifest.sha256)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Wingless-F55-once-only-TRAIN-heldout-and-audit
          path: ${{ runner.temp }}/w55/
          if-no-files-found: warn
          retention-days: 90
      - name: Authority exclusion
        run: |
          echo "NEW_DIAGNOSTIC_IS_SYNTHETIC_TRAIN_ONLY"
          echo "F3_INDEPENDENT=FALSE; PRIMARY_ORIGINALS_EXECUTED=ZERO"
          echo "NATIVE_TOTAL_576B=UNQUALIFIED"
          echo "ACCEPTED_REFS_AND_LIVE_FORGE_UNCHANGED=TRUE"
