name: Wingless isolated G26 per-command critical-path profiling
on:
  push:
    branches: [experiment/atlas-parallel-timing-20261104]
    paths: ['.github/workflows/atlas-g26-profile.yml']
permissions:
  contents: read
jobs:
  profile:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - name: Checkout immutable qualified Wingless source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 7f31b05cc274a1769c117567911d8a55030e5758
          fetch-depth: 0
          persist-credentials: false
      - name: Setup frozen Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Setup frozen Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: '1.25.5'
          cache: false
      - name: Restore exact-source Go compilation cache
        id: go-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/wingless-atlas-profile-gocache
          key: wingless-atlas-prof-go1255-windows2022-v1-${{ hashFiles('**/*.go', 'go.mod', 'go.sum', 'scripts/test_code_atlas_tamper.py', 'scripts/test_source_aware_atlas.py', 'scripts/validate_code_atlas.py') }}
      - name: Profile all original G26 subprocesses and enforce original PASS
        shell: pwsh
        env:
          GOCACHE: ${{ runner.temp }}/wingless-atlas-profile-gocache
          CACHE_HIT: ${{ steps.go-cache.outputs.cache-hit }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git rev-parse HEAD).Trim() -ne '7f31b05cc274a1769c117567911d8a55030e5758') { throw 'ORIGINAL_SOURCE_DRIFT' }
          if (git status --porcelain) { throw 'SOURCE_DIRTY_BEFORE_G26' }
          @'
          import collections, json, os, runpy, subprocess, sys, time
          _original = subprocess.run
          rows = []
          def timed_run(*args, **kwargs):
              cmd = args[0] if args else kwargs.get("args", [])
              cmd = [str(x) for x in cmd] if isinstance(cmd, (list,tuple)) else [str(cmd)]
              cwd = str(kwargs.get("cwd") or ".")
              start = time.monotonic()
              try:
                  result = _original(*args,**kwargs)
                  outcome = str(result.returncode)
                  return result
              except BaseException as e:
                  outcome = type(e).__name__
                  raise
              finally:
                  elapsed = time.monotonic()-start
                  exe = os.path.basename(cmd[0]).lower() if cmd else "missing"
                  if exe in ("go","go.exe"):
                      category = "go:"+" ".join(cmd[1:4])
                  elif exe in ("git","git.exe"):
                      category = "git:"+(cmd[1] if len(cmd)>1 else "unknown")
                  elif exe in ("python","python.exe","py.exe"):
                      category = "python:"+next((s for s in cmd[1:] if s.endswith(".py")),"other")
                  else:
                      category = exe
                  rows.append(dict(category=category,cwd_class=("baseline" if os.path.abspath(cwd)==os.path.abspath(".") else os.path.basename(cwd)),seconds=round(elapsed,3),result=outcome))
          subprocess.run=timed_run
          sys.argv=["scripts/test_source_aware_atlas.py","--root",".","--scratch-parent",os.environ["RUNNER_TEMP"]]
          begin=time.monotonic()
          try:
              runpy.run_path("scripts/test_source_aware_atlas.py",run_name="__main__")
          finally:
              wall=round(time.monotonic()-begin,3)
              grouped=collections.defaultdict(lambda: [0,0.0])
              for x in rows:
                  grouped[x["category"]][0]+=1
                  grouped[x["category"]][1]+=x["seconds"]
              summary=[dict(category=k,count=v[0],seconds=round(v[1],3)) for k,v in grouped.items()]
              summary.sort(key=lambda x:-x["seconds"])
              print("G26_WALL_SECONDS="+str(wall),flush=True)
              print("G26_CACHE_HIT="+str(os.getenv("CACHE_HIT","")),flush=True)
              print("G26_SUBPROCESS_CATEGORY_TIMINGS="+json.dumps(summary,separators=(",",":")),flush=True)
              print("G26_INDIVIDUAL_COMMAND_TIMINGS="+json.dumps(rows,separators=(",",":")),flush=True)
          '@ | python -B -
          if ($LASTEXITCODE -ne 0) { throw 'G26_AUTHENTIC_NEGATIVE_QUALIFICATION_FAILED' }
          if (git status --porcelain) { throw 'ORIGINAL_SOURCE_DIRTY_AFTER_G26' }
          Add-Content $env:GITHUB_STEP_SUMMARY "Exact-source G26 full qualification PASS; cache hit=$env:CACHE_HIT; all commands timed independently."
