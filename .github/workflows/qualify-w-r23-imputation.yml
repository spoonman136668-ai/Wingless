name: Wingless W-R23 frozen nonzero-imputation falsification
on:
  push:
    branches: [research/w-r23-missing-imputation-falsification-r1]
permissions:
  contents: read
jobs:
  science:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify original immutable parent, source and prereg
        run: |
          set -euo pipefail
          git merge-base --is-ancestor c551d41a7b8d4f77b9349033fa788d621a800519 HEAD
          test "$(git hash-object research/contrib/chatgpt/20261013-w-r22-maskaware/execute.py)" = e43abe25ef7b876d9138576d5184d02cde2819d8
          test "$(git hash-object research/contrib/chatgpt/20261013-w-r23-fill-falsification/prereg.json)" = 99be311f40e8da9eddff8b4547ca70f2aaa0c519
          test "$(git hash-object research/contrib/chatgpt/20261013-w-r23-fill-falsification/execute.py)" = 2588531f90de532f7f9ab7cf4992598c6abf4373
          python3 -m json.tool research/contrib/chatgpt/20261013-w-r23-fill-falsification/prereg.json >/dev/null
          python3 -m py_compile research/contrib/chatgpt/20261013-w-r23-fill-falsification/execute.py
      - name: Original frozen new-cohort imputation science
        run: |
          set -euo pipefail
          python3 -B research/contrib/chatgpt/20261013-w-r23-fill-falsification/execute.py > /tmp/W-R23-original.json
          python3 -m json.tool /tmp/W-R23-original.json >/dev/null
          python3 - <<'PY'
          import json
          r=json.load(open('/tmp/W-R23-original.json'))
          assert len(r['arms'])==4 and all(len(a['cells'])==54 for a in r['arms'])
          assert r['heldout_seeds']==list(range(272,288))
          print('CLASSIFICATION',r['classification'])
          for a in r['arms']:
              print(a['arm'],a['accuracy_by_fill'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: W-R23-original-imputation-falsification
          path: /tmp/W-R23-original.json
          retention-days: 90
          if-no-files-found: error
      - name: One full Wingless regression
        run: go test ./... && go build ./...
