name: Wingless W-R26 frozen latent alphabet permutation recovery
on:
  push:
    branches: [research/chatgpt-w-r26-latent-permutation-20261013]
permissions:
  contents: read
jobs:
  science:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify frozen origin, prereg and original evaluator
        run: |
          set -euo pipefail
          git merge-base --is-ancestor ebead7f1a2d194553d28db3e352f6e9bb039cedb HEAD
          test "$(git hash-object research/contrib/chatgpt/20261013-w-r26-latent-alphabet/prereg.json)" = b83023b78d47e99353413be6b4a2b94e20387e90
          test "$(git hash-object research/contrib/chatgpt/20261013-w-r26-latent-alphabet/execute.py)" = 7632546ca681c3c8fec66991ffc9468ab34e0d07
          python3 -m json.tool research/contrib/chatgpt/20261013-w-r26-latent-alphabet/prereg.json >/dev/null
          python3 -m py_compile research/contrib/chatgpt/20261013-w-r26-latent-alphabet/execute.py
      - name: First-use original W-R26 latent permutation science
        run: |
          set -euo pipefail
          python3 -B research/contrib/chatgpt/20261013-w-r26-latent-alphabet/execute.py > /tmp/W-R26-original.json
          python3 -m json.tool /tmp/W-R26-original.json
      - uses: actions/upload-artifact@v4
        with:
          name: W-R26-original-latent-alphabet
          path: /tmp/W-R26-original.json
          retention-days: 90
          if-no-files-found: error
      - name: Full Wingless regression and build
        run: go test ./... && go build ./...
