name: W-F23 learned entity descriptor alias discovery DEV
on:
  push:
    branches: [research/w-f23-learned-entity-similarity-20261015-r1]
permissions:
  contents: read
jobs:
  science:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-go@v5
        with: {go-version-file: go.mod}
      - name: Verify frozen predecessor and prereg
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 5a785822bf8fe7aa9878ab374dfd799a9d6f3633 HEAD
          test "$(git hash-object unitary/f22_learned_alias_links.go)" = "$(git rev-parse 5a785822bf8fe7aa9878ab374dfd799a9d6f3633:unitary/f22_learned_alias_links.go)"
          python3 -m json.tool research/foundational/20261015-w-f23/prereg.json >/dev/null
      - name: Run one NEW W-F23 graph-node similarity original
        run: |
          set -euo pipefail
          go run ./cmd/f23-wingless > /tmp/w-f23-original.json
          python3 -m json.tool /tmp/w-f23-original.json >/dev/null
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: W-F23-original-learned-descriptor-alias
          path: /tmp/w-f23-original.json
          if-no-files-found: error
          retention-days: 90
      - name: Independent evidence and row counts
        run: |
          python3 - <<'PY'
          import json,collections
          d=json.load(open('/tmp/w-f23-original.json'))
          assert d["stage"]=="DEVELOPMENT_ONLY" and d["graph_count"]==96 and d["questions"]==1152
          assert d["actual_native_state_bytes"]==576 and d["per_node_descriptor_record_limit"]==24
          assert not d["pair_certificate_supplied"] and d["programmed_lookup_of_node_annotations"]
          assert d["source_description_features_given"] and d["programmed_squared_difference_features"]
          assert not d["independent_source_birth"] and not d["sealed_first_use"] and not d["accepted_ref_mutation"]
          assert collections.Counter(r["Family"] for r in d["rows"])=={108:288,109:288,110:288,111:288}
          assert collections.Counter(r["Variant"] for r in d["rows"])==dict.fromkeys(range(12),96)
          for name,key in (("learned","Learned"),("untrained","Initialized"),("raw_id","ExactID"),("unrestricted","Unrestricted"),("coded_description","CodedDescription")):
            s=d["scores"][name]
            assert s["correct"]==sum(r[key]["answer"]==r["Truth"] for r in d["rows"])
            assert s["false_positives"]==sum(r[key]["answer"] for r in d["rows"] if not r["Truth"])
            assert s["false_negatives"]==sum(not r[key]["answer"] for r in d["rows"] if r["Truth"])
          assert d["registered_verdict"] in ("INVALID_W23_ENTITY_DESCRIPTION_ORACLE",
           "DEVELOPMENT_LEARNED_NODE_DESCRIPTION_ALIAS_TRANSFER",
           "DEVELOPMENT_NO_LEARNED_NODE_DESCRIPTION_ALIAS_TRANSFER")
          print("W_F23_VERDICT",d["registered_verdict"],d["scores"])
          PY
      - name: Full Go regression and build
        run: go test ./... && go build ./...
