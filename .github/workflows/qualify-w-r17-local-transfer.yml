name: Wingless W-R17 fresh local-order curriculum science
on:
  push:
    branches: [research/w-r17-local-order-curricula-r1]
permissions:
  contents: read
jobs:
  science:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Immutable first-use identity, parent and prereg check
        run: |
          set -euo pipefail
          git merge-base --is-ancestor a8e9d82a8abbb4a423dfa0ffac2d99af026a1005 HEAD
          test "$(git hash-object research/contrib/chatgpt/20261013-w-r16b-noise-matrix/execute.py)" = 949971431e0b296c5a797ee6ec336947db207a83
          test "$(git hash-object research/contrib/chatgpt/20261013-w-r17-local-transfer/prereg.json)" = 3fbb211c64cde2864a1fd2ff5c246a8bfff8b98f
          test "$(git hash-object research/contrib/chatgpt/20261013-w-r17-local-transfer/execute.py)" = 2b044f30569be92268cfc0ddc9c64185d3285c42
          python3 -m json.tool research/contrib/chatgpt/20261013-w-r17-local-transfer/prereg.json >/dev/null
          python3 -m py_compile research/contrib/chatgpt/20261013-w-r17-local-transfer/execute.py
      - name: Original frozen local temporal evaluation
        run: |
          set -euo pipefail
          python3 -B research/contrib/chatgpt/20261013-w-r17-local-transfer/execute.py > /tmp/W-R17-original.json
          python3 -m json.tool /tmp/W-R17-original.json >/dev/null
          python3 - <<'PY'
          import json
          a=json.load(open('/tmp/W-R17-original.json'))
          assert len(a['arms'])==6
          assert all(len(x['cells'])==6 for x in a['arms'])
          print('CLASSIFICATION',a['classification'])
          for x in a['arms']:
              print(x['curriculum'],x['representation'],x['accuracy'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: W-R17-original-local-transfer
          path: /tmp/W-R17-original.json
          if-no-files-found: error
          retention-days: 90
      - name: Final full Wingless integration
        run: go test ./... && go build ./...
