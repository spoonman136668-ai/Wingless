name: Mind-Palace access probe safe runner

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/mind-palace-access-probe-safe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: [self-hosted, Windows, X64, wingless-research-safe]
    steps:
      - name: Probe checkout visibility
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference = 'Stop'
          $Root = 'C:\Users\camar\GolandProjects\Mind-Palace'
          Write-Host "runner=$env:RUNNER_NAME"
          Write-Host "userprofile=$env:USERPROFILE"
          $Exists = Test-Path -LiteralPath $Root -PathType Container
          Write-Host "mind_palace_visible=$Exists"
          if (-not $Exists) { throw 'MIND_PALACE_NOT_VISIBLE' }
          $Head = (& git -C $Root rev-parse HEAD).Trim()
          Write-Host "mind_palace_head=$Head"
