name: Wingless W-R25 frozen observed-marker transfer
on:
  push:
    branches: [research/w-r25-observed-marker-generalization-r1]
permissions:
  contents: read
jobs:
  science:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Exact parent and immutable science freeze
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 2129317f1ad3a1247413991c68ae8c8e10da0dcd HEAD
          test "$(git hash-object research/contrib/chatgpt/20261013-w-r24-format/execute.py)" = ae443b249b26376ddc9637b59aa88a1222130e05
          test "$(git hash-object research/contrib/chatgpt/20261013-w-r25-marker-invariance/prereg.json)" = 743f4295bc2084523d68e04d3dd4e08ace253e19
          test "$(git hash-object research/contrib/chatgpt/20261013-w-r25-marker-invariance/execute.py)" = de39401c8db92ddbe5019277c1e6a21786d9a994
          python3 -m json.tool research/contrib/chatgpt/20261013-w-r25-marker-invariance/prereg.json >/dev/null
          python3 -m py_compile research/contrib/chatgpt/20261013-w-r25-marker-invariance/execute.py
      - name: First original observed-row feature science
        run: |
          set -euo pipefail
          python3 -B research/contrib/chatgpt/20261013-w-r25-marker-invariance/execute.py > /tmp/W-R25-original.json
          python3 -m json.tool /tmp/W-R25-original.json >/dev/null
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/W-R25-original.json'))
          assert x['matched_frozen_training_examples']==1728
          assert x['sealed_heldout_seeds']==list(range(304,320))
          assert len(x['arms'])==2 and all(len(a['cells'])==18 for a in x['arms'])
          print('CLASSIFICATION',x['classification'],'GAIN',x['aggregate_gain'])
          for a in x['arms']:
              print('ARM',a['arm'],a['aggregate_accuracy'])
              print('CELLS',[(c['generator'],c['format'],c['masked_ticks'],c['accuracy']) for c in a['cells']])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: W-R25-original-multi-marker
          path: /tmp/W-R25-original.json
          retention-days: 90
          if-no-files-found: error
      - name: One full Wingless test and build
        run: go test ./... && go build ./...
