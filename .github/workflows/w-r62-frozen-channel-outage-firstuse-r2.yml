name: Wingless W-R62 R2 frozen first-use after import-only repair
on:
  push:
    branches: [research/w-r62-frozen-channel-outage-transfer-20261013-r2]
permissions:
  contents: read
jobs:
  science:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify immutable R2 source prereg and pre-firstuse failure ledger
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 4fd74701a7a4cb61a7e4156dd9651390c7d981d5 HEAD
          test "$(git hash-object research/contrib/chatgpt/20261013-w-r61-entity-transfer/execute.py)" = ea86237d19c5bd75086f0dab699158d2aa8fc353
          test "$(git hash-object research/contrib/chatgpt/20261013-w-r62-channel-outage/prereg.json)" = ce1917d16a189e2c4dbd784134f18b5db4454f32
          test "$(git hash-object research/contrib/chatgpt/20261013-w-r62-channel-outage/execute.py)" = a5b182874758af692a180f7bf788c627b6da6f9a
          test "$(git hash-object research/contrib/chatgpt/20261013-w-r62-channel-outage/pre-firstuse-repair.json)" = 907bce6cee1711ae0d3dc286a17f335d9e2f0fcb
          python3 -m json.tool research/contrib/chatgpt/20261013-w-r62-channel-outage/prereg.json >/dev/null
          python3 -m py_compile research/contrib/chatgpt/20261013-w-r62-channel-outage/execute.py
      - name: W-R62 original first-use new 24-seed sealed observation cohort
        run: |
          set -euo pipefail
          python3 -B research/contrib/chatgpt/20261013-w-r62-channel-outage/execute.py > /tmp/W-R62-original-r2.json
          python3 -m json.tool /tmp/W-R62-original-r2.json >/dev/null
          python3 - <<'PY'
          import json
          a=json.load(open('/tmp/W-R62-original-r2.json'))
          assert a['sealed_heldout_seeds']==list(range(9312,9336))
          assert len(a['primary_xorshift_unseen_differences'])==36
          assert len(a['all_sealed_trial_records'])==3*3*3*2*5
          assert all(len(x['by_seed'])==24 for x in a['all_sealed_trial_records'])
          print('CLASSIFICATION',a['classification'])
          print('SEED_RECORDS',sum(len(x['by_seed']) for x in a['all_sealed_trial_records']))
          for x in a['primary_xorshift_unseen_differences']:
              print('OUTAGE_COMPARISON',x)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: W-R62-original-channel-outage-transfer-r2
          path: /tmp/W-R62-original-r2.json
          retention-days: 90
          if-no-files-found: error
      - name: Single full Wingless regression and build
        run: go test ./... && go build ./...
