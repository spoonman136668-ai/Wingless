name: Wingless hosted research qualification
run-name: Wingless research ${{ inputs.research_ref }} [${{ inputs.dispatch_id }}]

on:
  workflow_dispatch:
    inputs:
      research_ref:
        description: Exact Wingless research branch to qualify
        required: true
        type: string
      dispatch_id:
        description: Exact CKB-plane research dispatch identity
        required: true
        type: string

permissions:
  contents: read

jobs:
  qualify:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 180
    steps:
      - name: Checkout requested research ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.research_ref }}
          persist-credentials: false
          fetch-depth: 0

      - name: Set up frozen Go toolchain
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.5'
          cache: false

      - name: Run research qualification
        shell: powershell
        env:
          WINGLESS_EXPECTED_REF: ${{ inputs.research_ref }}
          WINGLESS_DISPATCH_ID: ${{ inputs.dispatch_id }}
        run: |
          $ErrorActionPreference = 'Stop'

          if ($env:WINGLESS_DISPATCH_ID -notmatch '^[0-9a-f]{64}$') {
            throw "WINGLESS_HOSTED_QUAL_DISPATCH_ID_INVALID: $env:WINGLESS_DISPATCH_ID"
          }

          $RequestPath = '.wingless/qualification-request.json'
          if (-not (Test-Path -LiteralPath $RequestPath -PathType Leaf)) {
            throw "WINGLESS_HOSTED_QUAL_REQUEST_MISSING: $RequestPath"
          }

          $Request = Get-Content -LiteralPath $RequestPath -Raw | ConvertFrom-Json
          if ($Request.schema -cne 'wingless.research-qualification-request.v1') {
            throw "WINGLESS_HOSTED_QUAL_REQUEST_SCHEMA_MISMATCH: $($Request.schema)"
          }
          if ([string]::IsNullOrWhiteSpace([string]$Request.branch)) {
            throw 'WINGLESS_HOSTED_QUAL_REQUEST_BRANCH_MISSING'
          }
          if ([string]$Request.branch -cne $env:WINGLESS_EXPECTED_REF) {
            throw "WINGLESS_HOSTED_QUAL_REF_MISMATCH expected=$env:WINGLESS_EXPECTED_REF request=$($Request.branch)"
          }
          if ([string]$Request.branch -notlike 'research/wingless-up*') {
            throw "WINGLESS_HOSTED_QUAL_BRANCH_NOT_AUTOMATION_COMPATIBLE: $($Request.branch)"
          }

          Remove-Item Env:GITHUB_SHA -ErrorAction SilentlyContinue
          Remove-Item Env:GITHUB_REF_NAME -ErrorAction SilentlyContinue

          ./scripts/Invoke-ResearchQualification.ps1 `
            -RequestPath $RequestPath `
            -OutputDirectory "$env:RUNNER_TEMP\wingless-research-qualification" `
            -GuardWaitMinutes 0

          $SummaryPath = "$env:RUNNER_TEMP\wingless-research-qualification\summary.json"
          if (-not (Test-Path -LiteralPath $SummaryPath -PathType Leaf)) {
            throw "WINGLESS_HOSTED_QUAL_SUMMARY_MISSING: $SummaryPath"
          }
          $Summary = Get-Content -LiteralPath $SummaryPath -Raw | ConvertFrom-Json
          $Summary | Add-Member -NotePropertyName dispatch_id -NotePropertyValue $env:WINGLESS_DISPATCH_ID -Force
          $Summary | ConvertTo-Json -Depth 100 | Set-Content -Encoding UTF8 -LiteralPath $SummaryPath

      - name: Deliver result to local CKB-plane
        if: always()
        shell: powershell
        env:
          WINGLESS_DISPATCH_ID: ${{ inputs.dispatch_id }}
          WINGLESS_RESEARCH_REF: ${{ inputs.research_ref }}
        run: |
          $ErrorActionPreference = 'Stop'
          $OutputDir = "$env:RUNNER_TEMP\wingless-research-qualification"
          $SummaryPath = Join-Path $OutputDir 'summary.json'
          $ProbePath = Join-Path $OutputDir 'probe.json'
          $RequestPath = '.wingless/qualification-request.json'

          if ($env:WINGLESS_DISPATCH_ID -notmatch '^[0-9a-f]{64}$') {
            throw 'WINGLESS_RESULT_CALLBACK_DISPATCH_ID_INVALID'
          }

          if (-not (Test-Path -LiteralPath $SummaryPath -PathType Leaf)) {
            if (-not (Test-Path -LiteralPath $RequestPath -PathType Leaf)) {
              throw 'WINGLESS_RESULT_CALLBACK_REQUEST_MISSING'
            }
            $Request = Get-Content -LiteralPath $RequestPath -Raw | ConvertFrom-Json
            $Head = (git rev-parse HEAD).Trim()
            if ($LASTEXITCODE -ne 0) { throw 'WINGLESS_RESULT_CALLBACK_HEAD_FAILED' }
            $Summary = [ordered]@{
              schema='wingless.research-qualification-summary.v1'
              experiment=[string]$Request.experiment
              branch=[string]$Request.branch
              baseline_sha=[string]$Request.baseline_sha
              head_sha=$Head
              test_script=[string]$Request.test_script
              test_exit_code=1
              harness_marker=$false
              probe_parsed=$false
              classification='harness-or-artifact-failure'
              unexpected_dirty=@()
              production_priority_guard='passed'
              generated_at_utc=[DateTime]::UtcNow.ToString('o')
              dispatch_id=$env:WINGLESS_DISPATCH_ID
            }
          }
          else {
            $Summary = Get-Content -LiteralPath $SummaryPath -Raw | ConvertFrom-Json
            $Summary | Add-Member -NotePropertyName dispatch_id -NotePropertyValue $env:WINGLESS_DISPATCH_ID -Force
          }

          $Envelope = [ordered]@{
            schema='ckb-plane.wingless-qualification-result.v2'
            summary=$Summary
          }
          if ([string]$Summary.classification -ceq 'qualified-scientific-result') {
            if (-not (Test-Path -LiteralPath $ProbePath -PathType Leaf)) {
              throw 'WINGLESS_RESULT_CALLBACK_PROBE_MISSING'
            }
            $Envelope.result = Get-Content -LiteralPath $ProbePath -Raw | ConvertFrom-Json
          }

          $Body = $Envelope | ConvertTo-Json -Depth 100
          $Uri = "http://127.0.0.1:8765/v1/research/wingless/results/$env:WINGLESS_DISPATCH_ID"
          Invoke-RestMethod -Method Post -Uri $Uri -ContentType 'application/json' -Body $Body | Out-Null

      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wingless-hosted-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/wingless-research-qualification/
          if-no-files-found: warn
          retention-days: 30
