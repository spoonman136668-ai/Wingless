name: Wingless W-R52 frozen family-balanced batch reproducibility
on:
  push:
    branches: [research/w-r52-batch-source-diversity-r1]
permissions:
  contents: read
jobs:
  science:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Exact frozen scientific prereg and source identity
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 300bf3d313a8bc98af120a6e32e046f3646385ad HEAD
          test "$(git hash-object research/contrib/chatgpt/20261013-w-r51-multicohort/execute.py)" = 92fcba0b2c9555d9599ac674625c046722c83811
          test "$(git hash-object research/contrib/chatgpt/20261013-w-r52-batch-diversity/prereg.json)" = 8eb23c80fe80f6233efcadad9cf065858eb44147
          test "$(git hash-object research/contrib/chatgpt/20261013-w-r52-batch-diversity/execute.py)" = 72df00223a980b951c5dae490be9e17fb1b5386c
          python3 -m json.tool research/contrib/chatgpt/20261013-w-r52-batch-diversity/prereg.json >/dev/null
          python3 -m py_compile research/contrib/chatgpt/20261013-w-r52-batch-diversity/execute.py
      - name: Original first-use sealed six-model source-diversity comparison
        run: |
          set -euo pipefail
          python3 -B research/contrib/chatgpt/20261013-w-r52-batch-diversity/execute.py > /tmp/W-R52-original.json
          python3 -m json.tool /tmp/W-R52-original.json >/dev/null
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/W-R52-original.json'))
          assert [list(i) for i in x['development_blocks']]==[
              list(range(3424,3440)),list(range(3456,3472)),list(range(3488,3504))]
          assert x['sealed_heldout_seeds']==list(range(3520,3568))
          assert len(x['arm_comparisons'])==3
          assert len(x['all_models_by_encoding']['identity'])==6
          assert all(len(m['by_seed'])==48 for m in x['all_models_by_encoding']['identity'].values())
          print('CLASSIFICATION',x['classification'])
          for c in x['arm_comparisons']:
              print('DEVELOPMENT',c['development_block'],c['min_source_gain'],
                    c['mixed_overall_accuracy'],c['source_deltas'],c['strict_gate'])
          for name,m in x['all_models_by_encoding']['identity'].items():
              print('ARM',name,m['accuracy'],m['family_accuracy'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: W-R52-original-balanced-family-batch
          path: /tmp/W-R52-original.json
          retention-days: 90
          if-no-files-found: error
      - name: One required complete Wingless Go regression and build
        run: go test ./... && go build ./...
