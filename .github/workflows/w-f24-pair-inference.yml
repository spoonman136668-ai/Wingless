name: Wingless W-F24 candidate identity links without provided pair IDs
on:
  push:
    branches: [research/w-f24-native-identity-candidate-discovery-20261015-r1]
permissions:
  contents: read
jobs:
  science:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-go@v5
        with: {go-version-file: go.mod}
      - name: Frozen parent and prereg qualification
        run: |
          set -euo pipefail
          git merge-base --is-ancestor ab55d8aa4dbc1f706e821bc94ae366f455570ecb HEAD
          test "$(git hash-object unitary/f23_competing_identity_claims.go)" = "$(git rev-parse ab55d8aa4dbc1f706e821bc94ae366f455570ecb:unitary/f23_competing_identity_claims.go)"
          python3 -m json.tool research/foundational/20261015-w-f24/prereg.json >/dev/null
      - name: Execute once W-F24 original development cohort
        run: |
          set -euo pipefail
          go run ./cmd/f24-wingless > /tmp/w-f24-original.json
          python3 -m json.tool /tmp/w-f24-original.json >/dev/null
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: W-F24-original-ungiven-identity-pair-inference
          path: /tmp/w-f24-original.json
          retention-days: 90
          if-no-files-found: error
      - name: Independent original source and row metrics audit
        run: |
          python3 - <<'PY'
          import json,collections
          d=json.load(open("/tmp/w-f24-original.json"))
          assert d["stage"]=="DEVELOPMENT_ONLY"
          assert d["native_state_bytes"]==576 and d["graphs"]==96 and d["questions"]==768
          assert d["actual_query_candidate_pairs_supplied"] is False
          assert d["node_profiles_source_generated"] and d["all_graph_edge_endpoint_pairs_enumerated_in_code"]
          assert not d["independently_born_source"] and not d["sealed_first_use"] and not d["accepted_ref_mutation"]
          assert collections.Counter(r["Family"] for r in d["rows"])=={108:192,109:192,110:192,111:192}
          assert collections.Counter(r["Variant"] for r in d["rows"])==dict.fromkeys(range(8),96)
          assert all(r["Truth"]==[True,True,False,False,True,True,False,True][r["Variant"]] for r in d["rows"])
          for arm,col in (("learned","Learned"),("none","NoLinks"),
              ("fixed_distance","FixedDistance"),("coded_oracle","CodedUpper")):
            s=d["scores"][arm]
            assert s["correct"]==sum(r[col]["answer"]==r["Truth"] for r in d["rows"])
            assert s["fp"]==sum(r[col]["answer"] for r in d["rows"] if not r["Truth"])
            assert s["fn"]==sum(not r[col]["answer"] for r in d["rows"] if r["Truth"])
          assert d["scores"]["coded_oracle"]["correct"]==768
          assert d["registered_verdict"] in ("INVALID_F24_SOURCE_ORACLE",
            "DEVELOPMENT_UNGIVEN_IDENTITY_CANDIDATE_TRANSFER",
            "DEVELOPMENT_NO_UNGIVEN_IDENTITY_CANDIDATE_TRANSFER")
          print("W_F24_VERDICT",d["registered_verdict"],d["scores"])
          PY
      - name: Full native Go regression and build
        run: go test ./... && go build ./...
