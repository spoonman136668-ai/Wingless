name: Wingless W-R37 frozen equal-budget cross-codebook training
on:
  push:
    branches: [research/w-r37-cross-codebook-equal-fit-r1]
permissions:
  contents: read
jobs:
  science:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify exact predecessor and frozen science identities
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 595a78cf0759e205c4e86510e3fc7a10cfdd53e3 HEAD
          test "$(git hash-object research/contrib/chatgpt/20261013-w-r36-codebook-transfer/execute.py)" = 59dfcf63cee9469c673df75c704ddbafb770b664
          test "$(git hash-object research/contrib/chatgpt/20261013-w-r37-codebook-conditioned/prereg.json)" = 564a65cbf3048a343d765c4d02d02e9f6570f221
          test "$(git hash-object research/contrib/chatgpt/20261013-w-r37-codebook-conditioned/execute.py)" = 16ecd94f0b08ca1ce0d2636ce3bd888d85734234
          python3 -m json.tool research/contrib/chatgpt/20261013-w-r37-codebook-conditioned/prereg.json >/dev/null
          python3 -m py_compile research/contrib/chatgpt/20261013-w-r37-codebook-conditioned/execute.py
      - name: First-use frozen heldout experiment
        run: |
          set -euo pipefail
          python3 -B research/contrib/chatgpt/20261013-w-r37-codebook-conditioned/execute.py >/tmp/W-R37-original.json
          python3 -m json.tool /tmp/W-R37-original.json >/dev/null
          python3 - <<'PY'
          import json
          a=json.load(open("/tmp/W-R37-original.json"))
          assert a["development_seeds"]==list(range(1664,1680))
          assert a["sealed_heldout_seeds"]==list(range(1680,1696))
          assert len(a["rows"])==4 and all(len(r["cells"])==6 for r in a["rows"])
          print("CLASSIFICATION",a["classification"])
          print("XOR_CONDITIONED_GAIN",a["xor_conditioned_accuracy_gain"])
          for r in a["rows"]:
              print("ARM",r["training_condition"],r["test_condition"],r["accuracy"],r["training_updates"],r["identical_training_pairs"])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: W-R37-original-codebook-conditioned
          path: /tmp/W-R37-original.json
          retention-days: 90
          if-no-files-found: error
      - name: One required full Wingless regression and build
        run: go test ./... && go build ./...
