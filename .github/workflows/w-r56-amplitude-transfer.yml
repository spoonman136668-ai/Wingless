name: Wingless W-R56 frozen unseen-source amplitude transfer
on:
  push:
    branches: [research/w-r56-fixed-model-independent-source-shifts-r1]
permissions:
  contents: read
jobs:
  science:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Pin scientific source and preregistration before first use
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 7656df2467df5013cdc48148804d47ab6f9cbaa3 HEAD
          test "$(git hash-object research/contrib/chatgpt/20261013-w-r54-loso/execute.py)" = f30f8ebfb13b7df49187e7ae95dd0f00d3a0d8d6
          test "$(git hash-object research/contrib/chatgpt/20261013-w-r56-amplitude/prereg.json)" = ccd5546463752c52202f3d3632cd29a4945b7152
          test "$(git hash-object research/contrib/chatgpt/20261013-w-r56-amplitude/execute.py)" = abc96941425294d8661be40487fa874a9030434e
          python3 -m py_compile research/contrib/chatgpt/20261013-w-r56-amplitude/execute.py
      - name: Original first-use amplitude and source heldout
        run: |
          set -euo pipefail
          python3 -B research/contrib/chatgpt/20261013-w-r56-amplitude/execute.py > /tmp/W-R56-original.json
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/W-R56-original.json'))
          assert x['sealed_heldout_seeds']==list(range(5824,5872))
          assert x['test_amplitudes']==[1,2,4]
          assert len(x['all_original_sealed_records'])==3
          print('CLASSIFICATION',x['classification'])
          print('AMPLITUDE_SOURCE_GRID',x['comparison'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: W-R56-original-swap-amplitude-transfer
          path: /tmp/W-R56-original.json
          retention-days: 90
          if-no-files-found: error
      - name: One full Wingless regression and build
        run: go test ./... && go build ./...
