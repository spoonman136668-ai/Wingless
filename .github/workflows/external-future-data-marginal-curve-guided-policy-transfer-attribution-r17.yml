name: Wingless policy transfer attribution R17

on:
  push:
    branches:
      - research/external-hosted-wingless-future-data-marginal-curve-guided-policy-transfer-attribution-r17
    paths:
      - 'docs/experiments/wlm-lm-external-future-data-marginal-curve-guided-policy-transfer-attribution-r17.json'
      - 'unitary/wlm_lm_external_future_data_marginal_curve_guided_policy_transfer_attribution_r17.go'
      - 'cmd/wlm-lm-external-future-data-marginal-curve-guided-policy-transfer-attribution-r17/main.go'
      - '.github/workflows/external-future-data-marginal-curve-guided-policy-transfer-attribution-r17.yml'

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
      - name: Validate frozen package
        shell: bash
        run: |
          set -euo pipefail
          prereg="ebe25f0377b6066d497adb920cced07cb4f4ee68"
          parent="fe54812281a5969e85d5d71b1b61444385abccca"
          git merge-base --is-ancestor "$prereg" HEAD
          test "$(git rev-parse "$prereg^")" = "$parent"
          changed="$(git diff --name-only "$parent..HEAD" | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/external-future-data-marginal-curve-guided-policy-transfer-attribution-r17.yml' \
            'cmd/wlm-lm-external-future-data-marginal-curve-guided-policy-transfer-attribution-r17/main.go' \
            'docs/experiments/wlm-lm-external-future-data-marginal-curve-guided-policy-transfer-attribution-r17.json' \
            'unitary/wlm_lm_external_future_data_marginal_curve_guided_policy_transfer_attribution_r17.go' | sort)"
          test "$changed" = "$expected"
      - name: Verify READY_RESEARCH receipt
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib,json,pathlib
          raw=r'''{"schema":"ckb-plane.external-exposure-ready-research-receipt.v1","project":"Wingless","experiment":"WLM-LM-EXTERNAL-FUTURE-DATA-MARGINAL-CURVE-GUIDED-POLICY-TRANSFER-ATTRIBUTION-R17","preregistration_sha":"ebe25f0377b6066d497adb920cced07cb4f4ee68","research_host":"runnervm8df0l","runner_id":"GitHub Actions 1000001836","manifest_sha256":"c79f09eb3841309b38827ceffee6a14eb87973c8aa2cf817908ed05f10e5c250","plan_decision":{"schema":"ckb-plane.external-exposure.v1","disposition":"READY_PLAN","scope":"plan-only","reasons":null},"fetch_decision":{"schema":"ckb-plane.external-exposure-fetch.v1","disposition":"READY_FETCH","scope":"fetch-verify-only","reasons":null},"research_decision":{"schema":"ckb-plane.external-exposure-research.v1","disposition":"READY_RESEARCH","scope":"research-consume-once","reasons":null},"ckb_plane_main_sha":"06c3cb723820407bc2db1bd3ec9e46f462059e41"}'''
          assert hashlib.sha256(raw.encode()).hexdigest()=="c3da67fe67e1918ff9d5ad68ea1bd0ab16a54e47499eb0920d66da119d69b49c"
          r=json.loads(raw)
          assert r["research_decision"]["disposition"]=="READY_RESEARCH"
          assert r["preregistration_sha"]=="ebe25f0377b6066d497adb920cced07cb4f4ee68"
          assert r["ckb_plane_main_sha"]=="06c3cb723820407bc2db1bd3ec9e46f462059e41"
          pathlib.Path("/tmp/authority.json").write_text(raw)
          PY
      - name: Fetch exact disjoint external sources
        shell: bash
        run: |
          set -euo pipefail
          export EXTERNAL_ROOT="$RUNNER_TEMP/wingless-r17"
          mkdir -p "$EXTERNAL_ROOT"
          python3 - <<'PY'
          import hashlib,os,pathlib,urllib.request
          sources=[
            ("code","https://raw.githubusercontent.com/python/cpython/ebf955df7a89ed0c7968f79faec1de49f61ed7cb/Lib/statistics.py",61896,"3023ec949802c2e880a000775bfd1a6b70c21b5423881118141e3ec69d8e3336",41453,"66bb25b24a0316b4965c64798494de93a1d7332672b15b5f430ab6a2fb4b9d45"),
            ("structured","https://raw.githubusercontent.com/json-schema-org/JSON-Schema-Test-Suite/5b0ee1613e45fcc2bddac00e07c19cd49b00d8a8/tests/draft2020-12/uniqueItems.json",14490,"ed84ef6ddc827659e257ba64cbe9679f06932b6320bea5c07622bf3d2cc4daa5",14365,"95ddbd0eaef29aad5ecfc74f9da21b795481f58b2c59380324a445fcd4d08932"),
            ("technical-prose","https://raw.githubusercontent.com/golang/go/6f5c275ebdc454197fff5f1496521c8f81e20eef/doc/README.md",3124,"c1bf000e7a873b3afed329c5b9f9c07f7692b1d7fb2bfca2d7600cec8b1d1407",1454,"48c3d95b8b03864a4af41d892710675956cde85afd0d5d6c331594de9f17881b"),
          ]
          root=pathlib.Path(os.environ["EXTERNAL_ROOT"])
          for name,url,full_n,full_h,prefix_n,prefix_h in sources:
              b=urllib.request.urlopen(urllib.request.Request(url,headers={"User-Agent":"wingless-r17"}),timeout=30).read()
              assert len(b)==full_n and hashlib.sha256(b).hexdigest()==full_h
              p=b[:prefix_n];assert len(p)==prefix_n and hashlib.sha256(p).hexdigest()==prefix_h
              (root/(name+".bin")).write_bytes(p)
          PY
          echo "EXTERNAL_ROOT=$EXTERNAL_ROOT" >> "$GITHUB_ENV"
      - name: Full Go regression
        run: go test ./...
      - name: Run frozen attribution twice
        shell: bash
        run: |
          set -euo pipefail
          go run ./cmd/wlm-lm-external-future-data-marginal-curve-guided-policy-transfer-attribution-r17 --code "$EXTERNAL_ROOT/code.bin" --structured "$EXTERNAL_ROOT/structured.bin" --technical-prose "$EXTERNAL_ROOT/technical-prose.bin" > /tmp/result1.json
          go run ./cmd/wlm-lm-external-future-data-marginal-curve-guided-policy-transfer-attribution-r17 --code "$EXTERNAL_ROOT/code.bin" --structured "$EXTERNAL_ROOT/structured.bin" --technical-prose "$EXTERNAL_ROOT/technical-prose.bin" > /tmp/result2.json
          cmp /tmp/result1.json /tmp/result2.json
          cat /tmp/result1.json
      - name: Classify
        shell: bash
        run: |
          python3 - <<'PY'
          import json,math,pathlib
          m=json.loads(pathlib.Path("/tmp/result1.json").read_text())["metrics"]
          valid=(
            m["source_identity_mismatch_count"]==0 and m["transfer_manifest_identity_mismatch_count"]==0 and
            m["source_count"]==3 and m["total_source_bytes"]==57272 and
            m["arm_count"]==3 and m["non_target_training_byte_budget_per_arm"]==15819 and
            m["motif_capacity"]==256 and m["target_evaluation_bytes_per_arm"]==582 and
            m["target_adaptation_reservoir_bytes_per_arm"]==872 and m["budget_point_count_total"]==15 and
            m["capacity_growth_event_count"]==0 and m["tokenizer_use_count"]==0 and
            m["external_model_call_count"]==0 and m["counter_overflow_count"]==0 and m["invalid_row_count"]==0 and
            all(math.isfinite(float(v)) for v in m.values())
          )
          d=m["predicted_curve_net_delta"]
          if not valid: cls="invalid"
          elif d<=0: cls="supported"
          elif d<=2: cls="mixed"
          else: cls="negative"
          out={"schema":"wingless.research-classification.v1","experiment":"WLM-LM-EXTERNAL-FUTURE-DATA-MARGINAL-CURVE-GUIDED-POLICY-TRANSFER-ATTRIBUTION-R17","classification":cls,"validity_pass":valid,"authority_receipt_sha256":"c3da67fe67e1918ff9d5ad68ea1bd0ab16a54e47499eb0920d66da119d69b49c","metrics":m}
          pathlib.Path("/tmp/classification.json").write_text(json.dumps(out,separators=(",",":")));print(json.dumps(out,separators=(",",":")))
          if not valid: raise SystemExit(2)
          PY
      - name: Delete external bytes
        if: always()
        run: rm -rf "$RUNNER_TEMP/wingless-r17"
      - name: Upload evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: wingless-policy-transfer-attribution-r17
          path: |
            /tmp/authority.json
            /tmp/result1.json
            /tmp/result2.json
            /tmp/classification.json
          if-no-files-found: error
