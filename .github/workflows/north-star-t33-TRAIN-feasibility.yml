name: T33 proof and native cost gate for learned exact predictive sufficient statistic
on:
  push:
    branches: [research/t33-predictive-syndrome-20261019]
    paths: ['.github/workflows/north-star-t33-TRAIN-feasibility.yml']
permissions:
  contents: read
concurrency:
  group: wingless-T33-TRAIN-no-DEV-identity
  cancel-in-progress: false
jobs:
  train-only:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 40
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify precode, new source birth and exact executable identity
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if((git rev-parse HEAD).Trim() -cne $env:GITHUB_SHA){throw 'T33_HEAD_DRIFT'}
          $expected=@{
            'research/north-star-transfer/20261019-wingless-t33-dual-witness-precode.json'='f643d9db80b18c5195804fc66ccfa0e70932cca5'
            'research/north-star-transfer/20261019-wingless-t33-new-syndrome-worlds.py'='63be8f621bf521b12fbfd115af8ee6091f6eaf0e'
            'research/north-star-transfer/20261019-wingless-t33-predictive-dual.py'='2784e9dfaf158eb09bc94fba1d92f043b4a7ce7f'
          }
          foreach($path in $expected.Keys){
            if((git hash-object -- $path).Trim() -cne $expected[$path]){throw "T33_FROZEN_BLOB_DRIFT:$path"}
          }
          git merge-base --is-ancestor 90d54706cb0b68aee84b25516a4ddbbd49cb0f61 0c451fe594a1d2e8e08f65782319ecba67cd3478
          if($LASTEXITCODE -ne 0){throw 'T33_SOURCE_PRECEDED_PREREG'}
          git merge-base --is-ancestor 0c451fe594a1d2e8e08f65782319ecba67cd3478 4b07ecaf8ae3f78c0aa83c2807bd057e147c7438
          if($LASTEXITCODE -ne 0){throw 'T33_EXECUTABLE_PRECEDED_SOURCE'}
          python -m py_compile research/north-star-transfer/20261019-wingless-t33-new-syndrome-worlds.py research/north-star-transfer/20261019-wingless-t33-predictive-dual.py
          if($LASTEXITCODE -ne 0){throw 'T33_SYNTAX_ERROR'}
          Write-Output 'T33_FREEZE_AND_NEW_CAUSAL_SOURCE=PASS'
      - name: Prove TRAIN-only source-blind learned syndrome and independent exact agreement
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          python research/north-star-transfer/20261019-wingless-t33-predictive-dual.py --train-only > t33-TRAIN-soundness.json
          if($LASTEXITCODE -ne 0){throw 'T33_TRAIN_PROOF_FAILED'}
          python -c "import json;x=json.load(open('t33-TRAIN-soundness.json',encoding='utf-8-sig'));assert x['status']=='PASS_PROOF_TRAIN_ONLY' and x['TRAIN_cases']==40 and x['DEV_generated']==0 and x['true_hidden_graphs_retained']==40 and x['TRAIN_target_questions']==120 and x['TRAIN_exact_equivalence_all_five_arms']==120 and .15<=x['TRAIN_uncertainty_fraction']<=.90 and x['TRAIN_learned_pair_certificate_hits']>=1 and x['TRAIN_elimination_query_reductions_avoided']>=1 and x['TRAIN_caused_actual_query_solver_work_change_cases']>=1 and x['all_source_laws_unconstrained_by_fit'] and x['no_old_DEV_replayed'] and not x['optimizer_admission'];print('T33_TRAIN_LEARNED_EXACT_COMPRESSION_ABLATION=PASS');print('T33_TRAIN_EVIDENCE='+json.dumps(x,sort_keys=True))"
          if($LASTEXITCODE -ne 0){throw 'T33_FROZEN_NO_DEV_MECHANISM_GATE_FAILED'}
      - name: Complete native TRAIN-only 5-process cost vs strongest optimized exact controls
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          python research/north-star-transfer/20261019-wingless-t33-predictive-dual.py --train-cost > t33-TRAIN-cost.json
          if($LASTEXITCODE -ne 0){throw 'T33_TRAIN_COMPLETE_COST_FAILED'}
          python -c "import json;x=json.load(open('t33-TRAIN-cost.json',encoding='utf-8-sig'));a=x['arms'];c=a['TRAIN-learned-compact-dual-syndrome'];exact=a['optimized-exact-GF2-rowspace'];other=a['deterministic-all-pairs-dual-certificate-control'];assert x['partition']=='TRAIN' and x['unseen_DEV_cases']==0 and x['target_questions']==120 and len(a)==5 and all(v['hard_false_positives']==0 and len(v['five_whole_CPU_ns'])==5 and len(v['five_peak_RSS_bytes'])==5 for v in a.values());print('T33_TRAIN_COST_TECHNICAL=PASS');print('T33_TRAIN_COST='+json.dumps({k:{s:v[s] for s in ('correct_certified','sound_abstentions','witness_hits','full_GF2_reductions','median_whole_CPU_ns','max_peak_RSS_bytes')} for k,v in a.items()},sort_keys=True));assert c['median_whole_CPU_ns'] < min(exact['median_whole_CPU_ns'],other['median_whole_CPU_ns']) and c['max_peak_RSS_bytes']<=min(v['max_peak_RSS_bytes'] for v in a.values()),'T33_FROZEN_NATIVE_ADVANTAGE_NOT_SHOWN';print('T33_TRAIN_NATIVE_SCIENCE_ADMISSION=PASS')"
          if($LASTEXITCODE -ne 0){throw 'T33_NATIVE_COST_ADVANTAGE_NO_GO_HOLD_DEV'}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: t33-original-TRAIN-proofs-and-cost-${{ matrix.os }}
          path: |
            t33-TRAIN-soundness.json
            t33-TRAIN-cost.json
          if-no-files-found: ignore
          retention-days: 90
