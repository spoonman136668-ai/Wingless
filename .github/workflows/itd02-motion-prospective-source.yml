name: ITD-02 prospective opt-in motion authentic-source comparison
on:
  push:
    branches: [research/itd02-optin-motion-evidence-20261027]
    paths: ['.github/workflows/itd02-motion-prospective-source.yml']
permissions:
  contents: read
jobs:
  motion-authentic-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Verify exact previously qualified source and clean checkout
        shell: bash
        run: |
          set -euo pipefail
          BASE=e39461e20183154e2e2daf22c59ade3c4b033d66
          git cat-file -e "$BASE^{commit}"
          test "$(git diff --name-only "$BASE" HEAD)" = ".github/workflows/itd02-motion-prospective-source.yml"
          git diff --exit-code
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: '1.25.5'
          cache: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install pinned authentic source dependency versions
        run: python -m pip install 'minigrid==2.3.1' 'gymnasium==0.29.1'
      - name: Requalify original and motion bridge and source-free comparison
        run: |
          set -euo pipefail
          go test ./research/native/itd02/outcome ./research/native/itd02/motionbridge -count=1
          (cd research/native/itd02/outcome && python -m unittest -v test_motion_source_compare test_exact_exposure_v2 test_exact_exposure_v3)
      - name: Build independently isolated original and motion native binaries
        run: |
          go build -o "$RUNNER_TEMP/itd02-original-bridge" ./research/native/itd02/outcomebridge
          go build -o "$RUNNER_TEMP/itd02-motion-bridge" ./research/native/itd02/motionbridge
      - name: Run genuine equal-exposure prospective frozen-preference comparison
        run: |
          python research/native/itd02/outcome/motion_source_compare.py --original-binary "$RUNNER_TEMP/itd02-original-bridge" --motion-binary "$RUNNER_TEMP/itd02-motion-bridge" --output "$RUNNER_TEMP/itd02-motion-v1.json" --run-source
      - name: Fail closed on exact source exposure, frozen tests and authority
        run: |
          python - <<'PY'
          import json,os,pathlib
          r=json.loads((pathlib.Path(os.environ["RUNNER_TEMP"])/"itd02-motion-v1.json").read_text())
          assert r["science"]=="NOT_ACCEPTED"
          assert r["exposure_per_arm"]==256
          assert r["train_seeds"]==list(range(1701,2213,2))
          assert r["eval_seeds"]==[2609,2617,2621,2633,2647,2657,2663,2671]
          assert r["evaluation_mode"]=="FROZEN_NATIVE_CLONE_PER_CHOICE_VERSUS_FROZEN_LINEAR_Q"
          assert set(r["arms"])=={"motion_native","original_native","linear_q"}
          assert all(sum(e["steps"] for e in a["training"])==256 for a in r["arms"].values())
          assert all(len(a["evaluation"])==8 for a in r["arms"].values())
          assert all(e["goal_reached"]==bool(e["events"][-1]["terminated"] and e["return"]>0) for a in r["arms"].values() for e in a["evaluation"])
          print("ITD02_MOTION_SOURCE_EXPLORATORY_EXACT_EXPOSURE_PASS_NOT_ACCEPTED")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: itd02-motion-v1-exploratory
          path: ${{ runner.temp }}/itd02-motion-v1.json
          if-no-files-found: warn
          retention-days: 7
