name: Wingless W-R50 frozen batch vs online comparison
on:
  push:
    branches: [research/w-r50-symmetric-batch-learning-r1]
permissions:
  contents: read
jobs:
  science:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Frozen parent, prereg and source-birth identity gate
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 1ea9d0b4cc218c2fedb1ab0fcc47ed93ad5876a1 HEAD
          test "$(git hash-object research/contrib/chatgpt/20261013-w-r49-order-sensitivity/execute.py)" = d04bd4de051f894929da7ee1dc13a02d066ec74a
          test "$(git hash-object research/contrib/chatgpt/20261013-w-r50-batch/prereg.json)" = 39cd4329b7c2c6fcfa4a4b9e84b6e4673078a506
          test "$(git hash-object research/contrib/chatgpt/20261013-w-r50-batch/execute.py)" = 70698a05037ab0338d2218d301bc8a6ca987cdc8
          python3 -m json.tool research/contrib/chatgpt/20261013-w-r50-batch/prereg.json >/dev/null
          python3 -m py_compile research/contrib/chatgpt/20261013-w-r50-batch/execute.py
      - name: First-use frozen batch-learning study
        run: |
          set -euo pipefail
          python3 -B research/contrib/chatgpt/20261013-w-r50-batch/execute.py > /tmp/W-R50-original.json
          python3 -m json.tool /tmp/W-R50-original.json >/dev/null
          python3 - <<'PY'
          import json
          a=json.load(open('/tmp/W-R50-original.json'))
          assert a['development_seeds']==list(range(3040,3056))
          assert a['sealed_heldout_seeds']==list(range(3056,3104))
          assert len(a['results']['identity'])==3
          assert all(len(v['by_seed'])==48 for v in a['results']['identity'].values())
          print('CLASSIFICATION',a['classification'])
          print('BATCH_MINUS_ONLINE_MEAN',a['batch_minus_online_mean_accuracy'])
          for arm,row in a['results']['identity'].items():
              print('ARM',arm,row['accuracy'],row['family_accuracy'],row['training_updates'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: W-R50-original-batch-learning
          path: /tmp/W-R50-original.json
          retention-days: 90
          if-no-files-found: error
      - name: Final complete Wingless regression and build
        run: go test ./... && go build ./...
