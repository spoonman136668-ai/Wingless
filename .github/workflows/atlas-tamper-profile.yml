name: Wingless isolated Atlas tamper critical-path profiler
on:
  push:
    branches: [experiment/atlas-parallel-timing-20261104]
    paths: ['.github/workflows/atlas-tamper-profile.yml']
permissions:
  contents: read
jobs:
  profile:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 7f31b05cc274a1769c117567911d8a55030e5758
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: '1.25.5'
          cache: false
      - name: Pin exact source and produce genuine typed evidence
        shell: pwsh
        run: |
          if ((git rev-parse HEAD).Trim() -ne '7f31b05cc274a1769c117567911d8a55030e5758') { throw 'SOURCE_DRIFT' }
          if (git status --porcelain) { throw 'DIRTY_CHECKOUT' }
          go run -buildvcs=false ./cmd/ice validate
          if ($LASTEXITCODE -ne 0) { throw 'ICE_STALE' }
          go run -buildvcs=false ./cmd/ice relationships > "$env:RUNNER_TEMP\wingless-atlas-rel.json"
          if ($LASTEXITCODE -ne 0) { throw 'RELATIONSHIPS_FAILED' }
          python -B scripts/validate_code_atlas.py --root . --relationships "$env:RUNNER_TEMP\wingless-atlas-rel.json"
          if ($LASTEXITCODE -ne 0) { throw 'ATLAS_VALIDATE_FAILED' }
      - name: Profile unchanged full tamper suite including nested G26 negative controls
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $profile = Join-Path $env:RUNNER_TEMP 'wingless-atlas-tamper.pstats'
          $watch = [Diagnostics.Stopwatch]::StartNew()
          python -B -m cProfile -o "$profile" scripts/test_code_atlas_tamper.py --root . --relationships "$env:RUNNER_TEMP\wingless-atlas-rel.json" --scratch-parent "$env:RUNNER_TEMP"
          $exit = $LASTEXITCODE
          $watch.Stop()
          Write-Host "COMPLETE_TAMPER_ELAPSED_SECONDS=$([math]::Round($watch.Elapsed.TotalSeconds,3))"
          if ($exit -ne 0) { throw 'AUTHENTIC_TAMPER_NEGATIVE_FAILED' }
          @'
          import pstats, sys
          st=pstats.Stats(sys.argv[1])
          st.sort_stats('cumulative').print_stats(35)
          '@ | python - "$profile"
          if ($LASTEXITCODE -ne 0) { throw 'PROFILE_INSPECT_FAILED' }
          if (git status --porcelain) { throw 'DIRTY_AFTER_TAMPER' }
          Add-Content $env:GITHUB_STEP_SUMMARY "Full unchanged tamper negative suite PASS, elapsed seconds: $([math]::Round($watch.Elapsed.TotalSeconds,3))"
