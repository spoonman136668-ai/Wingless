name: Wingless W-R47 frozen equal-budget diverse generator training
on:
  push:
    branches: [research/w-r47-diverse-training-transfer-r1]
permissions:
  contents: read
jobs:
  science:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Fail closed on exact parent prereg and source identities
        run: |
          set -euo pipefail
          git merge-base --is-ancestor e2629063bb0057c2ea9062e3dc7ab69ec5636585 HEAD
          test "$(git hash-object research/contrib/chatgpt/20261013-w-r46-cluster-replication/execute.py)" = ba17dedfd0cbbb296e774ba055c4d78ce021ab13
          test "$(git hash-object research/contrib/chatgpt/20261013-w-r47-diverse-training/prereg.json)" = c59d14ce1c80cc4ccc99e128ad6f701f9064c6e8
          test "$(git hash-object research/contrib/chatgpt/20261013-w-r47-diverse-training/execute.py)" = 092e20b4e5a35cd9ed01cbb653706f943cb36299
          python3 -m json.tool research/contrib/chatgpt/20261013-w-r47-diverse-training/prereg.json >/dev/null
          python3 -m py_compile research/contrib/chatgpt/20261013-w-r47-diverse-training/execute.py
      - name: One original first-use sealed diverse-source comparison
        run: |
          set -euo pipefail
          python3 -B research/contrib/chatgpt/20261013-w-r47-diverse-training/execute.py >/tmp/W-R47-original.json
          python3 -m json.tool /tmp/W-R47-original.json >/dev/null
          python3 - <<'PY'
          import json
          a=json.load(open('/tmp/W-R47-original.json'))
          assert a["development_seeds"]==list(range(2560,2576))
          assert a["sealed_heldout_seeds"]==list(range(2576,2608))
          assert len(a["results"])==4 and all(len(r["cells"])==6 for r in a["results"])
          assert all(r["development_example_count"]==1728 for r in a["results"])
          print('CLASSIFICATION',a["classification"])
          print('FAMILY_WORST_GAIN',a["family_worst_accuracy_gain"])
          print('FAMILY_DIFFERENCES',a["family_accuracy_differences"])
          for r in a["results"]:
              print('ARM',r['arm'],r['condition'],r['balanced_accuracy'])
              print('FAMILY',r['arm'],{g:d['accuracy'] for g,d in r["family"].items()})
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: W-R47-original-family-diversity-transfer
          path: /tmp/W-R47-original.json
          retention-days: 90
          if-no-files-found: error
      - name: One full required Wingless regression and build
        run: go test ./... && go build ./...
