name: Wingless W-R24 frozen fill-agnostic structure evaluation
on:
  push:
    branches: [research/w-r24-fill-agnostic-local-r1]
permissions:
  contents: read
jobs:
  science:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify exact prereg source and predecessor identity
        run: |
          set -euo pipefail
          git merge-base --is-ancestor cf2da79ea3289aa82791448e103f86b89d97228e HEAD
          test "$(git hash-object research/contrib/chatgpt/20261013-w-r23-fill-falsification/execute.py)" = 2588531f90de532f7f9ab7cf4992598c6abf4373
          test "$(git hash-object research/contrib/chatgpt/20261013-w-r24-missingness/pre.json)" = b31bf89b5f0e4300a36592ffacc97a6dac5a5edc
          test "$(git hash-object research/contrib/chatgpt/20261013-w-r24-missingness/execute.py)" = 67dc93782d56436793de386d4437375b3dfc87c8
          python3 -m json.tool research/contrib/chatgpt/20261013-w-r24-missingness/pre.json >/dev/null
          python3 -m py_compile research/contrib/chatgpt/20261013-w-r24-missingness/execute.py
      - name: Original frozen synthetic fill generalization
        run: |
          set -euo pipefail
          python3 -B research/contrib/chatgpt/20261013-w-r24-missingness/execute.py > /tmp/W-R24-original.json
          python3 -m json.tool /tmp/W-R24-original.json >/dev/null
          python3 - <<'PY'
          import json
          a=json.load(open('/tmp/W-R24-original.json'))
          assert len(a['arms'])==3 and all(len(x['cells'])==90 for x in a['arms'])
          assert a['heldout_seeds']==list(range(304,320))
          print('CLASSIFICATION',a['classification'],'NOVEL_GAIN',a['novel_gain_over_zero_detector'])
          for x in a['arms']:
              print('ARM',x['arm'],'ACCURACY_BY_FILL',x['accuracy_by_fill'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: W-R24-original-structural-fill
          path: /tmp/W-R24-original.json
          retention-days: 90
          if-no-files-found: error
      - name: Final Wingless repository regression and build
        run: go test ./... && go build ./...
