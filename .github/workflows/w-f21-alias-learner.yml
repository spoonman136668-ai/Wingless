name: W-F21 learned alias witness authorization DEVELOPMENT original
on:
  push:
    branches: [research/w-f21-learned-alias-evidence-gate-20261015-r1]
permissions:
  contents: read
jobs:
  science:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-go@v5
        with: {go-version-file: go.mod}
      - name: Verify unchanged frozen W-F20 and new prereg
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 7298eab8cdc8c50a626a58cb9bb111c94a89c9db HEAD
          test "$(git hash-object unitary/f20_alias_binding_falsifier.go)" = "$(git rev-parse 7298eab8cdc8c50a626a58cb9bb111c94a89c9db:unitary/f20_alias_binding_falsifier.go)"
          python3 -m json.tool research/foundational/20261015-w-f21/prereg.json >/dev/null
      - name: Execute one W-F21 learned authorization original
        run: |
          set -euo pipefail
          go run ./cmd/f21-wingless > /tmp/w-f21-original.json
          python3 -m json.tool /tmp/w-f21-original.json >/dev/null
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: W-F21-original-learned-evidence-alias-binding
          path: /tmp/w-f21-original.json
          if-no-files-found: error
          retention-days: 90
      - name: Independently reaggregate all scientific rows
        run: |
          python3 - <<'PY'
          import json,collections
          x=json.load(open('/tmp/w-f21-original.json'))
          assert x["stage"]=="DEVELOPMENT_ONLY" and x["graphs"]==96 and x["questions"]==1152
          assert x["native_state_bytes"]==576 and x["training_only_examples"]==256
          assert x["alias_structural_canonicalization_programmed"]
          assert x["learned_component"]=="evidence-conditioned authorization decision only"
          assert not x["independent_source_birth"] and not x["sealed_first_use"] and not x["accepted_ref_mutation"]
          assert collections.Counter(r["Family"] for r in x["rows"])=={108:288,109:288,110:288,111:288}
          assert collections.Counter(r["Variant"] for r in x["rows"])==dict.fromkeys(range(12),96)
          for name,key in (("learned","Learned"),("raw","RawFrozen"),("first_witness","Witness0"),("majority","Majority"),("coded_upper","OracleCanonical")):
            s=x["scores"][name]
            assert s["correct"]==sum(r[key]["answer"]==r["Truth"] for r in x["rows"])
            assert s["false_positives"]==sum(r[key]["answer"] for r in x["rows"] if not r["Truth"])
            assert s["false_negatives"]==sum(not r[key]["answer"] for r in x["rows"] if r["Truth"])
          assert x["registered_verdict"] in ("INVALID_F21_CODED_UPPER_OR_SOURCE",
             "DEVELOPMENT_LEARNED_ALIAS_AUTHORIZATION_TRANSFER",
             "DEVELOPMENT_NO_LEARNED_ALIAS_AUTHORIZATION_TRANSFER")
          print("W_F21_VERDICT",x["registered_verdict"],x["scores"])
          PY
      - name: One full Go regression and build
        run: go test ./... && go build ./...
