name: ITD-02 V2 sparse-goal-progress four-arm authentic navigation
on:
  push:
    branches: [research/itd02-goal-progress-sparse-repair-v2-20261027]
    paths: ['.github/workflows/itd02-progress-v2-authentic.yml']
permissions:
  contents: read
jobs:
  stateful-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Verify exact source-tree identity and clean checkout
        shell: bash
        run: |
          set -euo pipefail
          BASE=df0a39151f00c0c99491fb833cd0a6d0254d8a20
          git cat-file -e "$BASE^{commit}"
          test "$(git diff --name-only "$BASE" HEAD)" = ".github/workflows/itd02-progress-v2-authentic.yml"
          git diff --exit-code
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: '1.25.5'
          cache: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install pinned authentic source environment
        run: python -m pip install 'minigrid==2.3.1' 'gymnasium==0.29.1'
      - name: Verify predeclared seeds, feedback custody and source-free protocol
        run: |
          set -euo pipefail
          go test ./research/native/itd02/outcome ./research/native/itd02/motionbridge ./research/native/itd02/progressbridge -count=1
          (cd research/native/itd02/outcome && python -m unittest -v test_progress_stateful_eval_v2 test_progress_stateful_eval test_motion_stateful_eval test_motion_source_compare test_exact_exposure_v2 test_exact_exposure_v3)
      - name: Build independently isolated original and motion native bridges
        run: |
          go build -o "$RUNNER_TEMP/itd02-original" ./research/native/itd02/outcomebridge
          go build -o "$RUNNER_TEMP/itd02-motion" ./research/native/itd02/motionbridge
          go build -o "$RUNNER_TEMP/itd02-progress" ./research/native/itd02/progressbridge
      - name: Run three-arm genuine exact-exposure stateful navigation
        run: |
          python research/native/itd02/outcome/progress_stateful_eval_v2.py --original-binary "$RUNNER_TEMP/itd02-original" --motion-binary "$RUNNER_TEMP/itd02-motion" --progress-binary "$RUNNER_TEMP/itd02-progress" --output "$RUNNER_TEMP/itd02-progress-stateful-v2.json" --run-source
      - name: Fail closed on auth, train count, heldout starts and online update counts
        run: |
          python - <<'PY'
          import json,os,pathlib
          r=json.loads((pathlib.Path(os.environ["RUNNER_TEMP"])/"itd02-progress-stateful-v2.json").read_text())
          assert r["science"]=="NOT_ACCEPTED"
          assert r["scope"]=="PROSPECTIVE_GOAL_PROGRESS_STATEFUL_EVAL_WITH_TEST_TIME_UPDATES"
          assert r["evaluation_protocol"]=="COLD_RESTORE_PER_SEED_WITH_ONLINE_SELECTED_FEEDBACK"
          assert r["train_source_interactions_per_arm"]==256
          assert r["train_seeds"]==list(range(4101,4613,2))
          assert r["heldout_eval_seeds"]==[4703,4721,4733,4747,4759,4783,4793,4801]
          assert r["test_time_adaptation"] is True
          assert set(r["arms"])=={"progress_native","motion_native","original_native","linear_q"}
          for name,a in r["arms"].items():
              assert sum(ep["steps"] for ep in a["training"])==256,name
              assert len(a["evaluation"])==8,name
              for row in a["evaluation"]:
                  assert row["online_updates"]==row["episode"]["steps"]>0,(name,row["seed"])
                  assert row["episode"]["seed"]==row["seed"]
                  if name!="linear_q":
                      assert row["updates_before"]==256
                      assert row["updates_after"]==256+row["online_updates"]
                      assert row["checkpoint_changed_during_online_eval"] is True
          for i in range(8):
              starts=[a["evaluation"][i]["episode"]["events"][0]["before"] for a in r["arms"].values()]
              assert all(s==starts[0] for s in starts)
          print("ITD02_GOAL_PROGRESS_V2_EXACT_FEEDBACK_PASS_SCIENCE_NOT_ACCEPTED")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: itd02-progress-stateful-v2-exploratory
          path: ${{ runner.temp }}/itd02-progress-stateful-v2.json
          if-no-files-found: warn
          retention-days: 7
