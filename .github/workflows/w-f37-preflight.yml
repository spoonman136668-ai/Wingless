name: W-F37 doubly stochastic binding pre-original engineering
on:
  push:
    branches:
      - research/w-f37-doubly-stochastic-bindings-20261015-r1
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Confirm ancestry, preregistration and syntax
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor f7f197355fb3211f6f3b5b4086f7656930f862ed HEAD
          git merge-base --is-ancestor 1de4b24aa6073dc084e9111bf54e9999521cc1c5 HEAD
          python3 -m json.tool research/foundational/20261015-w-f37/prereg-candidate.json >/dev/null
          python3 -m py_compile research/foundational/20261015-w-f37/train_only.py
      - name: Source-only role inverse and q8 budget tests
        run: python3 -m unittest discover -s research/foundational/20261015-w-f37 -p test_preflight.py -v
      - name: One full Go regression and build
        run: go test ./... && go build ./...
      - name: Not scientific first-use
        run: |
          echo "ENGINEERING SOURCE ONLY: no train-only cohort or original executed"
