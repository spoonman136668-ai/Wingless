name: Wingless W-R27 frozen carry-forward observability
on:
  push:
    branches: [research/w-r27-carry-forward-identifiability-r1]
permissions:
  contents: read
jobs:
  science:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify exact parent and frozen science inputs
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 5617fd5f5a7ac4ec07b084ac08ede17e5c66f96d HEAD
          test "$(git hash-object research/contrib/chatgpt/20261013-w-r25-marker-invariance/execute.py)" = de39401c8db92ddbe5019277c1e6a21786d9a994
          test "$(git hash-object research/contrib/chatgpt/20261013-w-r27-carry-forward-identifiability/prereg.json)" = aee4b1b68f278ef1de3f6f9a07f6d19f740a0448
          test "$(git hash-object research/contrib/chatgpt/20261013-w-r27-carry-forward-identifiability/execute.py)" = 7abcee0e252c0357eae5b5a13d1a6f7f78273dba
          python3 -m json.tool research/contrib/chatgpt/20261013-w-r27-carry-forward-identifiability/prereg.json > /dev/null
          python3 -m py_compile research/contrib/chatgpt/20261013-w-r27-carry-forward-identifiability/execute.py
      - name: First-use original frozen science
        run: |
          set -euo pipefail
          python3 -B research/contrib/chatgpt/20261013-w-r27-carry-forward-identifiability/execute.py > /tmp/W-R27-original-identifiability.json
          python3 -m json.tool /tmp/W-R27-original-identifiability.json > /dev/null
          python3 - <<'PY'
          import json
          a=json.load(open('/tmp/W-R27-original-identifiability.json'))
          assert a['sealed_heldout_seeds']==list(range(400,416))
          assert a['balanced_opposite_label_pairs']>0
          assert a['marked_pairs']==a['balanced_opposite_label_pairs']
          print('CLASSIFICATION',a['classification'],'PAIRS',a['balanced_opposite_label_pairs'],'SKIPPED',a['structural_exclusions'],'FIXTURE_SHA256',a['fixture_sha256'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: W-R27-original-identifiability
          path: /tmp/W-R27-original-identifiability.json
          retention-days: 90
          if-no-files-found: error
      - name: One full repository regression and build
        run: go test ./... && go build ./...
