name: Wingless W-R13 fresh-cohort permutation generalization
on:
  push:
    branches: [research/w-r13-multiaugment-temporal-r1]
permissions:
  contents: read
jobs:
  science:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check immutable scientific identities before first use
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 5e27cf50f70bfb8fb28364461e2cac0f0695a055 HEAD
          test "$(git hash-object research/contrib/chatgpt/20261012-w-r12-offset-invariance/execute.py)" = 01a028114864c249a240130b9de59fc2ee7ec794
          test "$(git hash-object research/contrib/chatgpt/20261012-w-r13-general-permutation/prereg.json)" = 61a99ae0722b5a9097fbfe0d39f7a3a4cd40fb83
          test "$(git hash-object research/contrib/chatgpt/20261012-w-r13-general-permutation/execute.py)" = 97640b4637b0c441eb409f8fa175df4996ef8aa8
          python3 -m json.tool research/contrib/chatgpt/20261012-w-r13-general-permutation/prereg.json > /dev/null
          python3 -m py_compile research/contrib/chatgpt/20261012-w-r13-general-permutation/execute.py
      - name: Original frozen scientific evaluation
        run: |
          set -euo pipefail
          python3 -B research/contrib/chatgpt/20261012-w-r13-general-permutation/execute.py > /tmp/W-R13-original.json
          python3 -m json.tool /tmp/W-R13-original.json
      - uses: actions/upload-artifact@v4
        with:
          name: W-R13-original-fresh-weave
          path: /tmp/W-R13-original.json
          if-no-files-found: error
          retention-days: 90
      - name: One full Wingless regression and build
        run: go test ./... && go build ./...
