name: T7 wingless ONE original prospective source first-use
on:
  push:
    branches: [research/north-star-transfer-wingless-20261018]
    paths: ['.github/workflows/north-star-t7-wingless-original.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: t7-wingless-single-original-source-custody
  cancel-in-progress: false
jobs:
  one-original-prospective-first-use:
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 60
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify original source freeze, both independent preflight jobs, and no previous first-use attempt
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git hash-object research/north-star-transfer/20261018-wingless-t7-preregister.json)" = "f20df60f632fecab506040b855618e21e3c6472f"
          test "$(git log -1 --format=%H -- research/north-star-transfer/20261018-wingless-t7-preregister.json)" = "3e6566df5e3e972e0bd7fc88b1aabab9e7769a2b"
          git merge-base --is-ancestor 3e6566df5e3e972e0bd7fc88b1aabab9e7769a2b HEAD
          test "$(git hash-object research/north-star-transfer/20261018-wingless-t7-independent.py)" = "9c289b16963837a3c4095f682cc0fe94534ff061"
          test "$(git hash-object research/north-star-transfer/20261018-wingless-t6-learning.py)" = "e2591ae5c390438b14b6f622e902569c7b60b610"
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/39178944385" --jq '[.head_sha,.conclusion,.event] | join(" ")')" = "26b84eb3869535c69b2df29699b0ad715ddd55f3 success push"
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/39178944385/jobs?per_page=100" --jq '[.total_count,([.jobs[]|select(.conclusion=="success")]|length)]|join(" ")')" = "2 2"
          other=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?branch=research/north-star-transfer-wingless-20261018&per_page=100" --jq '[.workflow_runs[] | select(.path==".github/workflows/north-star-t7-wingless-original.yml") | select(.id != (env.GITHUB_RUN_ID|tonumber))] | length')
          test "$other" = "0" || { echo T7_ORIGINAL_SOURCE_ALREADY_ATTEMPTED; exit 1; }
          python3 -B research/north-star-transfer/20261018-wingless-t7-independent.py --mode preflight
          echo T7_WINGLESS_BEFORE_FIRST_USE_ADMISSION=PASS
      - name: Consume one frozen original source cohort, replica only if admitted
        shell: bash
        run: |
          set -euo pipefail
          python3 -B research/north-star-transfer/20261018-wingless-t7-independent.py --mode original > "$RUNNER_TEMP/t7-wingless-original.json"
          python3 - <<'PY'
          import json,os,pathlib
          f=pathlib.Path(os.environ["RUNNER_TEMP"],"t7-wingless-original.json")
          d=json.loads(f.read_text())
          assert d["schema"]=="wingless.t7.first-original-new-distribution.v1"
          assert d["A_prospective_sources_constructed"]==64
          assert d["WNS_protected_source_constructed"]==0
          assert d["B_constructed"]==d["A_eligible"]
          assert d["B_prospective_sources_constructed"]==(64 if d["A_eligible"] else 0)
          assert d["scientific_OOD_acceptance"] is False and d["original_science_promotion"] is False
          print("T7_WINGLESS_FIRST_USE_SOURCE_CUSTODY=PASS")
          print("T7_WINGLESS_SCIENTIFIC_ACCEPTANCE=false")
          print("T7_WINGLESS_ORIGINAL_PROTECTED_COHORTS_UNTOUCHED=true")
          print("T7_WINGLESS_FIRST_USE_RESULT="+json.dumps(d,sort_keys=True))
          PY
          (cd "$RUNNER_TEMP" && sha256sum "t7-wingless-original.json" > "t7-wingless-original.json.sha256")
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: t7-wingless-first-original-${{ github.sha }}
          path: |
            ${{ runner.temp }}/t7-wingless-original.json
            ${{ runner.temp }}/t7-wingless-original.json.sha256
          retention-days: 90
          if-no-files-found: warn
