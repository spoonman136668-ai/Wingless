name: Wingless exact candidate G26 original-output parity
on:
  push:
    branches: [experiment/atlas-parallel-timing-20261104]
    paths: ['.github/workflows/atlas-g26-output-parity.yml']
permissions:
  contents: read
jobs:
  parity:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 715e53ae638497c8d7e53a94a0a7b954dac984b2
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: '1.25.5'
          cache: false
      - name: Independent same-fixture original-versus-batch output byte parity
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git rev-parse HEAD).Trim() -ne '715e53ae638497c8d7e53a94a0a7b954dac984b2') { throw 'CANDIDATE_SHA_DRIFT' }
          if (git status --porcelain) { throw 'ORIGINAL_CHECKOUT_DIRTY' }
          @'
          import hashlib, json, os, pathlib, shutil, subprocess, sys, tempfile, time
          root=pathlib.Path(".").resolve()
          old_commit="7f31b05cc274a1769c117567911d8a55030e5758"
          candidate="715e53ae638497c8d7e53a94a0a7b954dac984b2"
          def cmd(cwd,*args,check=True):
              p=subprocess.run(list(map(str,args)),cwd=cwd,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
              if check and p.returncode:
                  raise SystemExit("G26_PARITY_COMMAND_FAILED "+repr(args)+" "+p.stdout[-1300:].decode(errors="replace"))
              return p
          def require(test,msg):
              if not test: raise SystemExit("G26_OUTPUT_PARITY_FAILED "+msg)
          require(cmd(root,"git","rev-parse","HEAD").stdout.strip().decode()==candidate,"candidate drift")
          legacy=cmd(root,"git","show",old_commit+":scripts/maintain_code_atlas.py").stdout
          require(b"def source_bytes(" in legacy and b"git(root, \"show\"" in legacy,"original source provenance mismatch")
          with tempfile.TemporaryDirectory(prefix="g26-parity-") as tmp:
              t=pathlib.Path(tmp)
              original_script=t/"legacy_maintainer.py"
              original_script.write_bytes(legacy)
              work=t/"same-source-fixture"
              cmd(root,"git","clone","--quiet","--no-hardlinks","--no-checkout",root,work)
              cmd(work,"git","checkout","--quiet","--detach",candidate)
              fixture=work/"inference/lifecycle.go"
              before=fixture.read_bytes()
              marker=b"\n// G26 parity deterministic comment with identical declaration bytes.\n"
              require(marker not in before,"fixture already modified")
              fixture.write_bytes(before+marker)
              cmd(work,"git","add","inference/lifecycle.go")
              cmd(work,"git","-c","user.name=Wingless G26 Parity","-c","user.email=g26-parity@example.invalid","commit","-qm","G26 fixed synthetic declaration-preserving parity fixture")
              fixture_sha=cmd(work,"git","rev-parse","HEAD").stdout.strip().decode()
              require(len(fixture_sha)==40,"synthetic commit missing")
              cmd(work,"go","run","-buildvcs=false","./cmd/ice","build")
              # Source, exact HEAD and structurally built .ice are cloned identically.
              # Only the invoked historical Python implementation differs.
              baseline=t/"legacy-input"
              optimized=t/"batch-input"
              shutil.copytree(work,baseline)
              shutil.copytree(work,optimized)
              timings={}
              outputs={}
              for mode,folder,script in (
                  ("legacy",baseline,original_script),
                  ("batch",optimized,optimized/"scripts/maintain_code_atlas.py")):
                  require(cmd(folder,"git","rev-parse","HEAD").stdout.strip().decode()==fixture_sha,"fixture head differs")
                  t0=time.perf_counter()
                  p=cmd(folder,sys.executable,"-B",script,"--root",folder)
                  timings[mode]=round(time.perf_counter()-t0,3)
                  payload=json.loads(p.stdout.decode().strip().splitlines()[-1])
                  require(payload.get("result")=="G26_SOURCE_AWARE_GENERATION_PASS","maintenance output not PASS")
                  require(payload.get("reused_declarations")==352 and
                          payload.get("fresh_review_receipts")==0,"frozen review receipts changed")
                  outputs[mode]={}
                  for filename in (".ice/code-intelligence.json",".ice/code-intelligence.html",".ice/code-intelligence.ice"):
                      outputs[mode][filename]=(folder/filename).read_bytes()
              for filename in outputs["legacy"]:
                  a,b=outputs["legacy"][filename],outputs["batch"][filename]
                  require(a==b,"generated bytes disagree "+filename)
                  print("G26_OUTPUT_SHA256="+filename+":"+hashlib.sha256(a).hexdigest(),flush=True)
              require(not cmd(root,"git","status","--porcelain").stdout.strip(),"original checkout changed")
              print("G26_PARITY_FIXTURE_SHA="+fixture_sha,flush=True)
              print("G26_PARITY_SOURCE_SHA="+candidate,flush=True)
              print("G26_LEGACY_SECONDS="+str(timings["legacy"]),flush=True)
              print("G26_BATCH_SECONDS="+str(timings["batch"]),flush=True)
              print("G26_EXACT_OUTPUT_PARITY_PASS=true",flush=True)
          '@ | python -B -
          if ($LASTEXITCODE -ne 0) { throw 'AUTHENTIC_G26_PARITY_FAILED' }
