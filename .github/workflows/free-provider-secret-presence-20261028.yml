# Single push-only diagnostic. Does not access or print the credential value.
# No external model invocation, network provider check, source promotion, or write permission.
name: Wingless one-shot free-provider credential scope witness
on:
  push:
    branches:
      - engineering/free-provider-secret-scope-probe-20261028
    paths:
      - .github/workflows/free-provider-secret-presence-20261028.yml
permissions:
  contents: read
jobs:
  repository-scope:
    if: github.repository == 'spoonman136668-ai/Wingless'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Frozen candidate source, no checkout credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Confirm exact parent and executor remains disabled
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'engineering/free-provider-secret-scope-probe-20261028'
          test "$(git rev-parse HEAD^)" = 'a91e125cd54102ef1c44ac0e60ee597963e0c9ae'
          test "$(git diff --name-only HEAD^ HEAD)" = '.github/workflows/free-provider-secret-presence-20261028.yml'
          python3 - <<'PY'
          import json
          with open('.research-autonomy/config.json',encoding='utf-8') as f:
              c=json.load(f)
          if c.get('schema')!='research.autonomy.v2' or c.get('program')!='Wingless' or c.get('authority')!='research-only' or c.get('research_executor')!='disabled':
              raise SystemExit('FREE_PROVIDER_WITNESS_PRODUCTION_MODE_DRIFT')
          print('FREE_PROVIDER_WITNESS_EXACT_DISABLED_SOURCE=PASS')
          PY
      - name: Inspect only boolean visibility of free provider credential
        shell: bash
        env:
          FREE_PROVIDER_SECRET_VISIBLE: ${{ secrets.OPENROUTER_FREE_API_KEY != '' }}
        run: |
          set -euo pipefail
          case "$FREE_PROVIDER_SECRET_VISIBLE" in
            true) echo 'FREE_PROVIDER_REPOSITORY_SECRET_VISIBLE=YES';;
            false) echo 'FREE_PROVIDER_REPOSITORY_SECRET_VISIBLE=NO';;
            *) echo 'FREE_PROVIDER_SCOPE_EVALUATION_INVALID'; exit 1;;
          esac
          echo 'FREE_PROVIDER_SECRET_VALUE_EXPOSED=NO'
          echo 'FREE_PROVIDER_API_REQUESTS=ZERO'
          echo 'FREE_PROVIDER_RESEARCH_EXECUTOR_ACTIVATED=NO'
