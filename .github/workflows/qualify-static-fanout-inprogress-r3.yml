name: Qualify static fanout in-progress R3
on:
  push:
    branches:
      - repair/static-fanout-inprogress-r3

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Verify start-time observer trigger
        shell: bash
        run: |
          set -euo pipefail
          p=.github/workflows/free-fanout-static-observer.yml
          test -f "$p"
          grep -F 'workflow_run:' "$p"
          grep -F 'CKB static research runner' "$p"
          grep -F -- '- in_progress' "$p"
          ! grep -F -- '- requested' "$p"
          ! grep -F 'branches:' "$p"
          grep -F "github.event.workflow_run.event == 'workflow_dispatch'" "$p"
          grep -F "github.event.workflow_run.head_branch == 'main'" "$p"
          grep -F 'github.event.workflow_run.display_title' "$p"
          grep -F 'contents: read' "$p"
          grep -F 'actions: read' "$p"
          ! grep -F 'contents: write' "$p"
          ! grep -F 'actions: write' "$p"
          ! grep -F 'gh workflow run' "$p"
          test "$(grep -c 'runs-on: ubuntu-latest' "$p")" -eq 3
          echo OBSERVER_START_TRIGGER=PASS

      - name: Verify exact static title parser
        shell: bash
        run: |
          set -euo pipefail
          GOOD="CKB static research 0123456789abcdef0123456789abcdef 0123456789abcdef0123456789abcdef01234567"
          BAD="CKB static research wrong 0123456789abcdef0123456789abcdef01234567"
          if [[ "$GOOD" =~ ^CKB\ static\ research\ ([0-9a-f]{32})\ ([0-9a-f]{40})$ ]]; then
            test "${BASH_REMATCH[1]}" = "0123456789abcdef0123456789abcdef"
            test "${BASH_REMATCH[2]}" = "0123456789abcdef0123456789abcdef01234567"
          else
            exit 1
          fi
          if [[ "$BAD" =~ ^CKB\ static\ research\ ([0-9a-f]{32})\ ([0-9a-f]{40})$ ]]; then exit 1; fi
          echo OBSERVER_IDENTITY_PARSER=PASS

      - name: Run sidecar regression
        shell: bash
        env:
          PROGRAM: Wingless
        run: |
          set -euo pipefail
          python -m unittest tests/test_free_fanout_sidecar.py
          echo SIDECAR_REGRESSION=PASS
