name: CKB private checkout hosted authentication probe
on:
  push:
    branches: [proposal/ckb-hosted-qualification-r1]
    paths: [.github/workflows/ckb-private-read-probe.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Verify secret configured without disclosing it
        shell: bash
        env:
          CKB_READ_TOKEN: ${{ secrets.CKB_QUAL_READ_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$CKB_READ_TOKEN" ]]; then
            echo 'CKB_READONLY_SECRET_MISSING' >&2
            exit 1
          fi
          echo 'CKB_READONLY_SECRET_PRESENT=PASS'
      - uses: actions/checkout@v4
        with:
          repository: spoonman136668-ai/ckb-plane
          ref: fb96a00369b3674a9c69fff1f3d49d974d485385
          token: ${{ secrets.CKB_QUAL_READ_TOKEN }}
          path: private-ckb
          persist-credentials: false
          fetch-depth: 1
      - name: Verify immutable checkout, never print private source
        shell: bash
        run: |
          set -euo pipefail
          cd private-ckb
          test "$(git rev-parse HEAD)" = 'fb96a00369b3674a9c69fff1f3d49d974d485385'
          test -z "$(git status --porcelain)"
          echo 'CKB_PRIVATE_HOSTED_CHECKOUT=PASS'
