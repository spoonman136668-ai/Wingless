name: ITD02 MG51 Focused Native Engineering
on:
  pull_request:
    paths:
      - 'research/native/itd02/mg37/**'
      - '.github/workflows/itd02-mg51-focused-native.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  focused-native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version-file: go.mod
      - name: Focused original-public native package tests
        run: go test ./research/native/itd02/mg37 -count=1 -v
      - name: Focused static check
        run: go vet ./research/native/itd02/mg37
      - name: Preserve read-only worktree
        run: git diff --exit-code
