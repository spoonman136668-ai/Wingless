name: Inspect outstanding CKB proxy requests R4d
on:
  push:
    branches: [repair/proxy-auto-fanout-r4]
    paths: ['.github/workflows/temp-proxy-rescue-r4d.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: [self-hosted, Windows, X64, wingless-up-c]
    timeout-minutes: 3
    steps:
      - name: Inspect pending requests for current qualified controller
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference='Stop'
          Set-StrictMode -Version 3.0
          if($env:COMPUTERNAME -cne 'LINKDEADKB'){throw 'PROXY_QUEUE_DIAGNOSTIC_HOST_DRIFT'}
          $root='C:\ProgramData\CKBR\research-write-proxy'
          $controller='a3a8c3ada1e4ff2c28651cf4a79fb14a606aede9'
          $dir=Join-Path $root 'requests\Wingless'
          $out=Join-Path $root 'responses\Wingless'
          if(!(Test-Path -LiteralPath $dir -PathType Container)){throw 'WINGLESS_PROXY_REQUEST_DIR_MISSING'}
          $pending=0
          $recent=0
          foreach($file in @(Get-ChildItem -LiteralPath $dir -File -Filter '*.json'|Sort-Object LastWriteTimeUtc -Descending|Select-Object -First 40)){
            try{$q=Get-Content -LiteralPath $file.FullName -Raw|ConvertFrom-Json}catch{continue}
            $responsePath=Join-Path $out $file.Name
            $status='MISSING'
            $errorCode=''
            $matchSha=$false
            if(Test-Path -LiteralPath $responsePath -PathType Leaf){
              try{
                $r=Get-Content -LiteralPath $responsePath -Raw|ConvertFrom-Json
                $status=[string]$r.status
                $errorCode=([string]$r.error)
                $digest=(Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
                $matchSha=([string]$r.request_sha256 -ceq $digest)
                if(!$matchSha){$status='STALE_SHA'}
              }catch{$status='INVALID_RESPONSE'}
            }
            if([string]$q.controller_sha -cne $controller){continue}
            $recent++
            if($status -cne 'PASS'){$pending++}
            $err=if($errorCode.Length-gt95){$errorCode.Substring(0,95)}else{$errorCode}
            Write-Host ('current_request_id='+$file.BaseName+' operation='+[string]$q.operation+' status='+$status+' match_sha='+$matchSha+' lastwrite='+$file.LastWriteTimeUtc.ToString('o')+' error='+$err)
          }
          Write-Host ('CURRENT_CONTROLLER_PROXY_QUEUE=PASS seen='+$recent+' unpassed='+$pending)
