name: Read current research controller receipt R4d
on:
  push:
    branches: [repair/proxy-auto-fanout-r4]
    paths: ['.github/workflows/temp-proxy-rescue-r4d.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: [self-hosted, Windows, X64, wingless-up-c]
    timeout-minutes: 3
    steps:
      - name: Inspect shared controller receipt without mutation
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference='Stop'
          Set-StrictMode -Version 3.0
          if($env:COMPUTERNAME -cne 'LINKDEADKB'){throw 'R4D_RECEIPT_HOST_MISMATCH'}
          $root='C:\ProgramData\CKBR\research'
          $id=([IO.File]::ReadAllText((Join-Path $root 'controller-qualified-sha.txt'))).Trim()
          $cfg=Get-Content -LiteralPath (Join-Path $root 'controller.json') -Raw|ConvertFrom-Json
          Write-Host ('installed_controller='+$id)
          Write-Host ('persistent_controller='+[string]$cfg.controller_sha)
          Write-Host ('persistent_authority_ref='+[string]$cfg.authority_workflow_ref)
          $p=Join-Path $root 'state\latest-receipt.json'
          if(Test-Path -LiteralPath $p -PathType Leaf){
            $r=Get-Content -LiteralPath $p -Raw|ConvertFrom-Json
            Write-Host ('receipt_time='+[string]$r.observed_at_utc)
            Write-Host ('receipt_status='+[string]$r.status)
            Write-Host ('receipt_controller='+[string]$r.controller_sha)
            Write-Host ('wingless_state='+[string]$r.wingless.state)
            Write-Host ('wingless_blocker='+[string]$r.wingless.blocker)
            Write-Host ('wingless_branch='+[string]$r.wingless.branch)
            Write-Host ('wingless_head='+[string]$r.wingless.head_sha)
            Write-Host ('wingless_run_id='+[string]$r.wingless.workflow_run_id)
            Write-Host ('yggdrasil_state='+[string]$r.yggdrasil.state)
          }else{Write-Host 'receipt_missing=true'}
          $reqId='fc29c5ee0e87f4e7a80dcd9c6ff8cad6'
          $respPath=Join-Path 'C:\ProgramData\CKBR\research-write-proxy\responses\Wingless' ($reqId+'.json')
          if(Test-Path -LiteralPath $respPath){
            $rr=Get-Content -LiteralPath $respPath -Raw|ConvertFrom-Json
            Write-Host ('r52_proxy_response_status='+[string]$rr.status)
            Write-Host ('r52_proxy_tree='+[string]$rr.tree_sha)
          }
          Write-Host 'RESEARCH_SHARED_RECEIPT_INSPECTION=PASS'
