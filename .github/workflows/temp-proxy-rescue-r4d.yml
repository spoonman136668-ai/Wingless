name: Temporary stale proxy pump retirement R4d
on:
  push:
    branches: [repair/proxy-auto-fanout-r4]
    paths: ['.github/workflows/temp-proxy-rescue-r4d.yml']
permissions:
  contents: read
  actions: write
jobs:
  retire:
    runs-on: [self-hosted, Windows, X64, wingless-up-c]
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Retire only exact pre-fix UP-B runs
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference='Stop'
          Set-StrictMode -Version 3.0
          if($env:COMPUTERNAME -cne 'LINKDEADKB'){throw ('STALE_PUMP_RETIRE_HOST_MISMATCH:'+ $env:COMPUTERNAME)}
          $repo='spoonman136668-ai/Wingless'
          $old='5766abeaab29159a090ce703d27c75c71009f3ff'
          foreach($id in @(37693229997,37694705265)){
            $raw=@(& gh.exe api ("repos/"+$repo+"/actions/runs/"+$id) 2>&1)
            if($LASTEXITCODE-ne0){throw ('STALE_PUMP_READ_FAILED:'+ $id)}
            $run=($raw-join[Environment]::NewLine)|ConvertFrom-Json
            if([string]$run.head_sha -cne $old -or [string]$run.path -cne '.github/workflows/ckb-research-write-proxy-pump.yml'){
              throw ('STALE_PUMP_IDENTITY_DRIFT:'+ $id)
            }
            if([string]$run.status -eq 'completed'){Write-Host ('STALE_PUMP_ALREADY_CLOSED='+$id);continue}
            & gh.exe run cancel $id --repo $repo
            if($LASTEXITCODE-ne0){throw ('STALE_PUMP_CANCEL_FAILED:'+ $id)}
            Write-Host ('STALE_PUMP_CANCEL_REQUESTED='+$id)
          }
          Write-Host 'STALE_PUMP_RETIREMENT=PASS'
