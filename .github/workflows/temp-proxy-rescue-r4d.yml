name: Inspect live research processes R4d
on:
  push:
    branches: [repair/proxy-auto-fanout-r4]
    paths: ['.github/workflows/temp-proxy-rescue-r4d.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: [self-hosted, Windows, X64, wingless-up-c]
    timeout-minutes: 3
    steps:
      - name: Inspect running controller process identities
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference='Stop'
          Set-StrictMode -Version 3.0
          if($env:COMPUTERNAME -cne 'LINKDEADKB'){throw 'PROCESS_PROBE_HOST_MISMATCH'}
          $rows=@(Get-CimInstance Win32_Process -ErrorAction Stop|Where-Object{
            [string]$_.CommandLine -match '(?i)(Invoke-ResearchLoop\.ps1|research-loop-headless|research-loop-controller)'
          })
          foreach($p in $rows){
            $cl=[string]$p.CommandLine
            $binding=if($cl -match 'controller\.json'){'PERSISTENT_CONFIG'}elseif($cl -match 'research-loop-headless-config\.json'){'HEADLESS_TEMP_CONFIG'}elseif($cl -match 'research-loop-activation-config\.json'){'ACTIVATION_TEMP_CONFIG'}else{'OTHER_RESEARCH_CONTROLLER'}
            Write-Host ('research_process_pid='+[string]$p.ProcessId+' parent='+[string]$p.ParentProcessId+' created='+[string]$p.CreationDate+' binding='+$binding)
          }
          $root='C:\ProgramData\CKBR\research'
          $j=Get-Content -LiteralPath (Join-Path $root 'controller.json') -Raw|ConvertFrom-Json
          Write-Host ('persistent_proxy_enabled='+[string]$j.write_proxy_enabled)
          Write-Host ('persistent_authority_ref='+[string]$j.authority_workflow_ref)
          $receipt=Join-Path $root 'state\latest-receipt.json'
          if(Test-Path $receipt){
            $r=Get-Content -LiteralPath $receipt -Raw|ConvertFrom-Json
            Write-Host ('receipt_time='+[string]$r.observed_at_utc+' status='+[string]$r.status+' wingless='+[string]$r.wingless.state+' blocker='+[string]$r.wingless.blocker)
          }
          Write-Host ('RESEARCH_PROCESS_INSPECTION=PASS count='+$rows.Count)
