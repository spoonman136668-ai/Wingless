name: Temporary proxy rescue R4d
on:
  push:
    branches:
      - repair/proxy-auto-fanout-r4
    paths:
      - '.github/workflows/temp-proxy-rescue-r4d.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: [self-hosted, Windows, X64, wingless-up-c]
    timeout-minutes: 5
    steps:
      - name: Verify exact R52 adoption response
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference='Stop'
          Set-StrictMode -Version 3.0
          if($env:COMPUTERNAME -cne 'LINKDEADKB'){throw ('R52_VERIFY_HOST_MISMATCH:'+ $env:COMPUTERNAME)}
          $requestDir='C:\ProgramData\CKBR\research-write-proxy\requests\Wingless'
          $responseDir='C:\ProgramData\CKBR\research-write-proxy\responses\Wingless'
          $target='research/external-hosted-wingless-rsi-representation-readout-coupling-diagnosis-r52'
          $matches=@()
          foreach($file in @(Get-ChildItem -LiteralPath $requestDir -File -Filter '*.json')){
            try{$req=Get-Content -LiteralPath $file.FullName -Raw|ConvertFrom-Json}catch{continue}
            if([string]$req.operation -eq 'create_documents_branch' -and [string]$req.branch -eq $target){
              $matches+=@([pscustomobject]@{file=$file;req=$req})
            }
          }
          if($matches.Count-ne1){throw ('R52_VERIFY_REQUEST_COUNT:'+ $matches.Count)}
          $m=$matches[0]
          if([string]$m.req.parent_sha -cne '4c35e6b4a58d9f282f58a734a02bf5e0c49d0dd6'){throw 'R52_VERIFY_PARENT_MISMATCH'}
          $requestSha=(Get-FileHash -LiteralPath $m.file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $responsePath=Join-Path $responseDir $m.file.Name
          if(!(Test-Path -LiteralPath $responsePath -PathType Leaf)){throw 'R52_VERIFY_RESPONSE_MISSING'}
          $resp=Get-Content -LiteralPath $responsePath -Raw|ConvertFrom-Json
          if([string]$resp.request_sha256 -cne $requestSha){throw 'R52_VERIFY_REQUEST_SHA_MISMATCH'}
          if([string]$resp.status -cne 'PASS'){throw ('R52_VERIFY_STATUS:'+ [string]$resp.status+':'+[string]$resp.error)}
          if([string]$resp.remote_sha -cne '4401f24bfe70a78fcf397ded2124e43c9e61a29f'){throw ('R52_VERIFY_REMOTE_SHA:'+ [string]$resp.remote_sha)}
          if([string]$resp.tree_sha -cne '7ab229c95dd1026ffb081cb7aa35d15cf9777805'){throw ('R52_VERIFY_TREE_SHA:'+ [string]$resp.tree_sha)}
          if($resp.PSObject.Properties['adopted_existing'] -eq $null -or $resp.adopted_existing -ne $true){throw 'R52_VERIFY_ADOPTION_FLAG_MISSING'}
          Write-Host ('R52_PROXY_ADOPTION=PASS request_id='+[string]$resp.request_id+' remote_sha='+[string]$resp.remote_sha+' tree_sha='+[string]$resp.tree_sha)
