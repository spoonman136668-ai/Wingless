name: Temporary R52 proxy verification R4d
on:
  push:
    branches: [repair/proxy-auto-fanout-r4]
    paths: ['.github/workflows/temp-proxy-rescue-r4d.yml']
permissions:
  contents: write
  actions: write
jobs:
  verify:
    runs-on: [self-hosted, Windows, X64, wingless-up-c]
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 1
      - name: Service and verify exact qualified R52 document
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference='Stop'
          Set-StrictMode -Version 3.0
          if($env:COMPUTERNAME -cne 'LINKDEADKB'){throw 'R52_PROXY_HOST_MISMATCH'}
          $head=(& git.exe rev-parse HEAD).Trim()
          if($head -cne 'ce81fbad415fdb754d18428e8ada3a8f1c2877ee'){throw ('R52_PROXY_CODE_IDENTITY_DRIFT:'+ $head)}
          $ctrl='a3a8c3ada1e4ff2c28651cf4a79fb14a606aede9'
          $id=([IO.File]::ReadAllText('C:\ProgramData\CKBR\research\controller-qualified-sha.txt')).Trim()
          if($id -cne $ctrl){throw ('R52_PROXY_CONTROLLER_IDENTITY_DRIFT:'+ $id)}
          $requestDir='C:\ProgramData\CKBR\research-write-proxy\requests\Wingless'
          $responseDir='C:\ProgramData\CKBR\research-write-proxy\responses\Wingless'
          $branch='research/external-hosted-wingless-rsi-representation-readout-coupling-diagnosis-r52'
          $deadline=(Get-Date).AddSeconds(60)
          $target=$null
          do {
            $matches=@()
            foreach($f in @(Get-ChildItem -LiteralPath $requestDir -File -Filter '*.json')){
              try{$q=Get-Content -LiteralPath $f.FullName -Raw|ConvertFrom-Json}catch{continue}
              if([string]$q.controller_sha -ceq $ctrl -and [string]$q.operation -ceq 'create_documents_branch' -and [string]$q.branch -ceq $branch){
                $matches+=@([pscustomobject]@{file=$f;req=$q})
              }
            }
            if($matches.Count-gt1){throw ('R52_PROXY_MULTIPLE_QUALIFIED_REQUESTS:'+ $matches.Count)}
            if($matches.Count-eq1){$target=$matches[0];break}
            Start-Sleep -Seconds 2
          }while((Get-Date)-lt$deadline)
          if($null-eq$target){throw 'R52_PROXY_QUALIFIED_REQUEST_NOT_YET_PRESENT'}
          if([string]$target.req.parent_sha -cne '4c35e6b4a58d9f282f58a734a02bf5e0c49d0dd6'){throw 'R52_PROXY_PARENT_DRIFT'}
          $requestSha=(Get-FileHash -LiteralPath $target.file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          & .\research\transport\Invoke-CKBResearchWriteProxy.ps1 -Lane 'Wingless' -Repository 'spoonman136668-ai/Wingless' -RepositoryPath 'C:\ProgramData\CKBR\research\repos\Wingless'
          $responsePath=Join-Path $responseDir $target.file.Name
          if(!(Test-Path -LiteralPath $responsePath -PathType Leaf)){throw 'R52_PROXY_RESPONSE_MISSING'}
          $resp=Get-Content -LiteralPath $responsePath -Raw|ConvertFrom-Json
          if([string]$resp.request_sha256 -cne $requestSha -or [string]$resp.status -cne 'PASS'){
            throw ('R52_PROXY_RESPONSE_FAILED:'+ [string]$resp.status+':'+[string]$resp.error)
          }
          if([string]$resp.remote_sha -cne '4401f24bfe70a78fcf397ded2124e43c9e61a29f' -or [string]$resp.tree_sha -cne '7ab229c95dd1026ffb081cb7aa35d15cf9777805' -or $resp.adopted_existing -ne $true){
            throw ('R52_PROXY_ADOPTION_IDENTITY_MISMATCH:'+ [string]$resp.remote_sha+':'+[string]$resp.tree_sha)
          }
          Write-Host ('R52_QUALIFIED_DOCUMENT_ADOPTION=PASS request_id='+[string]$resp.request_id+' remote_sha='+[string]$resp.remote_sha+' tree_sha='+[string]$resp.tree_sha)
