name: Diagnose live Git process contention R4d
on:
  push:
    branches: [repair/proxy-auto-fanout-r4]
    paths: ['.github/workflows/temp-proxy-rescue-r4d.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: [self-hosted, Windows, X64, wingless-up-c]
    timeout-minutes: 3
    steps:
      - name: Inspect bounded recent Git and PowerShell processes
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference='Stop'
          Set-StrictMode -Version 3.0
          if($env:COMPUTERNAME -cne 'LINKDEADKB'){throw 'R4D_GIT_PROCESS_HOST_MISMATCH'}
          $cutoff=(Get-Date).AddMinutes(-12)
          $rows=@(Get-CimInstance Win32_Process -ErrorAction Stop|Where-Object{
            [string]$_.Name -match '^(?i:gh|git|powershell|pwsh)\.exe$' -and [datetime]$_.CreationDate -ge $cutoff
          })
          foreach($p in $rows){
            $c=[string]$p.CommandLine
            $kind=if($c -match '(?i)auth setup-git'){'GH_SETUP_GIT'}elseif($c -match '(?i)gitconfig|\.gitconfig'){'GIT_CONFIG'}elseif($c -match '(?i)Invoke-ResearchLoop\.ps1'){'RESEARCH_CONTROLLER'}elseif($c -match '(?i)research-loop-headless-config\.json'){'HEADLESS_WAKE'}else{'OTHER'}
            Write-Host ('process='+[string]$p.Name+' pid='+[string]$p.ProcessId+' parent='+[string]$p.ParentProcessId+' started='+[string]$p.CreationDate+' kind='+$kind)
          }
          $lock='C:\Users\CKBResearchActivator\.gitconfig.lock'
          $serviceLock='C:\Windows\ServiceProfiles\NetworkService\.gitconfig.lock'
          foreach($p in @($lock,$serviceLock)){
            if(Test-Path -LiteralPath $p -PathType Leaf){
              $f=Get-Item -LiteralPath $p
              Write-Host ('git_config_lock_present='+$p+' modified='+$f.LastWriteTimeUtc.ToString('o'))
            }
          }
          Write-Host ('R4D_GIT_PROCESS_INSPECTION=PASS count='+$rows.Count)
