name: T29 TRAIN-only exact multi-grammar causal separator feasibility
on:
  push:
    branches: [research/t29-multigrammar-causal-separator-20261019]
    paths: ['.github/workflows/north-star-t29-train-only.yml']
permissions:
  contents: read
concurrency:
  group: wingless-T29-new-multigrammar-TRAIN
  cancel-in-progress: false
jobs:
  exact-source-feasibility:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 45
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check immutable precode-before-source identity and implementation
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if((git rev-parse HEAD).Trim() -cne $env:GITHUB_SHA){throw 'T29_HEAD_DRIFT'}
          $expected=@{
            'research/north-star-transfer/20261019-wingless-t29-multigrammar-precode.json'='291f95184331d4f4d9d3084b98cde10418a4c9fc'
            'research/north-star-transfer/20261019-wingless-t29-new-structural-worlds.py'='aa9ffc0df395ed3dd92e899764c5c664ca0b1b32'
            'research/north-star-transfer/20261019-wingless-t29-certified-causal-separator.py'='33f33e95bb6fbc89557abd34dd5d91d68550261f'
          }
          foreach($path in $expected.Keys) {
            if((git hash-object -- $path).Trim() -cne $expected[$path]){
              throw "T29_FROZEN_BLOB_DRIFT:$path"
            }
          }
          git merge-base --is-ancestor 672a1fb40cfaf446a27d19df754f1f8205fa05be a40bc4d19d19000cc1b950ed815810e863e40e95
          if($LASTEXITCODE -ne 0){throw 'T29_SOURCE_BORN_BEFORE_PRECODE'}
          git merge-base --is-ancestor a40bc4d19d19000cc1b950ed815810e863e40e95 ba41b07c2678c064a78f947b38ec6fd8efa0c9fb
          if($LASTEXITCODE -ne 0){throw 'T29_IMPLEMENTATION_BEFORE_SOURCE'}
          python -m py_compile research/north-star-transfer/20261019-wingless-t29-new-structural-worlds.py research/north-star-transfer/20261019-wingless-t29-certified-causal-separator.py
          if($LASTEXITCODE -ne 0){throw 'T29_PYTHON_SYNTAX_FAIL'}
          Write-Output 'T29_FROZEN_PREREG_AND_SOURCE_BIRTH=PASS'
      - name: Exhaustive TRAIN-only soundness and genuinely variable grammar headroom
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          python research/north-star-transfer/20261019-wingless-t29-certified-causal-separator.py --train-only > t29-TRAIN-feasibility.json
          if($LASTEXITCODE -ne 0){throw 'T29_TRAIN_CAUSAL_SEPARATOR_PROOF_FAILED'}
          python -c "import json;x=json.load(open('t29-TRAIN-feasibility.json',encoding='utf-8-sig'));assert x['status']=='PASS_TRAIN_ONLY_DEV_UNOPENED' and x['TRAIN_cases']==40 and x['DEV_generated']==0 and x['TRUE_hidden_worlds_retained']==40 and x['counterfactual_queries']==120 and x['exact_learned_equals_strong_control_queries']==120 and 0.20<=x['ambiguity_fraction']<=0.85 and x['universally_proven_nontrivial_separators']>=8 and x['training_from_public_only'] and not x['scientific_positive'] and not x['optimizer_admission'] and not x['old_DEV_replayed'];print('T29_NEW_CAUSAL_GRAMMAR_TRAIN_GATE=PASS');print('T29_TRAIN_EVIDENCE='+json.dumps(x,sort_keys=True))"
          if($LASTEXITCODE -ne 0){throw 'T29_FROZEN_HEADROOM_OR_SOUNDNESS_REJECTED'}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: t29-new-grammar-TRAIN-${{ matrix.os }}
          path: t29-TRAIN-feasibility.json
          if-no-files-found: ignore
          retention-days: 90
