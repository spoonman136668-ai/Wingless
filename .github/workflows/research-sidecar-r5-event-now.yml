name: Research Sidecar R5 Event Now

on:
  push:
    branches:
      - ops/research-autonomy-provider-probe-r1
    paths:
      - '.github/workflows/research-sidecar-r5-event-now.yml'

permissions:
  contents: read

jobs:
  event:
    runs-on: [self-hosted, Windows, X64, wingless-research-safe]
    timeout-minutes: 5
    steps:
      - name: Read latest controller event
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $Db='C:\ProgramData\CKBR\research-sidecar\state\research-sidecar.db'
          if(-not(Test-Path -LiteralPath $Db -PathType Leaf)){throw 'DB_MISSING'}
          $Dir=Join-Path $env:RUNNER_TEMP 'r5event'
          Remove-Item -LiteralPath $Dir -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $Dir|Out-Null
          $Main=@'
          package main
          import (
            "database/sql"
            "fmt"
            "os"
            _ "modernc.org/sqlite"
          )
          func main(){
            if len(os.Args)!=2 { panic("db path required") }
            db,err:=sql.Open("sqlite","file:"+os.Args[1]+"?mode=ro")
            if err!=nil { panic(err) }
            defer db.Close()
            rows,err:=db.Query("SELECT id,cycle_id,cause_key,state,CAST(raw AS TEXT) FROM research_controller_events ORDER BY created,id")
            if err!=nil { panic(err) }
            defer rows.Close()
            for rows.Next(){
              var id,cycle,cause,state,raw string
              if err:=rows.Scan(&id,&cycle,&cause,&state,&raw);err!=nil{panic(err)}
              fmt.Printf("event id=%s cycle=%s cause=%s state=%s raw=%s\n",id,cycle,cause,state,raw)
            }
            for _,t:=range []string{"research_sidecar_results","research_implementation_bundles","research_implementation_freezes"}{
              var exists,n int
              if err:=db.QueryRow("SELECT count(*) FROM sqlite_master WHERE type='table' AND name=?",t).Scan(&exists);err!=nil{panic(err)}
              if exists!=0 {
                if err:=db.QueryRow("SELECT count(*) FROM "+t).Scan(&n);err!=nil{panic(err)}
              }
              fmt.Printf("%s_count=%d\n",t,n)
            }
          }
'@
          $GoMod=@'
          module r5event

          go 1.25.5

          require modernc.org/sqlite v1.34.5
'@
          [IO.File]::WriteAllText((Join-Path $Dir 'main.go'),$Main,(New-Object Text.UTF8Encoding($false)))
          [IO.File]::WriteAllText((Join-Path $Dir 'go.mod'),$GoMod,(New-Object Text.UTF8Encoding($false)))
          Push-Location $Dir
          try {
            $env:GOFLAGS='-buildvcs=false'
            & go run -mod=mod . $Db
            if($LASTEXITCODE-ne0){throw "DB_PROBE_FAILED exit=$LASTEXITCODE"}
          } finally { Pop-Location }
          Write-Host 'RESEARCH_SIDECAR_R5_EVENT_NOW=PASS'
