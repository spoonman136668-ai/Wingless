name: Wingless NCI-04G7 Authentic Source Tasks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: '1.25.5'
          cache: false
      - name: Native source task and conventional controls
        run: go test ./cognition -run '^TestNCI04G7' -count=1 -v
      - name: Verify read-only source checkout
        run: |
          test -z "$(git status --porcelain)"
          echo "NCI04G7_EXACT_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
