name: Research Sidecar R8 Package Recovery

on:
  push:
    branches:
      - ops/research-autonomy-provider-probe-r1
    paths:
      - .github/research-sidecar-r8-recovery-request.json

permissions:
  contents: read

concurrency:
  group: wingless-research-sidecar-lifecycle
  cancel-in-progress: false

jobs:
  recover:
    runs-on: [self-hosted, Windows, X64, wingless-research-safe]
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Archive r7 package failure and clear for exact r8 replay
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference='Stop'
          Set-StrictMode -Version 2.0
          $Root='C:\ProgramData\CKBR\research-sidecar'
          $Lifecycle=Join-Path $Root 'ops\Lifecycle.ps1'
          $Exe=Join-Path $Root 'bin\research-sidecar.exe'
          $Config=Join-Path $Root 'config\autonomy.yaml'
          $State=Join-Path $Root 'state'
          $Db=Join-Path $State 'research-sidecar.db'
          $Archive=Join-Path $Root 'evidence\planner-package-recovery-r7-1'
          $Expected='4c5663ccd3bc7f654f64375299789912c9fed2b9279da8a6d463beca57105cc0'
          $Bootstrap='WINGLESS-LM-LM9C-AUTONOMY-BOOTSTRAP'
          $Request=Get-Content -LiteralPath '.\.github\research-sidecar-r8-recovery-request.json' -Raw|ConvertFrom-Json

          if([string]$Request.schema-cne'ckb-plane.research-sidecar-r8-recovery-request.v1' -or
             -not[bool]$Request.authorize_reset -or
             [long]$Request.live_probe_run_id-ne36656827020 -or
             [string]$Request.expected_current_binary_sha256-cne$Expected){
            throw 'R8_RECOVERY_REQUEST_INVALID'
          }

          $Identity=[Security.Principal.WindowsIdentity]::GetCurrent().Name
          if($Identity-cne'NT AUTHORITY\NETWORK SERVICE'){throw "R8_RECOVERY_IDENTITY_MISMATCH observed=$Identity"}
          foreach($Path in @($Lifecycle,$Exe,$Config,$Db)){
            if(-not(Test-Path -LiteralPath $Path -PathType Leaf)){throw "R8_RECOVERY_PREREQUISITE_MISSING path=$Path"}
          }
          if((Get-FileHash -LiteralPath $Exe -Algorithm SHA256).Hash.ToLowerInvariant()-cne$Expected){
            throw 'R8_RECOVERY_BINARY_HASH_MISMATCH'
          }

          $Raw=& $Exe -mode status -config $Config 2>&1
          if($LASTEXITCODE-ne0){throw "R8_RECOVERY_STATUS_FAILED output=$($Raw -join ' ')"}
          $Status=($Raw -join [Environment]::NewLine)|ConvertFrom-Json
          if([string]$Status.authority-cne'plane' -or
             [string]$Status.generation-cne'1' -or
             [int]$Status.cycle_count-ne1 -or
             [string]$Status.last_cycle_id-cne$Bootstrap -or
             [string]$Status.last_cycle_status-cne'PROPOSAL_VALIDATED' -or
             [int]$Status.blocked_cycle_count-ne0){
            throw 'R8_RECOVERY_BOUNDARY_STATUS_CHANGED'
          }

          & $Lifecycle -Mode stop
          if($LASTEXITCODE-ne0){throw "R8_RECOVERY_STOP_FAILED exit=$LASTEXITCODE"}
          Start-Sleep -Seconds 2
          if(Get-Process -Name 'research-sidecar' -ErrorAction SilentlyContinue){
            throw 'R8_RECOVERY_SIDECAR_PROCESS_STILL_RUNNING'
          }

          if(Test-Path -LiteralPath $Archive){throw 'R8_RECOVERY_ARCHIVE_ALREADY_EXISTS'}
          New-Item -ItemType Directory -Force -Path $Archive|Out-Null
          $Files=@('research-sidecar.db','research-sidecar.db-wal','research-sidecar.db-shm')
          $Hashes=[ordered]@{}
          foreach($Name in $Files){
            $Source=Join-Path $State $Name
            if(Test-Path -LiteralPath $Source -PathType Leaf){
              Copy-Item -LiteralPath $Source -Destination (Join-Path $Archive $Name) -Force
              $Hashes[$Name]=(Get-FileHash -LiteralPath $Source -Algorithm SHA256).Hash.ToLowerInvariant()
            }
          }
          if(-not$Hashes.Contains('research-sidecar.db')){throw 'R8_RECOVERY_ARCHIVE_DB_MISSING'}

          $Receipt=[ordered]@{
            schema='ckb-plane.research-sidecar-package-recovery.v1'
            reason='planner proposal passed generic validation but failed Wingless package validation: WINGLESS_RESEARCH_PACKAGE_INCOMPLETE'
            live_probe_run_id=36656827020
            live_probe_expected_result_count=0
            live_probe_expected_implementation_bundle_count=0
            live_probe_expected_implementation_freeze_count=0
            bootstrap_cycle=$Bootstrap
            binary_sha256=$Expected
            exact_replay_authorized=$true
            experiment_executed=$false
            result_sealed=$false
            implementation_generated=$false
            db_hashes=$Hashes
            archived_at_utc=[DateTimeOffset]::UtcNow.ToString('o')
          }
          [IO.File]::WriteAllText((Join-Path $Archive 'recovery-receipt.json'),($Receipt|ConvertTo-Json -Depth 8),(New-Object Text.UTF8Encoding($false)))
          foreach($Name in $Files){
            Remove-Item -LiteralPath (Join-Path $State $Name) -Force -ErrorAction SilentlyContinue
          }
          if(Test-Path -LiteralPath $Db){throw 'R8_RECOVERY_DB_CLEAR_FAILED'}

          Write-Host "archive=$Archive"
          Write-Host 'exact_replay_authorized=True'
          Write-Host 'RESEARCH_SIDECAR_R8_PACKAGE_RECOVERY=PASS'
