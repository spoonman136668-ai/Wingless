name: Wingless research autonomy dispatcher

on:
  workflow_run:
    workflows:
      - Wingless research Windows qualification
    types:
      - completed

permissions:
  actions: read
  contents: write

concurrency:
  group: wingless-research-autonomy-dispatch-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  dispatch:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      startsWith(github.event.workflow_run.head_branch, 'research/wingless-up')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Dispatch pre-staged successor
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          PARENT_BRANCH: ${{ github.event.workflow_run.head_branch }}
          PARENT_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, io, json, os, sys, urllib.error, urllib.parse, urllib.request, zipfile

          token=os.environ["GH_TOKEN"]
          repo=os.environ["REPO"]
          run_id=os.environ["RUN_ID"]
          parent_branch=os.environ["PARENT_BRANCH"]
          parent_sha=os.environ["PARENT_SHA"]
          api=f"https://api.github.com/repos/{repo}"

          def request(method, url, body=None, accept="application/vnd.github+json"):
              data=None if body is None else json.dumps(body).encode()
              req=urllib.request.Request(
                  url, data=data, method=method,
                  headers={
                      "Authorization":f"Bearer {token}",
                      "Accept":accept,
                      "X-GitHub-Api-Version":"2026-03-10",
                      "Content-Type":"application/json",
                      "User-Agent":"wingless-research-autonomy/1",
                  })
              try:
                  with urllib.request.urlopen(req, timeout=60) as r:
                      raw=r.read()
                      return r.status, raw, r.headers
              except urllib.error.HTTPError as e:
                  return e.code, e.read(), e.headers

          def get_content(path, ref):
              q=urllib.parse.urlencode({"ref":ref})
              status,raw,_=request("GET",f"{api}/contents/{urllib.parse.quote(path, safe='/')}?{q}")
              if status==404:
                  return None
              if status!=200:
                  raise SystemExit(f"CONTENT_GET_FAILED path={path} ref={ref} status={status} body={raw[:300]!r}")
              obj=json.loads(raw)
              data=base64.b64decode(obj["content"])
              return obj,data

          plan_item=get_content(".wingless/autonomy-next.json", parent_branch)
          if plan_item is None:
              print("AUTONOMY_NO_PRESTAGED_SUCCESSOR")
              raise SystemExit(3)
          plan_meta,plan_bytes=plan_item
          plan=json.loads(plan_bytes.decode("utf-8-sig"))
          if plan.get("schema")!="wingless.research-autonomy-next.v1":
              raise SystemExit("AUTONOMY_PLAN_SCHEMA_MISMATCH")
          if plan.get("enabled") is not True:
              print("AUTONOMY_PLAN_DISABLED")
              raise SystemExit(0)
          if plan.get("parent_run_head_sha")!=parent_sha:
              raise SystemExit(f"AUTONOMY_PARENT_SHA_MISMATCH expected={plan.get('parent_run_head_sha')} actual={parent_sha}")

          artifacts_status, artifacts_raw,_=request("GET",f"{api}/actions/runs/{run_id}/artifacts")
          if artifacts_status!=200:
              raise SystemExit(f"AUTONOMY_ARTIFACT_LIST_FAILED status={artifacts_status}")
          artifacts=json.loads(artifacts_raw).get("artifacts",[])
          candidates=[a for a in artifacts if a.get("name","").startswith("wingless-research-") and not a.get("expired")]
          if not candidates:
              raise SystemExit("AUTONOMY_QUALIFICATION_ARTIFACT_MISSING")
          art=max(candidates,key=lambda x:x["id"])
          st,zip_raw,_=request("GET",art["archive_download_url"],accept="application/octet-stream")
          if st!=200:
              raise SystemExit(f"AUTONOMY_ARTIFACT_DOWNLOAD_FAILED status={st}")
          with zipfile.ZipFile(io.BytesIO(zip_raw)) as z:
              probe=json.loads(z.read("probe.json").decode("utf-8-sig"))
          classification=probe.get("classification")
          if not classification:
              raise SystemExit("AUTONOMY_CLASSIFICATION_MISSING")

          routes=plan.get("routes") or {}
          route=routes.get(classification) or routes.get("*")
          if not isinstance(route,dict):
              raise SystemExit(f"AUTONOMY_ROUTE_MISSING classification={classification}")

          successor=route.get("successor_branch","")
          pending_path=route.get("pending_request_path",".wingless/qualification-request.pending.json")
          if not successor.startswith("research/wingless-up"):
              raise SystemExit("AUTONOMY_SUCCESSOR_BRANCH_INVALID")

          pending_item=get_content(pending_path, successor)
          if pending_item is None:
              raise SystemExit("AUTONOMY_PENDING_REQUEST_MISSING")
          _,pending_bytes=pending_item
          pending=json.loads(pending_bytes.decode("utf-8-sig"))
          if pending.get("schema")!="wingless.research-qualification-request.v1":
              raise SystemExit("AUTONOMY_PENDING_SCHEMA_MISMATCH")
          if pending.get("branch")!=successor:
              raise SystemExit("AUTONOMY_PENDING_BRANCH_MISMATCH")
          if not str(pending.get("experiment","")).startswith("UP-"):
              raise SystemExit("AUTONOMY_PENDING_EXPERIMENT_INVALID")
          if not str(pending.get("test_script","")).startswith("scripts/Test-"):
              raise SystemExit("AUTONOMY_PENDING_TEST_INVALID")

          active_item=get_content(".wingless/qualification-request.json", successor)
          if active_item is None:
              raise SystemExit("AUTONOMY_ACTIVE_REQUEST_MISSING")
          active_meta,active_bytes=active_item
          canonical=(json.dumps(pending,indent=2)+"\n").encode()
          if active_bytes==canonical:
              print(f"AUTONOMY_ALREADY_DISPATCHED branch={successor} experiment={pending['experiment']}")
              raise SystemExit(0)

          body={
              "message":f"research: autonomous dispatch {pending['experiment']}",
              "content":base64.b64encode(canonical).decode(),
              "sha":active_meta["sha"],
              "branch":successor,
          }
          st,raw,_=request("PUT",f"{api}/contents/.wingless/qualification-request.json",body)
          if st not in (200,201):
              raise SystemExit(f"AUTONOMY_DISPATCH_WRITE_FAILED status={st} body={raw[:300]!r}")
          print(json.dumps({
              "schema":"wingless.research-autonomy-dispatch.v1",
              "parent_branch":parent_branch,
              "parent_sha":parent_sha,
              "classification":classification,
              "successor_branch":successor,
              "successor_experiment":pending["experiment"],
              "status":"DISPATCHED",
          },sort_keys=True))
          PY
