name: Wingless marginal signal allocation attribution R21
on:
  push:
    branches:
      - research/external-hosted-wingless-future-data-marginal-signal-allocation-attribution-r21
    paths:
      - 'docs/experiments/wlm-lm-external-future-data-marginal-signal-allocation-attribution-r21.json'
      - 'unitary/wlm_lm_external_future_data_marginal_signal_allocation_attribution_r21.go'
      - 'cmd/wlm-lm-external-future-data-marginal-signal-allocation-attribution-r21/main.go'
      - '.github/workflows/external-future-data-marginal-signal-allocation-attribution-r21.yml'
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Validate frozen package
        shell: bash
        run: |
          set -euo pipefail
          prereg="c057abfb6cc6e3ba02be1c2150301ac38e4bca95"
          parent="0c125544164b028516f1470238779fe633645256"
          pp="docs/experiments/wlm-lm-external-future-data-marginal-signal-allocation-attribution-r21.json"
          test "$(git rev-parse "$prereg^")" = "$parent"
          git merge-base --is-ancestor "$prereg" HEAD
          changed="$(git diff --name-only "$parent..HEAD" | sort)"
          expected="$(printf '%s\n'             '.github/workflows/external-future-data-marginal-signal-allocation-attribution-r21.yml'             'cmd/wlm-lm-external-future-data-marginal-signal-allocation-attribution-r21/main.go'             'unitary/wlm_lm_external_future_data_marginal_signal_allocation_attribution_r21.go'             "$pp" | sort)"
          test "$changed" = "$expected"
      - name: Verify READY_RESEARCH receipt
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib,json,pathlib
          raw=r'''{"schema":"ckb-plane.external-exposure-ready-research-receipt.v1","project":"Wingless","experiment":"WLM-LM-EXTERNAL-FUTURE-DATA-MARGINAL-SIGNAL-ALLOCATION-ATTRIBUTION-R21","preregistration_sha":"c057abfb6cc6e3ba02be1c2150301ac38e4bca95","research_host":"runnervm8df0l","runner_id":"GitHub Actions 1000001859","manifest_sha256":"e46907e74ce92564bab657afc8d28b1a39b269bac88fb9b21092716c7ff53cb7","plan_decision":{"schema":"ckb-plane.external-exposure.v1","disposition":"READY_PLAN","scope":"plan-only","reasons":null},"fetch_decision":{"schema":"ckb-plane.external-exposure-fetch.v1","disposition":"READY_FETCH","scope":"fetch-verify-only","reasons":null},"research_decision":{"schema":"ckb-plane.external-exposure-research.v1","disposition":"READY_RESEARCH","scope":"research-consume-once","reasons":null},"ckb_plane_main_sha":"2518306c74ff426278f31b1199f8ad9891299d14"}'''
          assert hashlib.sha256(raw.encode()).hexdigest()=="7ec901332da98d482b9f50fbfa9e43b61e07cf13c3ac62312e373f114478b3b6"
          r=json.loads(raw)
          assert r["preregistration_sha"]=="c057abfb6cc6e3ba02be1c2150301ac38e4bca95"
          assert r["manifest_sha256"]=="e46907e74ce92564bab657afc8d28b1a39b269bac88fb9b21092716c7ff53cb7"
          assert r["ckb_plane_main_sha"]=="2518306c74ff426278f31b1199f8ad9891299d14"
          assert r["research_decision"]["disposition"]=="READY_RESEARCH"
          pathlib.Path("/tmp/authority.json").write_text(raw)
          PY
      - name: Fetch exact third-manifest sources
        shell: bash
        run: |
          set -euo pipefail
          export EXTERNAL_ROOT="$RUNNER_TEMP/wingless-r21"; mkdir -p "$EXTERNAL_ROOT"
          python3 - <<'PY'
          import hashlib,os,pathlib,urllib.request
          sources=[
            ("code","https://raw.githubusercontent.com/torvalds/linux/a74306e2e676f9775457366fc047a660fbf02f26/kernel/sched/core.c","9297982652b9810b3508993c06d3c6e097ebca5cbe1ef3a6246bccfa0c1128b1",303863,41453,"50744a9e70d67d62c97f3f434f4f05788b6b8514c6bce46cf7dafbaf49e2abff"),
            ("structured","https://raw.githubusercontent.com/SchemaStore/schemastore/de76181a2ab215431d3e9314bc14f83cc3b01ad2/src/schemas/json/github-workflow.json","d10c9f4656e1bd5bc6727e9b35080e017dc167154726fca93da33c7a6bd1c4f3",118601,14365,"2a97ba02bc5e479b1738f6f0c3e09318bb5a255350c84de014ddbcebea46af56"),
            ("technical-prose","https://raw.githubusercontent.com/rust-lang/book/1500248d8f230566e4ec9f27fcbb8fe9e2898ab1/src/ch01-03-hello-cargo.md","61369f359b84b646fc3773eb569a26bc18ba6edb4cf2be06a84472c7054c0e39",11025,1454,"23c002a1984ed065abfdbafa82100ed54d6bf6276a947676e710a30c75d96017"),
          ]
          root=pathlib.Path(os.environ["EXTERNAL_ROOT"])
          for d,u,full_h,full_n,prefix_n,prefix_h in sources:
              b=urllib.request.urlopen(urllib.request.Request(u,headers={"User-Agent":"wingless-r21"}),timeout=30).read(full_n+1)
              assert len(b)==full_n and hashlib.sha256(b).hexdigest()==full_h
              p=b[:prefix_n]
              assert len(p)==prefix_n and hashlib.sha256(p).hexdigest()==prefix_h
              (root/(d+".bin")).write_bytes(p)
          PY
          echo "EXTERNAL_ROOT=$EXTERNAL_ROOT" >> "$GITHUB_ENV"
      - name: Full Go regression
        run: go test ./... -count=1
      - name: Run frozen attribution twice
        shell: bash
        run: |
          set -euo pipefail
          go run ./cmd/wlm-lm-external-future-data-marginal-signal-allocation-attribution-r21 --code "$EXTERNAL_ROOT/code.bin" --structured "$EXTERNAL_ROOT/structured.bin" --technical-prose "$EXTERNAL_ROOT/technical-prose.bin" > /tmp/result1.json
          go run ./cmd/wlm-lm-external-future-data-marginal-signal-allocation-attribution-r21 --code "$EXTERNAL_ROOT/code.bin" --structured "$EXTERNAL_ROOT/structured.bin" --technical-prose "$EXTERNAL_ROOT/technical-prose.bin" > /tmp/result2.json
          cmp /tmp/result1.json /tmp/result2.json
          cat /tmp/result1.json
      - name: Classify
        shell: bash
        run: |
          python3 - <<'PY'
          import json,math,pathlib
          r=json.loads(pathlib.Path("/tmp/result1.json").read_text());m=r["metrics"]
          valid=(m["source_identity_mismatch_count"]==0 and m["total_source_bytes"]==57272 and
            m["non_target_training_byte_budget_per_arm"]==15819 and m["motif_capacity"]==256 and
            m["target_evaluation_bytes_per_arm"]==582 and m["target_adaptation_reservoir_bytes_per_arm"]==872 and
            m["signal_weight_baseline_argmax_change"]==1 and m["signal_weight_motif_churn"]==3 and
            m["signal_weight_retained_best_change"]==0 and m["signal_evaluation_byte_use_count"]==0 and
            m["signal_evaluation_label_use_count"]==0 and m["signal_post_result_choice_count"]==0 and
            m["capacity_growth_event_count"]==0 and m["invalid_row_count"]==0 and all(math.isfinite(float(v)) for v in m.values()))
          supported=(valid and m["structured_436_581_gain"]==0 and m["structured_436_581_rank_signal"]==0 and
            m["technical_prose_581_726_gain"]==0 and m["technical_prose_581_726_rank_signal"]>0 and
            m["technical_prose_581_726_baseline_argmax_change_count"]>0 and
            m["technical_prose_581_726_motif_churn_count"]==0 and
            m["technical_prose_581_726_retained_best_change_count"]==0)
          mixed=(valid and m["technical_prose_581_726_gain"]==0 and m["technical_prose_581_726_rank_signal"]>0)
          cls="supported" if supported else ("mixed" if mixed else ("negative" if valid else "invalid"))
          out={"schema":"wingless.research-classification.v1","experiment":"WLM-LM-EXTERNAL-FUTURE-DATA-MARGINAL-SIGNAL-ALLOCATION-ATTRIBUTION-R21","classification":cls,"validity_pass":valid,"authority_receipt_sha256":"7ec901332da98d482b9f50fbfa9e43b61e07cf13c3ac62312e373f114478b3b6","metrics":m}
          pathlib.Path("/tmp/classification.json").write_text(json.dumps(out,separators=(",",":")));print(json.dumps(out,separators=(",",":")))
          if not valid: raise SystemExit(2)
          PY
      - name: Delete external bytes
        if: always()
        run: rm -rf "$RUNNER_TEMP/wingless-r21"
      - name: Upload evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: wingless-marginal-signal-allocation-attribution-r21
          path: |
            /tmp/authority.json
            /tmp/result1.json
            /tmp/result2.json
            /tmp/classification.json
          if-no-files-found: error
