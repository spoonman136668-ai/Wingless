name: W-R71 frozen learned dual-phase readout
on:
  push:
    branches: [research/w-r71-dual-phase-learned-readout-20261014-r1]
permissions:
  contents: read
jobs:
  science:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Exact immutable identity and known source nonintersection
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 75c69c5a631a3184149823909dcd11ec95f722ea HEAD
          test "$(git hash-object research/contrib/chatgpt/20261014-w-r70-r3-learned-phase/execute.py)" = 4bbc58c56dcc35ae66e2d47547a2b96868889635
          test "$(git hash-object research/contrib/chatgpt/20261014-w-r71-dual-phase/execute.py)" = 3ef8e97850043b126da1118eda17c773d9a68c32
          test "$(git hash-object research/contrib/chatgpt/20261014-w-r71-dual-phase/prereg.json)" = cb6587c60e5d24ba2975072e69f67ff7dc8e4f72
          python3 -m py_compile research/contrib/chatgpt/20261014-w-r71-dual-phase/execute.py
          python3 -m json.tool research/contrib/chatgpt/20261014-w-r71-dual-phase/prereg.json >/dev/null
          python3 - <<'PY'
          import json
          p=json.load(open("research/contrib/chatgpt/20261014-w-r71-dual-phase/prereg.json"))
          s=set(range(*p["sealed_heldout_seeds"]))
          assert len(s)==16
          for a,b in ((12672,12688),(13312,13328),(13344,13360),(13424,13440)):
              assert s.isdisjoint(range(a,b))
          print("KNOWN_SEALED_NONOVERLAP=PASS")
          PY
      - name: Development-only fitting before sealed access
        run: |
          set -euo pipefail
          python3 -B - <<'PY'
          import importlib.util
          s=importlib.util.spec_from_file_location("w71_dev","research/contrib/chatgpt/20261014-w-r71-dual-phase/execute.py")
          assert s and s.loader
          m=importlib.util.module_from_spec(s)
          s.loader.exec_module(m)
          models=m.fit()
          assert len(models)==9 and all(v["examples"]==1728 and len(v["weights"])==16 for v in models.values())
          print("DEVELOPMENT_ONLY_9_FITS_PASS")
          PY
      - name: Single original heldout first-use
        run: |
          set -euo pipefail
          python3 -B research/contrib/chatgpt/20261014-w-r71-dual-phase/execute.py > /tmp/W-R71-original.json
          python3 -m json.tool /tmp/W-R71-original.json >/dev/null
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: W-R71-original-evidence
          path: /tmp/W-R71-original.json
          if-no-files-found: error
          retention-days: 90
      - name: Verify frozen scientific result after durable artifact
        run: |
          python3 - <<'PY'
          import json
          a=json.load(open("/tmp/W-R71-original.json"))
          assert len(a["all_heldout_records"])==6912
          assert a["sealed_heldout_seeds"]==list(range(14336,14352))
          assert a["classification"] in ("DUAL_PHASE_ROBUST_LEARNED_READOUT","PARTIAL_DUAL_PHASE_READOUT","NO_DUAL_PHASE_ROBUSTNESS")
          assert a["model_calls"]==0 and a["accepted_ref_mutation"] is False
          print("CLASSIFICATION",a["classification"])
          print("ACCURACIES",a["aggregate_accuracy"])
          PY
      - name: One final full Wingless regression and build
        run: go test ./... && go build ./...
