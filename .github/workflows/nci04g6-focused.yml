name: Wingless NCI-04G6 Focused
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: '1.25.5'
          cache: false
      - name: Native learning, source and equal-information controls
        env:
          NCI04L5B_ARTIFACT_ROOT: ${{ runner.temp }}/wingless-nci04l5b-state
          NCI04L5B_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: go test ./cognition -run '^TestNCI04(G[56]|L5B)' -count=1 -v
      - name: Verify clean exact source
        run: |
          test -z "$(git status --porcelain)"
          echo "NCI04G6_EXACT_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: wingless-nci04l5b-sourcefree-checkpoint
          path: ${{ runner.temp }}/wingless-nci04l5b-state/
          if-no-files-found: error
          retention-days: 30
