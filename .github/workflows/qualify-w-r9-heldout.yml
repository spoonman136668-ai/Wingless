name: Wingless W-R9 disjoint heldout science
on:
  push:
    branches: [research/w-r9-heldout-temporal-transfer-r1]
permissions:
  contents: read
jobs:
  science:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Exact frozen predecessor
        run: git merge-base --is-ancestor 3d26a66a39e0d12794f34c8ba286becae42cb28b HEAD
      - name: Original finite frozen transfer experiment
        run: |
          set -euo pipefail
          python3 -B research/contrib/chatgpt/20261012-w-r9-heldout-transfer/execute.py > "$RUNNER_TEMP/W-R9.json"
          python3 -m json.tool "$RUNNER_TEMP/W-R9.json"
      - uses: actions/upload-artifact@v4
        with:
          name: W-R9-original-disjoint-heldout
          path: ${{ runner.temp }}/W-R9.json
          retention-days: 90
          if-no-files-found: error
      - name: Full repository regression
        run: go test ./... && go build ./...
