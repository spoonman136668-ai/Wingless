name: W-F28 corroborating three independent anchored relationship witnesses
on:
  push:
    branches: [research/w-f28-multisource-relational-corroboration-20261015-r1]
permissions:
  contents: read
jobs:
  science:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-go@v5
        with: {go-version-file: go.mod}
      - name: Freeze prior original and preflight new source
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 86af22a4e9958826227b11749a6901c9ae84fe8a HEAD
          test "$(git hash-object unitary/f27_intervention_corroboration.go)" = "$(git rev-parse 86af22a4e9958826227b11749a6901c9ae84fe8a:unitary/f27_intervention_corroboration.go)"
          python3 -m json.tool research/foundational/20261015-w-f28/prereg.json >/dev/null
          go test -run '^$' ./unitary ./cmd/f28-wingless
      - name: First prospective W-F28 source original
        run: |
          set -euo pipefail
          go run ./cmd/f28-wingless > /tmp/w-f28-original.json
          python3 -m json.tool /tmp/w-f28-original.json >/dev/null
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: W-F28-original-three-source-relational-corroboration
          path: /tmp/w-f28-original.json
          if-no-files-found: error
          retention-days: 90
      - name: Independently audit new original source and competitor rows
        run: |
          python3 - <<'PY'
          import json,collections
          d=json.load(open('/tmp/w-f28-original.json'))
          assert d['stage']=='DEVELOPMENT_ONLY' and d['graphs']==96 and d['questions']==768
          assert d['native_state_bytes']==576
          assert d['training_only_positive_negative_pairs']==768
          assert d['source_relational_witness_count']==3 and d['learned_relational_agreement_weights']==8
          assert d['impostors_share_one_independent_anchor_relation']
          assert not d['actual_query_candidate_pairs_supplied'] and d['all_graph_edge_endpoint_pairs_enumerated_in_code']
          assert not d['independently_born_source'] and not d['sealed_first_use'] and not d['accepted_ref_mutation']
          assert collections.Counter(r['Family'] for r in d['rows'])=={108:192,109:192,110:192,111:192}
          assert collections.Counter(r['Variant'] for r in d['rows'])==dict.fromkeys(range(8),96)
          assert all(r['Truth']==[True,True,False,False,True,True,False,True][r['Variant']] for r in d['rows'])
          for arm,col in [('learned','Learned'),('none','NoLinks'),('fixed_distance','FixedDistance'),
             ('strict_distance','StrictDistance'),('static_only','StaticOnly'),('causal_fixed','CausalFixed'),
             ('consensus','Consensus'),('coded_oracle','CodedUpper')]:
            s=d['scores'][arm]
            assert s['correct']==sum(r[col]['answer']==r['Truth'] for r in d['rows'])
            assert s['fp']==sum(r[col]['answer'] for r in d['rows'] if not r['Truth'])
            assert s['fn']==sum(not r[col]['answer'] for r in d['rows'] if r['Truth'])
          assert d['scores']['coded_oracle']['correct']==768
          assert d['registered_verdict'] in ('INVALID_F28_SOURCE_ORACLE',
             'DEVELOPMENT_RELATIONAL_CONSENSUS_LEARNED_GAIN','DEVELOPMENT_RELATIONAL_CONSENSUS_NO_QUALIFIED_GAIN')
          print('W_F28_VERDICT',d['registered_verdict'],d['scores'])
          PY
      - name: One complete Go regression and build
        run: go test ./... && go build ./...
