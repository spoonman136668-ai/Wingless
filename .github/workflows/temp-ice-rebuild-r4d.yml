name: Temporary ICE rebuild R4d
on:
  push:
    branches:
      - repair/proxy-auto-fanout-r4
    paths:
      - '.github/workflows/temp-ice-rebuild-r4d.yml'

permissions:
  contents: read

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.5'
          cache: false
      - name: Rebuild final ICE tree
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/temp-ice-rebuild-r4d.yml
          go run -buildvcs=false ./cmd/ice build
          go run -buildvcs=false ./cmd/ice validate
          echo ICE_R4D_REBUILD=PASS
      - uses: actions/upload-artifact@v4
        with:
          name: wingless-ice-r4d
          path: .ice/
          include-hidden-files: true
          retention-days: 1
