name: Temporary ICE rebuild R4d
on:
  push:
    branches:
      - repair/proxy-auto-fanout-r4
    paths:
      - '.github/workflows/temp-ice-rebuild-r4d.yml'

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/proxy-auto-fanout-r4
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.5'
          cache: false
      - name: Seal canonical final ICE tree
        shell: bash
        run: |
          set -euo pipefail
          start="$(git rev-parse HEAD)"
          test "$start" = "$GITHUB_SHA"
          git fetch origin repair/proxy-auto-fanout-r4
          test "$(git rev-parse FETCH_HEAD)" = "$start"

          rm -f .github/workflows/temp-ice-rebuild-r4d.yml
          go run -buildvcs=false ./cmd/ice build
          go run -buildvcs=false ./cmd/ice validate

          mapfile -t changed < <({ git diff --name-only; git ls-files --deleted; } | sort -u)
          test "${#changed[@]}" -gt 0
          for p in "${changed[@]}"; do
            case "$p" in
              .ice/manifest.json|.ice/architecture-map.json|.ice/symbol-map.json|.ice/dependency-map.json|.ice/test-map.json|.ice/implementations.json|.ice/integration-seams.json|.ice/decisions.json|.github/workflows/temp-ice-rebuild-r4d.yml) ;;
              *) echo "ICE_R4D_SCOPE_WIDENED:$p" >&2; exit 1 ;;
            esac
          done

          git config user.name 'wingless-ice-rebuild'
          git config user.email 'wingless-ice-rebuild@users.noreply.github.com'
          git add -- .ice .github/workflows/temp-ice-rebuild-r4d.yml
          git commit -m 'chore: rebuild canonical ICE after proxy R4d'
          git fetch origin repair/proxy-auto-fanout-r4
          test "$(git rev-parse FETCH_HEAD)" = "$start"
          git push origin HEAD:refs/heads/repair/proxy-auto-fanout-r4
          echo ICE_R4D_SEALED=PASS
