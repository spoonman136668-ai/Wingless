name: One-shot Mind-Palace Oct1 Catch-up via Wingless Runner

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/one-shot-mind-palace-oct1-catchup.yml'

permissions:
  contents: read

jobs:
  catchup:
    runs-on: [self-hosted, Windows, X64, wingless-up-b]
    timeout-minutes: 20
    steps:
      - name: Apply bounded Mind-Palace Oct1 chat delta
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $Root = Join-Path $env:USERPROFILE 'GolandProjects\Mind-Palace'
          $Base = '783c91629e127935edf8a608f75fbfa2a45d1a07'
          $Staged = 'aeff5480b3b00f21593b452c85ab62dbc0537bd7'
          $StageRef = 'chatgpt/catchup-20261001-r1'
          $ManifestRel = 'pilots/chat-history/2026-10-01-catchup-delta-manifest.json'
          $Through = '2026-10-01T20:45:00.0000000+00:00'

          if (-not (Test-Path -LiteralPath $Root -PathType Container)) {
              throw "MIND_PALACE_ROOT_MISSING: $Root"
          }

          $Dirty = @(& git -C $Root status --porcelain=v1 --untracked-files=all)
          if ($LASTEXITCODE -ne 0) { throw 'MIND_PALACE_STATUS_FAILED' }
          if (@($Dirty | Where-Object { -not [string]::IsNullOrWhiteSpace($_) }).Count -ne 0) {
              throw "MIND_PALACE_WORKTREE_DIRTY: $($Dirty -join ' ')"
          }

          & git -C $Root fetch origin main $StageRef
          if ($LASTEXITCODE -ne 0) { throw 'MIND_PALACE_FETCH_FAILED' }

          $RemoteMain = (& git -C $Root rev-parse origin/main).Trim().ToLowerInvariant()
          $RemoteStage = (& git -C $Root rev-parse "origin/$StageRef").Trim().ToLowerInvariant()
          if ($RemoteMain -cne $Base) {
              throw "MIND_PALACE_MAIN_DRIFT expected=$Base observed=$RemoteMain"
          }
          if ($RemoteStage -cne $Staged) {
              throw "MIND_PALACE_STAGE_DRIFT expected=$Staged observed=$RemoteStage"
          }

          & git -C $Root merge-base --is-ancestor $Base $Staged
          if ($LASTEXITCODE -ne 0) {
              throw "MIND_PALACE_STAGE_NOT_DESCENDANT base=$Base staged=$Staged"
          }

          & git -C $Root checkout main
          if ($LASTEXITCODE -ne 0) { throw 'MIND_PALACE_CHECKOUT_MAIN_FAILED' }
          & git -C $Root reset --hard $Base
          if ($LASTEXITCODE -ne 0) { throw 'MIND_PALACE_RESET_BASE_FAILED' }
          & git -C $Root merge --ff-only $Staged
          if ($LASTEXITCODE -ne 0) { throw 'MIND_PALACE_STAGE_FAST_FORWARD_FAILED' }

          & git -C $Root push origin HEAD:main
          if ($LASTEXITCODE -ne 0) { throw 'MIND_PALACE_STAGE_PUSH_FAILED' }
          & git -C $Root fetch origin main --quiet
          if ($LASTEXITCODE -ne 0) { throw 'MIND_PALACE_POST_STAGE_FETCH_FAILED' }
          $RemoteAfterStage = (& git -C $Root rev-parse origin/main).Trim().ToLowerInvariant()
          if ($RemoteAfterStage -cne $Staged) {
              throw "MIND_PALACE_STAGE_REMOTE_MISMATCH expected=$Staged observed=$RemoteAfterStage"
          }

          $Manifest = Join-Path $Root ($ManifestRel -replace '/', '\')
          $DeltaTool = Join-Path $Root 'tools\chat-delta-ingest.ps1'
          $SnapshotTool = Join-Path $Root 'tools\remote-snapshot.ps1'
          $CheckpointTool = Join-Path $Root 'tools\update-checkpoint.ps1'
          $FullRegression = Join-Path $Root 'tests\Test-All.ps1'

          $ApplyStarted = $false
          $CheckpointCommitted = $false
          $RollbackPath = $null

          try {
              $ValidateRaw = (& powershell.exe -NoProfile -ExecutionPolicy Bypass -File $DeltaTool validate -ManifestPath $Manifest | Out-String).Trim()
              if ($LASTEXITCODE -ne 0) { throw "CHAT_DELTA_VALIDATE_FAILED: $ValidateRaw" }
              $Validate = $ValidateRaw | ConvertFrom-Json
              if ([string]$Validate.schema -ne 'mind-palace.chat-delta-validation.v1' -or -not [bool]$Validate.valid) {
                  throw 'CHAT_DELTA_VALIDATION_NOT_GREEN'
              }
              if (-not [bool]$Validate.coverage_complete -or [bool]$Validate.plane_runtime_touched -or [bool]$Validate.retrieval_code_changed) {
                  throw 'CHAT_DELTA_VALIDATION_BOUNDARY_FAILED'
              }

              $PrepareRaw = (& powershell.exe -NoProfile -ExecutionPolicy Bypass -File $DeltaTool prepare -ManifestPath $Manifest | Out-String).Trim()
              if ($LASTEXITCODE -ne 0) { throw "CHAT_DELTA_PREPARE_FAILED: $PrepareRaw" }
              $Prepare = $PrepareRaw | ConvertFrom-Json
              if ([string]$Prepare.status -ne 'ready' -or [bool]$Prepare.live_durable_store_mutated -or [bool]$Prepare.plane_runtime_touched) {
                  throw "CHAT_DELTA_PREPARE_NOT_READY status=$($Prepare.status)"
              }

              $PlanPath = [string]$Prepare.plan_path
              $ApplyRaw = (& powershell.exe -NoProfile -ExecutionPolicy Bypass -File $DeltaTool apply -PlanPath $PlanPath -ConfirmApply | Out-String).Trim()
              if ($LASTEXITCODE -ne 0) { throw "CHAT_DELTA_APPLY_FAILED: $ApplyRaw" }
              $Apply = $ApplyRaw | ConvertFrom-Json
              if ([string]$Apply.schema -ne 'mind-palace.chat-delta-apply-result.v1' -or [string]$Apply.status -ne 'applied') {
                  throw 'CHAT_DELTA_APPLY_NOT_APPLIED'
              }
              if (-not [bool]$Apply.coverage_complete -or [bool]$Apply.plane_runtime_touched -or [bool]$Apply.retrieval_code_changed) {
                  throw 'CHAT_DELTA_APPLY_BOUNDARY_FAILED'
              }
              $ApplyStarted = $true
              $RollbackPath = [string]$Apply.rollback_path

              & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $SnapshotTool -RepoRoot $Root | Out-Null
              if ($LASTEXITCODE -ne 0) { throw 'REMOTE_SNAPSHOT_REGEN_FAILED' }

              & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $FullRegression
              if ($LASTEXITCODE -ne 0) { throw 'MIND_PALACE_FULL_REGRESSION_FAILED' }

              $CheckpointValidateRaw = (& powershell.exe -NoProfile -ExecutionPolicy Bypass -File $CheckpointTool validate | Out-String).Trim()
              if ($LASTEXITCODE -ne 0) { throw "CHECKPOINT_VALIDATE_FAILED: $CheckpointValidateRaw" }
              $CheckpointValidate = $CheckpointValidateRaw | ConvertFrom-Json
              if ([string]$CheckpointValidate.status -ne 'ready' -or -not [bool]$CheckpointValidate.ready -or -not [bool]$CheckpointValidate.retrieval_quality_gate) {
                  throw 'CHECKPOINT_NOT_READY'
              }

              $Message = 'checkpoint: ingest chat delta through 2026-10-01T20:45:00Z'
              $CheckpointRaw = (& powershell.exe -NoProfile -ExecutionPolicy Bypass -File $CheckpointTool commit -Message $Message -ConfirmCheckpoint | Out-String).Trim()
              if ($LASTEXITCODE -ne 0) { throw "CHECKPOINT_COMMIT_FAILED: $CheckpointRaw" }
              $Checkpoint = $CheckpointRaw | ConvertFrom-Json
              if ([string]$Checkpoint.status -ne 'committed' -or -not [bool]$Checkpoint.committed -or -not [bool]$Checkpoint.pushed -or -not [bool]$Checkpoint.remote_main_verified) {
                  throw 'CHECKPOINT_COMMIT_NOT_VERIFIED'
              }
              $CheckpointCommitted = $true

              $State = Get-Content -LiteralPath (Join-Path $Root '.ice\chat-delta-state.json') -Raw | ConvertFrom-Json
              if ([DateTimeOffset]::Parse([string]$State.ingest_after_utc).ToUniversalTime().ToString('o') -ne [DateTimeOffset]::Parse($Through).ToUniversalTime().ToString('o')) {
                  throw "CHECKPOINT_CURSOR_MISMATCH expected=$Through observed=$($State.ingest_after_utc)"
              }

              & git -C $Root fetch origin main --quiet
              if ($LASTEXITCODE -ne 0) { throw 'FINAL_FETCH_FAILED' }
              $Head = (& git -C $Root rev-parse HEAD).Trim().ToLowerInvariant()
              $Remote = (& git -C $Root rev-parse origin/main).Trim().ToLowerInvariant()
              if ($Head -cne $Remote) { throw "FINAL_REMOTE_IDENTITY_MISMATCH head=$Head remote=$Remote" }

              $FinalDirty = @(& git -C $Root status --porcelain=v1 --untracked-files=all)
              if (@($FinalDirty | Where-Object { -not [string]::IsNullOrWhiteSpace($_) }).Count -ne 0) {
                  throw "FINAL_WORKTREE_DIRTY: $($FinalDirty -join ' ')"
              }

              Write-Host "MIND_PALACE_OCT1_CATCHUP_PASS commit=$Head through=$Through"
          }
          catch {
              $Original = $_
              if ($ApplyStarted -and -not $CheckpointCommitted -and -not [string]::IsNullOrWhiteSpace($RollbackPath) -and (Test-Path -LiteralPath $RollbackPath -PathType Container)) {
                  try {
                      & git -C $Root restore --staged -- '.ice/records.json' '.ice/source-ledger.json' '.ice/chat-delta-state.json' 'archive/index.json' '.ice/remote-bootstrap.json' '.ice/remote-catalog.json' '.ice/remote-index.ndjson' 2>$null | Out-Null
                      Copy-Item -LiteralPath (Join-Path $RollbackPath 'records.json') -Destination (Join-Path $Root '.ice\records.json') -Force
                      Copy-Item -LiteralPath (Join-Path $RollbackPath 'source-ledger.json') -Destination (Join-Path $Root '.ice\source-ledger.json') -Force
                      Copy-Item -LiteralPath (Join-Path $RollbackPath 'archive-index.json') -Destination (Join-Path $Root 'archive\index.json') -Force
                      Copy-Item -LiteralPath (Join-Path $RollbackPath 'chat-delta-state.json') -Destination (Join-Path $Root '.ice\chat-delta-state.json') -Force
                      & git -C $Root restore --worktree -- '.ice/remote-bootstrap.json' '.ice/remote-catalog.json' '.ice/remote-index.ndjson' | Out-Null
                  }
                  catch {
                      throw "MIND_PALACE_CATCHUP_FAILED_AND_ROLLBACK_FAILED original=$($Original.Exception.Message) rollback=$($_.Exception.Message)"
                  }
              }
              throw $Original
          }
