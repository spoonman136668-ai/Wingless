name: Mind-Palace cross-repo access probe

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/mind-palace-cross-repo-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: [self-hosted, Windows, X64, wingless-up-b]
    steps:
      - name: Probe Mind-Palace repository read
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $Pair = "x-access-token:$env:GH_TOKEN"
          $Basic = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes($Pair))
          $Repo = 'https://github.com/spoonman136668-ai/Mind-Palace.git'
          $Out = & git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $Basic" ls-remote $Repo refs/heads/main 2>&1
          if ($LASTEXITCODE -ne 0) {
            Write-Host 'mind_palace_cross_repo_read=false'
            exit 1
          }
          $Line = ($Out | Select-Object -First 1)
          $Sha = ([string]$Line -split '\s+')[0]
          Write-Host 'mind_palace_cross_repo_read=true'
          Write-Host "mind_palace_main=$Sha"
