name: Recover Wingless stack qualification

on:
  push:
    branches:
      - recovery/wingless-stack-qualification-r1
    paths:
      - '.github/workflows/recover-wingless-stack-qualification.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  recover:
    runs-on: [self-hosted, Windows, X64, wingless-up-c]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery/wingless-stack-qualification-r1
          fetch-depth: 0
          persist-credentials: false

      - name: Qualify immutable observed result without rerun
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference='Stop'

          $Repo=(Resolve-Path '.').Path
          $Parent='7287347f636c7c2aa7c1dc3b804d06a96dd28778'
          $Prereg='28d6f44cf127200465e2786b6a139f1389715225'
          $Scientific='fca6962e124b829505a896232b6c3c134d2fdb9e'
          $Experiment='WLM-SI-STACK-CONTAINER-R1'
          $SourceRun='36940852550'
          $SourceAttempt='7'
          $SourceJob='110656327110'
          $ActiveBranch='research/autonomy-wingless-active'
          $NorthStarSha='efd6172772d76f03ac04bdab0af40941232311def8202d6f0f953d33b3d05dd8'

          foreach($Sha in @($Parent,$Prereg,$Scientific)){
            & git cat-file -e ($Sha+'^{commit}')
            if($LASTEXITCODE-ne0){throw "RECOVERY_COMMIT_MISSING sha=$Sha"}
          }
          if((& git rev-parse ($Prereg+'^')).Trim()-cne$Parent){throw 'PREREG_PARENT_DRIFT'}
          if((& git rev-parse ($Scientific+'^')).Trim()-cne$Prereg){throw 'IMPLEMENTATION_PARENT_DRIFT'}

          $PreregFiles=@(& git diff-tree --no-commit-id --name-only -r $Prereg | Where-Object {$_})
          if($PreregFiles.Count-ne1 -or [string]$PreregFiles[0]-cne'docs/experiments/wlm-si-stack-container-r1.md'){
            throw "PREREG_FILESET_INVALID files=$($PreregFiles -join ',')"
          }
          $ExpectedImpl=@(
            '.wingless/qualification-request.json',
            'cmd/wlm-si-stack-container-r1/main.go',
            'scripts/run-wlm-si-stack-container-r1.ps1',
            'unitary/wlm_si_stack_container_r1.go'
          )
          $ImplFiles=@(& git diff-tree --no-commit-id --name-only -r $Scientific | Where-Object {$_} | Sort-Object)
          $ExpectedImplSorted=@($ExpectedImpl|Sort-Object)
          if(@(Compare-Object $ExpectedImplSorted $ImplFiles).Count-ne0){
            throw "IMPLEMENTATION_FILESET_INVALID files=$($ImplFiles -join ',')"
          }

          $PreregRaw=(& git show ($Prereg+':docs/experiments/wlm-si-stack-container-r1.md')) -join [Environment]::NewLine
          if($LASTEXITCODE-ne0){throw 'PREREG_READ_FAILED'}
          $PreregMatch=[regex]::Match($PreregRaw,'(?s)\x60\x60\x60json\s*(\{.*?\})\s*\x60\x60\x60')
          if(-not$PreregMatch.Success){throw 'PREREG_JSON_MISSING'}
          $P=$PreregMatch.Groups[1].Value|ConvertFrom-Json
          if([string]$P.experiment_id-cne$Experiment){throw "PREREG_EXPERIMENT_DRIFT actual=$($P.experiment_id)"}
          if([string]$P.exact_parent_sha-cne$Parent){throw "PREREG_PARENT_IDENTITY_DRIFT actual=$($P.exact_parent_sha)"}
          if(@($P.metrics).Count-ne11){throw "PREREG_METRIC_COUNT_INVALID count=$(@($P.metrics).Count)"}
          if(@($P.seeds).Count-ne8){throw "PREREG_SEED_COUNT_INVALID count=$(@($P.seeds).Count)"}

          $QRaw=(& git show ($Scientific+':.wingless/qualification-request.json')) -join [Environment]::NewLine
          if($LASTEXITCODE-ne0){throw 'QUALIFICATION_REQUEST_READ_FAILED'}
          $Q=$QRaw|ConvertFrom-Json
          if([string]$Q.schema-cne'wingless.research-qualification-request.v1'){throw 'QUALIFICATION_SCHEMA_INVALID'}
          if([string]$Q.experiment-cne$Experiment){throw 'QUALIFICATION_EXPERIMENT_INVALID'}
          if([string]$Q.branch-cne$ActiveBranch){throw 'QUALIFICATION_BRANCH_INVALID'}
          if([string]$Q.baseline_sha-cne$Parent){throw 'QUALIFICATION_BASELINE_INVALID'}
          if([string]$Q.test_script-cne'scripts/run-wlm-si-stack-container-r1.ps1'){throw 'QUALIFICATION_SCRIPT_INVALID'}

          $Headers=@{
            Authorization='Bearer '+$env:GITHUB_TOKEN
            Accept='application/vnd.github+json'
            'X-GitHub-Api-Version'='2022-11-28'
            'User-Agent'='wingless-recovery'
          }
          $Download=Join-Path $env:RUNNER_TEMP 'wingless-stack-source-job-log.bin'
          $Transcript=Join-Path $env:RUNNER_TEMP 'wingless-stack-source-job.log'
          Invoke-WebRequest -UseBasicParsing -Uri ('https://api.github.com/repos/spoonman136668-ai/Wingless/actions/jobs/'+$SourceJob+'/logs') -Headers $Headers -OutFile $Download -MaximumRedirection 8
          $Bytes=[IO.File]::ReadAllBytes($Download)
          if($Bytes.Length-ge2 -and $Bytes[0]-eq0x50 -and $Bytes[1]-eq0x4b){
            $ZipDir=Join-Path $env:RUNNER_TEMP 'wingless-stack-source-job'
            if(Test-Path -LiteralPath $ZipDir){Remove-Item -LiteralPath $ZipDir -Recurse -Force}
            Expand-Archive -LiteralPath $Download -DestinationPath $ZipDir -Force
            $Parts=@(Get-ChildItem -LiteralPath $ZipDir -File -Recurse|Sort-Object FullName)
            if($Parts.Count-eq0){throw 'SOURCE_JOB_LOG_ZIP_EMPTY'}
            $TranscriptText=($Parts|ForEach-Object{Get-Content -LiteralPath $_.FullName -Raw}) -join [Environment]::NewLine
            [IO.File]::WriteAllText($Transcript,$TranscriptText,(New-Object Text.UTF8Encoding($false)))
          }else{
            Copy-Item -LiteralPath $Download -Destination $Transcript -Force
            $TranscriptText=Get-Content -LiteralPath $Transcript -Raw
          }
          $TranscriptHash=(Get-FileHash -LiteralPath $Transcript -Algorithm SHA256).Hash.ToLowerInvariant()

          foreach($Needle in @(
            'PREREG_VALID experiment=WLM-SI-STACK-CONTAINER-R1 metrics=11 seeds=8',
            'research: preregister stack container invariance',
            'research: run stack container invariance',
            'Controller-owned normalized result harness; interpretation follows frozen gates.',
            'WINGLESS_AUTOMATED_QUALIFICATION_CLASSIFICATION: missing-harness-marker',
            'WINGLESS_AUTOMATED_QUALIFICATION_HARNESS_MARKER_MISSING'
          )){
            if(-not$TranscriptText.Contains($Needle)){throw "SOURCE_TRANSCRIPT_INVARIANT_MISSING needle=$Needle"}
          }

          $Pattern='\{"schema":"wingless\.research-scientific-result\.v1","experiment":"WLM-SI-STACK-CONTAINER-R1","metrics":\{[^\r\n]+?\}\}'
          $Matches=[regex]::Matches($TranscriptText,$Pattern)
          if($Matches.Count-lt2){throw "SCIENTIFIC_RESULT_OCCURRENCE_COUNT_TOO_SMALL count=$($Matches.Count)"}

          $ExpectedMetrics=[ordered]@{
            paired_case_count=512
            completed_substrate_case_runs=1024
            total_emitted_rows=65536
            paired_observable_mismatch_cases=0
            row_count_mismatch_cases=0
            state_cardinality_mismatch_cases=0
            invalid_state_schedules=0
            budget_overrun_rows=0
            law_violation_cases=0
            max_conservation_error=0
            max_residual_law_error=0
          }

          $CanonicalProbe=$null
          foreach($M in $Matches){
            $Probe=$M.Value|ConvertFrom-Json
            if([string]$Probe.schema-cne'wingless.research-scientific-result.v1'){throw 'PROBE_SCHEMA_INVALID'}
            if([string]$Probe.experiment-cne$Experiment){throw 'PROBE_EXPERIMENT_INVALID'}
            foreach($Key in $ExpectedMetrics.Keys){
              $Prop=$Probe.metrics.PSObject.Properties[$Key]
              if($null-eq$Prop){throw "PROBE_METRIC_MISSING metric=$Key"}
              if([double]$Prop.Value-ne[double]$ExpectedMetrics[$Key]){throw "PROBE_METRIC_MISMATCH metric=$Key expected=$($ExpectedMetrics[$Key]) actual=$($Prop.Value)"}
            }
            if($null-eq$CanonicalProbe){$CanonicalProbe=$Probe}
            else{
              $A=$CanonicalProbe|ConvertTo-Json -Depth 20 -Compress
              $B=$Probe|ConvertTo-Json -Depth 20 -Compress
              if($A-cne$B){throw 'SCIENTIFIC_RESULT_DUPLICATE_MISMATCH'}
            }
          }

          & git checkout -B recovery/wingless-stack-qualified-r1 $Scientific
          if($LASTEXITCODE-ne0){throw 'RECOVERY_EVIDENCE_BRANCH_FAILED'}
          if(((& git status --porcelain)-join'').Trim()){throw 'RECOVERY_EVIDENCE_BRANCH_DIRTY'}

          $EvidenceDir=Join-Path $Repo '.research-autonomy\evidence\WLM-SI-STACK-CONTAINER-R1-recovered-36940852550'
          New-Item -ItemType Directory -Force -Path $EvidenceDir|Out-Null
          $ProbePath=Join-Path $EvidenceDir 'probe.json'
          $SummaryPath=Join-Path $EvidenceDir 'summary.json'
          $ProvenancePath=Join-Path $EvidenceDir 'provenance.json'
          $CanonicalProbe|ConvertTo-Json -Depth 20|Set-Content -LiteralPath $ProbePath -Encoding UTF8
          $ProbeHash=(Get-FileHash -LiteralPath $ProbePath -Algorithm SHA256).Hash.ToLowerInvariant()

          $Summary=[ordered]@{
            schema='wingless.research-qualification-summary.v1'
            experiment=$Experiment
            classification='qualified-scientific-result'
            recovery_mode=$true
            scientific_rerun=$false
            parent_sha=$Parent
            preregistration_sha=$Prereg
            observed_scientific_head_sha=$Scientific
            source_github_run_id=$SourceRun
            source_github_run_attempt=$SourceAttempt
            source_github_job_id=$SourceJob
            source_job_log_sha256=$TranscriptHash
            scientific_result_occurrences=$Matches.Count
            recovered_probe_sha256=$ProbeHash
            qualifier='immutable-transcript-and-lineage'
            generated_at_utc=[DateTime]::UtcNow.ToString('o')
          }
          $Summary|ConvertTo-Json -Depth 20|Set-Content -LiteralPath $SummaryPath -Encoding UTF8

          $Provenance=[ordered]@{
            schema='wingless.recovered-qualification-provenance.v1'
            experiment=$Experiment
            parent_sha=$Parent
            preregistration_sha=$Prereg
            observed_scientific_head_sha=$Scientific
            source_github_run_id=$SourceRun
            source_github_run_attempt=$SourceAttempt
            source_github_job_id=$SourceJob
            source_job_log_sha256=$TranscriptHash
            recovered_probe_sha256=$ProbeHash
            scientific_rerun=$false
            recovery_scope='evidence-only'
            generated_at_utc=[DateTime]::UtcNow.ToString('o')
          }
          $Provenance|ConvertTo-Json -Depth 20|Set-Content -LiteralPath $ProvenancePath -Encoding UTF8

          $State=[ordered]@{
            schema='research.repo-local-state.v1'
            program='Wingless'
            active_branch=$ActiveBranch
            north_star_path='research/bootstrap/wingless-lm-north-star.txt'
            north_star_sha256=$NorthStarSha
            parent_sha=$Parent
            qualified_head_sha=$Scientific
            experiment=$Experiment
            classification='qualified-scientific-result'
            scientific_rerun=$false
            source_github_run_id=$SourceRun
            source_github_job_id=$SourceJob
            last_completed_utc=[DateTime]::UtcNow.ToString('o')
            authority='research-only'
            ckb_plane_role='governance-only'
          }
          $State|ConvertTo-Json -Depth 20|Set-Content -LiteralPath (Join-Path $Repo '.research-autonomy\state.json') -Encoding UTF8

          & git add -- '.research-autonomy'
          if($LASTEXITCODE-ne0){throw 'RECOVERY_EVIDENCE_STAGE_FAILED'}
          & git diff --cached --check
          if($LASTEXITCODE-ne0){throw 'RECOVERY_EVIDENCE_DIFF_CHECK_FAILED'}
          $Staged=@(& git diff --cached --name-only|Where-Object{$_})
          foreach($Path in $Staged){
            if(-not([string]$Path).StartsWith('.research-autonomy/')){throw "RECOVERY_EVIDENCE_SCOPE_WIDENED path=$Path"}
          }

          & git config user.name 'wingless-research-recovery'
          & git config user.email 'research-recovery@localhost'
          & git commit -m 'research: seal recovered qualification for WLM-SI-STACK-CONTAINER-R1'
          if($LASTEXITCODE-ne0){throw 'RECOVERY_EVIDENCE_COMMIT_FAILED'}
          $EvidenceHead=(& git rev-parse HEAD).Trim()

          $Remote='https://github.com/spoonman136668-ai/Wingless.git'
          $Pair="x-access-token:$env:GITHUB_TOKEN"
          $Basic=[Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes($Pair))
          $Header="AUTHORIZATION: basic $Basic"

          $RemoteActive=@(& git -c "http.https://github.com/.extraheader=$Header" ls-remote --heads $Remote ('refs/heads/'+$ActiveBranch))
          if($LASTEXITCODE-ne0 -or $RemoteActive.Count-ne1){throw 'ACTIVE_REF_READ_FAILED'}
          $ActiveSha=(([string]$RemoteActive[0])-split '\s+')[0]
          if($ActiveSha-cne$Parent -and $ActiveSha-cne$Scientific -and $ActiveSha-cne$EvidenceHead){
            throw "ACTIVE_REF_DRIFT expected_parent=$Parent expected_scientific=$Scientific expected_evidence=$EvidenceHead actual=$ActiveSha"
          }

          & git -c "http.https://github.com/.extraheader=$Header" push $Remote ($EvidenceHead+':refs/heads/recovery/wingless-stack-qualified-r1')
          if($LASTEXITCODE-ne0){throw 'RECOVERY_EVIDENCE_PUSH_FAILED'}
          if($ActiveSha-cne$EvidenceHead){
            & git -c "http.https://github.com/.extraheader=$Header" push $Remote ($EvidenceHead+':refs/heads/'+$ActiveBranch)
            if($LASTEXITCODE-ne0){throw 'ACTIVE_REF_FAST_FORWARD_FAILED'}
          }

          $DispatchHeaders=@{
            Authorization='Bearer '+$env:GITHUB_TOKEN
            Accept='application/vnd.github+json'
            'X-GitHub-Api-Version'='2022-11-28'
            'User-Agent'='wingless-recovery'
          }
          $Body=@{
            ref='main'
            inputs=@{reason='recovered-qualified-chain'}
          }|ConvertTo-Json -Depth 5
          Invoke-RestMethod -Method Post -Headers $DispatchHeaders -ContentType 'application/json' -Body $Body -Uri 'https://api.github.com/repos/spoonman136668-ai/Wingless/actions/workflows/research-continuation-controller.yml/dispatches'

          Write-Host 'WINGLESS_STACK_RECOVERY_QUALIFICATION=PASS'
          Write-Host "scientific_head=$Scientific"
          Write-Host "evidence_head=$EvidenceHead"
          Write-Host "active_branch=$ActiveBranch"
          Write-Host "scientific_result_occurrences=$($Matches.Count)"
          Write-Host "source_job_log_sha256=$TranscriptHash"
          Write-Host 'REPO_LOCAL_NEXT_CYCLE_DISPATCHED'
