name: Wingless W-R65 frozen temporal-order causality
on:
  push:
    branches: [research/w-r65-temporal-order-falsification-20261014-r1]
permissions:
  contents: read
jobs:
  science:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify frozen source and first-use
        run: |
          set -euo pipefail
          git merge-base --is-ancestor d5fe061ddedab79893b2eb3c5ba5020c9ee2d8a2 HEAD
          test "$(git hash-object research/contrib/chatgpt/20261014-w-r64-source-specificity/execute.py)" = d029cbbfc0bb3003f7d888f2a6386c1b02ec9338
          test "$(git hash-object research/contrib/chatgpt/20261014-w-r65-temporal-order/prereg.json)" = 736d56506c400d77aa9f8cdbe95b0f811fccc75d
          test "$(git hash-object research/contrib/chatgpt/20261014-w-r65-temporal-order/execute.py)" = 30c09e011cd3d208fe01f709bd744bf2e8ee32b3
          python3 -m json.tool research/contrib/chatgpt/20261014-w-r65-temporal-order/prereg.json >/dev/null
          python3 -m py_compile research/contrib/chatgpt/20261014-w-r65-temporal-order/execute.py
      - name: Original first-use heldout temporal perturbation
        run: |
          set -euo pipefail
          python3 -B research/contrib/chatgpt/20261014-w-r65-temporal-order/execute.py > /tmp/W-R65-original.json
          python3 -m json.tool /tmp/W-R65-original.json >/dev/null
          python3 - <<'PY'
          import json
          a=json.load(open("/tmp/W-R65-original.json"))
          assert a["sealed_heldout_seeds"]==list(range(9792,9816))
          assert len(a["all_sealed_records"])==216 and len(a["comparisons"])==36
          assert a["model_calls"]==0 and a["accepted_ref_mutation"] is False
          assert a["classification"] in ("TEMPORAL_ORDER_DEPENDENCE","NONORDER_SOURCE0_DEPENDENCE","MIXED_OR_NONREPLICATION")
          print("CLASSIFICATION",a["classification"])
          print("PAIRED_MEANS",a["mean_accuracy_change"])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: W-R65-original-temporal-order
          path: /tmp/W-R65-original.json
          if-no-files-found: error
          retention-days: 90
      - name: Full Wingless regression and build
        run: go test ./... && go build ./...
