name: T25 TRAIN-only learned world model and full causal proof qualification
on:
  push:
    branches: [research/t25-causal-world-inference-20261019]
    paths: ['.github/workflows/north-star-t25-learned-train-only.yml']
permissions:
  contents: read
concurrency:
  group: wingless-t25-learned-TRAIN-only
  cancel-in-progress: false
jobs:
  learned-causal-certificate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 55
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify original source, passed prereg and new learned engine identities
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if((git rev-parse HEAD).Trim() -cne $env:GITHUB_SHA){throw 'T25_TRAIN_HEAD_DRIFT'}
          $expected=@{
            'research/north-star-transfer/20261019-wingless-t25-world-precode.json'='2cf22852a8c2a038bbd3bc44cbaa26fb1f2546f6'
            'research/north-star-transfer/20261019-wingless-t25-new-world-source.py'='5e8514031bbe69cba3270f7c45ee11fb28d04451'
            'research/north-star-transfer/20261019-wingless-t25-causal-belief-foundation.py'='b0d796026b768cd10db75b5201d057a1b0bdfb4b'
            'research/north-star-transfer/20261019-wingless-t25-headroom-measure.py'='fe27d9802c9f6d5c1256409425fb51f51e6ee9b0'
            'research/north-star-transfer/20261019-wingless-t25-learned-world-model.py'='9efa9256dc32b6f4bd1f3745e2a6e8967f91ac93'
          }
          foreach($path in $expected.Keys){
            if((git hash-object -- $path).Trim() -cne $expected[$path]){
              throw "T25_TRAIN_BLOB_DRIFT:$path"
            }
          }
          git merge-base --is-ancestor dd745a39ef121032acdef7d80756f3c2d13737de b6a6d281077fc139b45d185315419c67195d6537
          if($LASTEXITCODE -ne 0){throw 'T25_NO_VALID_PRECODE'}
          git merge-base --is-ancestor ceb74bfa9b84f62bc1773aa041e5c95453603023 150a64750207c4a2119ebc0f7a59778cf8b64ac8
          if($LASTEXITCODE -ne 0){throw 'T25_MISSING_POSITIVE_TRAIN_HEADROOM'}
          python -m py_compile research/north-star-transfer/20261019-wingless-t25-learned-world-model.py
          if($LASTEXITCODE -ne 0){throw 'T25_MODEL_SYNTAX_FAIL'}
          Write-Output 'T25_MODEL_FROZEN_NO_DEV=PASS'
      - name: Source-blind self-supervised TRAIN model vs strongest exact ancestry
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          python research/north-star-transfer/20261019-wingless-t25-learned-world-model.py --train-only > t25-learned-TRAIN.json
          if($LASTEXITCODE -ne 0){throw 'T25_TRAIN_CAUSAL_WORLD_SOUNDNESS_FAILURE'}
          python -c "import json;x=json.load(open('t25-learned-TRAIN.json',encoding='utf-8-sig'));assert x['status']=='PASS_TRAIN_ONLY_NO_DEV' and x['source_cases']==40 and x['DEV_cases_generated']==0 and x['causal_counterfactual_equivalence_checks']==120 and x['public_probes']==720 and 12<=x['universally_verified_transition_entries']<=16 and not x['scientific_acceptance'] and not x['optimizer_admission'];print('T25_LEARNED_TRAIN_CAUSAL_MODEL=PASS');print('T25_TRAINED_RELATIONAL_REPRESENTATION='+json.dumps(x,sort_keys=True))"
          if($LASTEXITCODE -ne 0){throw 'T25_TRAIN_RECEIPT_REJECTED'}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: t25-learned-world-TRAIN-${{ matrix.os }}
          path: t25-learned-TRAIN.json
          if-no-files-found: ignore
          retention-days: 90
