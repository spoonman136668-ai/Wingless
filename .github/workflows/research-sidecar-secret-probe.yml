name: Research Sidecar Nemotron Secret Probe

on:
  push:
    branches:
      - ops/research-sidecar-seed-r1
    paths:
      - '.github/workflows/research-sidecar-secret-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: [self-hosted, Windows, X64, wingless-research-safe]
    timeout-minutes: 5
    steps:
      - name: Locate decryptable NETWORK SERVICE research secret
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference='Stop'
          $SearchRoot='C:\Users\camar\GolandProjects\ckb-plane\state\research'
          Write-Host "identity=$(& whoami.exe)"
          if(-not(Test-Path -LiteralPath $SearchRoot -PathType Container)){throw 'RESEARCH_SECRET_ROOT_MISSING'}
          $Files=@(Get-ChildItem -LiteralPath $SearchRoot -Recurse -File -Filter '*.dpapi' -ErrorAction Stop)
          Write-Host "dpapi_candidate_count=$($Files.Count)"
          $Good=@()
          foreach($F in $Files){
            $Ok=$false
            $Len=0
            try{
              $Secure=(Get-Content -LiteralPath $F.FullName -Raw).Trim() | ConvertTo-SecureString
              $Ptr=[Runtime.InteropServices.Marshal]::SecureStringToBSTR($Secure)
              try{
                $Plain=[Runtime.InteropServices.Marshal]::PtrToStringBSTR($Ptr)
                $Len=$Plain.Length
                $Ok=($Len -ge 20)
              }finally{
                if($Ptr -ne [IntPtr]::Zero){[Runtime.InteropServices.Marshal]::ZeroFreeBSTR($Ptr)}
                $Plain=$null
              }
            }catch{
              $Ok=$false
            }
            Write-Host "candidate=$($F.FullName) decryptable=$Ok length=$Len"
            if($Ok){$Good+=$F.FullName}
          }
          if($Good.Count-ne1){throw "DECRYPTABLE_RESEARCH_SECRET_AMBIGUOUS count=$($Good.Count)"}
          Write-Host "selected_secret=$($Good[0])"
          Write-Host 'RESEARCH_SIDECAR_SECRET_PROBE=PASS'
