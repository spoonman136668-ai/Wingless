name: Wingless W-R25 train-only adaptive gain science
on:
  push:
    branches: [research/w-r25-dev-gain-selection-r1]
permissions:
  contents: read
jobs:
  science:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check immutable head ancestry, prereg and science code
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 3c02f2afc1868c97659e17a667c8e8d88277c9fa HEAD
          test "$(git hash-object research/contrib/chatgpt/20261013-w-r24-feedback/execute.py)" = e9feea4817627431c036b4ce7079abbf2be24c80
          test "$(git hash-object research/contrib/chatgpt/20261013-w-r25-gain-selection/prereg.json)" = 44fbf6edb7de0d702946d3b584ac497d368fd9d5
          test "$(git hash-object research/contrib/chatgpt/20261013-w-r25-gain-selection/execute.py)" = 7028e56ebb9626895166a192a6fa5ebd487bc531
          python3 -m json.tool research/contrib/chatgpt/20261013-w-r25-gain-selection/prereg.json > /dev/null
          python3 -m py_compile research/contrib/chatgpt/20261013-w-r25-gain-selection/execute.py
      - name: One original frozen scientific experiment
        run: |
          set -euo pipefail
          python3 -B research/contrib/chatgpt/20261013-w-r25-gain-selection/execute.py > /tmp/wr25-original.json
          python3 -m json.tool /tmp/wr25-original.json
      - uses: actions/upload-artifact@v4
        with:
          name: W-R25-original
          path: /tmp/wr25-original.json
          if-no-files-found: error
          retention-days: 90
      - name: Full final project regression
        run: go test ./... && go build ./...
