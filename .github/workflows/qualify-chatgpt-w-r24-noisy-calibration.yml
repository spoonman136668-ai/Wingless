name: Wingless W-R24 frozen noisy-calibration science
on:
  push:
    branches: [research/chatgpt-w-r24-noisy-calibration-20261013]
permissions:
  contents: read
jobs:
  science:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Validate preregistration and source blob identity
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 0c899bceb80f3bb54e3f98e797ed5e547c0d62bc HEAD
          test "$(git hash-object research/contrib/chatgpt/20261013-w-r24-noisy-calibration/prereg.json)" = 0ed337b5dd25ac95904fd2cb89a8f0505de9b6e0
          test "$(git hash-object research/contrib/chatgpt/20261013-w-r24-noisy-calibration/execute.py)" = 3ae2c3f907217ce5ad6fd9152709d4d21518a000
          python3 -m json.tool research/contrib/chatgpt/20261013-w-r24-noisy-calibration/prereg.json >/dev/null
          python3 -m py_compile research/contrib/chatgpt/20261013-w-r24-noisy-calibration/execute.py
      - name: Original frozen W-R24 science
        run: |
          set -euo pipefail
          python3 -B research/contrib/chatgpt/20261013-w-r24-noisy-calibration/execute.py > /tmp/W-R24-original.json
          python3 -m json.tool /tmp/W-R24-original.json
      - uses: actions/upload-artifact@v4
        with:
          name: W-R24-original-noisy-calibration
          path: /tmp/W-R24-original.json
          retention-days: 90
          if-no-files-found: error
      - name: Full Wingless regression and build
        run: go test ./... && go build ./...
