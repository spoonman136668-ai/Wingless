name: CKB Plane Implementation Audit B R1

on:
  push:
    branches:
      - diagnostic/ckb-plane-role-swap-watch-r1
    paths:
      - '.github/ckb-plane-implementation-audit-b-r1-request.json'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: [wingless-up-b]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Read implementation provider audits
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $R=Get-Content -LiteralPath '.\.github\ckb-plane-implementation-audit-b-r1-request.json' -Raw|ConvertFrom-Json
          if([string]$R.schema-cne'ckb-plane.implementation-audit-b-r1.v1' -or -not[bool]$R.read_only){throw 'IMPLEMENTATION_AUDIT_REQUEST_INVALID'}
          $Cycle=[string]$R.cycle_id
          $Root='C:\ProgramData\CKBR\research-sidecar'
          $Targets=@(
            Get-ChildItem -LiteralPath $Root -Recurse -File -ErrorAction SilentlyContinue |
              Where-Object { $_.Name -ceq ($Cycle+'.json') -or $_.Name -ceq ($Cycle+'-nemotron.json') }
          )
          if($Targets.Count-eq0){throw 'IMPLEMENTATION_AUDIT_NOT_FOUND'}
          foreach($F in ($Targets|Sort-Object FullName)){
            Write-Host "AUDIT_PATH=$($F.FullName)"
            Write-Host 'AUDIT_BEGIN'
            Get-Content -LiteralPath $F.FullName -Raw
            Write-Host 'AUDIT_END'
          }
          Write-Host 'sidecar_mutation=False'
          Write-Host 'research_state_mutation=False'
          Write-Host 'CKB_PLANE_IMPLEMENTATION_AUDIT_B_R1=PASS'
