name: Wingless future-data allocation attribution R14
on:
  push:
    branches: [research/external-hosted-wingless-future-data-allocation-attribution-r14]
    paths:
      - 'unitary/wlm_lm_external_future_data_allocation_attribution_r14.go'
      - 'cmd/wlm-lm-external-future-data-allocation-attribution-r14/main.go'
      - '.github/workflows/external-future-data-allocation-attribution-r14.yml'
permissions: {contents: read}
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false, fetch-depth: 0}
      - uses: actions/setup-go@v5
        with: {go-version: '1.25.x'}
      - name: Validate frozen package
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "e3219d88501db4ffc30ed22f179d50b6318c44c5" HEAD
          python3 - <<'PY'
          import subprocess
          prereg="e3219d88501db4ffc30ed22f179d50b6318c44c5"; parent="62aef857f4dc3a15d1e4f75002fe18e6a8564379"
          pp="docs/experiments/wlm-lm-external-future-data-allocation-attribution-r14.json"
          assert subprocess.check_output(["git","rev-parse",prereg+"^"],text=True).strip()==parent
          changed=set(subprocess.check_output(["git","diff","--name-only",parent+"..HEAD"],text=True).splitlines())
          expected={pp,"unitary/wlm_lm_external_future_data_allocation_attribution_r14.go","cmd/wlm-lm-external-future-data-allocation-attribution-r14/main.go",".github/workflows/external-future-data-allocation-attribution-r14.yml"}
          assert changed==expected,(sorted(changed),sorted(expected))
          PY
      - name: Verify READY_RESEARCH receipt
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib,json,pathlib
          raw=r'''{"schema":"ckb-plane.external-exposure-ready-research-receipt.v1","project":"Wingless","experiment":"WLM-LM-EXTERNAL-FUTURE-DATA-ALLOCATION-ATTRIBUTION-R14","preregistration_sha":"e3219d88501db4ffc30ed22f179d50b6318c44c5","research_host":"runnervm8df0l","runner_id":"GitHub Actions 1000001824","manifest_sha256":"75cdb3b97dbb7017299f573d506f07095ed89c06264b29724b78f29c909d4da4","plan_decision":{"schema":"ckb-plane.external-exposure.v1","disposition":"READY_PLAN","scope":"plan-only","reasons":null},"fetch_decision":{"schema":"ckb-plane.external-exposure-fetch.v1","disposition":"READY_FETCH","scope":"fetch-verify-only","reasons":null},"research_decision":{"schema":"ckb-plane.external-exposure-research.v1","disposition":"READY_RESEARCH","scope":"research-consume-once","reasons":null},"ckb_plane_main_sha":"36d99a0257120ede57bb96638660d35014dd529e"}'''
          assert hashlib.sha256(raw.encode()).hexdigest()=="ea8c18ab91c0d20780f66d6f8dd67948e0b404e14ce8db8e202554bae56a2fe0"
          pathlib.Path("/tmp/authority.json").write_text(raw)
          PY
      - name: Fetch exact external sources
        shell: bash
        run: |
          set -euo pipefail
          export EXTERNAL_ROOT="$RUNNER_TEMP/wingless-r14"; mkdir -p "$EXTERNAL_ROOT"
          python3 - <<'PY'
          import hashlib,os,pathlib,urllib.request
          src=[
            ("code","https://raw.githubusercontent.com/python/cpython/ebf955df7a89ed0c7968f79faec1de49f61ed7cb/Lib/fractions.py","7a95f1c506c9ac4b2277df5f2bdd9d61cc67b520c45021a5a961939770221ef6",41453),
            ("structured","https://raw.githubusercontent.com/json-schema-org/JSON-Schema-Test-Suite/5b0ee1613e45fcc2bddac00e07c19cd49b00d8a8/tests/draft2020-12/type.json","4c5cbe6cbcd28af73761091367b20e07d0403847e236c06c31fc27061bd81192",14365),
            ("technical-prose","https://raw.githubusercontent.com/golang/go/6f5c275ebdc454197fff5f1496521c8f81e20eef/README.md","8247b7c5de1e74854aac1a08aa5894444d1d33b4045c70d5cc3367ad0e25c3f3",1454)]
          root=pathlib.Path(os.environ["EXTERNAL_ROOT"])
          for n,u,h,s in src:
            b=urllib.request.urlopen(urllib.request.Request(u,headers={"User-Agent":"wingless-r14"}),timeout=30).read(s+1)
            assert len(b)==s and hashlib.sha256(b).hexdigest()==h
            (root/(n+".bin")).write_bytes(b)
          PY
          echo "EXTERNAL_ROOT=$EXTERNAL_ROOT" >> "$GITHUB_ENV"
      - name: Full Go regression
        run: go test ./...
      - name: Run frozen allocation attribution twice
        shell: bash
        run: |
          set -euo pipefail
          go run ./cmd/wlm-lm-external-future-data-allocation-attribution-r14 --code "$EXTERNAL_ROOT/code.bin" --structured "$EXTERNAL_ROOT/structured.bin" --technical-prose "$EXTERNAL_ROOT/technical-prose.bin" > /tmp/result1.json
          go run ./cmd/wlm-lm-external-future-data-allocation-attribution-r14 --code "$EXTERNAL_ROOT/code.bin" --structured "$EXTERNAL_ROOT/structured.bin" --technical-prose "$EXTERNAL_ROOT/technical-prose.bin" > /tmp/result2.json
          cmp /tmp/result1.json /tmp/result2.json
          cat /tmp/result1.json
      - name: Classify
        shell: bash
        run: |
          python3 - <<'PY'
          import json,math,pathlib
          m=json.loads(pathlib.Path("/tmp/result1.json").read_text())["metrics"]
          valid=(
            m["source_identity_mismatch_count"]==0 and m["source_count"]==3 and m["total_source_bytes"]==57272 and
            m["arm_count"]==3 and m["non_target_training_byte_budget_per_arm"]==15819 and
            m["motif_capacity"]==256 and m["target_window_bytes_per_arm"]==1454 and
            m["target_evaluation_bytes_per_arm"]==582 and m["target_adaptation_reservoir_bytes_per_arm"]==872 and
            m["transition_observation_count"]==1743 and m["transition_accounting_error_count"]==0 and
            m["arm_code_reconstructed_delta"]==5 and m["arm_structured_reconstructed_delta"]==0 and
            m["arm_technical_prose_reconstructed_delta"]==-10 and m["aggregate_reconstructed_delta"]==-5 and
            m["capacity_growth_event_count"]==0 and m["tokenizer_use_count"]==0 and
            m["external_model_call_count"]==0 and m["counter_overflow_count"]==0 and
            m["invalid_row_count"]==0 and all(math.isfinite(float(v)) for v in m.values())
          )
          frac=m["dominant_prose_loss_fraction"]
          if not valid: cls="invalid"
          elif frac>=0.5: cls="supported"
          elif m["dominant_prose_loss_abs"]>0: cls="mixed"
          else: cls="negative"
          out={"schema":"wingless.research-classification.v1","experiment":"WLM-LM-EXTERNAL-FUTURE-DATA-ALLOCATION-ATTRIBUTION-R14","classification":cls,"validity_pass":valid,"authority_receipt_sha256":"ea8c18ab91c0d20780f66d6f8dd67948e0b404e14ce8db8e202554bae56a2fe0","metrics":m}
          pathlib.Path("/tmp/classification.json").write_text(json.dumps(out,separators=(",",":")));print(json.dumps(out,separators=(",",":")))
          if not valid: raise SystemExit(2)
          PY
      - name: Delete external bytes
        if: always()
        run: rm -rf "$RUNNER_TEMP/wingless-r14"
      - name: Upload evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: wingless-future-data-allocation-attribution-r14
          path: |
            /tmp/authority.json
            /tmp/result1.json
            /tmp/result2.json
            /tmp/classification.json
          if-no-files-found: error
