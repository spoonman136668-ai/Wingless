name: ITD-02 v3 source-free preregistration qualification
on:
  push:
    branches: [research/itd02-exact-exposure-v3-prespecified-seeds-20261027]
permissions:
  contents: read
jobs:
  source-free:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Qualify unchanged v2 and prospective v3 boundaries without source world
        run: |
          cd research/native/itd02/outcome
          python -m unittest -v test_exact_exposure_v2 test_exact_exposure_v3
