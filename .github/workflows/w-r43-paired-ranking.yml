name: Wingless W-R43 frozen paired-comparison diagnostic
on:
  push:
    branches: [research/w-r43-paired-ranking-diagnostic-r1]
permissions:
  contents: read
jobs:
  science:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify exact predecessor and frozen preregistration
        run: |
          set -euo pipefail
          git merge-base --is-ancestor d75b6bb35a037abc9613282f6375d66b0c0eff1b HEAD
          test "$(git hash-object research/contrib/chatgpt/20261013-w-r42-nonlinear/execute.py)" = 503157c169b2572b3fbc07a0eb9c8275fca01aac
          test "$(git hash-object research/contrib/chatgpt/20261013-w-r43-paired-ranking/prereg.json)" = bd203ab6ad483c96310eb32c3a151165ea2b898a
          test "$(git hash-object research/contrib/chatgpt/20261013-w-r43-paired-ranking/execute.py)" = 84cb39fbc1d41bc8e94873493f9f021d10bdde82
          python3 -m json.tool research/contrib/chatgpt/20261013-w-r43-paired-ranking/prereg.json >/dev/null
          python3 -m py_compile research/contrib/chatgpt/20261013-w-r43-paired-ranking/execute.py
      - name: Execute original single sealed first-use diagnostic
        run: |
          set -euo pipefail
          python3 -B research/contrib/chatgpt/20261013-w-r43-paired-ranking/execute.py >/tmp/W-R43-original.json
          python3 -m json.tool /tmp/W-R43-original.json >/dev/null
          python3 - <<'PY'
          import json
          a=json.load(open('/tmp/W-R43-original.json'))
          assert a['development_seeds']==list(range(2112,2128))
          assert a['sealed_heldout_seeds']==list(range(2128,2144))
          assert len(a['results'])==4 and all(len(r['cells'])==6 for r in a['results'])
          print('CLASSIFICATION',a['classification'])
          print('PAIRED_RANK_GAIN',a['paired_minus_independent_ranking_accuracy_gain'])
          print('TRAIN_IDENTICAL_PAIRS',a['identical_development_feature_pairs'])
          for r in a['results']:
              print('ARM',r['arm'],r['condition'],r['paired_preference_accuracy'],r['tie_count'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: W-R43-original-paired-ranking
          path: /tmp/W-R43-original.json
          retention-days: 90
          if-no-files-found: error
      - name: Required full Wingless repository regression and build
        run: go test ./... && go build ./...
