name: MP-AI05 fail-closed free Nemotron connectivity
on:
  push:
    branches: [qualification/mpai05-nemotron-public-probe-20261027]
    paths: ['.github/workflows/mpai05-public-nemotron-probe.yml']
permissions:
  contents: read
jobs:
  public-free-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      WINGLESS_REASONER_OPENROUTER_API_KEY: ${{ secrets.WINGLESS_REASONER_OPENROUTER_API_KEY }}
    steps:
      - name: Require a genuine free-model response, never treat HTTP error as PASS
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error
          key=os.environ.get('WINGLESS_REASONER_OPENROUTER_API_KEY','')
          if not key:
              print('MPAI05_NEMOTRON_SECRET=UNAVAILABLE')
              raise SystemExit(1)
          models=['nvidia/nemotron-3-ultra-550b-a55b:free','nvidia/nemotron-3.5-lightning:free']
          for model in models:
              assert model.endswith(':free')
              payload=json.dumps({'model':model,
                  'messages':[{'role':'user','content':'Public synthetic connectivity check. Reply only NEMOTRON_PROBE_OK.'}],
                  'max_tokens':96, 'temperature':0, 'reasoning':{'enabled':False}}).encode()
              req=urllib.request.Request('https://openrouter.ai/api/v1/chat/completions',
                  data=payload,headers={'Authorization':'Bearer '+key,'Content-Type':'application/json'})
              try:
                  with urllib.request.urlopen(req,timeout=45) as res: obj=json.load(res)
                  answer=str(obj['choices'][0]['message'].get('content') or '').strip()
                  if answer=='NEMOTRON_PROBE_OK':
                      print('MPAI05_NEMOTRON_FREE_INFERENCE=PASS')
                      print('MPAI05_NEMOTRON_MODEL='+model)
                      print('MPAI05_PRIVATE_MP_DATA_SENT=FALSE')
                      raise SystemExit(0)
                  print('MPAI05_NEMOTRON_MODEL_RESULT='+model+' RESPONSE_NOT_EXACT')
              except urllib.error.HTTPError as e:
                  print('MPAI05_NEMOTRON_MODEL_RESULT='+model+' HTTP_'+str(e.code))
              except Exception as e:
                  print('MPAI05_NEMOTRON_MODEL_RESULT='+model+' '+type(e).__name__)
          print('MPAI05_NEMOTRON_FREE_INFERENCE=BLOCKED')
          print('MPAI05_PRIVATE_MP_DATA_SENT=FALSE')
          raise SystemExit(1)
          PY
