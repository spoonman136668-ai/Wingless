name: Wingless W-R25 frozen monotone DP science
on:
  push:
    branches: [research/w-r25-monotone-alignment-pilot-r1]
permissions:
  contents: read
jobs:
  science:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Frozen parent, prereg and immutable evaluator identity
        run: |
          set -euo pipefail
          git merge-base --is-ancestor de6234a46160970e4c23f74d11e9580683047319 HEAD
          test "$(git hash-object research/contrib/chatgpt/20261013-w-r24-monotone-warp/execute.py)" = 916949b8f244be0275dd4a75bec332dc8e64c841
          test "$(git hash-object research/contrib/chatgpt/20261013-w-r25-monotone-align/prereg.json)" = 4feea18db9a6076db05914c9f8a41b42b4c2389b
          test "$(git hash-object research/contrib/chatgpt/20261013-w-r25-monotone-align/execute.py)" = 7245a8c9e444ddbfae63909132ca0a95655111b3
          python3 -m json.tool research/contrib/chatgpt/20261013-w-r25-monotone-align/prereg.json >/dev/null
          python3 -m py_compile research/contrib/chatgpt/20261013-w-r25-monotone-align/execute.py
      - name: First-use immutable time-warp DP experiment
        run: |
          set -euo pipefail
          python3 -B research/contrib/chatgpt/20261013-w-r25-monotone-align/execute.py >/tmp/W-R25-original.json
          python3 -m json.tool /tmp/W-R25-original.json >/dev/null
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/W-R25-original.json'))
          assert x['sealed_heldout_seeds']==list(range(320,336))
          assert len(x['arms'])==2 and all(len(r['cells'])==18 for r in x['arms'])
          print('CLASSIFICATION',x['classification'],'GAIN',x['warped_dp_vs_baseline_gain'])
          for arm in x['arms']:print('ARM',arm['arm'],arm['overall_accuracy'],arm['warped_accuracy'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: W-R25-original-monotone-alignment
          path: /tmp/W-R25-original.json
          if-no-files-found: error
          retention-days: 90
      - name: Full Wingless qualification regression
        run: go test ./... && go build ./...
