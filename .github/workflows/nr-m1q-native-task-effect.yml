name: NR-M1Q Native Selected Task-Effect Go Qualification
on:
  pull_request:
    paths:
      - 'research/native/itd02/mg40/**'
      - '.github/workflows/nr-m1q-native-task-effect.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-task:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version-file: go.mod
      - name: Run original-public selected-feedback tests
        run: go test ./research/native/itd02/mg40 -count=1 -v
      - name: Check native contract
        run: go vet ./research/native/itd02/mg40
      - name: Verify no generated source modifications
        run: git diff --exit-code
