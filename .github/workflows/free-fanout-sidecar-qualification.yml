name: Temporary Wingless free fanout qualification

on:
  push:
    branches:
      - 'infra/free-fanout-sidecar-r1'
    paths:
      - 'research/fanout/.qualification-trigger'

permissions:
  contents: read

concurrency:
  group: wingless-free-fanout-qualification
  cancel-in-progress: false

env:
  PACKAGE_SHA: '24d88a08468a0df8124b6fe4dabb2eaa5d74fb7c'
  MANIFEST: 'research/fanout/smoke.manifest.json'

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: sidecar
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.PACKAGE_SHA }}
          path: frozen-package
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: false
      - name: Verify exact frozen package and build matrix
        id: matrix
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git -C frozen-package rev-parse HEAD)" == "$PACKAGE_SHA" ]]
          cd sidecar
          MATRIX="$(python scripts/free_fanout_sidecar.py prepare --manifest "$MANIFEST" --program Wingless --package-sha "$PACKAGE_SHA")"
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

  screen:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: sidecar
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.PACKAGE_SHA }}
          path: frozen-package
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.5'
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: false
      - name: Run bounded synthetic candidate
        shell: bash
        env:
          CANDIDATE_ID: ${{ matrix.id }}
        run: |
          set -euo pipefail
          cd sidecar
          python scripts/free_fanout_sidecar.py run --manifest "$MANIFEST" --program Wingless --package-sha "$PACKAGE_SHA" --package-root ../frozen-package --candidate-id "$CANDIDATE_ID" --output "../fanout-output/$CANDIDATE_ID"
      - uses: actions/upload-artifact@v4
        with:
          name: wingless-qualification-${{ matrix.id }}-${{ github.run_id }}
          path: fanout-output/${{ matrix.id }}/
          if-no-files-found: error
          retention-days: 2

  aggregate:
    if: always() && needs.prepare.result == 'success'
    needs: [prepare, screen]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          path: sidecar
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: false
      - uses: actions/download-artifact@v4
        with:
          pattern: wingless-qualification-*-${{ github.run_id }}
          path: fanout-artifacts
      - name: Aggregate external-only evidence
        shell: bash
        run: |
          set -euo pipefail
          cd sidecar
          python scripts/free_fanout_sidecar.py aggregate --manifest "$MANIFEST" --program Wingless --package-sha "$PACKAGE_SHA" --artifacts ../fanout-artifacts --output ../fanout-summary/summary.json
      - uses: actions/upload-artifact@v4
        with:
          name: wingless-qualification-summary-${{ github.run_id }}
          path: fanout-summary/
          if-no-files-found: error
          retention-days: 2
