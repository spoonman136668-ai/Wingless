name: Wingless isolated G26 atlas maintenance internal profiler
on:
  push:
    branches: [experiment/atlas-parallel-timing-20261104]
    paths: ['.github/workflows/atlas-maintenance-profile.yml']
permissions:
  contents: read
jobs:
  profile:
    runs-on: windows-2022
    timeout-minutes: 18
    steps:
      - name: Checkout immutable, already-qualified source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 7f31b05cc274a1769c117567911d8a55030e5758
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: '1.25.5'
          cache: false
      - name: Restore matching exact-source Go compilation cache
        id: go-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/wingless-atlas-profile-gocache
          key: wingless-atlas-prof-go1255-windows2022-v1-${{ hashFiles('**/*.go', 'go.mod', 'go.sum', 'scripts/test_code_atlas_tamper.py', 'scripts/test_source_aware_atlas.py', 'scripts/validate_code_atlas.py') }}
      - name: Profile all original G26 Atlas maintenance invocations
        shell: pwsh
        env:
          GOCACHE: ${{ runner.temp }}/wingless-atlas-profile-gocache
          CACHE_HIT: ${{ steps.go-cache.outputs.cache-hit }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git rev-parse HEAD).Trim() -ne '7f31b05cc274a1769c117567911d8a55030e5758') { throw 'SOURCE_SHA_DRIFT' }
          if (git status --porcelain) { throw 'BASELINE_DIRTY' }
          @'
          import collections, json, os, pathlib, pstats, runpy, subprocess, sys, time
          original = subprocess.run
          work = pathlib.Path(os.environ["RUNNER_TEMP"])
          measures = []
          profiles = []
          def instrumented(*args, **kwargs):
              command = args[0] if args else kwargs.get("args", [])
              command = list(command) if isinstance(command, (list,tuple)) else [command]
              command = [str(i) for i in command]
              is_maintainer = any(x.replace("\\","/").endswith("scripts/maintain_code_atlas.py") for x in command)
              if is_maintainer:
                  n = len(profiles)+1
                  outfile = work/("wingless-g26-maint-"+str(n)+".pstats")
                  at = next(i for i,x in enumerate(command)
                            if x.replace("\\","/").endswith("scripts/maintain_code_atlas.py"))
                  command = command[:at]+["-m","cProfile","-o",str(outfile)]+command[at:]
                  profiles.append(str(outfile))
              start=time.monotonic()
              try:
                  result=original(command,**kwargs)
                  return result
              finally:
                  if is_maintainer:
                      elapsed=time.monotonic()-start
                      measures.append({"number":len(profiles),"elapsed":round(elapsed,3),
                                       "cwd":pathlib.Path(kwargs.get("cwd") or ".").name,
                                       "exit":result.returncode if "result" in locals() else "exception"})
          subprocess.run=instrumented
          sys.argv=["scripts/test_source_aware_atlas.py","--root",".","--scratch-parent",str(work)]
          start=time.monotonic()
          try:
              runpy.run_path("scripts/test_source_aware_atlas.py",run_name="__main__")
          finally:
              print("G26_FULL_WALL_SECONDS="+str(round(time.monotonic()-start,3)),flush=True)
              print("G26_CACHE_HIT="+str(os.getenv("CACHE_HIT","")),flush=True)
              print("MAINTENANCE_INVOCATIONS="+json.dumps(measures,separators=(",",":")),flush=True)
              combined=collections.defaultdict(float)
              for i,profile in enumerate(profiles):
                  if not pathlib.Path(profile).exists():
                      print("MAINTENANCE_PROFILE_MISSING="+str(i+1),flush=True)
                      continue
                  stat=pstats.Stats(profile)
                  top=sorted(((data[3],f[0].replace("\\","/").rsplit("/",1)[-1]+":"+str(f[2]))
                              for f,data in stat.stats.items()),reverse=True)[:10]
                  print("MAINTENANCE_PROFILE_"+str(i+1)+"="+json.dumps(
                      [{"cumulative":round(t,3),"function":label} for t,label in top],separators=(",",":")),flush=True)
                  for (file,line,func),data in stat.stats.items():
                      if file.replace("\\","/").endswith("/maintain_code_atlas.py"):
                          combined[func]+=data[3]
              print("MAINTENANCE_AGGREGATE_FUNCTION_CUMULATIVE="+json.dumps(
                  [{"function":f,"cumulative":round(t,3)} for f,t in
                   sorted(combined.items(),key=lambda x:-x[1])[:25]],separators=(",",":")),flush=True)
          '@ | python -B -
          if ($LASTEXITCODE -ne 0) { throw 'FULL_G26_NEGATIVE_CONTROLS_FAILED' }
          if (git status --porcelain) { throw 'ORIGINAL_CHECKOUT_DIRTY_AFTER_G26' }
          Add-Content $env:GITHUB_STEP_SUMMARY "All authentic G26 controls PASS; maintenance cProfile observations saved in run logs; source pinned."
