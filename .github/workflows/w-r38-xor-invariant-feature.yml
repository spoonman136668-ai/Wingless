name: Wingless W-R38 frozen zero-shot XOR-invariant feature
on:
  push:
    branches: [research/w-r38-bitxor-invariant-zero-shot-r1]
permissions:
  contents: read
jobs:
  science:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Exact content-addressed frozen qualification gate
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 74fa95538c7df1092243d0637cee2bdd1b02a3d2 HEAD
          test "$(git hash-object research/contrib/chatgpt/20261013-w-r37-codebook-conditioned/execute.py)" = 16ecd94f0b08ca1ce0d2636ce3bd888d85734234
          test "$(git hash-object research/contrib/chatgpt/20261013-w-r38-xor-transition/prereg.json)" = d57ae76672e413cc4e5d4d96c3cb62fa3df56b2d
          test "$(git hash-object research/contrib/chatgpt/20261013-w-r38-xor-transition/execute.py)" = 74a5d4263b565f28dc36a01892c554f1c63c735a
          python3 -m json.tool research/contrib/chatgpt/20261013-w-r38-xor-transition/prereg.json >/dev/null
          python3 -m py_compile research/contrib/chatgpt/20261013-w-r38-xor-transition/execute.py
      - name: Original one-shot sealed feature experiment
        run: |
          set -euo pipefail
          python3 -B research/contrib/chatgpt/20261013-w-r38-xor-transition/execute.py > /tmp/W-R38-original.json
          python3 -m json.tool /tmp/W-R38-original.json >/dev/null
          python3 - <<'PY'
          import json
          a=json.load(open('/tmp/W-R38-original.json'))
          assert a['development_seeds']==list(range(1760,1776))
          assert a['sealed_heldout_seeds']==list(range(1776,1792))
          assert len(a['rows'])==4 and all(len(r['cells'])==6 for r in a['rows'])
          print('CLASSIFICATION',a['classification'])
          print('INVARIANT',a['xor_feature_invariant'])
          print('ARITHMETIC_XOR_TRANSFER_LOSS',a['arithmetic_identity_minus_xor_accuracy'])
          for r in a['rows']:
              print('ARM',r['arm'],r['condition'],r['accuracy'],r['invariance_checks'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: W-R38-original-xor-invariant-transition
          path: /tmp/W-R38-original.json
          if-no-files-found: error
          retention-days: 90
      - name: Required final full Wingless regression and build
        run: go test ./... && go build ./...
