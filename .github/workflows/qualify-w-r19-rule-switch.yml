name: Wingless W-R19 preregistered few-shot rule-switch science
on:
  push:
    branches: [research/w-r19-fewshot-rule-switch-r1]
permissions:
  contents: read
jobs:
  science:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify exact frozen scientific identities
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 452f0e37a449a9e68a1f10371582cbe7013ccb61 HEAD
          test "$(git hash-object research/contrib/chatgpt/20261013-w-r18-predictive-state/execute.py)" = f09a072c3c00e1694036dc8e7fcadbc8f0009762
          test "$(git hash-object research/contrib/chatgpt/20261013-w-r19-rule-switch/prereg.json)" = b14469d07a8e979f4303cf6ab86650ef083736bb
          test "$(git hash-object research/contrib/chatgpt/20261013-w-r19-rule-switch/execute.py)" = 723308237ba69bd09be4dd9798ebb620cff9e6f2
          python3 -m json.tool research/contrib/chatgpt/20261013-w-r19-rule-switch/prereg.json > /dev/null
          python3 -m py_compile research/contrib/chatgpt/20261013-w-r19-rule-switch/execute.py
      - name: Original frozen few-shot adaptive rule experiment
        run: |
          set -euo pipefail
          python3 -B research/contrib/chatgpt/20261013-w-r19-rule-switch/execute.py > /tmp/W-R19-original.json
          python3 -m json.tool /tmp/W-R19-original.json
      - uses: actions/upload-artifact@v4
        with:
          name: W-R19-original-fewshot-rule-change
          path: /tmp/W-R19-original.json
          retention-days: 90
          if-no-files-found: error
      - name: One full Wingless regression and build
        run: go test ./... && go build ./...
