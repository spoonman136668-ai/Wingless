name: Wingless GitHub Models probe

on:
  push:
    branches:
      - 'research/wingless-up**'
    paths:
      - '.wingless/github-models-probe.json'

permissions:
  contents: read
  models: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect GitHub Models transport
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/request.json <<'JSON'
          {"model":"openai/gpt-4.1-nano","messages":[{"role":"user","content":"Reply with the single word PING"}],"temperature":0,"max_tokens":16,"stream":false}
          JSON

          echo "=== CATALOG ==="
          curl -sS --max-time 30 \
            -D /tmp/catalog.headers \
            -o /tmp/catalog.body \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://models.github.ai/catalog/models || true
          head -40 /tmp/catalog.headers
          python3 - <<'PY'
          from pathlib import Path
          b=Path('/tmp/catalog.body').read_bytes()
          print({"catalog_bytes":len(b),"catalog_prefix":b[:300].decode("utf-8","replace")})
          PY

          echo "=== INFERENCE NO REDIRECT ==="
          curl -sS --max-time 60 \
            --max-redirs 0 \
            -D /tmp/infer.headers \
            -o /tmp/infer.body \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/request.json \
            https://models.github.ai/inference/chat/completions || true
          cat /tmp/infer.headers
          python3 - <<'PY'
          from pathlib import Path
          b=Path('/tmp/infer.body').read_bytes()
          print({"infer_bytes":len(b),"infer_prefix":b[:500].decode("utf-8","replace")})
          PY
