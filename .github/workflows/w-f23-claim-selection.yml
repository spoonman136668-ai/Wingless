name: W-F23 frozen choice among three competing identity claims
on:
  push:
    branches: [research/w-f23-competing-alias-link-claims-20261015-r1]
permissions:
  contents: read
jobs:
  science:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-go@v5
        with: {go-version-file: go.mod}
      - name: Verify unchanged W-F22 prior original and prereg
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 5a785822bf8fe7aa9878ab374dfd799a9d6f3633 HEAD
          test "$(git hash-object unitary/f22_learned_alias_links.go)" = "$(git rev-parse 5a785822bf8fe7aa9878ab374dfd799a9d6f3633:unitary/f22_learned_alias_links.go)"
          python3 -m json.tool research/foundational/20261015-w-f23/prereg.json >/dev/null
      - name: Original W-F23 frozen candidate-identity selection development
        run: |
          set -euo pipefail
          go run ./cmd/f23-wingless > /tmp/w-f23-original.json
          python3 -m json.tool /tmp/w-f23-original.json >/dev/null
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: W-F23-original-competing-in-state-alias-claims
          path: /tmp/w-f23-original.json
          if-no-files-found: error
          retention-days: 90
      - name: Audit exact row decisions and candidate order
        run: |
          python3 - <<'PY'
          import json,collections
          d=json.load(open('/tmp/w-f23-original.json'))
          assert d["stage"]=="DEVELOPMENT_ONLY"
          assert d["native_state_bytes"]==576
          assert d["graph_count"]==96 and d["question_count"]==1152
          assert d["candidate_proposals_externally_supplied"] and d["candidate_alias_pair_matching_coded"]
          assert d["three_candidates_per_case"] and d["candidate_order_changed_per_case"]
          assert not d["retrained"] and not d["source_birth_independent"]
          assert not d["sealed_first_use"] and not d["accepted_ref_mutation"]
          assert collections.Counter(x["Family"] for x in d["rows"])=={108:288,109:288,110:288,111:288}
          assert collections.Counter(x["Variant"] for x in d["rows"])==dict.fromkeys(range(12),96)
          assert all(sorted(x["ProposalPerm"])==[0,1,2] for x in d["rows"])
          for name,key in (("learned","Selected"),("first","FirstOnly"),("all","AllLinks"),("none","NoLinks"),("coded","CodedUpper")):
            s=d["scores"][name]
            assert s["correct"]==sum(x[key]["answer"]==x["Truth"] for x in d["rows"])
            assert s["fp"]==sum(x[key]["answer"] for x in d["rows"] if not x["Truth"])
            assert s["fn"]==sum(not x[key]["answer"] for x in d["rows"] if x["Truth"])
          assert d["registered_verdict"] in ("INVALID_COMPETING_CLAIM_REFERENCE",
            "DEVELOPMENT_LEARNED_COMPETING_ALIAS_CLAIM_SELECTION",
            "DEVELOPMENT_NO_COMPETING_ALIAS_CLAIM_SELECTION")
          print("W_F23_VERDICT",d["registered_verdict"],d["scores"])
          PY
      - name: One full native regression plus build
        run: go test ./... && go build ./...
