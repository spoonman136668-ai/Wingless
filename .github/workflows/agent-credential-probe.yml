name: Agent credential presence probe

on:
  push:
    branches:
      - ops/agent-credential-probe-r1
    paths:
      - .github/workflows/agent-credential-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Report boolean credential availability only
        env:
          HAS_COPILOT: ${{ secrets.COPILOT_GITHUB_TOKEN != '' }}
          HAS_OPENAI: ${{ secrets.OPENAI_API_KEY != '' }}
          HAS_ANTHROPIC: ${{ secrets.ANTHROPIC_API_KEY != '' }}
          HAS_GEMINI: ${{ secrets.GEMINI_API_KEY != '' }}
        run: |
          echo "has_copilot=$HAS_COPILOT"
          echo "has_openai=$HAS_OPENAI"
          echo "has_anthropic=$HAS_ANTHROPIC"
          echo "has_gemini=$HAS_GEMINI"
