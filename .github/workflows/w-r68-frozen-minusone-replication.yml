name: Wingless W-R68 frozen negative-one phase replication
on:
  push:
    branches: [research/w-r68-minus1-fresh-cohort-20261014-r1]
permissions:
  contents: read
jobs:
  science:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify immutable source and sealed cohort before first use
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 5a73ddf04a9bad1c2b41c8d5154e472f976ea4aa HEAD
          test "$(git hash-object research/contrib/chatgpt/20261014-w-r67-phase-ladder/execute.py)" = f41f916bf7c8d5cc47ecd717577718d705d31d32
          test "$(git hash-object research/contrib/chatgpt/20261014-w-r68-minus1-replication/execute.py)" = 04222695ef33a1f5a0c9c67baf6cc1d286a304e1
          test "$(git hash-object research/contrib/chatgpt/20261014-w-r68-minus1-replication/prereg.json)" = ba4bd630f51096dc3c6b61df821fde2e4767e07f
          python3 -m json.tool research/contrib/chatgpt/20261014-w-r68-minus1-replication/prereg.json >/dev/null
          python3 -m py_compile research/contrib/chatgpt/20261014-w-r68-minus1-replication/execute.py
      - name: Execute original sealed minus-one replication exactly once
        shell: bash
        run: |
          set -euo pipefail
          python3 -B research/contrib/chatgpt/20261014-w-r68-minus1-replication/execute.py > /tmp/W-R68-original.json
          python3 -m json.tool /tmp/W-R68-original.json >/dev/null
          python3 - <<'PY'
          import json
          a=json.load(open("/tmp/W-R68-original.json"))
          assert a["sealed_heldout_seeds"] == list(range(10432,10456))
          assert len(a["all_sealed_records"])==288 and len(a["comparisons"])==36
          assert 0 <= a["exact_minus1_zero_cells"] <= 36
          assert a["model_calls"]==0 and not a["accepted_ref_mutation"]
          assert a["classification"] in ("MINUS_ONE_EXCEPTION_REPLICATED",
              "MINUS_ONE_EXCEPTION_FALSIFIED","MINUS_ONE_PARTIAL_OR_INCONCLUSIVE")
          print("CLASSIFICATION",a["classification"])
          print("MINUS_ONE_EXACT_ZERO_CELLS",a["exact_minus1_zero_cells"])
          print("PHASE_MEANS",a["mean_accuracy_change"])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: W-R68-original-minusone-fresh-cohort
          path: /tmp/W-R68-original.json
          if-no-files-found: error
          retention-days: 90
      - name: Full Wingless regression and build
        shell: bash
        run: go test ./... && go build ./...
