name: Wingless W-R23 unseen missingness encoding falsification
on:
  push:
    branches: [research/w-r23-unmarked-missingness-r1]
permissions:
  contents: read
jobs:
  science:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify exact preregistration and source
        run: |
          set -euo pipefail
          git merge-base --is-ancestor c551d41a7b8d4f77b9349033fa788d621a800519 HEAD
          test "$(git hash-object research/contrib/chatgpt/20261013-w-r22-maskaware/execute.py)" = e43abe25ef7b876d9138576d5184d02cde2819d8
          test "$(git hash-object research/contrib/chatgpt/20261013-w-r23-unmarked/prereg.json)" = 7b0763038b29f5d29071d7811d3ae5e192a9ccde
          test "$(git hash-object research/contrib/chatgpt/20261013-w-r23-unmarked/execute.py)" = a41dca10d51f68468766d043199e48bbbec7eedb
          python3 -m json.tool research/contrib/chatgpt/20261013-w-r23-unmarked/prereg.json >/dev/null
          python3 -m py_compile research/contrib/chatgpt/20261013-w-r23-unmarked/execute.py
      - name: Original frozen 72-cell missingness encoding evaluation
        run: |
          set -euo pipefail
          python3 -B research/contrib/chatgpt/20261013-w-r23-unmarked/execute.py > /tmp/W-R23-original.json
          python3 -m json.tool /tmp/W-R23-original.json >/dev/null
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/W-R23-original.json'))
          assert x['heldout_seeds']==list(range(272,288))
          assert len(x['arms'])==4 and all(len(a['cells'])==18 for a in x['arms'])
          print('CLASSIFICATION',x['classification'])
          print('EXPLICIT_ZERO',x['maskaware_aug_zero_accuracy'],'HIDDEN',x['maskaware_aug_hidden_accuracy'])
          for a in x['arms']:
              print('ARM',a['arm'],a['accuracy'])
              print('CELLS',[(c['generator'],c['masked_ticks'],c['encoding'],c['accuracy']) for c in a['cells']])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: W-R23-original-unmarked-missingness
          path: /tmp/W-R23-original.json
          retention-days: 90
          if-no-files-found: error
      - name: One final full Wingless regression
        run: go test ./... && go build ./...
