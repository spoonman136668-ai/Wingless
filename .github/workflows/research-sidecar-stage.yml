name: Research sidecar prerequisite staging

on:
  push:
    branches:
      - ops/research-sidecar-stage-r1
    paths:
      - '.github/workflows/research-sidecar-stage.yml'

permissions:
  contents: read

jobs:
  stage:
    runs-on: [self-hosted, Windows, X64, wingless-research-safe]
    timeout-minutes: 15
    env:
      OPENROUTER_KEY: ${{ secrets.WINGLESS_REASONER_OPENROUTER_API_KEY }}
      BOOTSTRAP_B64: ''
    steps:
      - name: Stage isolated sidecar prerequisites only
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference='Stop'
          if([string]::IsNullOrWhiteSpace($env:OPENROUTER_KEY)){throw 'OPENROUTER_KEY_MISSING'}
          $Plane='C:\Users\camar\GolandProjects\ckb-plane'
          $Root=Join-Path $Plane 'state\research-sidecar'
          $Config=Join-Path $Root 'config'
          $Secrets=Join-Path $Root 'secrets'
          $Workspaces=Join-Path $Root 'workspaces'
          $Source=Join-Path $Root 'wingless-source'
          New-Item -ItemType Directory -Force -Path $Root,$Config,$Secrets,$Workspaces | Out-Null

          if(-not(Test-Path -LiteralPath $Source -PathType Container)){
            git clone --no-tags --no-checkout https://github.com/spoonman136668-ai/Wingless.git $Source
            if($LASTEXITCODE-ne0){throw 'WINGLESS_SOURCE_CLONE_FAILED'}
          }
          $Origin=(git -C $Source remote get-url origin).Trim()
          if($Origin-cnotin@('https://github.com/spoonman136668-ai/Wingless.git','https://github.com/spoonman136668-ai/Wingless')){
            throw "WINGLESS_SOURCE_ORIGIN_INVALID origin=$Origin"
          }
          $Dirty=@(git -C $Source status --porcelain)
          if($LASTEXITCODE-ne0 -or $Dirty.Count-ne0){throw 'WINGLESS_SOURCE_NOT_CLEAN'}

          $Secure=ConvertTo-SecureString $env:OPENROUTER_KEY -AsPlainText -Force
          $Cipher=ConvertFrom-SecureString $Secure
          [IO.File]::WriteAllText((Join-Path $Secrets 'openrouter.dpapi'),$Cipher,(New-Object Text.UTF8Encoding($false)))

          $Auto=@"
autonomy:
  enabled: false
  poll_seconds: 5
  retry_seconds: 60
  max_no_progress_seconds: 900
  remote_control: false
  repository: ''
  repository_id: 0
  original_workflows: []
server:
  bind: 127.0.0.1
  port: 8896
state:
  sqlite_path: state/research-sidecar.db
profile:
  name: ''
repos: {}
execution:
  sandbox_syntax: native
  enabled: false
  codex_home: 'C:\ProgramData\CKBR\codex\home'
  timeout_seconds: 1200
  local_operations_config: ''
  local_operations_sha256: ''
tools:
  git: 'C:\Program Files\Git\cmd\git.exe'
  go: 'C:\Users\camar\go\pkg\mod\golang.org\toolchain@v0.0.1-go1.25.5.windows-amd64\bin\go.exe'
  powershell: 'C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe'
  codex: 'C:\ProgramData\CKBR\codex\bin\codex.exe'
  node: 'C:\Program Files\nodejs\node.exe'
  playwright_root: 'C:\ckb-ci-tools'
policy:
  accepted_ref_mutation: false
  runtime_launch_allowed: false
  arbitrary_shell_from_webui: false
  max_attempts_per_work_order: 3
"@
          [IO.File]::WriteAllText((Join-Path $Config 'autonomy.yaml'),$Auto,(New-Object Text.UTF8Encoding($false)))

          $Research=@"
schema: ckb-plane.research-native-runtime.v1
enabled: true
planner:
  endpoint: 'http://127.0.0.1:8897/v1/chat/completions'
  model: 'nvidia/nemotron-3-ultra-550b-a55b:free'
  max_tokens: 4096
  timeout_seconds: 600
implementation:
  endpoint: 'http://127.0.0.1:8898/v1/chat/completions'
  model: 'unused-dedicated-codex-cli'
  max_tokens: 8192
  timeout_seconds: 600
wingless:
  source_root: '$($Source.Replace("'","''"))'
  workspace_parent: '$($Workspaces.Replace("'","''"))'
  publication_enabled: false
  workflow_dispatch_enabled: false
  result_mode: 'disabled'
  callback_ready: false
  github_token_env: ''
"@
          [IO.File]::WriteAllText((Join-Path $Config 'research-runtime.yaml'),$Research,(New-Object Text.UTF8Encoding($false)))

          $Bootstrap=[Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($env:BOOTSTRAP_B64))
          [IO.File]::WriteAllText((Join-Path $Config 'research-bootstrap.json'),$Bootstrap,(New-Object Text.UTF8Encoding($false)))

          $Record=[ordered]@{
            schema='ckb-plane.research-sidecar-staging.v1'
            staged_at_utc=[DateTimeOffset]::UtcNow.ToString('o')
            identity=[Security.Principal.WindowsIdentity]::GetCurrent().Name
            root=$Root
            source_head='ad5ad9f044ee12e194cdb09bee59db5411baf141'
            north_star_sha256='efd6172772d76f03ac04bdab0af40941232311def8202d6f0f953d33b3d05dd8'
            evidence_sha256='84e0214178acd2043c49adf8df66f733e4a8534a88d8a3d3881344933191460b'
            nemotron_model='nvidia/nemotron-3-ultra-550b-a55b:free'
            codex_home='C:\ProgramData\CKBR\codex\home'
            codex_default_model='gpt-5.6-luna'
            sidecar_started=$false
            ktrade_modified=$false
          }
          [IO.File]::WriteAllText((Join-Path $Root 'staging.json'),($Record|ConvertTo-Json -Depth 8),(New-Object Text.UTF8Encoding($false)))
          Write-Host "identity=$($Record.identity)"
          Write-Host "sidecar_root=$Root"
          Write-Host "source_root=$Source"
          Write-Host "sidecar_started=False"
          Write-Host "ktrade_modified=False"
          Write-Host 'RESEARCH_SIDECAR_PREREQUISITES=PASS'
