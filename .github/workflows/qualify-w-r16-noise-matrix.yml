name: Wingless W-R16 frozen factorial noise/order transfer
on:
  push:
    branches: [research/w-r16-noise-transfer-matrix-r1]
permissions:
  contents: read
jobs:
  science:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Fail-closed original identity and preregistration
        run: |
          set -euo pipefail
          git merge-base --is-ancestor cd9ed8c98e655e9ebf77204750f9ca733ced83e5 HEAD
          test "$(git hash-object research/contrib/chatgpt/20261012-w-r15-noisy-positive/execute.py)" = 0a5a6f6c2993a04ca46c3ec918dd8fbdaac8bda5
          test "$(git hash-object research/contrib/chatgpt/20261013-w-r16-noise-matrix/prereg.json)" = 74793c8821f81656f8202b729996b5e7f132136a
          test "$(git hash-object research/contrib/chatgpt/20261013-w-r16-noise-matrix/execute.py)" = 99d4065fb0fa5dedc4390c718f0af56d9fc7d0cb
          python3 -m json.tool research/contrib/chatgpt/20261013-w-r16-noise-matrix/prereg.json >/dev/null
          python3 -m py_compile research/contrib/chatgpt/20261013-w-r16-noise-matrix/execute.py
      - name: First and only frozen 36-cell scientific evaluation
        run: |
          set -euo pipefail
          python3 -B research/contrib/chatgpt/20261013-w-r16-noise-matrix/execute.py > /tmp/W-R16-original.json
          python3 -m json.tool /tmp/W-R16-original.json > /dev/null
          python3 - <<'PY'
          import json
          a=json.load(open('/tmp/W-R16-original.json'))
          assert len(a['models'])==4
          assert all(len(x['matrix'])==9 for x in a['models'])
          print('SCIENCE_CLASSIFICATION',a['classification'])
          for model in a['models']:
              print('MODEL',model['model'],model['aggregate_accuracy'],
                    'PER_CELL',[(x['amplitude'],x['negative_family'],x['accuracy']) for x in model['matrix']])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: W-R16-original-36-cell-science
          path: /tmp/W-R16-original.json
          retention-days: 90
          if-no-files-found: error
      - name: Single full Wingless qualification regression
        run: go test ./... && go build ./...
