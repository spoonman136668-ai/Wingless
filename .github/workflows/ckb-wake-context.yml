name: Diagnose CKB shared transport checkout
on:
  push:
    branches: [diag/ckb-wake-context-r1]
    paths: ['.github/workflows/ckb-wake-context.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: [self-hosted, Windows, X64, wingless-up-b]
    timeout-minutes: 5
    steps:
      - name: Inspect shared target checkout
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference='Stop'
          $p='C:\ProgramData\CKBR\research\repos\Wingless'
          Write-Host ('repo_path='+$p)
          Write-Host ('exists='+(Test-Path -LiteralPath (Join-Path $p '.git')))
          if(!(Test-Path -LiteralPath (Join-Path $p '.git'))){throw 'SHARED_REPO_MISSING'}
          $head=(& git.exe -C $p rev-parse HEAD).Trim()
          if($LASTEXITCODE-ne0){throw 'SHARED_REPO_HEAD_FAILED'}
          Write-Host ('head='+$head)
          $origin=(& git.exe -C $p remote get-url origin).Trim()
          if($LASTEXITCODE-ne0){throw 'SHARED_REPO_ORIGIN_FAILED'}
          Write-Host ('origin_kind='+(if($origin -match '^https://'){'https'}elseif($origin -match '^git@'){'ssh'}else{'other'}))
          $dirty=(& git.exe -C $p status --porcelain) -join ''
          Write-Host ('dirty='+(-not[string]::IsNullOrWhiteSpace($dirty)))
