name: Diagnose CKB wake context
on:
  push:
    branches: [diag/ckb-wake-context-r1]
    paths: ['.github/workflows/ckb-wake-context.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: [self-hosted, Windows, X64, wingless-up-b]
    timeout-minutes: 5
    steps:
      - name: Inspect wake-only prerequisites
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference='Stop'
          Write-Host ('whoami=' + (& whoami.exe))
          $Root='C:\ProgramData\CKBR\research'
          $Controller=Join-Path $Root 'Invoke-ResearchLoop.ps1'
          $Config=Join-Path $Root 'controller.json'
          $Identity=Join-Path $Root 'controller-qualified-sha.txt'
          foreach($p in @($Controller,$Config,$Identity)){Write-Host ((Split-Path $p -Leaf)+'_exists='+(Test-Path -LiteralPath $p -PathType Leaf))}
          if(!(Test-Path -LiteralPath $Config -PathType Leaf)){throw 'RESEARCH_CONFIG_MISSING'}
          $c=Get-Content -LiteralPath $Config -Raw|ConvertFrom-Json
          Write-Host ('github_cli_config_dir_set=' + (-not[string]::IsNullOrWhiteSpace([string]$c.github_cli_config_dir)))
          Write-Host ('github_token_dpapi_file=' + [string]$c.github_token_dpapi_file)
          if($c.github_token_dpapi_file -and (Test-Path -LiteralPath ([string]$c.github_token_dpapi_file) -PathType Leaf)){
            Add-Type -AssemblyName System.Security -ErrorAction Stop
            try{
              $cipher=[IO.File]::ReadAllBytes([string]$c.github_token_dpapi_file)
              $plain=[System.Security.Cryptography.ProtectedData]::Unprotect($cipher,$null,[System.Security.Cryptography.DataProtectionScope]::LocalMachine)
              try{
                $token=[Text.Encoding]::UTF8.GetString($plain).Trim()
                Write-Host ('machine_dpapi_decryptable=' + (-not[string]::IsNullOrWhiteSpace($token)))
              } finally { if($plain){[Array]::Clear($plain,0,$plain.Length)} }
            } catch { Write-Host ('machine_dpapi_decryptable=false reason='+$_.Exception.GetType().Name) }
          } else {
            Write-Host 'machine_dpapi_decryptable=false reason=file_missing_or_unset'
          }
          $UserToken='C:\Users\camar\GolandProjects\ckb-plane\state\control-auth\github-token.dpapi'
          Write-Host ('user_dpapi_file_exists='+(Test-Path -LiteralPath $UserToken -PathType Leaf))
          if(Test-Path -LiteralPath $UserToken -PathType Leaf){
            try{
              $sec=((Get-Content -LiteralPath $UserToken -Raw).Trim())|ConvertTo-SecureString
              $ptr=[Runtime.InteropServices.Marshal]::SecureStringToBSTR($sec)
              try{$v=[Runtime.InteropServices.Marshal]::PtrToStringBSTR($ptr);Write-Host ('user_dpapi_decryptable='+(-not[string]::IsNullOrWhiteSpace($v)))}finally{if($ptr-ne[IntPtr]::Zero){[Runtime.InteropServices.Marshal]::ZeroFreeBSTR($ptr)}}
            } catch { Write-Host ('user_dpapi_decryptable=false reason='+$_.Exception.GetType().Name) }
          }
