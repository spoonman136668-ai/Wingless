name: ITD-02 stateful navigation prospective source-free gate
on:
  push:
    branches: [research/itd02-motion-stateful-v1-20261027]
    paths:
      - 'research/native/itd02/outcome/motion_stateful_eval.py'
      - 'research/native/itd02/outcome/test_motion_stateful_eval.py'
      - '.github/workflows/itd02-stateful-sourcefree.yml'
permissions:
  contents: read
jobs:
  preregistration:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Syntax and frozen split validation, no real world
        run: |
          python -m py_compile research/native/itd02/outcome/motion_stateful_eval.py research/native/itd02/outcome/test_motion_stateful_eval.py
          cd research/native/itd02/outcome
          python -m unittest -v test_motion_stateful_eval test_motion_source_compare test_exact_exposure_v2 test_exact_exposure_v3
  original-custody:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: '1.25.5'
          cache: false
      - name: Source-free original and motion learner regression
        run: go test ./research/native/itd02/outcome ./research/native/itd02/motionbridge -count=1
      - name: Vet original and motion learner
        run: go vet ./research/native/itd02/outcome ./research/native/itd02/motionbridge
