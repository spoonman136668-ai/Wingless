name: ITD-02 opt-in motion evidence source-free qualification
on:
  push:
    branches: [research/itd02-optin-motion-evidence-20261027]
    paths:
      - 'research/native/itd02/outcome/motion_selected.go'
      - 'research/native/itd02/outcome/motion_selected_test.go'
      - '.github/workflows/itd02-optin-motion-sourcefree.yml'
permissions:
  contents: read
jobs:
  native-source-free:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: '1.25.5'
          cache: false
      - name: Validate native source-free movement protocol
        run: go test ./research/native/itd02/outcome -run '^TestMotion' -count=1 -v
      - name: Check entire existing opt-in outcome package
        run: go test ./research/native/itd02/outcome -count=1
      - name: Vet opt-in outcome package
        run: go vet ./research/native/itd02/outcome
