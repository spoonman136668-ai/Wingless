name: Wingless W-R51 prospectively frozen batch training multi-cohort reproducibility
on:
  push:
    branches: [research/w-r51-multicohort-batch-robustness-r1]
permissions:
  contents: read
jobs:
  science:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fail-closed exact pinned design and source-birth
        run: |
          set -euo pipefail
          git merge-base --is-ancestor c97a5fcf97562f4320a43c27f409bd810c06fd6f HEAD
          test "$(git hash-object research/contrib/chatgpt/20261013-w-r50-batch/execute.py)" = 70698a05037ab0338d2218d301bc8a6ca987cdc8
          test "$(git hash-object research/contrib/chatgpt/20261013-w-r51-multicohort/prereg.json)" = 6fbca12393fdd22cf885f4b9ee56670ccab6495b
          test "$(git hash-object research/contrib/chatgpt/20261013-w-r51-multicohort/execute.py)" = 92fcba0b2c9555d9599ac674625c046722c83811
          python3 -m json.tool research/contrib/chatgpt/20261013-w-r51-multicohort/prereg.json >/dev/null
          python3 -m py_compile research/contrib/chatgpt/20261013-w-r51-multicohort/execute.py
      - name: Original first-use sealed nine-arm multicohort experiment
        run: |
          set -euo pipefail
          python3 -B research/contrib/chatgpt/20261013-w-r51-multicohort/execute.py > /tmp/W-R51-original.json
          python3 -m json.tool /tmp/W-R51-original.json >/dev/null
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/W-R51-original.json'))
          assert len(x['studies'])==3
          assert x['sealed_heldout_seeds']==list(range(3312,3360))
          assert [s['development_seeds'] for s in x['studies']]==[
              list(range(3216,3232)),list(range(3248,3264)),list(range(3280,3296))]
          assert all(len(s['arms_by_encoding']['identity'])==3 for s in x['studies'])
          assert all(len(s['arms_by_encoding']['identity']['order_invariant_full_batch']['by_seed'])==48
                     for s in x['studies'])
          print('CLASSIFICATION',x['classification'])
          print('QUALIFIED_BATCH_MODELS',x['number_of_useful_batch_models'])
          for s in x['studies']:
              print('BLOCK',s['development_block'],s['batch_accuracy'],
                    s['batch_gain_vs_online_mean'],s['batch_families_above_52pct'])
              print('FAMILIES',s['development_block'],
                    s['arms_by_encoding']['identity']['order_invariant_full_batch']['family_accuracy'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: W-R51-original-multicohort-batch
          path: /tmp/W-R51-original.json
          retention-days: 90
          if-no-files-found: error
      - name: One final complete Wingless regression and build
        run: go test ./... && go build ./...
