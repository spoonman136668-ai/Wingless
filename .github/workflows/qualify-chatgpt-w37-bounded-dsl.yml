name: W-R37 original frozen science and repository regression
on:
  push:
    branches: [research/chatgpt-w37-bounded-program-search-20261013]
permissions:
  contents: read
jobs:
  first-use:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check exact immutable original identity
        run: |
          set -euo pipefail
          git merge-base --is-ancestor fab90052e3850519f7182978876088f396d655b1 HEAD
          test "$(git hash-object research/contrib/chatgpt/20261013-w-r26-latent-alphabet/execute.py)" = 7632546ca681c3c8fec66991ffc9468ab34e0d07
          test "$(git hash-object research/contrib/chatgpt/20261013-w37-bounded-dsl/prereg.json)" = d9870f3277649a3ef5cfd85de6974cacd07e9d70
          test "$(git hash-object research/contrib/chatgpt/20261013-w37-bounded-dsl/execute.py)" = 888022d9a4de362851d44e145c47fc8e9afe48ee
          python3 -m json.tool research/contrib/chatgpt/20261013-w37-bounded-dsl/prereg.json >/dev/null
          python3 -m py_compile research/contrib/chatgpt/20261013-w37-bounded-dsl/execute.py
      - name: Original prospective first use W-R37
        run: |
          set -euo pipefail
          python3 -B research/contrib/chatgpt/20261013-w37-bounded-dsl/execute.py > /tmp/W-R37-original.json
          python3 -m json.tool /tmp/W-R37-original.json >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: W-R37-original-first-use
          path: /tmp/W-R37-original.json
          retention-days: 90
          if-no-files-found: error
      - name: Complete repository regression
        run: go test ./... && go build ./...
