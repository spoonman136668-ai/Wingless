name: W-F41 action-identifiability source engineering only
on:
  push:
    branches:
      - research/w-f41-action-identifiability-preflight-20261015-r1
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Preimplementation source and consumed-negative identity
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor e968b9cd1ba32d4f4157b4aa9c8ebc1e6c2c22b4 HEAD
          git merge-base --is-ancestor 726fff3b1976af89246fc680740b6f0195938865 HEAD
          python3 -m json.tool research/foundational/20261015-w-f41/prereg-candidate.json >/dev/null
          python3 -m py_compile research/foundational/20261015-w-f41/source_pilot.py
      - name: Source-only disjoint/private port tests
        run: python3 -m unittest discover -s research/foundational/20261015-w-f41 -p test_preflight.py -v
      - name: One full Go regression and build
        run: go test ./... && go build ./...
      - name: Authority
        run: |
          echo "Engineering only; no fresh source cohort or primary original executed"
