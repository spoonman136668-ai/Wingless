name: Wingless event-driven research continuation

on:
  workflow_run:
    workflows:
      - Wingless research Windows qualification
    types:
      - completed

permissions:
  contents: write
  actions: read

concurrency:
  group: wingless-event-continuation-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  continue:
    if: startsWith(github.event.workflow_run.head_branch, 'research/wingless-up')
    runs-on: [self-hosted, Windows, X64, wingless-research-safe]
    timeout-minutes: 45

    steps:
      - name: Checkout controller
        uses: actions/checkout@v4
        with:
          ref: main
          path: controller
          persist-credentials: false
          fetch-depth: 1

      - name: Read autonomy switch
        id: gate
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = 'Stop'
          $C = Get-Content -LiteralPath 'controller\.research-autonomy\config.json' -Raw | ConvertFrom-Json
          if ($C.schema -cne 'research.autonomy.v1') { throw 'AUTONOMY_SCHEMA_INVALID' }
          "enabled=$([string]([bool]$C.enabled).ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - name: Checkout completed research head
        if: steps.gate.outputs.enabled == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          path: target
          fetch-depth: 0
          persist-credentials: true

      - name: Continue completed lane
        if: steps.gate.outputs.enabled == 'true'
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          & 'controller\scripts\Invoke-EventDrivenResearchContinuation.ps1' -RepoPath (Resolve-Path 'target').Path -Repository '${{ github.repository }}' -RunId ${{ github.event.workflow_run.id }} -HeadBranch '${{ github.event.workflow_run.head_branch }}' -HeadSha '${{ github.event.workflow_run.head_sha }}' -Conclusion '${{ github.event.workflow_run.conclusion }}' -Program wingless
