name: Wingless transfer capacity feasibility R2

on:
  push:
    branches:
      - research/external-hosted-wingless-reasoning-transfer-capacity-feasibility-r2
    paths:
      - 'unitary/wlm_lm_external_reasoning_transfer_capacity_feasibility_r2.go'
      - 'cmd/wlm-lm-external-reasoning-transfer-capacity-feasibility-r2/main.go'
      - '.github/workflows/external-reasoning-transfer-capacity-feasibility-r2.yml'

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Validate frozen package
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "4adebfebbe497937b5a5e359dff3e6b66aef0031" HEAD
          python3 - <<'PY'
          import subprocess
          prereg="4adebfebbe497937b5a5e359dff3e6b66aef0031"
          parent="bba8dd9d15bb956dc7f9f08226d367e31386160d"
          pp="docs/experiments/wlm-lm-external-reasoning-transfer-capacity-feasibility-r2.json"
          assert subprocess.check_output(["git","rev-parse",prereg+"^"],text=True).strip()==parent
          assert set(subprocess.check_output(["git","diff-tree","--no-commit-id","--name-only","-r",prereg],text=True).splitlines())=={pp}
          changed=set(subprocess.check_output(["git","diff","--name-only",parent+"..HEAD"],text=True).splitlines())
          expected={pp,"unitary/wlm_lm_external_reasoning_transfer_capacity_feasibility_r2.go","cmd/wlm-lm-external-reasoning-transfer-capacity-feasibility-r2/main.go",".github/workflows/external-reasoning-transfer-capacity-feasibility-r2.yml"}
          assert changed==expected,(sorted(changed),sorted(expected))
          print("FROZEN_PACKAGE_OK",sorted(changed))
          PY
      - name: Verify READY_RESEARCH receipt
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib,json,pathlib
          raw=r'''{"schema":"ckb-plane.external-exposure-ready-research-receipt.v1","project":"Wingless","experiment":"WLM-LM-EXTERNAL-REASONING-TRANSFER-CAPACITY-FEASIBILITY-R2","preregistration_sha":"4adebfebbe497937b5a5e359dff3e6b66aef0031","research_host":"runnervm8df0l","runner_id":"GitHub Actions 1000001779","manifest_sha256":"75cdb3b97dbb7017299f573d506f07095ed89c06264b29724b78f29c909d4da4","plan_decision":{"schema":"ckb-plane.external-exposure.v1","disposition":"READY_PLAN","scope":"plan-only","reasons":null},"fetch_decision":{"schema":"ckb-plane.external-exposure-fetch.v1","disposition":"READY_FETCH","scope":"fetch-verify-only","reasons":null},"research_decision":{"schema":"ckb-plane.external-exposure-research.v1","disposition":"READY_RESEARCH","scope":"research-consume-once","reasons":null},"ckb_plane_main_sha":"36d99a0257120ede57bb96638660d35014dd529e"}'''
          assert hashlib.sha256(raw.encode()).hexdigest()=="16d302209db2e62565dcc55fd85c69de7a9c372e102be5abc63677a56d449b53"
          r=json.loads(raw)
          assert r["preregistration_sha"]=="4adebfebbe497937b5a5e359dff3e6b66aef0031"
          assert r["research_decision"]["disposition"]=="READY_RESEARCH"
          pathlib.Path("/tmp/authority.json").write_text(raw)
          PY
      - name: Fetch exact external sources
        shell: bash
        run: |
          set -euo pipefail
          export EXTERNAL_ROOT="$RUNNER_TEMP/wingless-capacity-r2"; mkdir -p "$EXTERNAL_ROOT"
          python3 - <<'PY'
          import hashlib,os,pathlib,urllib.request
          sources=[
            ("code","https://raw.githubusercontent.com/python/cpython/ebf955df7a89ed0c7968f79faec1de49f61ed7cb/Lib/fractions.py","7a95f1c506c9ac4b2277df5f2bdd9d61cc67b520c45021a5a961939770221ef6",41453),
            ("structured","https://raw.githubusercontent.com/json-schema-org/JSON-Schema-Test-Suite/5b0ee1613e45fcc2bddac00e07c19cd49b00d8a8/tests/draft2020-12/type.json","4c5cbe6cbcd28af73761091367b20e07d0403847e236c06c31fc27061bd81192",14365),
            ("technical-prose","https://raw.githubusercontent.com/golang/go/6f5c275ebdc454197fff5f1496521c8f81e20eef/README.md","8247b7c5de1e74854aac1a08aa5894444d1d33b4045c70d5cc3367ad0e25c3f3",1454),
          ]
          root=pathlib.Path(os.environ["EXTERNAL_ROOT"])
          for d,u,h,n in sources:
              b=urllib.request.urlopen(urllib.request.Request(u,headers={"User-Agent":"wingless-capacity-r2-class-attribution"}),timeout=30).read(n+1)
              assert len(b)==n and hashlib.sha256(b).hexdigest()==h
              (root/(d+".bin")).write_bytes(b)
          PY
          echo "EXTERNAL_ROOT=$EXTERNAL_ROOT" >> "$GITHUB_ENV"
      - name: Full Go regression
        run: go test ./... -count=1
      - name: Run frozen capacity frontier twice
        shell: bash
        run: |
          set -euo pipefail
          go run ./cmd/wlm-lm-external-reasoning-transfer-capacity-feasibility-r2 --code "$EXTERNAL_ROOT/code.bin" --structured "$EXTERNAL_ROOT/structured.bin" --technical-prose "$EXTERNAL_ROOT/technical-prose.bin" > /tmp/result1.json
          go run ./cmd/wlm-lm-external-reasoning-transfer-capacity-feasibility-r2 --code "$EXTERNAL_ROOT/code.bin" --structured "$EXTERNAL_ROOT/structured.bin" --technical-prose "$EXTERNAL_ROOT/technical-prose.bin" > /tmp/result2.json
          cmp /tmp/result1.json /tmp/result2.json
          cat /tmp/result1.json
      - name: Classify
        shell: bash
        run: |
          python3 - <<'PY'
          import json,math,pathlib
          r=json.loads(pathlib.Path("/tmp/result1.json").read_text());m=r["metrics"]
          valid=(
            m["source_identity_mismatch_count"]==0 and m["source_count"]==3 and m["total_source_bytes"]==57272 and
            m["arm_count"]==3 and m["training_byte_budget_per_arm"]==15819 and
            m["target_byte_use_count"]==0 and m["target_label_use_count"]==0 and
            m["candidate_capacity_count"]==4 and
            m["capacity_selection_post_target_count"]==0 and
            m["selected_common_capacity"] in (128,256,384,512) and
            m["tokenizer_use_count"]==0 and m["external_model_call_count"]==0 and
            m["counter_overflow_count"]==0 and m["invalid_row_count"]==0 and
            all(math.isfinite(float(v)) for v in m.values())
          )
          if not valid: cls="invalid"
          elif m["minimum_eligible_motif_count_across_arms"]>=256 and m["selected_common_capacity"]>=256: cls="supported"
          else: cls="negative"
          out={"schema":"wingless.research-classification.v1","experiment":"WLM-LM-EXTERNAL-REASONING-TRANSFER-CAPACITY-FEASIBILITY-R2","classification":cls,"validity_pass":valid,"authority_receipt_sha256":"16d302209db2e62565dcc55fd85c69de7a9c372e102be5abc63677a56d449b53","metrics":m}
          pathlib.Path("/tmp/classification.json").write_text(json.dumps(out,separators=(",",":")));print(json.dumps(out,separators=(",",":")))
          if not valid: raise SystemExit(2)
          PY
      - name: Delete external bytes
        if: always()
        run: rm -rf "$RUNNER_TEMP/wingless-capacity-r2"
      - name: Upload evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: wingless-transfer-capacity-feasibility-r2
          path: |
            /tmp/authority.json
            /tmp/result1.json
            /tmp/result2.json
            /tmp/classification.json
          if-no-files-found: error
