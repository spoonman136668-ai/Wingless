name: ITD02 MG63 One-Shot Wingless Source Atlas Transition
on:
  push:
    branches:
      - research/itd02-mg37-progress-selection-20261029
    paths:
      - .github/workflows/itd02-mg63-wingless-atlas-transition.yml
permissions:
  contents: write
jobs:
  source-transition:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: '1.25.5'
          cache: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Freeze original source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/research/itd02-mg37-progress-selection-20261029"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
      - name: Use original ICE builder and authenticated source-bound maintainer
        shell: bash
        run: |
          set -euo pipefail
          go run ./cmd/ice build
          python scripts/maintain_code_atlas.py --root .
          git diff --name-only | while IFS= read -r f; do
            case "$f" in .ice/*) ;; *) echo "UNAUTHORIZED_CHANGED_PATH: $f"; exit 1 ;; esac
          done
          git add .ice/
          test -n "$(git diff --cached --name-only)"
          git -c user.name=github-actions -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit -m "MG63: original ICE build and source-bound provisional atlas"
          go run ./cmd/ice validate
          go run ./cmd/ice relationships > /tmp/mg63-type-relationships.json
          python scripts/validate_code_atlas.py --root . --relationships /tmp/mg63-type-relationships.json
          git push origin HEAD:research/itd02-mg37-progress-selection-20261029
