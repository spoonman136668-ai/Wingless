name: ITD-02 motion IPC and prospective split source-free qualification
on:
  push:
    branches: [research/itd02-optin-motion-evidence-20261027]
    paths:
      - 'research/native/itd02/motionbridge/**'
      - 'research/native/itd02/outcome/motion_source_compare.py'
      - 'research/native/itd02/outcome/test_motion_source_compare.py'
      - '.github/workflows/itd02-motion-comparison-sourcefree.yml'
permissions:
  contents: read
jobs:
  motion-bridge:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: '1.25.5'
          cache: false
      - name: Qualified original outcome and motion IPC
        run: go test ./research/native/itd02/outcome ./research/native/itd02/motionbridge -count=1 -v
      - name: Go vet motion bridge and original custody
        run: go vet ./research/native/itd02/outcome ./research/native/itd02/motionbridge
      - name: Build opt-in motion IPC
        run: go build ./research/native/itd02/motionbridge
  source-free-split:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Compile and test source-free split only
        run: |
          python -m py_compile research/native/itd02/outcome/motion_source_compare.py
          cd research/native/itd02/outcome
          python -m unittest -v test_motion_source_compare test_exact_exposure_v2 test_exact_exposure_v3
