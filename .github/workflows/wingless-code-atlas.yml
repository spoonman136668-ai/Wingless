name: Wingless Code Intelligence Qualification
on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main
      - engineering/atlas-win2022-sourcebound-main-cache-20261105
    paths:
      - '.github/workflows/wingless-code-atlas.yml'
      - '**/*.go'
      - '**/*.s'
      - '**/*.c'
      - '**/*.h'
      - '**/*.syso'
      - 'go.mod'
      - 'go.sum'
      - 'go.work'
      - 'go.work.sum'

permissions:
  contents: read

concurrency:
  group: wingless-atlas-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:

  backend_probe:
    if: github.event_name == 'push' && github.ref == 'refs/heads/engineering/atlas-win2022-sourcebound-main-cache-20261105'
    name: Development Go cache backend roundtrip (not qualification)
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - name: Check out exact bounded development source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up frozen Go compiler for backend probe
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.25.5'
          cache: false
      - name: Verify identity and compile with fresh development cache
        id: cold_probe
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $head = (git rev-parse HEAD).Trim()
          if ($head -ne $env:GITHUB_SHA) { throw 'ATLAS_BACKEND_PROBE_HEAD_MISMATCH' }
          if ($env:ImageOS -ne 'win22' -and [string]::IsNullOrWhiteSpace($env:ImageVersion)) { throw 'ATLAS_BACKEND_PROBE_IMAGE_MISSING' }
          if ([string]::IsNullOrWhiteSpace($env:ImageVersion)) { throw 'ATLAS_BACKEND_PROBE_IMAGE_VERSION_EMPTY' }
          if ((go version).Trim() -ne 'go version go1.25.5 windows/amd64') { throw 'ATLAS_BACKEND_PROBE_GO_VERSION_DRIFT' }
          if ((go env GOFLAGS).Trim() -ne '' -or (go env GOCACHEPROG).Trim() -ne '') { throw 'ATLAS_BACKEND_PROBE_FLAGS_DRIFT' }
          $cgo = (go env CGO_ENABLED).Trim()
          $goamd64 = (go env GOAMD64).Trim()
          if ($cgo -notin @('0','1') -or $goamd64 -notin @('v1','v2','v3','v4')) { throw 'ATLAS_BACKEND_PROBE_ENV_INVALID' }
          $cache = Join-Path $env:RUNNER_TEMP 'wingless-atlas-pr462-backend-cache'
          if (Test-Path -LiteralPath $cache) { throw 'ATLAS_BACKEND_PROBE_CACHE_NOT_FRESH' }
          $env:GOCACHE = $cache
          "GOCACHE=$cache" >> $env:GITHUB_ENV
          "image=$env:ImageVersion" >> $env:GITHUB_OUTPUT
          "cgo=$cgo" >> $env:GITHUB_OUTPUT
          "goamd64=$goamd64" >> $env:GITHUB_OUTPUT
          $sw = [Diagnostics.Stopwatch]::StartNew()
          go build -o "$env:RUNNER_TEMP\wingless-atlas-backend-cold.exe" ./cmd/ice
          if ($LASTEXITCODE -ne 0) { throw 'ATLAS_BACKEND_PROBE_COLD_BUILD_FAILED' }
          $sw.Stop()
          "cold_seconds=$([math]::Round($sw.Elapsed.TotalSeconds,6))" >> $env:GITHUB_OUTPUT
          if (@(git status --porcelain).Count -gt 0) { throw 'ATLAS_BACKEND_PROBE_DIRTY_AFTER_COLD' }
      - name: Mark cache upload start
        id: upload_start
        shell: pwsh
        run: |
          "started=$([DateTimeOffset]::UtcNow.ToString('o'))" >> $env:GITHUB_OUTPUT
      - name: Upload PR-isolated diagnostic compiler objects
        uses: actions/cache/save@v4
        id: dev_cache_save
        with:
          path: ${{ env.GOCACHE }}
          key: wingless-atlas-dev-pr462-go1255-${{ steps.cold_probe.outputs.image }}-${{ runner.arch }}-cgo${{ steps.cold_probe.outputs.cgo }}-${{ steps.cold_probe.outputs.goamd64 }}-${{ hashFiles('**/*.go', '**/*.s', '**/*.c', '**/*.h', '**/*.syso', 'go.mod', 'go.sum', 'go.work', 'go.work.sum') }}
      - name: Measure upload and clear active cache for backend restore
        id: restore_start
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $uploadBegin = [DateTimeOffset]::Parse('${{ steps.upload_start.outputs.started }}')
          $uploadSeconds = ([DateTimeOffset]::UtcNow - $uploadBegin).TotalSeconds
          "upload_seconds=$([math]::Round($uploadSeconds,6))" >> $env:GITHUB_OUTPUT
          if (-not (Test-Path -LiteralPath $env:GOCACHE)) { throw 'ATLAS_BACKEND_PROBE_SOURCE_CACHE_MISSING' }
          $archived = Join-Path $env:RUNNER_TEMP 'wingless-atlas-pr462-backend-pre-restore'
          if (Test-Path -LiteralPath $archived) { throw 'ATLAS_BACKEND_PROBE_BACKUP_EXISTS' }
          Move-Item -LiteralPath $env:GOCACHE -Destination $archived -ErrorAction Stop
          if (Test-Path -LiteralPath $env:GOCACHE) { throw 'ATLAS_BACKEND_PROBE_CACHE_NOT_CLEARED' }
          "started=$([DateTimeOffset]::UtcNow.ToString('o'))" >> $env:GITHUB_OUTPUT
      - name: Restore exact PR-isolated compiler objects from GitHub backend
        id: dev_cache_restore
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.GOCACHE }}
          key: wingless-atlas-dev-pr462-go1255-${{ steps.cold_probe.outputs.image }}-${{ runner.arch }}-cgo${{ steps.cold_probe.outputs.cgo }}-${{ steps.cold_probe.outputs.goamd64 }}-${{ hashFiles('**/*.go', '**/*.s', '**/*.c', '**/*.h', '**/*.syso', 'go.mod', 'go.sum', 'go.work', 'go.work.sum') }}
          fail-on-cache-miss: true
      - name: Measure restored-cache compilation and emit development receipt
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ('${{ steps.dev_cache_restore.outputs.cache-hit }}' -ne 'true') { throw 'ATLAS_BACKEND_PROBE_EXACT_HIT_MISSING' }
          $restoreBegin = [DateTimeOffset]::Parse('${{ steps.restore_start.outputs.started }}')
          $restoreSeconds = ([DateTimeOffset]::UtcNow - $restoreBegin).TotalSeconds
          if (-not (Test-Path -LiteralPath $env:GOCACHE)) { throw 'ATLAS_BACKEND_PROBE_RESTORED_OBJECTS_MISSING' }
          $clock = [Diagnostics.Stopwatch]::StartNew()
          go build -o "$env:RUNNER_TEMP\wingless-atlas-backend-warm.exe" ./cmd/ice
          if ($LASTEXITCODE -ne 0) { throw 'ATLAS_BACKEND_PROBE_WARM_BUILD_FAILED' }
          $clock.Stop()
          if (@(git status --porcelain).Count -gt 0) { throw 'ATLAS_BACKEND_PROBE_DIRTY_AFTER_RESTORE' }
          $cold = [double]'${{ steps.cold_probe.outputs.cold_seconds }}'
          $upload = [double]'${{ steps.restore_start.outputs.upload_seconds }}'
          $warm = $clock.Elapsed.TotalSeconds
          $net = $cold - $restoreSeconds - $warm
          @{
            result = 'ATLAS_GO_CACHE_BACKEND_DEVELOPMENT_RECEIPT'
            head = (git rev-parse HEAD).Trim()
            runner_image = $env:ImageVersion
            go_version = 'go1.25.5 windows/amd64'
            cache_scope = 'PR462 development branch only'
            exact_backend_cache_hit = $true
            cold_seconds = [math]::Round($cold,6)
            upload_seconds = [math]::Round($upload,6)
            restore_seconds = [math]::Round($restoreSeconds,6)
            restored_warm_seconds = [math]::Round($warm,6)
            net_warm_hit_saved_seconds = [math]::Round($net,6)
            first_use_including_upload_saved_seconds = [math]::Round($net - $upload,6)
            gate = 'DEVELOPMENT_ONLY_NO_FULL_CI_ACCEPTANCE'
            original_checkout_dirty = $false
          } | ConvertTo-Json -Compress | Tee-Object -Variable receipt
          '### Development-only GitHub cache backend transfer (no production promotion)' >> $env:GITHUB_STEP_SUMMARY
          $receipt >> $env:GITHUB_STEP_SUMMARY

  seed_cache:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    name: Windows 2022 Go compiler cache seed (not qualification)
    runs-on: windows-2022
    timeout-minutes: 8
    steps:
      - name: Check out exact protected-main source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up frozen Go compiler
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.25.5'
          cache: false
      - name: Configure runner-local Go compilation cache directory
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          "GOCACHE=$env:RUNNER_TEMP\wingless-atlas-win2022-gocache" >> $env:GITHUB_ENV
      - name: Bind frozen Windows 2022 compiler identity
        id: cache_identity
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:ImageVersion)) { throw 'ATLAS_CACHE_IMAGE_IDENTITY_MISSING' }
          if ((go version).Trim() -ne 'go version go1.25.5 windows/amd64') { throw 'ATLAS_CACHE_TOOLCHAIN_MISMATCH' }
          if ((go env GOFLAGS).Trim() -ne '') { throw 'ATLAS_CACHE_GOFLAGS_DRIFT' }
          $cgo = (go env CGO_ENABLED).Trim()
          $goamd64 = (go env GOAMD64).Trim()
          if ($cgo -notin @('0', '1') -or $goamd64 -notin @('v1', 'v2', 'v3', 'v4')) { throw 'ATLAS_CACHE_GO_ENV_INVALID' }
          "image_version=$env:ImageVersion" >> $env:GITHUB_OUTPUT
          "cgo=$cgo" >> $env:GITHUB_OUTPUT
          "goamd64=$goamd64" >> $env:GITHUB_OUTPUT
      - name: Restore or populate protected-main compiler objects
        id: go_cache
        uses: actions/cache@v4
        with:
          path: ${{ env.GOCACHE }}
          key: wingless-atlas-win2022-go1255-${{ steps.cache_identity.outputs.image_version }}-${{ runner.arch }}-cgo${{ steps.cache_identity.outputs.cgo }}-${{ steps.cache_identity.outputs.goamd64 }}-${{ hashFiles('**/*.go', '**/*.s', '**/*.c', '**/*.h', '**/*.syso', 'go.mod', 'go.sum', 'go.work', 'go.work.sum') }}
      - name: Compile original ICE command without test or acceptance substitution
        if: steps.go_cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          go build -o "$env:RUNNER_TEMP\\wingless-atlas-cache-seed.exe" ./cmd/ice
          if ($LASTEXITCODE -ne 0) { throw 'ATLAS_CACHE_SEED_COMPILE_FAILED' }
          if (@(git status --porcelain).Count -gt 0) { throw 'ATLAS_CACHE_SEED_CHECKOUT_DIRTY' }

  qualify:
    if: github.event_name != 'push'
    name: Read-only Windows Atlas Qualification
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - name: Check out exact proposed Wingless source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python for read-only structural verification
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Verify unconditional PR scope and classify changed files
        id: scope
        shell: pwsh
        env:
          ATLAS_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          ATLAS_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          python -B scripts/atlas_ci_scope.py --root . --self-test
          if ($LASTEXITCODE -ne 0) { throw 'ATLAS_SCOPE_CONTRACT_FAILED' }
          python -B scripts/atlas_ci_scope.py --root . --event "$env:GITHUB_EVENT_NAME" --base "$env:ATLAS_BASE_SHA" --expected-head "$env:ATLAS_EXPECTED_HEAD" --output "$env:GITHUB_OUTPUT"
          if ($LASTEXITCODE -ne 0) { throw 'ATLAS_SCOPE_CLASSIFICATION_FAILED' }

      - name: Set up frozen Go toolchain
        if: steps.scope.outputs.atlas_relevant == 'true'
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.25.5'
          cache: false
      - name: Configure runner-local Go compilation cache directory
        if: steps.scope.outputs.atlas_relevant == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          "GOCACHE=$env:RUNNER_TEMP\wingless-atlas-win2022-gocache" >> $env:GITHUB_ENV

      - name: Bind frozen Windows 2022 compiler identity
        if: steps.scope.outputs.atlas_relevant == 'true'
        id: cache_identity
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:ImageVersion)) { throw 'ATLAS_CACHE_IMAGE_IDENTITY_MISSING' }
          if ((go version).Trim() -ne 'go version go1.25.5 windows/amd64') { throw 'ATLAS_CACHE_TOOLCHAIN_MISMATCH' }
          if ((go env GOFLAGS).Trim() -ne '') { throw 'ATLAS_CACHE_GOFLAGS_DRIFT' }
          $cgo = (go env CGO_ENABLED).Trim()
          $goamd64 = (go env GOAMD64).Trim()
          if ($cgo -notin @('0', '1') -or $goamd64 -notin @('v1', 'v2', 'v3', 'v4')) { throw 'ATLAS_CACHE_GO_ENV_INVALID' }
          "image_version=$env:ImageVersion" >> $env:GITHUB_OUTPUT
          "cgo=$cgo" >> $env:GITHUB_OUTPUT
          "goamd64=$goamd64" >> $env:GITHUB_OUTPUT

      - name: Restore protected-main compiler objects read-only
        if: steps.scope.outputs.atlas_relevant == 'true'
        id: atlas_cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.GOCACHE }}
          key: wingless-atlas-win2022-go1255-${{ steps.cache_identity.outputs.image_version }}-${{ runner.arch }}-cgo${{ steps.cache_identity.outputs.cgo }}-${{ steps.cache_identity.outputs.goamd64 }}-${{ hashFiles('**/*.go', '**/*.s', '**/*.c', '**/*.h', '**/*.syso', 'go.mod', 'go.sum', 'go.work', 'go.work.sum') }}

      - name: Validate source-index freshness and typed relationships
        if: steps.scope.outputs.atlas_relevant == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          go run ./cmd/ice validate
          if ($LASTEXITCODE -ne 0) { throw 'ICE_SOURCE_VALIDATION_FAILED' }
          go run ./cmd/ice relationships > "$env:RUNNER_TEMP\wingless-type-relationships.json"
          if ($LASTEXITCODE -ne 0) { throw 'TYPE_RELATIONSHIP_EXTRACTION_FAILED' }
          python scripts/validate_code_atlas.py --root . --relationships "$env:RUNNER_TEMP\wingless-type-relationships.json"
          if ($LASTEXITCODE -ne 0) { throw 'SEMANTIC_ATLAS_VALIDATION_FAILED' }

      - name: Bounded parallel tamper-negative and genuine Chromium acceptance
        if: steps.scope.outputs.atlas_relevant == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install --disable-pip-version-check --quiet "selenium==4.35.0"
          if ($LASTEXITCODE -ne 0) { throw 'PINNED_SELENIUM_INSTALL_FAILED' }
          $null = Get-Command Start-ThreadJob -ErrorAction Stop
          $root = (Get-Location).Path
          $relationships = Join-Path $env:RUNNER_TEMP 'wingless-type-relationships.json'
          $watch = [Diagnostics.Stopwatch]::StartNew()
          $jobs = @()
          $jobs += Start-ThreadJob -Name atlas-tamper -ArgumentList @($root, $relationships, $env:RUNNER_TEMP) -ScriptBlock {
            param($root, $relationships, $scratch)
            Set-Location $root
            $expectedHead = (git rev-parse HEAD).Trim()
            $output = & python scripts/test_code_atlas_tamper.py --root . --relationships $relationships --scratch-parent $scratch
            if ($LASTEXITCODE -ne 0) { throw 'ATLAS_TAMPER_NEGATIVE_ACCEPTANCE_FAILED' }
            $receipts = @($output | ForEach-Object {
              try { [string]$_ | ConvertFrom-Json -ErrorAction Stop }
              catch { $null }
            } | Where-Object { $_.result -eq 'WINGLESS_ATLAS_NEGATIVE_QUALIFICATION_PASS' })
            if ($receipts.Count -ne 1) { throw 'ATLAS_TAMPER_PASS_RECEIPT_MISSING' }
            $receipt = $receipts[0]
            if ($receipt.head -ne $expectedHead -or
                $receipt.expected_rejections -ne 9 -or
                $receipt.positive_control -ne 'PASS' -or
                $receipt.source_checkout_changed -ne $false) {
              throw 'ATLAS_TAMPER_PASS_RECEIPT_IDENTITY_MISMATCH'
            }
            $output | Write-Output
          }
          $jobs += Start-ThreadJob -Name atlas-browser -ArgumentList @($root) -ScriptBlock {
            param($root)
            Set-Location $root
            $expectedHead = (git rev-parse HEAD).Trim()
            $output = & python -B scripts/test_atlas_browser.py --root .
            if ($LASTEXITCODE -ne 0) { throw 'ATLAS_CHROMIUM_BROWSER_ACCEPTANCE_FAILED' }
            $receipts = @($output | ForEach-Object {
              try { [string]$_ | ConvertFrom-Json -ErrorAction Stop }
              catch { $null }
            } | Where-Object { $_.result -eq 'WINGLESS_ATLAS_CHROMIUM_BROWSER_ACCEPTANCE_PASS' })
            if ($receipts.Count -ne 1) { throw 'ATLAS_CHROMIUM_PASS_RECEIPT_MISSING' }
            $receipt = $receipts[0]
            if ($receipt.browser_test_commit -ne $expectedHead -or
                $receipt.original_checkout_dirty -ne $false -or
                $receipt.steps -notcontains 'actual_click_cross_file_relationship' -or
                $receipt.steps -notcontains 'actual_click_source_link_new_tab' -or
                $receipt.browser -notlike '*real Selenium UI*') {
              throw 'ATLAS_CHROMIUM_PASS_RECEIPT_IDENTITY_MISMATCH'
            }
            $output | Write-Output
          }
          $null = $jobs | Wait-Job
          $failures = @()
          foreach ($job in $jobs) {
            try { Receive-Job -Job $job -ErrorAction Stop | Out-Host }
            catch { $failures += "$($job.Name): $_" }
            if ($job.State -ne 'Completed') { $failures += "$($job.Name): $($job.State)" }
          }
          $jobs | Remove-Job
          if ($failures.Count -gt 0) { throw "ATLAS_PARALLEL_ACCEPTANCE_FAILED" }
          @{ result = 'ATLAS_BOUNDED_PARALLEL_ACCEPTANCE_PASS'; head = (git rev-parse HEAD).Trim(); workers = 2; parallel_wall_seconds = [math]::Round($watch.Elapsed.TotalSeconds, 6); tamper = 'PASS'; genuine_chromium = 'PASS' } | ConvertTo-Json -Compress

      - name: Focused ICE regression
        if: steps.scope.outputs.atlas_relevant == 'true'
        shell: pwsh
        run: |
          go test ./ice
          if ($LASTEXITCODE -ne 0) { throw 'FOCUSED_ICE_TESTS_FAILED' }

      - name: One complete integration regression
        if: steps.scope.outputs.atlas_relevant == 'true'
        shell: pwsh
        run: |
          go test ./...
          if ($LASTEXITCODE -ne 0) { throw 'FULL_GO_REGRESSION_FAILED' }

      - name: Vet, build, and verify clean checkout
        if: steps.scope.outputs.atlas_relevant == 'true'
        shell: pwsh
        run: |
          go vet ./...
          if ($LASTEXITCODE -ne 0) { throw 'GO_VET_FAILED' }
          go build -o "$env:RUNNER_TEMP\wingless-ice-qualification.exe" ./cmd/ice
          if ($LASTEXITCODE -ne 0) { throw 'ICE_BUILD_FAILED' }
          $dirty = @(git status --porcelain)
          if ($dirty.Count -gt 0) { throw "QUALIFICATION_CHECKOUT_DIRTY: $($dirty -join ', ')" }
          "WINGLESS_ATLAS_QUALIFIED_HEAD=$(git rev-parse HEAD)" >> $env:GITHUB_STEP_SUMMARY
          'Code intelligence validation, focused tests, full regression, vet, build, and clean checkout passed.' >> $env:GITHUB_STEP_SUMMARY

      # Diagnostic only. Does not replace acceptance or publish scientific/CI speedup claims.
      - name: Development-only cold and warm compiler comparison
        if: github.event_name == 'pull_request' && github.head_ref == 'engineering/atlas-win2022-sourcebound-main-cache-20261105'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $head = (git rev-parse HEAD).Trim()
          if ($head -notmatch '^[0-9a-f]{40}$') { throw 'ATLAS_DEV_CACHE_SOURCE_SHA_INVALID' }
          if ((go version).Trim() -ne 'go version go1.25.5 windows/amd64') { throw 'ATLAS_DEV_CACHE_GO_VERSION_DRIFT' }
          if ((go env GOCACHEPROG).Trim() -ne '') { throw 'ATLAS_DEV_CACHE_EXTERNAL_HELPER_UNEXPECTED' }
          $scratch = Join-Path $env:RUNNER_TEMP "wingless-atlas-dev-cache-$head"
          if (Test-Path $scratch) { throw 'ATLAS_DEV_CACHE_SCRATCH_NOT_FRESH' }
          New-Item -ItemType Directory -Force $scratch | Out-Null
          $oldGoCache = $env:GOCACHE
          $env:GOCACHE = Join-Path $scratch 'gocache'
          $output = Join-Path $scratch 'ice-benchmark.exe'
          $clock = [Diagnostics.Stopwatch]::StartNew()
          & go build -o $output ./cmd/ice
          if ($LASTEXITCODE -ne 0) { throw 'ATLAS_DEV_CACHE_COLD_BUILD_FAILED' }
          $clock.Stop()
          $coldSeconds = $clock.Elapsed.TotalSeconds
          if (-not (Test-Path $output)) { throw 'ATLAS_DEV_CACHE_COLD_BINARY_MISSING' }
          Remove-Item -LiteralPath $output -Force
          $clock.Restart()
          & go build -o $output ./cmd/ice
          if ($LASTEXITCODE -ne 0) { throw 'ATLAS_DEV_CACHE_WARM_BUILD_FAILED' }
          $clock.Stop()
          $warmSeconds = $clock.Elapsed.TotalSeconds
          if (-not (Test-Path $output)) { throw 'ATLAS_DEV_CACHE_WARM_BINARY_MISSING' }
          $env:GOCACHE = $oldGoCache
          if (@(git status --porcelain).Count -ne 0) { throw 'ATLAS_DEV_CACHE_CHECKOUT_DIRTY' }
          $receipt = @{
            result = 'ATLAS_GO_CACHE_DEVELOPMENT_DIAGNOSTIC'
            source_sha = $head
            runner_image = $env:ImageVersion
            go_version = 'go1.25.5 windows/amd64'
            case = 'fresh Go object cache versus same-cache repeated build'
            cold_seconds = [math]::Round($coldSeconds, 6)
            warm_seconds = [math]::Round($warmSeconds, 6)
            saved_compiler_seconds = [math]::Round($coldSeconds - $warmSeconds, 6)
            diagnostic_threshold_seconds = 8
            exceeds_diagnostic_threshold = (($coldSeconds - $warmSeconds) -ge 8)
            acceptance = 'UNVERIFIED: does not include backend cache transfer or full CI time'
            original_checkout_dirty = $false
          } | ConvertTo-Json -Compress
          $receipt | Write-Output
          '### Development-only Go cache compilation diagnostic' >> $env:GITHUB_STEP_SUMMARY
          $receipt >> $env:GITHUB_STEP_SUMMARY
