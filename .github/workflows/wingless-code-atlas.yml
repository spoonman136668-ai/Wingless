name: Wingless Code Intelligence Qualification
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wingless-atlas-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    name: Read-only Windows Atlas Qualification
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - name: Check out exact proposed Wingless source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python for read-only structural verification
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Verify unconditional PR scope and classify changed files
        id: scope
        shell: pwsh
        env:
          ATLAS_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          ATLAS_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          python -B scripts/atlas_ci_scope.py --root . --self-test
          if ($LASTEXITCODE -ne 0) { throw 'ATLAS_SCOPE_CONTRACT_FAILED' }
          python -B scripts/atlas_ci_scope.py --root . --event "$env:GITHUB_EVENT_NAME" --base "$env:ATLAS_BASE_SHA" --expected-head "$env:ATLAS_EXPECTED_HEAD" --output "$env:GITHUB_OUTPUT"
          if ($LASTEXITCODE -ne 0) { throw 'ATLAS_SCOPE_CLASSIFICATION_FAILED' }

      - name: Set up frozen Go toolchain
        if: steps.scope.outputs.atlas_relevant == 'true'
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.25.5'
          cache: false

      - name: NCI-04D2 exact-head focused native learning checks
        if: steps.scope.outputs.atlas_relevant == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          go test ./cognition ./cmd/wingless-ice-cognition
          if ($LASTEXITCODE -ne 0) { throw 'NCI04D2_FOCUSED_NATIVE_TEST_FAILURE' }

      - name: Validate source-index freshness and typed relationships
        if: steps.scope.outputs.atlas_relevant == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          go run ./cmd/ice validate
          if ($LASTEXITCODE -ne 0) { throw 'ICE_SOURCE_VALIDATION_FAILED' }
          go run ./cmd/ice relationships > "$env:RUNNER_TEMP\wingless-type-relationships.json"
          if ($LASTEXITCODE -ne 0) { throw 'TYPE_RELATIONSHIP_EXTRACTION_FAILED' }
          python scripts/validate_code_atlas.py --root . --relationships "$env:RUNNER_TEMP\wingless-type-relationships.json"
          if ($LASTEXITCODE -ne 0) { throw 'SEMANTIC_ATLAS_VALIDATION_FAILED' }

      - name: Emit NCI-04D2 source-pinned provisional ICE proposal (no write permission)
        if: always() && steps.scope.outputs.atlas_relevant == 'true' && (github.event.pull_request.head.ref == 'research/nci04d2-native-consumer-20261020' || github.event.pull_request.head.ref == 'research/nci04g6-wingless-source-resource-20261021' || github.event.pull_request.head.ref == 'research/nci04g7-native-task-20261021' || github.event.pull_request.head.ref == 'research/nci04g7a-native-causal-contrast-20261021' || github.event.pull_request.head.ref == 'research/nci04h-wingless-causal-partition-20261021')
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -B scripts/nci04d2_emit_atlas.py
          if ($LASTEXITCODE -ne 0) { throw 'NCI04D2_G28_PROVISIONAL_GENERATION_FAILED' }

      - name: Tamper-resistance negative acceptance in disposable exact-head clone
        if: steps.scope.outputs.atlas_relevant == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python scripts/test_code_atlas_tamper.py --root . --relationships "$env:RUNNER_TEMP\wingless-type-relationships.json" --scratch-parent "$env:RUNNER_TEMP"
          if ($LASTEXITCODE -ne 0) { throw 'ATLAS_TAMPER_NEGATIVE_ACCEPTANCE_FAILED' }

      - name: Genuine Chromium browser navigation acceptance
        if: steps.scope.outputs.atlas_relevant == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install --disable-pip-version-check --quiet "selenium==4.35.0"
          if ($LASTEXITCODE -ne 0) { throw 'PINNED_SELENIUM_INSTALL_FAILED' }
          python -B scripts/test_atlas_browser.py --root .
          if ($LASTEXITCODE -ne 0) { throw 'ATLAS_CHROMIUM_BROWSER_ACCEPTANCE_FAILED' }

      - name: Focused ICE regression
        if: steps.scope.outputs.atlas_relevant == 'true'
        shell: pwsh
        run: |
          go test ./ice
          if ($LASTEXITCODE -ne 0) { throw 'FOCUSED_ICE_TESTS_FAILED' }

      - name: One complete integration regression
        if: steps.scope.outputs.atlas_relevant == 'true'
        shell: pwsh
        run: |
          go test ./...
          if ($LASTEXITCODE -ne 0) { throw 'FULL_GO_REGRESSION_FAILED' }

      - name: Vet, build, and verify clean checkout
        if: steps.scope.outputs.atlas_relevant == 'true'
        shell: pwsh
        run: |
          go vet ./...
          if ($LASTEXITCODE -ne 0) { throw 'GO_VET_FAILED' }
          go build -o "$env:RUNNER_TEMP\wingless-ice-qualification.exe" ./cmd/ice
          if ($LASTEXITCODE -ne 0) { throw 'ICE_BUILD_FAILED' }
          $dirty = @(git status --porcelain)
          if ($dirty.Count -gt 0) { throw "QUALIFICATION_CHECKOUT_DIRTY: $($dirty -join ', ')" }
          "WINGLESS_ATLAS_QUALIFIED_HEAD=$(git rev-parse HEAD)" >> $env:GITHUB_STEP_SUMMARY
          'Code intelligence validation, focused tests, full regression, vet, build, and clean checkout passed.' >> $env:GITHUB_STEP_SUMMARY
