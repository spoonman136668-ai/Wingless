name: Wingless Code Intelligence Qualification
on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wingless-code-atlas.yml'
      - '**/*.go'
      - '**/*.s'
      - '**/*.c'
      - '**/*.h'
      - '**/*.syso'
      - 'go.mod'
      - 'go.sum'
      - 'go.work'
      - 'go.work.sum'

permissions:
  contents: read

concurrency:
  group: wingless-atlas-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  seed_cache:
    if: github.event_name == 'push'
    name: Windows 2022 Go compiler cache seed (not qualification)
    runs-on: windows-2022
    timeout-minutes: 8
    steps:
      - name: Check out exact protected-main source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up frozen Go compiler
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.25.5'
          cache: false
      - name: Configure runner-local Go compilation cache directory
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          "GOCACHE=$env:RUNNER_TEMP\wingless-atlas-win2022-gocache" >> $env:GITHUB_ENV
      - name: Bind frozen Windows 2022 compiler identity
        id: cache_identity
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:ImageVersion)) { throw 'ATLAS_CACHE_IMAGE_IDENTITY_MISSING' }
          if ((go version).Trim() -ne 'go version go1.25.5 windows/amd64') { throw 'ATLAS_CACHE_TOOLCHAIN_MISMATCH' }
          if ((go env GOFLAGS).Trim() -ne '') { throw 'ATLAS_CACHE_GOFLAGS_DRIFT' }
          $cgo = (go env CGO_ENABLED).Trim()
          $goamd64 = (go env GOAMD64).Trim()
          if ($cgo -notin @('0', '1') -or $goamd64 -notin @('v1', 'v2', 'v3', 'v4')) { throw 'ATLAS_CACHE_GO_ENV_INVALID' }
          "image_version=$env:ImageVersion" >> $env:GITHUB_OUTPUT
          "cgo=$cgo" >> $env:GITHUB_OUTPUT
          "goamd64=$goamd64" >> $env:GITHUB_OUTPUT
      - name: Restore or populate protected-main compiler objects
        id: go_cache
        uses: actions/cache@v4
        with:
          path: ${{ env.GOCACHE }}
          key: wingless-atlas-win2022-go1255-${{ steps.cache_identity.outputs.image_version }}-${{ runner.arch }}-cgo${{ steps.cache_identity.outputs.cgo }}-${{ steps.cache_identity.outputs.goamd64 }}-${{ hashFiles('**/*.go', '**/*.s', '**/*.c', '**/*.h', '**/*.syso', 'go.mod', 'go.sum', 'go.work', 'go.work.sum') }}
      - name: Compile original ICE command without test or acceptance substitution
        if: steps.go_cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          go build -o "$env:RUNNER_TEMP\\wingless-atlas-cache-seed.exe" ./cmd/ice
          if ($LASTEXITCODE -ne 0) { throw 'ATLAS_CACHE_SEED_COMPILE_FAILED' }
          if (@(git status --porcelain).Count -gt 0) { throw 'ATLAS_CACHE_SEED_CHECKOUT_DIRTY' }

  qualify:
    if: github.event_name != 'push'
    name: Read-only Windows Atlas Qualification
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - name: Check out exact proposed Wingless source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python for read-only structural verification
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Verify unconditional PR scope and classify changed files
        id: scope
        shell: pwsh
        env:
          ATLAS_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          ATLAS_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          python -B scripts/atlas_ci_scope.py --root . --self-test
          if ($LASTEXITCODE -ne 0) { throw 'ATLAS_SCOPE_CONTRACT_FAILED' }
          python -B scripts/atlas_ci_scope.py --root . --event "$env:GITHUB_EVENT_NAME" --base "$env:ATLAS_BASE_SHA" --expected-head "$env:ATLAS_EXPECTED_HEAD" --output "$env:GITHUB_OUTPUT"
          if ($LASTEXITCODE -ne 0) { throw 'ATLAS_SCOPE_CLASSIFICATION_FAILED' }

      - name: Set up frozen Go toolchain
        if: steps.scope.outputs.atlas_relevant == 'true'
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.25.5'
          cache: false
      - name: Configure runner-local Go compilation cache directory
        if: steps.scope.outputs.atlas_relevant == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          "GOCACHE=$env:RUNNER_TEMP\wingless-atlas-win2022-gocache" >> $env:GITHUB_ENV

      - name: Bind frozen Windows 2022 compiler identity
        if: steps.scope.outputs.atlas_relevant == 'true'
        id: cache_identity
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:ImageVersion)) { throw 'ATLAS_CACHE_IMAGE_IDENTITY_MISSING' }
          if ((go version).Trim() -ne 'go version go1.25.5 windows/amd64') { throw 'ATLAS_CACHE_TOOLCHAIN_MISMATCH' }
          if ((go env GOFLAGS).Trim() -ne '') { throw 'ATLAS_CACHE_GOFLAGS_DRIFT' }
          $cgo = (go env CGO_ENABLED).Trim()
          $goamd64 = (go env GOAMD64).Trim()
          if ($cgo -notin @('0', '1') -or $goamd64 -notin @('v1', 'v2', 'v3', 'v4')) { throw 'ATLAS_CACHE_GO_ENV_INVALID' }
          "image_version=$env:ImageVersion" >> $env:GITHUB_OUTPUT
          "cgo=$cgo" >> $env:GITHUB_OUTPUT
          "goamd64=$goamd64" >> $env:GITHUB_OUTPUT

      - name: Restore protected-main compiler objects read-only
        if: steps.scope.outputs.atlas_relevant == 'true'
        id: atlas_cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.GOCACHE }}
          key: wingless-atlas-win2022-go1255-${{ steps.cache_identity.outputs.image_version }}-${{ runner.arch }}-cgo${{ steps.cache_identity.outputs.cgo }}-${{ steps.cache_identity.outputs.goamd64 }}-${{ hashFiles('**/*.go', '**/*.s', '**/*.c', '**/*.h', '**/*.syso', 'go.mod', 'go.sum', 'go.work', 'go.work.sum') }}

      - name: Validate source-index freshness and typed relationships
        if: steps.scope.outputs.atlas_relevant == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          go run ./cmd/ice validate
          if ($LASTEXITCODE -ne 0) { throw 'ICE_SOURCE_VALIDATION_FAILED' }
          go run ./cmd/ice relationships > "$env:RUNNER_TEMP\wingless-type-relationships.json"
          if ($LASTEXITCODE -ne 0) { throw 'TYPE_RELATIONSHIP_EXTRACTION_FAILED' }
          python scripts/validate_code_atlas.py --root . --relationships "$env:RUNNER_TEMP\wingless-type-relationships.json"
          if ($LASTEXITCODE -ne 0) { throw 'SEMANTIC_ATLAS_VALIDATION_FAILED' }

      - name: Bounded parallel tamper-negative and genuine Chromium acceptance
        if: steps.scope.outputs.atlas_relevant == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install --disable-pip-version-check --quiet "selenium==4.35.0"
          if ($LASTEXITCODE -ne 0) { throw 'PINNED_SELENIUM_INSTALL_FAILED' }
          $null = Get-Command Start-ThreadJob -ErrorAction Stop
          $root = (Get-Location).Path
          $relationships = Join-Path $env:RUNNER_TEMP 'wingless-type-relationships.json'
          $watch = [Diagnostics.Stopwatch]::StartNew()
          $jobs = @()
          $jobs += Start-ThreadJob -Name atlas-tamper -ArgumentList @($root, $relationships, $env:RUNNER_TEMP) -ScriptBlock {
            param($root, $relationships, $scratch)
            Set-Location $root
            $expectedHead = (git rev-parse HEAD).Trim()
            $output = & python scripts/test_code_atlas_tamper.py --root . --relationships $relationships --scratch-parent $scratch
            if ($LASTEXITCODE -ne 0) { throw 'ATLAS_TAMPER_NEGATIVE_ACCEPTANCE_FAILED' }
            $receipts = @($output | ForEach-Object {
              try { [string]$_ | ConvertFrom-Json -ErrorAction Stop }
              catch { $null }
            } | Where-Object { $_.result -eq 'WINGLESS_ATLAS_NEGATIVE_QUALIFICATION_PASS' })
            if ($receipts.Count -ne 1) { throw 'ATLAS_TAMPER_PASS_RECEIPT_MISSING' }
            $receipt = $receipts[0]
            if ($receipt.head -ne $expectedHead -or
                $receipt.expected_rejections -ne 9 -or
                $receipt.positive_control -ne 'PASS' -or
                $receipt.source_checkout_changed -ne $false) {
              throw 'ATLAS_TAMPER_PASS_RECEIPT_IDENTITY_MISMATCH'
            }
            $output | Write-Output
          }
          $jobs += Start-ThreadJob -Name atlas-browser -ArgumentList @($root) -ScriptBlock {
            param($root)
            Set-Location $root
            $expectedHead = (git rev-parse HEAD).Trim()
            $output = & python -B scripts/test_atlas_browser.py --root .
            if ($LASTEXITCODE -ne 0) { throw 'ATLAS_CHROMIUM_BROWSER_ACCEPTANCE_FAILED' }
            $receipts = @($output | ForEach-Object {
              try { [string]$_ | ConvertFrom-Json -ErrorAction Stop }
              catch { $null }
            } | Where-Object { $_.result -eq 'WINGLESS_ATLAS_CHROMIUM_BROWSER_ACCEPTANCE_PASS' })
            if ($receipts.Count -ne 1) { throw 'ATLAS_CHROMIUM_PASS_RECEIPT_MISSING' }
            $receipt = $receipts[0]
            if ($receipt.browser_test_commit -ne $expectedHead -or
                $receipt.original_checkout_dirty -ne $false -or
                $receipt.steps -notcontains 'actual_click_cross_file_relationship' -or
                $receipt.steps -notcontains 'actual_click_source_link_new_tab' -or
                $receipt.browser -notlike '*real Selenium UI*') {
              throw 'ATLAS_CHROMIUM_PASS_RECEIPT_IDENTITY_MISMATCH'
            }
            $output | Write-Output
          }
          $null = $jobs | Wait-Job
          $failures = @()
          foreach ($job in $jobs) {
            try { Receive-Job -Job $job -ErrorAction Stop | Out-Host }
            catch { $failures += "$($job.Name): $_" }
            if ($job.State -ne 'Completed') { $failures += "$($job.Name): $($job.State)" }
          }
          $jobs | Remove-Job
          if ($failures.Count -gt 0) { throw "ATLAS_PARALLEL_ACCEPTANCE_FAILED" }
          @{ result = 'ATLAS_BOUNDED_PARALLEL_ACCEPTANCE_PASS'; head = (git rev-parse HEAD).Trim(); workers = 2; parallel_wall_seconds = [math]::Round($watch.Elapsed.TotalSeconds, 6); tamper = 'PASS'; genuine_chromium = 'PASS' } | ConvertTo-Json -Compress

      - name: Focused ICE regression
        if: steps.scope.outputs.atlas_relevant == 'true'
        shell: pwsh
        run: |
          go test ./ice
          if ($LASTEXITCODE -ne 0) { throw 'FOCUSED_ICE_TESTS_FAILED' }

      - name: One complete integration regression
        if: steps.scope.outputs.atlas_relevant == 'true'
        shell: pwsh
        run: |
          go test ./...
          if ($LASTEXITCODE -ne 0) { throw 'FULL_GO_REGRESSION_FAILED' }

      - name: Vet, build, and verify clean checkout
        if: steps.scope.outputs.atlas_relevant == 'true'
        shell: pwsh
        run: |
          go vet ./...
          if ($LASTEXITCODE -ne 0) { throw 'GO_VET_FAILED' }
          go build -o "$env:RUNNER_TEMP\wingless-ice-qualification.exe" ./cmd/ice
          if ($LASTEXITCODE -ne 0) { throw 'ICE_BUILD_FAILED' }
          $dirty = @(git status --porcelain)
          if ($dirty.Count -gt 0) { throw "QUALIFICATION_CHECKOUT_DIRTY: $($dirty -join ', ')" }
          "WINGLESS_ATLAS_QUALIFIED_HEAD=$(git rev-parse HEAD)" >> $env:GITHUB_STEP_SUMMARY
          'Code intelligence validation, focused tests, full regression, vet, build, and clean checkout passed.' >> $env:GITHUB_STEP_SUMMARY
