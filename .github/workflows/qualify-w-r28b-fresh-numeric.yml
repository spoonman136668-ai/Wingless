name: W-R28B frozen fresh causal numeric next-byte science
on:
  push:
    branches: [research/w-r28b-fresh-causal-numeric-r1]
permissions:
  contents: read
jobs:
  science:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Freeze original identity and disjoint cohort
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 859d4af60957941fa3c28dd0c41841c42296d5df HEAD
          test "$(git hash-object research/contrib/chatgpt/20261013-w-r27-second-order/execute.py)" = 3a1b97bc63a78e57227c9d7799678b7d39d698bc
          test "$(git hash-object research/contrib/chatgpt/20261013-w-r28b-numeric/prereg.json)" = 4eaab32711ce2b14125433ebcae2477be5fd18a4
          test "$(git hash-object research/contrib/chatgpt/20261013-w-r28b-numeric/execute.py)" = e0a83a1e5866b00fa1ac10a3973381b58f101561
          python3 -m json.tool research/contrib/chatgpt/20261013-w-r28b-numeric/prereg.json >/dev/null
          python3 -m py_compile research/contrib/chatgpt/20261013-w-r28b-numeric/execute.py
      - name: Original fresh-cohort numerical forecast
        run: |
          set -euo pipefail
          python3 -B research/contrib/chatgpt/20261013-w-r28b-numeric/execute.py > /tmp/W-R28B-original.json
          python3 -m json.tool /tmp/W-R28B-original.json >/dev/null
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/W-R28B-original.json'))
          assert len(x['heldout_cells'])==27
          assert x['sealed_heldout_seeds']==list(range(480,496))
          print('CLASSIFICATION',x['classification'])
          print('AFFINE_VELOCITY_GAIN',x['affine_velocity_gain'])
          print('QUADRATIC_ACCELERATION_GAIN',x['quadratic_acceleration_gain'])
          print('GLOBAL_DEV_CHOICE',x['development_only_selected_model'])
          for c in x['heldout_cells']:
              if c['amplitude']==3:print(c['generator'],c['predictor'],c['circular_mae'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: W-R28B-original-fresh-numeric
          path: /tmp/W-R28B-original.json
          retention-days: 90
          if-no-files-found: error
      - name: One full Wingless regression
        run: go test ./... && go build ./...
