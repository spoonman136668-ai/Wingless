name: Wingless isolated full Atlas parallel critical-path comparison
on:
  push:
    branches: [experiment/atlas-parallel-timing-20261104]
    paths: ['.github/workflows/atlas-full-parallel-probe.yml']
permissions:
  contents: read
jobs:
  browser:
    name: Full Atlas Chromium browser lane
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - name: Checkout qualified source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 7f31b05cc274a1769c117567911d8a55030e5758
          fetch-depth: 0
          persist-credentials: false
      - name: Verify frozen source identity
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git rev-parse HEAD).Trim() -ne '7f31b05cc274a1769c117567911d8a55030e5758') { throw 'SOURCE_DRIFT' }
          if (git status --porcelain) { throw 'DIRTY_SOURCE' }
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned Selenium and run genuine browser acceptance
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check --quiet 'selenium==4.35.0'
          if ($LASTEXITCODE -ne 0) { throw 'PINNED_SELENIUM_FAILED' }
          python -B scripts/test_atlas_browser.py --root .
          if ($LASTEXITCODE -ne 0) { throw 'CHROMIUM_ACCEPTANCE_FAILED' }
      - name: Enforce clean qualified source checkout
        shell: pwsh
        run: |
          if (git status --porcelain) { throw 'SOURCE_CHECKOUT_MUTATED' }
          if ((git rev-parse HEAD).Trim() -ne '7f31b05cc274a1769c117567911d8a55030e5758') { throw 'SOURCE_DRIFT' }
  tamper:
    name: Full Atlas tamper-negative lane
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - name: Checkout qualified source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 7f31b05cc274a1769c117567911d8a55030e5758
          fetch-depth: 0
          persist-credentials: false
      - name: Verify frozen source identity
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git rev-parse HEAD).Trim() -ne '7f31b05cc274a1769c117567911d8a55030e5758') { throw 'SOURCE_DRIFT' }
          if (git status --porcelain) { throw 'DIRTY_SOURCE' }
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Set up frozen Go 1.25.5
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: '1.25.5'
          cache: false
      - name: Build authentic typed relationships and validate source-index
        shell: pwsh
        run: |
          go run ./cmd/ice validate
          if ($LASTEXITCODE -ne 0) { throw 'ICE_STALE' }
          go run ./cmd/ice relationships > "$env:RUNNER_TEMP\wingless-typed.json"
          if ($LASTEXITCODE -ne 0) { throw 'TYPED_RELATIONS_FAILED' }
          python -B scripts/validate_code_atlas.py --root . --relationships "$env:RUNNER_TEMP\wingless-typed.json"
          if ($LASTEXITCODE -ne 0) { throw 'ATLAS_VALIDATION_FAILED' }
      - name: Run complete original tamper-negative suite
        shell: pwsh
        run: |
          python -B scripts/test_code_atlas_tamper.py --root . --relationships "$env:RUNNER_TEMP\wingless-typed.json" --scratch-parent "$env:RUNNER_TEMP"
          if ($LASTEXITCODE -ne 0) { throw 'TAMPER_NEGATIVE_FAILED' }
      - name: Enforce clean qualified source checkout
        shell: pwsh
        run: |
          if (git status --porcelain) { throw 'SOURCE_CHECKOUT_MUTATED' }
          if ((git rev-parse HEAD).Trim() -ne '7f31b05cc274a1769c117567911d8a55030e5758') { throw 'SOURCE_DRIFT' }
  integration:
    name: Full Atlas native integration lane
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - name: Checkout qualified source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 7f31b05cc274a1769c117567911d8a55030e5758
          fetch-depth: 0
          persist-credentials: false
      - name: Verify frozen source identity
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git rev-parse HEAD).Trim() -ne '7f31b05cc274a1769c117567911d8a55030e5758') { throw 'SOURCE_DRIFT' }
          if (git status --porcelain) { throw 'DIRTY_SOURCE' }
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Set up frozen Go 1.25.5
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: '1.25.5'
          cache: false
      - name: Verify Atlas scope self-test unconditionally
        shell: pwsh
        run: |
          python -B scripts/atlas_ci_scope.py --root . --self-test
          if ($LASTEXITCODE -ne 0) { throw 'ATLAS_SCOPE_SELF_TEST_FAILED' }
      - name: Focused ICE tests
        shell: pwsh
        run: |
          go test ./ice
          if ($LASTEXITCODE -ne 0) { throw 'FOCUSED_ICE_FAILED' }
      - name: Complete native Go integration regression
        shell: pwsh
        run: |
          go test ./...
          if ($LASTEXITCODE -ne 0) { throw 'INTEGRATION_FAILED' }
      - name: Vet and build original ICE command
        shell: pwsh
        run: |
          go vet ./...
          if ($LASTEXITCODE -ne 0) { throw 'VET_FAILED' }
          go build -o "$env:RUNNER_TEMP\wingless-ice-qualification.exe" ./cmd/ice
          if ($LASTEXITCODE -ne 0) { throw 'ICE_BUILD_FAILED' }
      - name: Enforce clean qualified source checkout
        shell: pwsh
        run: |
          if (git status --porcelain) { throw 'SOURCE_CHECKOUT_MUTATED' }
          if ((git rev-parse HEAD).Trim() -ne '7f31b05cc274a1769c117567911d8a55030e5758') { throw 'SOURCE_DRIFT' }
  aggregate:
    name: Isolated aggregate Atlas qualification (not production required status)
    runs-on: ubuntu-latest
    needs: [browser, tamper, integration]
    if: always()
    timeout-minutes: 3
    steps:
      - name: Fail closed on every native lane and state
        shell: bash
        env:
          BROWSER_RESULT: ${{ needs.browser.result }}
          TAMPER_RESULT: ${{ needs.tamper.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
        run: |
          set -euo pipefail
          test "$BROWSER_RESULT" = success
          test "$TAMPER_RESULT" = success
          test "$INTEGRATION_RESULT" = success
          echo "FROZEN_QUALIFIED_SOURCE=7f31b05cc274a1769c117567911d8a55030e5758" >> "$GITHUB_STEP_SUMMARY"
          echo 'All browser, tamper and integration lanes passed independently; experiment only.' >> "$GITHUB_STEP_SUMMARY"
