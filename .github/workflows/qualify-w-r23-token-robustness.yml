name: W-R23 frozen mask token research
on:
  push:
    branches: [research/w-r23-mask-token-robustness-r1]
permissions:
  contents: read
jobs:
  qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Validate preregistration and immutable source
        run: |
          set -euo pipefail
          git merge-base --is-ancestor c551d41a7b8d4f77b9349033fa788d621a800519 HEAD
          test "$(git hash-object research/contrib/chatgpt/20261013-w-r23-token-robustness/prereg.json)" = 835ae4c86480247debe48ee3bfc787b4f2ca2421
          test "$(git hash-object research/contrib/chatgpt/20261013-w-r23-token-robustness/execute.py)" = a634867731b37ac9aafc5ad839f768037aadb34e
      - name: Original science
        run: |
          python3 -B research/contrib/chatgpt/20261013-w-r23-token-robustness/execute.py > /tmp/W-R23-original.json
          python3 -m json.tool /tmp/W-R23-original.json > /dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: W-R23-original
          path: /tmp/W-R23-original.json
          if-no-files-found: error
      - name: Full regression
        run: go test ./... && go build ./...
