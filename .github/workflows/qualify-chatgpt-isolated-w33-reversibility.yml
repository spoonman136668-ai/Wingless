name: W-R33 frozen original scientific qualification
on:
  push:
    branches: [research/chatgpt-isolated-w33-reversible-dynamics-20261013]
permissions:
  contents: read
jobs:
  original:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Freeze original parent and evaluator inputs
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 9a83922dc60d32c194477982aa38445dabdb77df HEAD
          test "$(git hash-object research/contrib/chatgpt/20261013-w-r26-latent-alphabet/execute.py)" = 7632546ca681c3c8fec66991ffc9468ab34e0d07
          test "$(git hash-object research/contrib/chatgpt/20261013-isolated-w33-reversible-regime/prereg.json)" = 3495cd6aebe2c370fd5f2a2bd881068b46cb3da7
          test "$(git hash-object research/contrib/chatgpt/20261013-isolated-w33-reversible-regime/execute.py)" = c61040e4c1709b611488aa67f529788edfedecb8
          python3 -m json.tool research/contrib/chatgpt/20261013-isolated-w33-reversible-regime/prereg.json > /dev/null
          python3 -m py_compile research/contrib/chatgpt/20261013-isolated-w33-reversible-regime/execute.py
      - name: Original first-use W-R33 experiment
        run: |
          set -euo pipefail
          python3 -B research/contrib/chatgpt/20261013-isolated-w33-reversible-regime/execute.py > /tmp/W-R33-original.json
          python3 -m json.tool /tmp/W-R33-original.json > /dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: W-R33-original-first-use
          path: /tmp/W-R33-original.json
          retention-days: 90
          if-no-files-found: error
      - name: Full repository regression
        run: go test ./... && go build ./...
