name: Repo Local Cutover Read Only Probe

on:
  push:
    branches:
      - diagnostic/repo-local-cutover-r1
    paths:
      - '.github/workflows/repo-local-cutover-probe.yml'
      - 'scripts/Probe-RepoLocalCutover.ps1'
      - 'scripts/Probe-RepoLocalLatest.ps1'

permissions:
  contents: read

jobs:
  probe:
    runs-on: [self-hosted, Windows, X64, wingless-up-b]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Inspect sidecar handoff state
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          ./scripts/Probe-RepoLocalLatest.ps1
