name: Nemotron configuration probe

on:
  push:
    branches:
      - diagnostic/repo-local-cutover-r1
    paths:
      - 'scripts/Probe-NemotronConfig.ps1'
      - '.github/workflows/probe-nemotron-config.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: [self-hosted, Windows, X64, wingless-up-b]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Inspect existing Nemotron/OpenRouter wiring
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          ./scripts/Probe-NemotronConfig.ps1
