name: ITD-02 prospective v2 source exposure (exploratory)
on:
  push:
    branches: [research/itd02-exact-exposure-v2-sourcefree-20261027]
    paths: ['.github/workflows/itd02-exact-exposure-v2-prospective.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prospective-source-exposure:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Verify pinned prospective source
        shell: bash
        run: |
          test "$(git diff --name-only 044d63e516a78777b10027279f2a7c0dba25793a HEAD | sort -u)" = ".github/workflows/itd02-exact-exposure-v2-prospective.yml"
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: '1.25.5'
          cache: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install authentic source world dependency versions
        run: python -m pip install 'minigrid==2.3.1' 'gymnasium==0.29.1'
      - name: Run source-free boundary gate first
        run: |
          cd research/native/itd02/outcome
          python -m unittest -v test_exact_exposure_v2
      - name: Build native learner
        run: go build -o "$RUNNER_TEMP/itd02-outcomebridge" ./research/native/itd02/outcomebridge
      - name: Prospective v2 genuine source exposure and frozen controls
        run: python research/native/itd02/outcome/exact_exposure_v2.py --native-binary "$RUNNER_TEMP/itd02-outcomebridge" --output "$RUNNER_TEMP/itd02-exact-exposure-v2.json" --run-source
      - name: Fail closed on counts, source identity and acceptance
        run: |
          python - <<'PY'
          import json,os,pathlib
          r=json.loads((pathlib.Path(os.environ["RUNNER_TEMP"])/"itd02-exact-exposure-v2.json").read_text())
          assert r["science"]=="NOT_ACCEPTED"
          assert r["training_interactions"]=={"reward_aware":256,"reward_blind":256,"linear_q":256}
          assert r["train_seeds_allowed"]==[181,191,193,197,199,211,223,227,271,277,281,283]
          assert r["test_seeds"]==[229,233,239,241,251,257,263,269]
          assert all(len(v)==8 for v in r["evaluation"].values())
          print("PROSPECTIVE_EXACT_EXPOSURE_V2_EXPLORATORY_PASS_NOT_ACCEPTED")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: itd02-exact-exposure-v2-exploratory
          path: ${{ runner.temp }}/itd02-exact-exposure-v2.json
          if-no-files-found: warn
          retention-days: 7
