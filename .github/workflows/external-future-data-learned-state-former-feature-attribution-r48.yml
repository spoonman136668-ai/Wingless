name: Wingless learned state-former feature attribution R48
on:
  push:
    branches:
      - 'research/external-hosted-wingless-rsi-state-former-feature-attribution-r48'
    paths:
      - 'docs/experiments/wlm-lm-external-future-data-learned-state-former-feature-attribution-r48.json'
      - 'docs/experiments/wlm-lm-external-future-data-r48-manifest.json'
      - 'unitary/wlm_lm_external_future_data_learned_state_former_feature_attribution_r48.go'
      - 'cmd/wlm-lm-external-future-data-learned-state-former-feature-attribution-r48/main.go'
      - 'research/fanout/r48_package_audit.py'
      - '.github/workflows/external-future-data-learned-state-former-feature-attribution-r48.yml'
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Validate frozen package
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor '465609d9845adfa464af363d00313b9d1d10698e' HEAD
          git merge-base --is-ancestor 'd39cd28bcf2543f331ac4557ac5e6a3cc37500c5' HEAD
          changed="$(git diff --name-only '465609d9845adfa464af363d00313b9d1d10698e..HEAD' | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/external-future-data-learned-state-former-feature-attribution-r48.yml' \
            'cmd/wlm-lm-external-future-data-learned-state-former-feature-attribution-r48/main.go' \
            'docs/experiments/wlm-lm-external-future-data-learned-state-former-feature-attribution-r48.json' \
            'docs/experiments/wlm-lm-external-future-data-r48-manifest.json' \
            'research/fanout/r48_package_audit.py' \
            'unitary/wlm_lm_external_future_data_learned_state_former_feature_attribution_r48.go' | sort)"
          test "$changed" = "$expected"
          test "$(git rev-parse 'd39cd28bcf2543f331ac4557ac5e6a3cc37500c5:docs/experiments/wlm-lm-external-future-data-learned-state-former-feature-attribution-r48.json')" = '2d63f093e9b7d06b7f5ad1ef6d427bbb12496301'
          test "$(git rev-parse 'd39cd28bcf2543f331ac4557ac5e6a3cc37500c5:docs/experiments/wlm-lm-external-future-data-r48-manifest.json')" = '83b988f17ad4c51351dce390ba0b8eeafb1e3595'
          python3 - <<'PY'
          import json
          p=json.load(open("docs/experiments/wlm-lm-external-future-data-learned-state-former-feature-attribution-r48.json"))
          m=json.load(open("docs/experiments/wlm-lm-external-future-data-r48-manifest.json"))
          assert p["experiment"]=="WLM-LM-EXTERNAL-FUTURE-DATA-LEARNED-STATE-FORMER-FEATURE-ATTRIBUTION-R48"
          assert p["r47_frozen_mechanism"]["selected_candidate"]=="three-group-alpha"
          assert p["r47_frozen_mechanism"]["selected_group_alphas"]==[0.75,0.125,1]
          assert p["attribution_arms"]["count"]==4
          assert p["raw_state"]["state_dimension"]==6
          assert p["raw_state"]["readout_parameters_including_intercept"]==7
          assert p["resource_envelope"]["total_adaptation_budget"]==1744
          assert p["governance"]["broad_continual_training"] is False
          assert m["manifest_sha256"]=="73c4bcdb292a27ccd403ef691db09c9ec436ad137d907423615fe69cced8b1fb"
          assert m["source_count"]==9 and m["total_prefix_bytes"]==171816
          PY
      - name: Verify exact READY_RESEARCH receipt
        shell: bash
        env:
          AUTHORITY_RECEIPT_SHA256: 'd35b41f38909e182cb0d9eb92704a34b124cc5616ed73ed8e1f0706301ffd24d'
          AUTHORITY_RECEIPT_B64: ''
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,hashlib,json,os,pathlib
          raw=base64.b64decode(os.environ["AUTHORITY_RECEIPT_B64"],validate=True)
          assert hashlib.sha256(raw).hexdigest()==os.environ["AUTHORITY_RECEIPT_SHA256"]
          r=json.loads(raw)
          assert r["schema"]=="ckb-plane.external-exposure-ready-research-receipt.v1"
          assert r["project"]=="Wingless"
          assert r["experiment"]=="WLM-LM-EXTERNAL-FUTURE-DATA-LEARNED-STATE-FORMER-FEATURE-ATTRIBUTION-R48"
          assert r["preregistration_sha"]=="d39cd28bcf2543f331ac4557ac5e6a3cc37500c5"
          assert r["manifest_sha256"]=="73c4bcdb292a27ccd403ef691db09c9ec436ad137d907423615fe69cced8b1fb"
          assert r["ckb_plane_main_sha"]=="0c2a1d2093eb7fbe587c8330371d6ee558ac2ee3"
          assert r["plan_decision"]["disposition"]=="READY_PLAN"
          assert r["fetch_decision"]["disposition"]=="READY_FETCH"
          assert r["research_decision"]["disposition"]=="READY_RESEARCH"
          pathlib.Path("/tmp/authority.json").write_bytes(raw)
          PY
      - name: Fetch frozen historical and sealed unseen manifests
        shell: bash
        run: |
          set -euo pipefail
          for n in transfer third fourth fifth eighteenth nineteenth twentieth; do mkdir -p "$RUNNER_TEMP/r48-$n"; done
          python3 - <<'PY'
          import hashlib,json,os,pathlib,urllib.parse,urllib.request
          root=pathlib.Path(os.environ["RUNNER_TEMP"])
          roots={n:root/("r48-"+n) for n in ("transfer","third","fourth","fifth","eighteenth","nineteenth","twentieth")}
          historical={
            "transfer":[
              ("code","https://raw.githubusercontent.com/python/cpython/ebf955df7a89ed0c7968f79faec1de49f61ed7cb/Lib/statistics.py",61896,"3023ec949802c2e880a000775bfd1a6b70c21b5423881118141e3ec69d8e3336",41453,"66bb25b24a0316b4965c64798494de93a1d7332672b15b5f430ab6a2fb4b9d45"),
              ("structured","https://raw.githubusercontent.com/json-schema-org/JSON-Schema-Test-Suite/5b0ee1613e45fcc2bddac00e07c19cd49b00d8a8/tests/draft2020-12/uniqueItems.json",14490,"ed84ef6ddc827659e257ba64cbe9679f06932b6320bea5c07622bf3d2cc4daa5",14365,"95ddbd0eaef29aad5ecfc74f9da21b795481f58b2c59380324a445fcd4d08932"),
              ("technical_prose","https://raw.githubusercontent.com/golang/go/6f5c275ebdc454197fff5f1496521c8f81e20eef/doc/README.md",3124,"c1bf000e7a873b3afed329c5b9f9c07f7692b1d7fb2bfca2d7600cec8b1d1407",1454,"48c3d95b8b03864a4af41d892710675956cde85afd0d5d6c331594de9f17881b")],
            "third":[
              ("code","https://raw.githubusercontent.com/torvalds/linux/a74306e2e676f9775457366fc047a660fbf02f26/kernel/sched/core.c",303863,"9297982652b9810b3508993c06d3c6e097ebca5cbe1ef3a6246bccfa0c1128b1",41453,"50744a9e70d67d62c97f3f434f4f05788b6b8514c6bce46cf7dafbaf49e2abff"),
              ("structured","https://raw.githubusercontent.com/SchemaStore/schemastore/de76181a2ab215431d3e9314bc14f83cc3b01ad2/src/schemas/json/github-workflow.json",118601,"d10c9f4656e1bd5bc6727e9b35080e017dc167154726fca93da33c7a6bd1c4f3",14365,"2a97ba02bc5e479b1738f6f0c3e09318bb5a255350c84de014ddbcebea46af56"),
              ("technical_prose","https://raw.githubusercontent.com/rust-lang/book/1500248d8f230566e4ec9f27fcbb8fe9e2898ab1/src/ch01-03-hello-cargo.md",11025,"61369f359b84b646fc3773eb569a26bc18ba6edb4cf2be06a84472c7054c0e39",1454,"23c002a1984ed065abfdbafa82100ed54d6bf6276a947676e710a30c75d96017")],
            "fourth":[
              ("code","https://raw.githubusercontent.com/kubernetes/kubernetes/e7967bb9b76d43a6388abb7a4e90d2f899ef97ff/pkg/kubelet/kubelet.go",156626,"e0f247ef45cb281166b58ba1a013dc6925023388193bd74c1f126c695b770d34",41453,"283073d9f6c0dd868c39a913364bce6744ff1e29c038f6920197c0d33e0c2ac1"),
              ("structured","https://raw.githubusercontent.com/microsoft/TypeScript/50d70a3f5f453a79a4323b263165da51f656a4e3/package-lock.json",143844,"52b6c9bd0a26ef1b0fc27dfbfaa00df6a047cdddd587d07c4f6c1c3345faf5cf",14365,"a46fcfb7d862b03b750b61a5f667d4ac25a064df9ccb746e395db7e864068933"),
              ("technical_prose","https://raw.githubusercontent.com/django/django/a461af8ce48762d7ec602260aaff81014ddccbcb/docs/intro/tutorial01.txt",10844,"1cf1817e6211b7c0fa9e8044ee808fde1e8f16ca5f9d5ab5358510a5c9591b96",1454,"5d0c2efd139bd6094098bc893ed746020f03e0860a25f278348f43f47c236222")],
            "fifth":[
              ("code","https://raw.githubusercontent.com/pytorch/pytorch/496340f06ef7bda2800522429ba3f4e3473a92fa/torch/_inductor/scheduler.py",539420,"b13a89d0fd77430e2a637dae41980086909c4ad4a855b8418dc17286c39953b8",41453,"504b68653b5478b88216f6342a74bacc5982549657005fb486dd00d753b4ea9a"),
              ("structured","https://raw.githubusercontent.com/microsoft/vscode/6fad7188e7dbf7db564e5e4a85960eb2bf69bdf4/package-lock.json",784171,"73224989048e176e7eeafa8aa729df7e4d510f4bd453018902d95345db0fe886",14365,"5c0f3a215ba35b7fbcaae212d27a33ba5109e16d89809987d16fa89072534281"),
              ("technical_prose","https://raw.githubusercontent.com/numpy/numpy/2f1eca306857b641fb0fef0ab854a2d4137e1581/doc/source/user/absolute_beginners.rst",52653,"945a0a598d080ee7526c9bd5459ce615a5b49fe0331adfdf8bbd8812e908e7e3",1454,"527e21110a7f84a1939ccf6063fdfeb77905d9ec180e5fde18488d21b90c4f49")]}
          for group,sources in historical.items():
            for domain,url,full_n,full_h,prefix_n,prefix_h in sources:
              data=urllib.request.urlopen(urllib.request.Request(url,headers={"User-Agent":"wingless-r48"}),timeout=90).read(full_n+1)
              assert len(data)==full_n and hashlib.sha256(data).hexdigest()==full_h
              p=data[:prefix_n];assert hashlib.sha256(p).hexdigest()==prefix_h
              filename={"code":"code.bin","structured":"structured.bin","technical_prose":"technical-prose.bin"}[domain]
              (roots[group]/filename).write_bytes(p)
          manifest=json.load(open("docs/experiments/wlm-lm-external-future-data-r48-manifest.json"))
          assert manifest["manifest_sha256"]=="73c4bcdb292a27ccd403ef691db09c9ec436ad137d907423615fe69cced8b1fb"
          for group in manifest["unseen"]:
            name=group["name"]
            for src in group["sources"]:
              url=f"https://raw.githubusercontent.com/{src['repo']}/{src['commit']}/{urllib.parse.quote(src['path'])}"
              data=urllib.request.urlopen(urllib.request.Request(url,headers={"User-Agent":"wingless-r48"}),timeout=90).read()
              got=hashlib.sha1((f"blob {len(data)}\0").encode()+data).hexdigest()
              assert got==src["git_blob"] and len(data)>=src["prefix_bytes"]
              p=data[:src["prefix_bytes"]]
              assert hashlib.sha256(p).hexdigest()==src["prefix_sha256"]
              filename={"code":"code.bin","structured":"structured.bin","technical_prose":"technical-prose.bin"}[src["domain"]]
              (roots[name]/filename).write_bytes(p)
          PY
          for n in transfer third fourth fifth eighteenth nineteenth twentieth; do
            key="$(echo "$n" | tr '[:lower:]' '[:upper:]')_ROOT"
            echo "$key=$RUNNER_TEMP/r48-$n" >> "$GITHUB_ENV"
          done
      - name: Focused package tests
        run: |
          set -euo pipefail
          go test ./unitary -count=1
          go test ./cmd/wlm-lm-external-future-data-learned-state-former-feature-attribution-r48 -count=1
      - name: Full Go regression
        run: go test ./... -count=1
      - name: Run frozen R48 twice
        shell: bash
        run: |
          set -euo pipefail
          args=(--transfer-root "$TRANSFER_ROOT" --third-root "$THIRD_ROOT" --fourth-root "$FOURTH_ROOT" --fifth-root "$FIFTH_ROOT" --eighteenth-root "$EIGHTEENTH_ROOT" --nineteenth-root "$NINETEENTH_ROOT" --twentieth-root "$TWENTIETH_ROOT")
          go run ./cmd/wlm-lm-external-future-data-learned-state-former-feature-attribution-r48 "${args[@]}" --resource-out /tmp/resource.json > /tmp/result1.json
          go run ./cmd/wlm-lm-external-future-data-learned-state-former-feature-attribution-r48 "${args[@]}" > /tmp/result2.json
          cmp /tmp/result1.json /tmp/result2.json
          test -s /tmp/resource.json
          cat /tmp/result1.json
      - name: Classify frozen R48
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,math,pathlib
          r=json.loads(pathlib.Path("/tmp/result1.json").read_text());m=r["metrics"]
          arms={a["id"]:a for a in r["arms"]}
          required={"full-selected","reset-distribution","reset-character","reset-layout-repetition"}
          valid=(set(arms)==required and m["historical_manifest_count"]==4 and m["unseen_manifest_count"]==3 and
                 m["attribution_arm_count"]==4 and m["baseline_anchor_count"]==1 and
                 m["state_dimension"]==6 and m["readout_parameter_count"]==7 and m["total_adaptation_budget"]==1744 and
                 m["candidate_pair_count_per_arm"]==108 and m["heldout_outcome_use_before_arm_freeze"]==0 and
                 m["post_result_arm_or_threshold_choice_count"]==0 and m["capacity_growth_event_count"]==0 and
                 m["external_model_call_count"]==0 and m["tokenizer_use_count"]==0 and
                 m["fixed_budget_mismatch_count"]==0 and m["raw_state_source_mismatch_count"]==0 and
                 m["source_identity_mismatch_count"]==0 and m["fit_failure_count"]==0 and m["invalid_row_count"]==0 and
                 all(a["non_tie_pair_count"]>=72 and len(a["manifest_accuracy"])==3 for a in r["arms"]) and
                 r["baseline"]["non_tie_pair_count"]>=72 and len(r["baseline"]["manifest_accuracy"])==3 and
                 all(math.isfinite(float(v)) for v in m.values()))
          resets=[arms[k] for k in sorted(required-{"full-selected"})]
          full=arms["full-selected"]; best=next((a for a in resets if a["id"]==r["best_reset"]),None)
          if best is None: valid=False
          strong=[a for a in resets if a["accuracy_delta_vs_full"]>=0.05]
          support=(valid and best["accuracy_delta_vs_full"]>=0.05 and best["positive_manifest_count_vs_full"]>=2 and
                   best["mean_decision_regret"]<=0.90*full["mean_decision_regret"] and m["best_vs_second_margin"]>=0.015)
          mixed=(valid and not support and (
                 (best["accuracy_delta_vs_full"]>=0.015 and best["positive_manifest_count_vs_full"]>=2 and
                  best["mean_decision_regret"]<full["mean_decision_regret"]) or
                 len(strong)>=2 or
                 (m["baseline_minus_full_accuracy"]>=0.05 and len(strong)==0)))
          cls="invalid" if not valid else "supported" if support else "mixed" if mixed else "negative"
          nexts={
            "supported":"WLM-LM-EXTERNAL-FUTURE-DATA-LEARNED-STATE-FORMER-TARGETED-GROUP-CORRECTION-R49",
            "mixed":"WLM-LM-EXTERNAL-FUTURE-DATA-LEARNED-STATE-FORMER-INTERACTION-ATTRIBUTION-R49",
            "negative":"WLM-LM-EXTERNAL-FUTURE-DATA-LEARNED-STATE-FORMER-READOUT-INTERFACE-ATTRIBUTION-R49",
            "invalid":None}
          failure_class=None;failing_step=None;error_signature=None
          if cls=="invalid":
              failure_class="FROZEN_VALIDITY_FAILURE";failing_step="classification"
              error_signature=hashlib.sha256(json.dumps(m,sort_keys=True,separators=(",",":")).encode()).hexdigest()
          out={"schema":"wingless.research-classification.v1",
               "experiment":"WLM-LM-EXTERNAL-FUTURE-DATA-LEARNED-STATE-FORMER-FEATURE-ATTRIBUTION-R48",
               "classification":cls,"validity_pass":valid,"best_reset":r["best_reset"],
               "rsi_success":False,
               "rsi_success_reason":"R48 is bounded diagnostic attribution; it does not authorize mechanism promotion.",
               "next_successor":nexts[cls],
               "failure_class":failure_class,"failing_step":failing_step,"error_signature":error_signature,
               "authority_receipt_sha256":"d35b41f38909e182cb0d9eb92704a34b124cc5616ed73ed8e1f0706301ffd24d","metrics":m,"arms":r["arms"],"baseline":r["baseline"]}
          pathlib.Path("/tmp/classification.json").write_text(json.dumps(out,separators=(",",":")),encoding="utf-8")
          print(json.dumps(out,separators=(",",":")))
          PY
      - name: Delete external bytes
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP"/r48-*
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wingless-state-former-feature-attribution-r48
          path: |
            /tmp/authority.json
            /tmp/result1.json
            /tmp/result2.json
            /tmp/resource.json
            /tmp/classification.json
          if-no-files-found: error
# experiment: WLM-LM-EXTERNAL-FUTURE-DATA-LEARNED-STATE-FORMER-FEATURE-ATTRIBUTION-R48
# manifest: 73c4bcdb292a27ccd403ef691db09c9ec436ad137d907423615fe69cced8b1fb
# preregistration: d39cd28bcf2543f331ac4557ac5e6a3cc37500c5
