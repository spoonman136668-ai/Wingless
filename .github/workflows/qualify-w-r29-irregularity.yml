name: W-R29 frozen modular irregularity ablation
on:
  push:
    branches: [research/w-r29-irregularity-ablation-r1]
permissions:
  contents: read
jobs:
  science:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Exact immutable source preregistration
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 785ec7782e955225c3c140d181b261e9310eb042 HEAD
          test "$(git hash-object research/contrib/chatgpt/20261013-w-r28b-numeric/execute.py)" = e0a83a1e5866b00fa1ac10a3973381b58f101561
          test "$(git hash-object research/contrib/chatgpt/20261013-w-r29-irregularity/prereg.json)" = 0541cf5cdcf59ba3f7a4c95831c0c8ed11cc3a72
          test "$(git hash-object research/contrib/chatgpt/20261013-w-r29-irregularity/execute.py)" = 31862215a45f200ed09718192ec92782141aee77
          python3 -m json.tool research/contrib/chatgpt/20261013-w-r29-irregularity/prereg.json >/dev/null
          python3 -m py_compile research/contrib/chatgpt/20261013-w-r29-irregularity/execute.py
      - name: Original unexposed generator ablation
        run: |
          set -euo pipefail
          python3 -B research/contrib/chatgpt/20261013-w-r29-irregularity/execute.py > /tmp/W-R29-original.json
          python3 -m json.tool /tmp/W-R29-original.json >/dev/null
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/W-R29-original.json'))
          assert len(x['cells'])==36
          assert x['sealed_heldout_seeds']==list(range(504,520))
          print('CLASSIFICATION',x['classification'])
          print('PURE_QUADRATIC_ACCEL_ERROR',x['pure_acceleration_error'])
          print('IRREGULAR_ACCEL_ERROR',x['irregular_acceleration_error'])
          print('IRREGULARITY_DELTA',x['irregularity_error_increase'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: W-R29-original-irregularity
          path: /tmp/W-R29-original.json
          retention-days: 90
          if-no-files-found: error
      - name: Complete Wingless regression
        run: go test ./... && go build ./...
