name: Wingless W-R36 frozen bijective sensor coding transfer
on:
  push:
    branches: [research/w-r36-bijective-codebook-transfer-r1]
permissions:
  contents: read
jobs:
  science:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify frozen precursor and exact first-use identities
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 7528b49520035347597967e476392ef4a2b97a15 HEAD
          test "$(git hash-object research/contrib/chatgpt/20261013-w-r35-cohort-replication/execute.py)" = e5ad92c199b9be99b6cfa1423220c5d73745706e
          test "$(git hash-object research/contrib/chatgpt/20261013-w-r36-codebook-transfer/prereg.json)" = f51a439fc660e96a90b2cefb941551eae793b6cf
          test "$(git hash-object research/contrib/chatgpt/20261013-w-r36-codebook-transfer/execute.py)" = 59dfcf63cee9469c673df75c704ddbafb770b664
          python3 -m json.tool research/contrib/chatgpt/20261013-w-r36-codebook-transfer/prereg.json >/dev/null
          python3 -m py_compile research/contrib/chatgpt/20261013-w-r36-codebook-transfer/execute.py
      - name: One original sealed coding-transfer experiment
        run: |
          set -euo pipefail
          python3 -B research/contrib/chatgpt/20261013-w-r36-codebook-transfer/execute.py > /tmp/W-R36-first.json
          python3 -m json.tool /tmp/W-R36-first.json >/dev/null
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/W-R36-first.json'))
          assert x['sealed_heldout_seeds']==list(range(1600,1632))
          assert len(x['arms'])==10 and all(len(r['cells'])==6 for r in x['arms'])
          print('CLASSIFICATION',x['classification'])
          print('RECODE_LOSSES',x['four_bit_loss_by_format_and_arm'])
          for a in x['arms']:print('FORMAT',a['format'],a['arm'],a['accuracy'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: W-R36-original-bijective-coding-transfer
          path: /tmp/W-R36-first.json
          retention-days: 90
          if-no-files-found: error
      - name: One full Wingless regression and build
        run: go test ./... && go build ./...
