name: W-R75 frozen circular orbit temporal pooling
on:
  push:
    branches: [research/w-r75-orbit-pooled-temporal-20261014-r1]
permissions:
  contents: read
jobs:
  science:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Exact pinned source and prospectively frozen cohort
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 33ad17eeafed3a7941f0b1258bc67913be247aea HEAD
          test "$(git hash-object research/contrib/chatgpt/20261014-w-r73-canonical-temporal-state/execute.py)" = 703c269049fef36c4af6feb71fad69dd1be31514
          test "$(git hash-object research/contrib/chatgpt/20261014-w-r75-orbit-pooled/execute.py)" = a8725622f79351356d550ce8ed36cbd6326f0182
          test "$(git hash-object research/contrib/chatgpt/20261014-w-r75-orbit-pooled/prereg.json)" = 9701fda54500a86d6bf8d0a48afdec328a73e6b1
          python3 -m py_compile research/contrib/chatgpt/20261014-w-r75-orbit-pooled/execute.py
          python3 -m json.tool research/contrib/chatgpt/20261014-w-r75-orbit-pooled/prereg.json >/dev/null
      - name: Development-only learned readout and source-qualified model choice
        run: |
          set -euo pipefail
          python3 -B - <<'PY'
          import importlib.util
          spec=importlib.util.spec_from_file_location("w75_dev","research/contrib/chatgpt/20261014-w-r75-orbit-pooled/execute.py")
          assert spec and spec.loader
          m=importlib.util.module_from_spec(spec);spec.loader.exec_module(m)
          trained,chosen,scores=m.fit_and_select()
          assert chosen in ("orbit4","orbit16") and len(trained)==3
          assert all(v["examples"]==1728 and len(v["weights"])==16 for v in trained.values())
          print("FROZEN_DEV_CHOICE",chosen,scores)
          PY
      - name: Original one-time sealed heldout execution
        run: |
          set -euo pipefail
          python3 -B research/contrib/chatgpt/20261014-w-r75-orbit-pooled/execute.py > /tmp/W-R75-original.json
          python3 -m json.tool /tmp/W-R75-original.json >/dev/null
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: W-R75-original-frozen-science
          path: /tmp/W-R75-original.json
          if-no-files-found: error
          retention-days: 90
      - name: Verify original archive counts and frozen rubric
        run: |
          python3 - <<'PY'
          import json
          a=json.load(open("/tmp/W-R75-original.json"))
          assert a["sealed_heldout_seeds"]==list(range(18240,18256))
          assert len(a["complete_heldout_records"])==1152
          assert a["selected_mode"] in ("orbit4","orbit16")
          assert a["classification"] in ("ORBIT_POOLED_READOUT_TRANSFER",
              "PARTIAL_ORBIT_POOLED_READOUT_GAIN","NO_ORBIT_POOLED_GAIN")
          assert a["model_calls"]==0 and a["accepted_ref_mutation"] is False
          print("CLASSIFICATION",a["classification"])
          print("ACCURACY",a["accuracy"])
          print("DELTA",a["selected_minus_baseline"])
          PY
      - name: One full Wingless regression and build
        run: go test ./... && go build ./...
