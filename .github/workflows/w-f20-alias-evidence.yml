name: Wingless F20 alias metadata evidence uptake causal falsification
on:
  push:
    branches: [research/w-f20-alias-binding-falsification-20261015-r1]
permissions:
  contents: read
jobs:
  science:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-go@v5
        with: {go-version-file: go.mod}
      - name: Original F19 frozen scientific source and prospective protocol
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 51d82274d97c076edaba0b45cca45e4a05f093c0 HEAD
          test "$(git hash-object unitary/f19_redundant_causal_witnesses.go)" = "$(git rev-parse 51d82274d97c076edaba0b45cca45e4a05f093c0:unitary/f19_redundant_causal_witnesses.go)"
          python3 -m json.tool research/foundational/20261015-w-f20/prereg.json >/dev/null
      - name: One original native W20 controlled alias evidence development test
        run: |
          set -euo pipefail
          go run ./cmd/f20-wingless > /tmp/w-f20-original.json
          python3 -m json.tool /tmp/w-f20-original.json >/dev/null
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: W-F20-original-alias-evidence-causal-falsifier
          path: /tmp/w-f20-original.json
          if-no-files-found: error
          retention-days: 90
      - name: Independently audit source, identity-pair witnesses and outcomes
        run: |
          python3 - <<'PY'
          import json,collections
          r=json.load(open("/tmp/w-f20-original.json"))
          assert r["stage"]=="DEVELOPMENT_ONLY" and r["graph_count"]==96
          assert r["question_count"]==576 and r["native_state_bytes"]==576
          assert r["alias_metadata_state_words"]==[24,25]
          assert not r["frozen_model_reads_alias_metadata"] and r["coded_alias_canonicalizer_is_not_learned"]
          assert not r["model_retrained"] and not r["source_birth_independent"]
          assert not r["sealed_first_use"] and not r["accepted_ref_mutation"]
          assert collections.Counter(x["Family"] for x in r["rows"])=={108:144,109:144,110:144,111:144}
          assert collections.Counter(x["Variant"] for x in r["rows"])==dict.fromkeys(range(6),96)
          assert all(x["Truth"]==[True,True,True,False,False,True][x["Variant"]] for x in r["rows"])
          assert sum(x["Variant"]==2 and x["AliasDeclared"] for x in r["rows"])==96
          assert sum(x["Variant"]==3 and not x["AliasDeclared"] for x in r["rows"])==96
          for name,field in (("full","Full"),("risk","Risk"),("coded_canonicalize_then_frozen","Canonical")):
            s=r["scores"][name]
            assert s["correct"]==sum(x[field]["answer"]==x["Truth"] for x in r["rows"])
            assert s["false_negatives"]==sum(not x[field]["answer"] for x in r["rows"] if x["Truth"])
          assert r["registered_verdict"] in ("DEVELOPMENT_FROZEN_ALIAS_INFORMATION_PATH_NEGATIVE",
            "DEVELOPMENT_ALIAS_INFORMATION_PATH_NOT_FALSIFIED","INVALID_ALIAS_CONTROL_OR_IDENTITY_PAIR")
          print("W_F20_VERDICT",r["registered_verdict"],r["scores"])
          PY
      - name: One full Go regression and build
        run: go test ./... && go build ./...
