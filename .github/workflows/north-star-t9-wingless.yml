name: T9 wingless causal learning focused source-neutral
on:
  push:
    branches: [research/north-star-transfer-wingless-20261018]
    paths: ['.github/workflows/north-star-t9-wingless.yml']
permissions:
  contents: read
concurrency:
  group: t9-wingless-source-neutral-no-protected-firstuse
  cancel-in-progress: false
jobs:
  exact-source-new-causal-mechanism:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest,windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 55
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Frozen source and unchanged original scientific control verification
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if((git rev-parse HEAD).Trim() -cne $env:GITHUB_SHA){throw 'T9_EXACT_SOURCE_HEAD_DRIFT'}
          if((git hash-object 'research/north-star-transfer/20261019-wingless-t9-source-freeze.json').Trim() -cne '5c23b25888b454d4f293ce56fa2a87773e46e131'){throw 'T9_PREREG_BLOB_DRIFT'}
          if((git log -1 --format=%H -- 'research/north-star-transfer/20261019-wingless-t9-source-freeze.json').Trim() -cne '1e28301bb33dc7c94354c9964ecddab21177eea4'){throw 'T9_FREEZE_NOT_BEFORE_IMPLEMENTATION'}
          git merge-base --is-ancestor 1e28301bb33dc7c94354c9964ecddab21177eea4 HEAD
          if($LASTEXITCODE -ne 0){throw 'T9_FREEZE_NOT_ANCESTOR'}
          if((git hash-object 'research/north-star-transfer/20261019-wingless-t9-causal-query.py').Trim() -cne 'b6950b0f8f03170d7d35afb5006771d641ea7b0d'){throw 'T9_NEW_MECHANISM_SOURCE_DRIFT'}
          if((git hash-object 'research/north-star-transfer/20261018-wingless-t3-typed-composition.py').Trim() -cne '85dbd2673a94a6d72db29e57ee836619405f7f1e'){throw 'T9_FROZEN_ORIGINAL_CONTROL_DRIFT'}
          Write-Output 'T9_WINGLESS_SOURCE_IDENTITY_AND_FREEZE=PASS'
      - name: Execute causal sufficiency and full public control diagnostic
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $py=if($IsWindows){'python'}else{'python3'}
          & $py -B 'research/north-star-transfer/20261019-wingless-t9-causal-query.py' | Tee-Object 't9-wingless-original.json'
          if($LASTEXITCODE -ne 0){throw 'T9_WINGLESS_NONCONSUMING_MECHANISM_FAILED'}
          $d=Get-Content 't9-wingless-original.json' -Raw | ConvertFrom-Json
          if($d.'original_protected_WNS_used' -ne $false -and $d.'original_protected_WNS_used' -ne 0){throw 'T9_PROTECTED_SOURCE_USED'}
          if($d.'scientific_acceptance' -ne $false){throw 'T9_SCIENCE_ACCEPTANCE_UNAUTHORIZED'}
          Write-Output 'T9_WINGLESS_EVIDENCE_OR_NEGATIVE=PASS'
          Write-Output 'T9_WINGLESS_PROTECTED_FIRST_USE=false'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: t9-wingless-nonconsuming-${{ matrix.os }}-${{ github.sha }}
          path: t9-wingless-original.json
          retention-days: 90
          if-no-files-found: warn
