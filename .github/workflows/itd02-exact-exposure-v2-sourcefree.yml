name: ITD-02 exact exposure v2 source-free qualification
on:
  push:
    branches: [research/itd02-exact-exposure-v2-sourcefree-20261027]
  pull_request:
    paths:
      - 'research/native/itd02/outcome/exact_exposure_v2.py'
      - 'research/native/itd02/outcome/test_exact_exposure_v2.py'
      - '.github/workflows/itd02-exact-exposure-v2-sourcefree.yml'
permissions:
  contents: read
jobs:
  source-free-v2:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Source-free v2 syntax and boundary tests
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile research/native/itd02/outcome/exact_exposure_v2.py research/native/itd02/outcome/test_exact_exposure_v2.py
          cd research/native/itd02/outcome
          python -m unittest -v test_exact_exposure_v2
