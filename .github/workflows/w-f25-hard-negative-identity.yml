name: W-F25 identity similarity hard-negative independent original
on:
  push:
    branches: [research/w-f25-hard-negative-identity-contrastive-20261015-r1]
permissions:
  contents: read
jobs:
  science:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-go@v5
        with: {go-version-file: go.mod}
      - name: Frozen preceding original, protocol and syntax BEFORE original
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 0927853d9330e7fa6462276b8b9ef120cba554c7 HEAD
          test "$(git hash-object unitary/f24_identity_pair_discovery.go)" = "$(git rev-parse 0927853d9330e7fa6462276b8b9ef120cba554c7:unitary/f24_identity_pair_discovery.go)"
          python3 -m json.tool research/foundational/20261015-w-f25/prereg.json > /dev/null
          go test -run '^$' ./unitary ./cmd/f25-wingless
      - name: Execute exactly one fresh developmental original
        run: |
          set -euo pipefail
          go run ./cmd/f25-wingless > /tmp/w-f25-original.json
          python3 -m json.tool /tmp/w-f25-original.json > /dev/null
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: W-F25-original-hard-negative-identity-links
          path: /tmp/w-f25-original.json
          if-no-files-found: error
          retention-days: 90
      - name: Independently audit row decisions and compute comparisons
        run: |
          python3 - <<'PY'
          import collections,json
          d=json.load(open("/tmp/w-f25-original.json"))
          assert d["stage"]=="DEVELOPMENT_ONLY"
          assert d["graphs"]==96 and d["questions"]==768 and d["native_state_bytes"]==576
          assert d["training_only_positive_negative_pairs"]==512
          assert d["hard_near_negative_training"] and d["near_negative_validation_source_generated"]
          assert not d["actual_query_candidate_pairs_supplied"] and d["all_graph_edge_endpoint_pairs_enumerated_in_code"]
          assert not d["independently_born_source"] and not d["sealed_first_use"] and not d["accepted_ref_mutation"]
          assert collections.Counter(r["Family"] for r in d["rows"])=={108:192,109:192,110:192,111:192}
          assert collections.Counter(r["Variant"] for r in d["rows"])==dict.fromkeys(range(8),96)
          assert all(r["Truth"]==[True,True,False,False,True,True,False,True][r["Variant"]] for r in d["rows"])
          for name,key in (("learned","Learned"),("none","NoLinks"),("fixed_distance","FixedDistance"),
                           ("strict_distance","StrictDistance"),("coded_oracle","CodedUpper")):
            s=d["scores"][name]
            assert s["correct"]==sum(r[key]["answer"]==r["Truth"] for r in d["rows"])
            assert s["fp"]==sum(r[key]["answer"] for r in d["rows"] if not r["Truth"])
            assert s["fn"]==sum(not r[key]["answer"] for r in d["rows"] if r["Truth"])
          assert d["scores"]["coded_oracle"]["correct"]==768
          assert d["registered_verdict"] in ("INVALID_F25_SOURCE_ORACLE",
            "DEVELOPMENT_HARD_NEGATIVE_IDENTITY_LEARNED_ADVANTAGE",
            "DEVELOPMENT_HARD_NEGATIVE_IDENTITY_NO_GAIN")
          print("W_F25_VERDICT",d["registered_verdict"],d["scores"])
          PY
      - name: Full regression and one native Go build
        run: go test ./... && go build ./...
