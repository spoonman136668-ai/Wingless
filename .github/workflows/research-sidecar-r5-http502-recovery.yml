name: Research Sidecar R5 HTTP502 Recovery

on:
  push:
    branches:
      - ops/research-autonomy-provider-probe-r1
    paths:
      - .github/workflows/research-sidecar-r5-http502-recovery.yml

permissions:
  contents: read

concurrency:
  group: wingless-research-sidecar-lifecycle
  cancel-in-progress: false

jobs:
  recover:
    runs-on: [self-hosted, Windows, X64, wingless-research-safe]
    timeout-minutes: 8
    steps:
      - name: Archive failed transport attempt and clear for exact replay
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference='Stop'
          Set-StrictMode -Version 2.0
          $Root='C:\ProgramData\CKBR\research-sidecar'
          $Lifecycle=Join-Path $Root 'ops\Lifecycle.ps1'
          $Exe=Join-Path $Root 'bin\research-sidecar.exe'
          $Config=Join-Path $Root 'config\autonomy.yaml'
          $State=Join-Path $Root 'state'
          $Db=Join-Path $State 'research-sidecar.db'
          $Archive=Join-Path $Root 'evidence\planner-http502-recovery-r5-2'
          $Expected='807ed051e05eb3dbdf9860103b0f605540543714ba51a947e2c58e5070b88128'
          $Bootstrap='WINGLESS-LM-LM9C-AUTONOMY-BOOTSTRAP'

          $Identity=[Security.Principal.WindowsIdentity]::GetCurrent().Name
          if($Identity-cne'NT AUTHORITY\NETWORK SERVICE'){throw "RECOVERY_IDENTITY_MISMATCH observed=$Identity"}
          foreach($Path in @($Lifecycle,$Exe,$Config,$Db)){if(-not(Test-Path -LiteralPath $Path -PathType Leaf)){throw "RECOVERY_PREREQUISITE_MISSING path=$Path"}}
          if((Get-FileHash -LiteralPath $Exe -Algorithm SHA256).Hash.ToLowerInvariant()-cne$Expected){throw 'RECOVERY_BINARY_HASH_MISMATCH'}

          $Raw=& $Exe -mode status -config $Config 2>&1
          if($LASTEXITCODE-ne0){throw "RECOVERY_STATUS_FAILED output=$($Raw -join ' ')"}
          $Status=($Raw -join [Environment]::NewLine)|ConvertFrom-Json
          if([string]$Status.authority-cne'plane' -or [string]$Status.generation-cne'1' -or
             [int]$Status.cycle_count-ne1 -or [string]$Status.last_cycle_id-cne$Bootstrap -or
             [string]$Status.last_cycle_status-cne'PLANNING_REQUIRED' -or [int]$Status.blocked_cycle_count-ne0){
            throw 'RECOVERY_BOUNDARY_STATUS_CHANGED'
          }

          # Immutable read-only proof run 36651892311 observed terminal
          # RESEARCH_LOOPBACK_HTTP_STATUS_502 and zero results/bundles/freezes.
          & $Lifecycle -Mode stop
          if($LASTEXITCODE-ne0){throw "RECOVERY_STOP_FAILED exit=$LASTEXITCODE"}
          Start-Sleep -Seconds 2
          if(Get-Process -Name 'research-sidecar' -ErrorAction SilentlyContinue){throw 'RECOVERY_SIDECAR_PROCESS_STILL_RUNNING'}

          if(Test-Path -LiteralPath $Archive){throw 'RECOVERY_ARCHIVE_ALREADY_EXISTS'}
          New-Item -ItemType Directory -Force -Path $Archive|Out-Null
          $Files=@('research-sidecar.db','research-sidecar.db-wal','research-sidecar.db-shm')
          $Hashes=[ordered]@{}
          foreach($Name in $Files){
            $Source=Join-Path $State $Name
            if(Test-Path -LiteralPath $Source -PathType Leaf){
              Copy-Item -LiteralPath $Source -Destination (Join-Path $Archive $Name) -Force
              $Hashes[$Name]=(Get-FileHash -LiteralPath $Source -Algorithm SHA256).Hash.ToLowerInvariant()
            }
          }
          if(-not$Hashes.Contains('research-sidecar.db')){throw 'RECOVERY_ARCHIVE_DB_MISSING'}

          $Addresses=@([System.Net.Dns]::GetHostAddresses('openrouter.ai'))
          if($Addresses.Count-lt1){throw 'RECOVERY_OPENROUTER_DNS_EMPTY'}
          $Tcp=New-Object System.Net.Sockets.TcpClient
          try{
            $Async=$Tcp.BeginConnect('openrouter.ai',443,$null,$null)
            if(-not$Async.AsyncWaitHandle.WaitOne(10000)){throw 'RECOVERY_OPENROUTER_TCP_TIMEOUT'}
            $Tcp.EndConnect($Async)
            if(-not$Tcp.Connected){throw 'RECOVERY_OPENROUTER_TCP_FAILED'}
          }finally{$Tcp.Dispose()}

          $Receipt=[ordered]@{
            schema='ckb-plane.research-sidecar-transport-recovery.v1'
            reason='planner transport failed before preregistration or execution: RESEARCH_LOOPBACK_HTTP_STATUS_502'
            live_probe_run_id=36651892311
            live_probe_result_count=0
            live_probe_implementation_bundle_count=0
            live_probe_implementation_freeze_count=0
            bootstrap_cycle=$Bootstrap
            binary_sha256=$Expected
            exact_replay_authorized=$true
            experiment_executed=$false
            result_sealed=$false
            implementation_generated=$false
            openrouter_dns_count=$Addresses.Count
            openrouter_tcp_443=$true
            db_hashes=$Hashes
            archived_at_utc=[DateTimeOffset]::UtcNow.ToString('o')
          }
          [IO.File]::WriteAllText((Join-Path $Archive 'recovery-receipt.json'),($Receipt|ConvertTo-Json -Depth 8),(New-Object Text.UTF8Encoding($false)))
          foreach($Name in $Files){Remove-Item -LiteralPath (Join-Path $State $Name) -Force -ErrorAction SilentlyContinue}
          if(Test-Path -LiteralPath $Db){throw 'RECOVERY_DB_CLEAR_FAILED'}

          Write-Host "archive=$Archive"
          Write-Host "openrouter_dns_count=$($Addresses.Count)"
          Write-Host 'openrouter_tcp_443=True'
          Write-Host 'exact_replay_authorized=True'
          Write-Host 'RESEARCH_SIDECAR_R5_HTTP502_RECOVERY_REPLAY2=PASS'
