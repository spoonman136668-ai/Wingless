name: W73 frozen bounded independent scientific experiment
on:
  push:
    branches: [research/w-r73-canonical-raw-temporal-state-20261014-r1]
permissions:
  contents: read
jobs:
  science:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify frozen source and parent before any original first-use
        run: |
          set -euo pipefail
          git merge-base --is-ancestor e127dde54ce1d4a9f992d0f201c88ab7ee263909 HEAD
          test "$(git hash-object research/contrib/chatgpt/20261014-w-r72-three-phase/execute.py)" = db25bd5f2fd877f0cc7d046615e8523b55ec75cf
          test "$(git hash-object research/contrib/chatgpt/20261014-w-r73-canonical-temporal-state/execute.py)" = 703c269049fef36c4af6feb71fad69dd1be31514
          test "$(git hash-object research/contrib/chatgpt/20261014-w-r73-canonical-temporal-state/prereg.json)" = af117b7461fcc20ab70f43f485c3c9e165f262d7
          python3 -m py_compile research/contrib/chatgpt/20261014-w-r73-canonical-temporal-state/execute.py
          python3 -m json.tool research/contrib/chatgpt/20261014-w-r73-canonical-temporal-state/prereg.json >/dev/null
      - name: Bounded development-only learning and import prequalification
        run: |
          set -euo pipefail
          python3 -B - <<'PY'
          import importlib.util
          s=importlib.util.spec_from_file_location("w73_preflight","research/contrib/chatgpt/20261014-w-r73-canonical-temporal-state/execute.py")
          assert s and s.loader
          m=importlib.util.module_from_spec(s);s.loader.exec_module(m)
          trained={mode:m.fit_mode(mode) for mode in m.MODES}
          chosen, scores=m.validate_dev(trained)
          assert chosen in m.MODES[1:] and len(trained)==4
          assert all(v["examples"]==1728 and len(v["weights"])==16 for v in trained.values())
          print("FROZEN_DEV_CHOICE",chosen,scores)

          PY
      - name: Execute exactly one frozen prospective original first-use
        run: |
          set -euo pipefail
          python3 -B research/contrib/chatgpt/20261014-w-r73-canonical-temporal-state/execute.py > /tmp/W73-original.json
          python3 -m json.tool /tmp/W73-original.json >/dev/null
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: W73-original-source-evidence
          path: /tmp/W73-original.json
          if-no-files-found: error
          retention-days: 90
      - name: Validate frozen outcome after original archive upload
        run: |
          python3 - <<'PY'
          import json
          a=json.load(open("/tmp/W73-original.json"))
          assert a["sealed_heldout_seeds"]==list(range(16000,16016))
          assert len(a["all_sealed_records"])==1152
          assert a["selected_mode"] in ("channel0_peak","channel0_gradient","four_channel_energy")
          assert a["classification"] in ("BOUNDED_CANONICAL_STATE_TRANSFER","PARTIAL_CANONICAL_STATE_TRANSFER","NO_CANONICAL_STATE_GAIN")
          print("CLASSIFICATION",a["classification"])
          print("CANONICAL_ACCURACIES",a["accuracies"])

          assert a["model_calls"]==0 and a["accepted_ref_mutation"] is False
          PY
      - name: Final full repository regression and build
        run: go test ./... && go build ./...
