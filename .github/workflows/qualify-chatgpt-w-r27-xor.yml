name: Wingless W-R27 frozen XOR out-of-family rejection
on:
  push:
    branches: [research/chatgpt-w-r27-xor-open-set-20261013]
permissions:
  contents: read
jobs:
  science:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify frozen original identity
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 1dfad834724594354aa622d23fd0405f76e79a07 HEAD
          test "$(git hash-object research/contrib/chatgpt/20261013-w-r27-xor-family/prereg.json)" = f1e76e53b66163ecffba2102c454e9296e39b5a0
          test "$(git hash-object research/contrib/chatgpt/20261013-w-r27-xor-family/execute.py)" = 2106006e43ee89ce3b205cd4713c8a05858cbff4
          python3 -m json.tool research/contrib/chatgpt/20261013-w-r27-xor-family/prereg.json >/dev/null
          python3 -m py_compile research/contrib/chatgpt/20261013-w-r27-xor-family/execute.py
      - name: Original W-R27 nonisomorphic operation science
        run: |
          set -euo pipefail
          python3 -B research/contrib/chatgpt/20261013-w-r27-xor-family/execute.py > /tmp/W-R27-original.json
          python3 -m json.tool /tmp/W-R27-original.json
      - uses: actions/upload-artifact@v4
        with:
          name: W-R27-original-xor-open-set
          path: /tmp/W-R27-original.json
          retention-days: 90
          if-no-files-found: error
      - name: Full Wingless regression and build
        run: go test ./... && go build ./...
