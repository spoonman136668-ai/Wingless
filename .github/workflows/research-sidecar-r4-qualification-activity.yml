name: Research Sidecar R4 Qualification Activity

on:
  push:
    branches:
      - ops/research-autonomy-provider-probe-r1
    paths:
      - .github/workflows/research-sidecar-r4-qualification-activity.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: [self-hosted, Windows, X64, wingless-research-safe]
    timeout-minutes: 4
    steps:
      - name: Diagnose qualification process tree
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference='Stop'
          $Targets=@(Get-CimInstance Win32_Process -ErrorAction Stop | Where-Object { $_.Name -in @('go.exe','compile.exe','link.exe','git.exe','powershell.exe') })
          foreach($P in $Targets){
            Write-Host "proc pid=$($P.ProcessId) ppid=$($P.ParentProcessId) name=$($P.Name) cmd=$($P.CommandLine)"
          }

          $Go=@(Get-Process -Name go -ErrorAction SilentlyContinue)
          foreach($P in $Go){
            $Cpu1=[double]$P.CPU
            $Start=$P.StartTime.ToString('o')
            Start-Sleep -Seconds 10
            $P2=Get-Process -Id $P.Id -ErrorAction SilentlyContinue
            if($null-eq$P2){
              Write-Host "go_exit pid=$($P.Id) start=$Start"
              continue
            }
            $Cpu2=[double]$P2.CPU
            Write-Host "go_sample pid=$($P.Id) start=$Start cpu_before=$Cpu1 cpu_after=$Cpu2 delta=$($Cpu2-$Cpu1) responding=$($P2.Responding)"
          }
          Write-Host 'RESEARCH_SIDECAR_R4_QUALIFICATION_DIAGNOSTIC=PASS'
          Write-Host 'sample_reason=final-r5-qualification-check'
