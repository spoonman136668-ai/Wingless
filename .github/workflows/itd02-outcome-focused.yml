name: ITD-02 isolated outcome learner focused qualification
on:
  push:
    branches:
      - research/itd02-selected-outcome-learner-20261026
  pull_request:
    paths:
      - 'research/native/itd02/outcome/**'
      - 'research/native/itd02/outcomebridge/**'
      - '.github/workflows/itd02-outcome-focused.yml'
permissions:
  contents: read
jobs:
  outcome-focused:
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Focused native outcome tests
        run: go test -count=1 -v ./research/native/itd02/outcome ./research/native/itd02/outcomebridge
      - name: Vet and build native outcome
        run: |
          go vet ./research/native/itd02/outcome ./research/native/itd02/outcomebridge
          go build ./research/native/itd02/outcome ./research/native/itd02/outcomebridge
      - name: Race safety on Linux
        if: runner.os == 'Linux'
        run: go test -race -count=1 ./research/native/itd02/outcome ./research/native/itd02/outcomebridge
  ice-index-artifact:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Rebuild ICE in disposable checkout
        run: |
          go run ./cmd/ice build
          go run ./cmd/ice validate
      - name: Record exact generated delta
        run: |
          git diff --binary -- .ice > "$RUNNER_TEMP/itd02-ice-index.patch"
          git diff --stat -- .ice > "$RUNNER_TEMP/itd02-ice-index-stat.txt"
          git diff --name-only -- .ice > "$RUNNER_TEMP/itd02-ice-index-files.txt"
          if test -s "$RUNNER_TEMP/itd02-ice-index.patch"; then
            echo "ICE_INDEX_DELTA_PRESENT=true"
          else
            echo "ICE_INDEX_ALREADY_FRESH=true"
          fi
      - name: Package generated delta and index
        run: tar -czf "$RUNNER_TEMP/itd02-ice-index.tar.gz" .ice
      - uses: actions/upload-artifact@v4
        with:
          name: itd02-ice-index
          path: |
            ${{ runner.temp }}/itd02-ice-index.tar.gz
            ${{ runner.temp }}/itd02-ice-index.patch
            ${{ runner.temp }}/itd02-ice-index-stat.txt
            ${{ runner.temp }}/itd02-ice-index-files.txt
          retention-days: 3
  source-adapter-static:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test public-only source adapter without environment dependencies
        run: |
          python -m unittest discover -s research/native/itd02/outcome -p 'test_minigrid_source.py' -v
          python -m unittest discover -s research/native/itd02/outcome -p 'test_ipc_source_runner.py' -v
  source-minigrid-smoke:
    # Authentically executed one-seed engineering smoke only; not an experiment
    # claiming improved intelligence, held-out transfer, or scientific FSA.
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned public source environment
        run: python -m pip install 'minigrid==2.3.1' 'gymnasium==0.29.1'
      - name: Compile native selected-action learner IPC
        run: go build -o "$RUNNER_TEMP/itd02-outcomebridge" ./research/native/itd02/outcomebridge
      - name: Execute bounded authentic source episode
        run: |
          python research/native/itd02/outcome/ipc_source_runner.py \\
            --native-binary "$RUNNER_TEMP/itd02-outcomebridge" \\
            --environment MiniGrid-Empty-5x5-v0 --seeds 7 --max-steps 32 \\
            --output "$RUNNER_TEMP/itd02-source-smoke.json" --run-source
      - name: Check source evidence is explicitly engineering-only
        run: |
          python -c 'import json,os,pathlib; p=pathlib.Path(os.environ["RUNNER_TEMP"])/"itd02-source-smoke.json"; e=json.loads(p.read_text()); assert e["science"]=="NOT_ACCEPTED" and e["status"]=="ENGINEERING_SOURCE_TRAINING_ONLY" and len(e["events"])>0 and e["events"][0]["event_id"]==1; print("SOURCE_SMOKE_EVIDENCE_PRESENT")'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: itd02-source-smoke
          path: ${{ runner.temp }}/itd02-source-smoke.json
          if-no-files-found: warn
          retention-days: 7
