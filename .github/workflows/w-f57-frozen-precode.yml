name: Wingless F57 frozen first-use precode qualification
on:
  push:
    branches: [research/w-f57-causal-public-belief-state-precode-20261015-r1]
permissions:
  contents: read
jobs:
  source-identity:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Frozen precode, future folds and blocked promotion
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git hash-object research/foundational/20261015-w-f57/prereg.json)" = f088b68ac0cfdcd9ca1a3aa104de1c555fd29c70
          test ! -f research/foundational/20261015-w-f57/source_pilot.py
          python3 -B -m json.tool research/foundational/20261015-w-f57/prereg.json >/dev/null
          python3 -B -m unittest discover -s research/foundational/20261015-w-f57 -p test_precode.py -v
          echo F57_FROZEN_PRECODE_NO_ORIGINAL=PASS
      - name: One complete existing project regression
        shell: bash
        run: |
          set -euo pipefail
          go test -count=1 ./...
          go vet ./...
          go build ./...
          echo F57_ONE_COMPLETE_PROJECT_REGRESSION=PASS
      - name: Preserve science first use
        run: echo "FIT_NOT_EXECUTED=TRUE DIAGNOSTIC_NOT_EXECUTED=TRUE PRIMARY_ORIGINAL_NOT_EXECUTED=TRUE"
