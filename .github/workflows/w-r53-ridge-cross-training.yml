name: Wingless W-R53 frozen ridge versus batch cross-training test
on:
  push:
    branches: [research/w-r53-ridge-vs-batch-stability-r1]
permissions:
  contents: read
jobs:
  science:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Pre-first-use frozen identities
        run: |
          set -euo pipefail
          git merge-base --is-ancestor b1e4972f04142f1f35f76f9483b12491dec4846c HEAD
          test "$(git hash-object research/contrib/chatgpt/20261013-w-r52-batch-diversity/execute.py)" = 72df00223a980b951c5dae490be9e17fb1b5386c
          test "$(git hash-object research/contrib/chatgpt/20261013-w-r53-ridge/prereg.json)" = c1a207267abfe0ecd5b197fd8ea21a5e0ebcb8ec
          test "$(git hash-object research/contrib/chatgpt/20261013-w-r53-ridge/execute.py)" = 151e21f2a4335c64ff633bdc9c3cd0f0d006c23d
          python3 -m json.tool research/contrib/chatgpt/20261013-w-r53-ridge/prereg.json > /dev/null
          python3 -m py_compile research/contrib/chatgpt/20261013-w-r53-ridge/execute.py
      - name: Exactly one original sealed ridge-versus-batch comparison
        run: |
          set -euo pipefail
          python3 -B research/contrib/chatgpt/20261013-w-r53-ridge/execute.py > /tmp/W-R53-first-use.json
          python3 -m json.tool /tmp/W-R53-first-use.json > /dev/null
          python3 - <<'PY'
          import json
          a=json.load(open('/tmp/W-R53-first-use.json'))
          assert a['development_blocks']==[list(range(3680,3696)),list(range(3712,3728)),list(range(3744,3760))]
          assert a['sealed_heldout_seeds']==list(range(3808,3856))
          assert a['lambda_normalized']==1
          assert len(a['models']['identity'])==12
          assert all(len(m['by_seed'])==48 for m in a['models']['identity'].values())
          print('CLASSIFICATION',a['classification'])
          for c in a['mixed_source_comparisons']:
              print('MIXED_RIDGE',c['dev_cohort'],c['mixed_batch_accuracy'],
                    c['mixed_ridge_accuracy'],c['worst_source_gain'],
                    c['source_deltas'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: W-R53-original-ridge-vs-batch
          path: /tmp/W-R53-first-use.json
          retention-days: 90
          if-no-files-found: error
      - name: One required full Wingless regression and build
        run: go test ./... && go build ./...
