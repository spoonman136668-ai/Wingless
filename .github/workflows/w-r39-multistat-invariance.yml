name: Wingless W-R39 frozen multi-stat XOR-invariant representation
on:
  push:
    branches: [research/w-r39-multistat-xor-robust-r1]
permissions:
  contents: read
jobs:
  science:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Immutable source identity and frozen first-use gate
        run: |
          set -euo pipefail
          git merge-base --is-ancestor d9d51080086a39fcbf0f2fae0c08e7a78d6412de HEAD
          test "$(git hash-object research/contrib/chatgpt/20261013-w-r38-xor-transition/execute.py)" = 74a5d4263b565f28dc36a01892c554f1c63c735a
          test "$(git hash-object research/contrib/chatgpt/20261013-w-r39-multistat/prereg.json)" = 479979d472c94d733589c67ea9f0b39cce893354
          test "$(git hash-object research/contrib/chatgpt/20261013-w-r39-multistat/execute.py)" = a1d29ce3397c71d96309a9f515fda5f665bff2d5
          python3 -m json.tool research/contrib/chatgpt/20261013-w-r39-multistat/prereg.json >/dev/null
          python3 -m py_compile research/contrib/chatgpt/20261013-w-r39-multistat/execute.py
      - name: Original first-use sealed multi-stat temporal science
        run: |
          set -euo pipefail
          python3 -B research/contrib/chatgpt/20261013-w-r39-multistat/execute.py > /tmp/W-R39-original.json
          python3 -m json.tool /tmp/W-R39-original.json >/dev/null
          python3 - <<'PY'
          import json
          a=json.load(open("/tmp/W-R39-original.json"))
          assert a["development_seeds"]==list(range(1824,1840))
          assert a["sealed_heldout_seeds"]==list(range(1840,1856))
          assert len(a["results"])==6 and all(len(r["cells"])==6 for r in a["results"])
          print("CLASSIFICATION",a["classification"])
          print("INVARIANCE",a["mathematical_xor_invariance_verified"])
          print("GAINS",a["candidate_identity_accuracy_gains"])
          for r in a["results"]:
              print("ARM",r["arm"],r["condition"],r["accuracy"],r["identity_checks"])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: W-R39-original-multistat-invariance
          path: /tmp/W-R39-original.json
          retention-days: 90
          if-no-files-found: error
      - name: Required final complete Wingless regression and build
        run: go test ./... && go build ./...
