name: Research Sidecar Secret Provisioning Preflight

on:
  push:
    branches:
      - ops/research-autonomy-provider-probe-r1
    paths:
      - .github/workflows/research-autonomy-provider-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: [self-hosted, Windows, X64, wingless-research-safe]
    timeout-minutes: 5
    env:
      OPENROUTER_KEY: ${{ secrets.WINGLESS_REASONER_OPENROUTER_API_KEY }}
    steps:
      - name: Verify identity and isolated sidecar path access
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference='Stop'
          $Identity=[System.Security.Principal.WindowsIdentity]::GetCurrent().Name
          $HasSecret=-not [string]::IsNullOrWhiteSpace($env:OPENROUTER_KEY)
          $Root='C:\ProgramData\CKBR\research-sidecar'
          Write-Host "identity=$Identity"
          Write-Host "openrouter_secret_present=$HasSecret"
          Write-Host "programdata_ckbr_present=$([bool](Test-Path -LiteralPath 'C:\ProgramData\CKBR' -PathType Container))"
          Write-Host "sidecar_root_present=$([bool](Test-Path -LiteralPath $Root -PathType Container))"
          if(-not $HasSecret){throw 'WINGLESS_OPENROUTER_SECRET_MISSING'}
          Write-Host 'RESEARCH_SIDECAR_SECRET_PREFLIGHT=PASS'
