name: Research Sidecar Task Registration Probe

on:
  push:
    branches:
      - ops/research-autonomy-provider-probe-r1
    paths:
      - .github/workflows/research-autonomy-provider-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: [self-hosted, Windows, X64, wingless-research-safe]
    timeout-minutes: 5
    steps:
      - name: Test no-trigger task registration as NETWORK SERVICE
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference='Stop'
          $Name='CKBPlane Research Sidecar Registration Probe'
          Unregister-ScheduledTask -TaskName $Name -Confirm:$false -ErrorAction SilentlyContinue
          $Action=New-ScheduledTaskAction -Execute 'cmd.exe' -Argument '/c exit 0'
          $Principal=New-ScheduledTaskPrincipal -UserId 'NT AUTHORITY\NETWORK SERVICE' -LogonType ServiceAccount -RunLevel Limited
          $Settings=New-ScheduledTaskSettingsSet -ExecutionTimeLimit (New-TimeSpan -Minutes 1)
          try{
            Register-ScheduledTask -TaskName $Name -Action $Action -Principal $Principal -Settings $Settings -ErrorAction Stop | Out-Null
            $T=Get-ScheduledTask -TaskName $Name -ErrorAction Stop
            Write-Host "task_registration=PASS"
            Write-Host "task_principal=$($T.Principal.UserId)"
          }finally{
            Unregister-ScheduledTask -TaskName $Name -Confirm:$false -ErrorAction SilentlyContinue
          }
          Write-Host 'RESEARCH_SIDECAR_TASK_REGISTRATION_PROBE=PASS'
