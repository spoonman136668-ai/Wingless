name: Read CKB Codex Configuration Paths

on:
  push:
    branches:
      - ops/research-autonomy-provider-probe-r1
    paths:
      - .github/workflows/research-autonomy-provider-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: [self-hosted, Windows, X64, wingless-research-safe]
    timeout-minutes: 5
    steps:
      - name: Read configured Codex paths only
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference='Stop'
          $Config='C:\Users\camar\GolandProjects\ckb-plane\config\autonomy.yaml'
          if(-not(Test-Path -LiteralPath $Config -PathType Leaf)){throw 'CONFIG_UNAVAILABLE'}
          $Lines=Get-Content -LiteralPath $Config
          function GetValue([string]$Key){
            $L=$Lines | Where-Object {$_ -match ("^\s*"+[regex]::Escape($Key)+":\s*")} | Select-Object -First 1
            if($null-eq$L){return ''}
            return (($L -split ':',2)[1].Trim().Trim("'").Trim('"'))
          }
          $Codex=GetValue 'codex'
          $CodexHome=GetValue 'codex_home'
          if([string]::IsNullOrWhiteSpace($Codex)){throw 'CODEX_PATH_NOT_CONFIGURED'}
          if([string]::IsNullOrWhiteSpace($CodexHome)){throw 'CODEX_HOME_NOT_CONFIGURED'}
          Write-Host "codex_path=$Codex"
          Write-Host "codex_home=$CodexHome"
          Write-Host 'CODEX_CONFIG_PATH_PROBE=PASS'
