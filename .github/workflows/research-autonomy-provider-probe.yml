name: Research Sidecar Persistence Preflight

on:
  push:
    branches:
      - ops/research-autonomy-provider-probe-r1
    paths:
      - .github/workflows/research-autonomy-provider-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: [self-hosted, Windows, X64, wingless-research-safe]
    timeout-minutes: 5
    steps:
      - name: Inspect isolated persistence surfaces
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference='Stop'
          $Identity=[System.Security.Principal.WindowsIdentity]::GetCurrent().Name
          Write-Host "identity=$Identity"
          $Svc=@(Get-Service -ErrorAction SilentlyContinue | Where-Object { $_.Name -match 'research|sidecar' -or $_.DisplayName -match 'Research|Sidecar' })
          foreach($S in $Svc){Write-Host "service=$($S.Name)|$($S.Status)|$($S.StartType)"}
          try{
            $Tasks=@(Get-ScheduledTask -ErrorAction Stop | Where-Object { $_.TaskName -match 'research|sidecar' })
            foreach($T in $Tasks){Write-Host "task=$($T.TaskName)|$($T.State)|$($T.Principal.UserId)"}
          }catch{
            Write-Host "scheduled_task_query=UNAVAILABLE"
          }
          $Root='C:\ProgramData\CKBR\research-sidecar'
          Write-Host "sidecar_root_present=$([bool](Test-Path -LiteralPath $Root -PathType Container))"
          Write-Host "secret_present=$([bool](Test-Path -LiteralPath (Join-Path $Root 'secrets\openrouter.dpapi') -PathType Leaf))"
          Write-Host 'RESEARCH_SIDECAR_PERSISTENCE_PREFLIGHT=PASS'
