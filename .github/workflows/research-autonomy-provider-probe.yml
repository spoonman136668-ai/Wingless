name: Research Autonomy Nemotron Gateway Qualification

on:
  push:
    branches:
      - ops/research-autonomy-provider-probe-r1
    paths:
      - cmd/ckb-planner-gateway/**
      - reasoner/**
      - .github/workflows/research-autonomy-provider-probe.yml

permissions:
  contents: read

jobs:
  qualify:
    runs-on: [self-hosted, Windows, X64, wingless-research-safe]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Focused gateway and reasoner tests
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference='Stop'
          $env:GOFLAGS='-buildvcs=false'
          go test ./cmd/ckb-planner-gateway ./reasoner -count=1
          if($LASTEXITCODE -ne 0){throw 'FOCUSED_TEST_FAILED'}

      - name: Full Wingless regression
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference='Stop'
          $env:GOFLAGS='-buildvcs=false'
          go test ./... -count=1
          if($LASTEXITCODE -ne 0){throw 'FULL_REGRESSION_FAILED'}

      - name: Deterministic Windows build
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference='Stop'
          $env:GOFLAGS='-buildvcs=false'
          New-Item -ItemType Directory -Force -Path '.qualification' | Out-Null
          go build -trimpath -o '.qualification\ckb-nemotron-planner-gateway.exe' ./cmd/ckb-planner-gateway
          if($LASTEXITCODE -ne 0){throw 'BUILD_FAILED'}
          Write-Host "gateway_sha256=$((Get-FileHash -LiteralPath '.qualification\ckb-nemotron-planner-gateway.exe' -Algorithm SHA256).Hash.ToLowerInvariant())"
          Write-Host 'NEMOTRON_GATEWAY_WINDOWS_QUALIFICATION=PASS'
