name: Codex Runtime Accessibility Probe

on:
  push:
    branches:
      - ops/research-autonomy-provider-probe-r1
    paths:
      - .github/workflows/research-autonomy-provider-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: [self-hosted, Windows, X64, wingless-research-safe]
    timeout-minutes: 5
    steps:
      - name: Verify configured Codex runtime is reachable
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference='Stop'
          $Codex='C:\Users\camar\AppData\Local\Programs\OpenAI\Codex\bin\codex.exe'
          $CodexHome='C:\Users\camar\.ckb-plane-codex-home-toy-r1'
          try{$ToolOK=Test-Path -LiteralPath $Codex -PathType Leaf -ErrorAction Stop}catch{$ToolOK=$false}
          try{$HomeOK=Test-Path -LiteralPath $CodexHome -PathType Container -ErrorAction Stop}catch{$HomeOK=$false}
          Write-Host "codex_path_accessible=$ToolOK"
          Write-Host "codex_home_accessible=$HomeOK"
          if($ToolOK){
            $V=@(& $Codex --version 2>&1)
            Write-Host "codex_version=$($V -join ' ')"
            Write-Host "codex_version_exit=$LASTEXITCODE"
          }
          Write-Host 'CODEX_RUNTIME_ACCESS_PROBE=PASS'
