name: Research Sidecar Final Activation Preflight

on:
  push:
    branches:
      - ops/research-autonomy-provider-probe-r1
    paths:
      - .github/workflows/research-autonomy-provider-probe.yml
      - .github/workflows/research-sidecar-activate.yml

permissions:
  contents: read

jobs:
  preflight:
    runs-on: [self-hosted, Windows, X64, wingless-research-safe]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Stage final isolated root and seal dormant activation workflow
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference='Stop'
          Set-StrictMode -Version 2.0

          $ExpectedBinary='46e4fc8d6344c4f6a554c02aeaf9f3adb8f8c1ee7871d74f70f69f111c5cf3de'
          $ExpectedWingless='c1d35fa339c245b382450a7cfb222c0e92f0154f'
          $ExpectedPackage='d92c2b211780d35d5525c2142fd286bc3ec23aa0'
          $Handoff='C:\ProgramData\CKBR\codex\work\research-sidecar-qualified-handoff'
          $Root='C:\ProgramData\CKBR\research-sidecar'
          $TaskName='CKBPlane Research Sidecar'
          $ActivationWorkflow=Join-Path $env:GITHUB_WORKSPACE '.github\workflows\research-sidecar-activate.yml'

          $Identity=[Security.Principal.WindowsIdentity]::GetCurrent().Name
          if($Identity-cne'NT AUTHORITY\NETWORK SERVICE'){throw "SIDECAR_IDENTITY_MISMATCH observed=$Identity"}

          $HandoffRecord=Get-Content -LiteralPath (Join-Path $Handoff 'handoff.json') -Raw | ConvertFrom-Json
          if([string]$HandoffRecord.schema-cne'ckb-plane.research-sidecar-qualified-handoff.v1' -or
             [string]$HandoffRecord.sidecar_binary_sha256-cne$ExpectedBinary -or
             [string]$HandoffRecord.activation_package_head-cne$ExpectedPackage -or
             [bool]$HandoffRecord.activation_authorized){
              throw 'SIDECAR_HANDOFF_PROVENANCE_INVALID'
          }

          $Binary=Join-Path $Handoff 'research-sidecar.exe'
          $Package=Join-Path $Handoff 'package'
          $Lifecycle=Join-Path $Package 'Lifecycle.ps1'
          $Manifest=Get-Content -LiteralPath (Join-Path $Package 'manifest.json') -Raw | ConvertFrom-Json
          if((Get-FileHash -LiteralPath $Binary -Algorithm SHA256).Hash.ToLowerInvariant()-cne$ExpectedBinary){throw 'SIDECAR_HANDOFF_BINARY_HASH_MISMATCH'}
          if([string]$Manifest.qualified_binary_sha256-cne$ExpectedBinary -or [string]$Manifest.wingless_bootstrap_head-cne$ExpectedWingless -or [bool]$Manifest.activation_authorized){throw 'SIDECAR_HANDOFF_PACKAGE_INVALID'}

          if(-not(Test-Path -LiteralPath $ActivationWorkflow -PathType Leaf)){throw 'SIDECAR_ACTIVATION_WORKFLOW_MISSING'}
          $ActivationText=Get-Content -LiteralPath $ActivationWorkflow -Raw
          foreach($Required in @('research-sidecar-activate-request.json','AuthorizeActivation','-Mode activate',$ExpectedBinary,$ExpectedWingless,'activation-preflight.json')){
              if(-not$ActivationText.Contains($Required)){throw "SIDECAR_ACTIVATION_WORKFLOW_BINDING_MISSING token=$Required"}
          }
          foreach($Forbidden in @('CKB-plane Controller','Stop-CKBPlane','Start-CKBPlane','Coinbase','TradeGuard')){
              if($ActivationText -match [regex]::Escape($Forbidden)){throw "SIDECAR_ACTIVATION_WORKFLOW_FORBIDDEN token=$Forbidden"}
          }

          $Existing=Get-ScheduledTask -TaskName $TaskName -ErrorAction SilentlyContinue
          if($null-ne$Existing){
              $ExistingAction=@($Existing.Actions)[0]
              if($Existing.Principal.UserId -notmatch 'NETWORK SERVICE' -or
                 [string]$ExistingAction.Execute -notmatch 'powershell' -or
                 [string]$ExistingAction.Arguments -notlike '*C:\ProgramData\CKBR\research-sidecar\ops\Lifecycle.ps1*'){
                  throw 'SIDECAR_STALE_TASK_IDENTITY_MISMATCH'
              }
              if($Existing.State-eq'Running'){throw 'SIDECAR_TASK_ALREADY_RUNNING_DURING_PREFLIGHT'}
              Stop-ScheduledTask -TaskName $TaskName -ErrorAction SilentlyContinue
              Unregister-ScheduledTask -TaskName $TaskName -Confirm:$false -ErrorAction Stop
              Write-Host "stale_task_cleanup=True prior_state=$($Existing.State)"
          }else{
              Write-Host 'stale_task_cleanup=False'
          }

          & $Lifecycle -Mode stage -QualifiedBinaryPath $Binary
          if($LASTEXITCODE-ne0){throw "SIDECAR_FINAL_STAGE_FAILED exit=$LASTEXITCODE"}

          $Installed=Join-Path $Root 'bin\research-sidecar.exe'
          if((Get-FileHash -LiteralPath $Installed -Algorithm SHA256).Hash.ToLowerInvariant()-cne$ExpectedBinary){throw 'SIDECAR_FINAL_BINARY_HASH_MISMATCH'}
          $Stage=Get-Content -LiteralPath (Join-Path $Root 'stage.json') -Raw | ConvertFrom-Json
          if([bool]$Stage.task_registered -or [bool]$Stage.sidecar_started){throw 'SIDECAR_FINAL_STAGE_NOT_INACTIVE'}
          if($null-ne(Get-ScheduledTask -TaskName $TaskName -ErrorAction SilentlyContinue)){throw 'SIDECAR_TASK_REGISTERED_DURING_PREFLIGHT'}

          $WorkflowHash=(Get-FileHash -LiteralPath $ActivationWorkflow -Algorithm SHA256).Hash.ToLowerInvariant()
          $Receipt=[ordered]@{
              schema='ckb-plane.research-sidecar-activation-preflight.v1'
              qualified_binary_sha256=$ExpectedBinary
              wingless_source_head=$ExpectedWingless
              activation_package_head=$ExpectedPackage
              activation_workflow_sha256=$WorkflowHash
              runtime_identity=$Identity
              task_registered=$false
              sidecar_started=$false
              sealed_at_utc=[DateTimeOffset]::UtcNow.ToString('o')
          }
          [IO.File]::WriteAllText((Join-Path $Root 'activation-preflight.json'),($Receipt|ConvertTo-Json -Depth 6),(New-Object Text.UTF8Encoding($false)))
          Write-Host "identity=$Identity"
          Write-Host "binary_sha256=$ExpectedBinary"
          Write-Host "activation_workflow_sha256=$WorkflowHash"
          Write-Host 'task_registered=False'
          Write-Host 'sidecar_started=False'
          Write-Host 'RESEARCH_SIDECAR_FINAL_PREFLIGHT=PASS'

# recovery: stale queued sidecar task may be removed only after exact identity/action validation