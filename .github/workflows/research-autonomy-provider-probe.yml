name: Research Autonomy Nemotron Secret Seal

on:
  push:
    branches:
      - ops/research-autonomy-provider-probe-r1
    paths:
      - .github/workflows/research-autonomy-provider-probe.yml

permissions:
  contents: read

jobs:
  seal:
    runs-on: [self-hosted, Windows, X64, wingless-research-safe]
    timeout-minutes: 5
    env:
      WINGLESS_REASONER_OPENROUTER_API_KEY: ${{ secrets.WINGLESS_REASONER_OPENROUTER_API_KEY }}
    steps:
      - name: Seal Nemotron credential for Network Service provider
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference='Stop'
          if([string]::IsNullOrWhiteSpace($env:WINGLESS_REASONER_OPENROUTER_API_KEY)){throw 'REASONER_SECRET_MISSING'}
          $Root='C:\Users\camar\GolandProjects\ckb-plane\state\research\secrets'
          New-Item -ItemType Directory -Force -Path $Root | Out-Null
          $Path=Join-Path $Root 'nemotron-openrouter.dpapi'
          $Secure=ConvertTo-SecureString $env:WINGLESS_REASONER_OPENROUTER_API_KEY -AsPlainText -Force
          $Cipher=$Secure | ConvertFrom-SecureString
          [IO.File]::WriteAllText($Path,$Cipher,(New-Object Text.UTF8Encoding($false)))
          $RoundTrip=(Get-Content -LiteralPath $Path -Raw).Trim() | ConvertTo-SecureString
          $Ptr=[Runtime.InteropServices.Marshal]::SecureStringToBSTR($RoundTrip)
          try{$Plain=[Runtime.InteropServices.Marshal]::PtrToStringBSTR($Ptr)}
          finally{[Runtime.InteropServices.Marshal]::ZeroFreeBSTR($Ptr)}
          if($Plain -cne $env:WINGLESS_REASONER_OPENROUTER_API_KEY){throw 'DPAPI_ROUNDTRIP_FAILED'}
          Remove-Variable Plain -ErrorAction SilentlyContinue
          Write-Host "sealed_path=$Path"
          Write-Host "cipher_sha256=$((Get-FileHash -LiteralPath $Path -Algorithm SHA256).Hash.ToLowerInvariant())"
          Write-Host 'NEMOTRON_SECRET_SEAL=PASS'
