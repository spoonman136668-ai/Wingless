name: NCI-04G Wingless Development Focused
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: '1.25.5'
          cache: false
      - name: Focused development-only learning contracts
        run: go test ./cognition -run '^TestNCI04G3' -count=1 -v
      - name: Emit pre-primary generator digest (no outcomes)
        shell: bash
        run: sha256sum cognition/nci04g_dev_test.go
      - name: Read-only source identity and clean checkout
        shell: bash
        run: |
          test -z "$(git status --porcelain)"
          echo "NCI04G_WINGLESS_FOCUSED_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
