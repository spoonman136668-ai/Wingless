name: Wingless W-R46 frozen seed-cluster order-signal replication
on:
  push:
    branches: [research/w-r46-cluster-replication-r1]
permissions:
  contents: read
jobs:
  science:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Exact immutable source and preregistration gate
        run: |
          set -euo pipefail
          git merge-base --is-ancestor a0733122a2e35cfb05bbd04231847d68abc6dff5 HEAD
          test "$(git hash-object research/contrib/chatgpt/20261013-w-r45-order-blind/execute.py)" = 18b39645174d29d43e1813fe578c680fde156077
          test "$(git hash-object research/contrib/chatgpt/20261013-w-r46-cluster-replication/prereg.json)" = 1ffe26f27e595e1d13311523c8fa0447da41d42d
          test "$(git hash-object research/contrib/chatgpt/20261013-w-r46-cluster-replication/execute.py)" = ba17dedfd0cbbb296e774ba055c4d78ce021ab13
          python3 -m json.tool research/contrib/chatgpt/20261013-w-r46-cluster-replication/prereg.json >/dev/null
          python3 -m py_compile research/contrib/chatgpt/20261013-w-r46-cluster-replication/execute.py
      - name: Original frozen first-use 48-seed cluster replication
        run: |
          set -euo pipefail
          python3 -B research/contrib/chatgpt/20261013-w-r46-cluster-replication/execute.py > /tmp/W-R46-original.json
          python3 -m json.tool /tmp/W-R46-original.json >/dev/null
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/W-R46-original.json'))
          assert x["development_seeds"]==list(range(2416,2432))
          assert x["sealed_heldout_seeds"]==list(range(2432,2480))
          assert len(x["results"]["identity"]["by_seed"])==48
          assert len(x["results"]["xor55"]["by_seed"])==48
          assert x["results"]["identity"]["bootstrap_resamples"]==4096
          print('CLASSIFICATION',x['classification'])
          print('BALANCED_ACCURACY',x["results"]["identity"]["balanced_accuracy"])
          print('SEED_CLUSTER_INTERVAL',x["results"]["identity"]["seed_cluster_interval"])
          print('FAMILY_ACCURACIES',{k:v['accuracy'] for k,v in x['results']['identity']['family'].items()})
          print('XOR_MATCH',x["results"]["identity"]["balanced_accuracy"]==x["results"]["xor55"]["balanced_accuracy"])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: W-R46-original-seed-cluster-replication
          path: /tmp/W-R46-original.json
          retention-days: 90
          if-no-files-found: error
      - name: One complete Wingless regression and build
        run: go test ./... && go build ./...
