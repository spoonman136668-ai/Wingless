name: ITD-02 goal-progress four-arm preregistration qualification
on:
  push:
    branches: [research/itd02-goal-progress-v1-20261027]
    paths:
      - 'research/native/itd02/outcome/progress_stateful_eval.py'
      - 'research/native/itd02/outcome/test_progress_stateful_eval.py'
      - '.github/workflows/itd02-progress-split-sourcefree.yml'
permissions:
  contents: read
jobs:
  prospective-protocol:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Test prospectively disjoint seeds and four-arm feedback accounting
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile research/native/itd02/outcome/progress_stateful_eval.py
          cd research/native/itd02/outcome
          python -m unittest -v test_progress_stateful_eval test_motion_stateful_eval test_motion_source_compare test_exact_exposure_v2 test_exact_exposure_v3
