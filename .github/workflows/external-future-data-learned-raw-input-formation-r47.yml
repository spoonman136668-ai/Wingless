name: Wingless learned raw-input state-former pilot R47
on:
  push:
    branches:
      - 'research/external-hosted-wingless-rsi-learned-state-former-pilot-r47'
    paths:
      - 'docs/experiments/wlm-lm-external-future-data-learned-raw-input-formation-r47.json'
      - 'docs/experiments/wlm-lm-external-future-data-r47-manifest.json'
      - 'unitary/wlm_lm_external_future_data_learned_raw_input_formation_r47.go'
      - 'cmd/wlm-lm-external-future-data-learned-raw-input-formation-r47/main.go'
      - '.github/workflows/external-future-data-learned-raw-input-formation-r47.yml'
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Validate frozen package
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^{commit})" = "$(git rev-parse HEAD)"
          git merge-base --is-ancestor '4721b17fc7f19c2cb54323ed58e8e1ceadc56916' HEAD
          git merge-base --is-ancestor 'bdd146178f06d4a71fc6ea0944f12bef1eafcd9e' HEAD
          changed="$(git diff --name-only '4721b17fc7f19c2cb54323ed58e8e1ceadc56916..HEAD' | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/external-future-data-learned-raw-input-formation-r47.yml' \
            'cmd/wlm-lm-external-future-data-learned-raw-input-formation-r47/main.go' \
            'docs/experiments/wlm-lm-external-future-data-learned-raw-input-formation-r47.json' \
            'docs/experiments/wlm-lm-external-future-data-r47-manifest.json' \
            'unitary/wlm_lm_external_future_data_learned_raw_input_formation_r47.go' | sort)"
          test "$changed" = "$expected"
          test "$(git rev-parse 'bdd146178f06d4a71fc6ea0944f12bef1eafcd9e:docs/experiments/wlm-lm-external-future-data-learned-raw-input-formation-r47.json')" = '298aa28db39bf5920c8036c3a42821ffa3879991'
          test "$(git rev-parse 'bdd146178f06d4a71fc6ea0944f12bef1eafcd9e:docs/experiments/wlm-lm-external-future-data-r47-manifest.json')" = 'fe2cd2a8d72074985f7e526b0ba6da2528c42c6f'
          python3 - <<'PY'
          import json
          p=json.load(open("docs/experiments/wlm-lm-external-future-data-learned-raw-input-formation-r47.json"))
          m=json.load(open("docs/experiments/wlm-lm-external-future-data-r47-manifest.json"))
          assert p["experiment"]=="WLM-LM-EXTERNAL-FUTURE-DATA-LEARNED-RAW-INPUT-FORMATION-R47"
          assert p["candidate_search"]["candidate_count"]==4
          assert p["resource_envelope"]["state_dimension"]==6
          assert p["raw_state"]["readout_parameters_including_intercept"]==7
          assert p["governance"]["broad_continual_training"] is False
          assert m["manifest_sha256"]=="b71ff7db39450a120a700129dfb2ed3f38a6b134f5c23e5af1391685ed8801d5"
          assert m["source_count"]==9 and m["total_prefix_bytes"]==171816
          PY
      - name: Verify exact READY_RESEARCH receipt
        shell: bash
        env:
          AUTHORITY_RECEIPT_SHA256: 'd382f4595cd455386da94868293c7a6b0db3dcb00d586103f21184c9966614e4'
          AUTHORITY_RECEIPT_B64: ''
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,hashlib,json,os,pathlib
          raw=base64.b64decode(os.environ["AUTHORITY_RECEIPT_B64"],validate=True)
          assert hashlib.sha256(raw).hexdigest()==os.environ["AUTHORITY_RECEIPT_SHA256"]
          r=json.loads(raw)
          assert r["schema"]=="ckb-plane.external-exposure-ready-research-receipt.v1"
          assert r["project"]=="Wingless"
          assert r["experiment"]=="WLM-LM-EXTERNAL-FUTURE-DATA-LEARNED-RAW-INPUT-FORMATION-R47"
          assert r["preregistration_sha"]=="bdd146178f06d4a71fc6ea0944f12bef1eafcd9e"
          assert r["manifest_sha256"]=="b71ff7db39450a120a700129dfb2ed3f38a6b134f5c23e5af1391685ed8801d5"
          assert r["ckb_plane_main_sha"]=="6916c3c80428b2fa111bbc636025b29fc1bb4304"
          assert r["plan_decision"]["disposition"]=="READY_PLAN"
          assert r["fetch_decision"]["disposition"]=="READY_FETCH"
          assert r["research_decision"]["disposition"]=="READY_RESEARCH"
          pathlib.Path("/tmp/authority.json").write_bytes(raw)
          PY
      - name: Fetch frozen historical and sealed unseen manifests
        shell: bash
        run: |
          set -euo pipefail
          for n in transfer third fourth fifth fifteenth sixteenth seventeenth; do mkdir -p "$RUNNER_TEMP/r47-$n"; done
          python3 - <<'PY'
          import hashlib,json,os,pathlib,urllib.parse,urllib.request
          root=pathlib.Path(os.environ["RUNNER_TEMP"])
          roots={n:root/("r47-"+n) for n in ("transfer","third","fourth","fifth","fifteenth","sixteenth","seventeenth")}
          historical={
            "transfer":[
              ("code","https://raw.githubusercontent.com/python/cpython/ebf955df7a89ed0c7968f79faec1de49f61ed7cb/Lib/statistics.py",61896,"3023ec949802c2e880a000775bfd1a6b70c21b5423881118141e3ec69d8e3336",41453,"66bb25b24a0316b4965c64798494de93a1d7332672b15b5f430ab6a2fb4b9d45"),
              ("structured","https://raw.githubusercontent.com/json-schema-org/JSON-Schema-Test-Suite/5b0ee1613e45fcc2bddac00e07c19cd49b00d8a8/tests/draft2020-12/uniqueItems.json",14490,"ed84ef6ddc827659e257ba64cbe9679f06932b6320bea5c07622bf3d2cc4daa5",14365,"95ddbd0eaef29aad5ecfc74f9da21b795481f58b2c59380324a445fcd4d08932"),
              ("technical_prose","https://raw.githubusercontent.com/golang/go/6f5c275ebdc454197fff5f1496521c8f81e20eef/doc/README.md",3124,"c1bf000e7a873b3afed329c5b9f9c07f7692b1d7fb2bfca2d7600cec8b1d1407",1454,"48c3d95b8b03864a4af41d892710675956cde85afd0d5d6c331594de9f17881b")],
            "third":[
              ("code","https://raw.githubusercontent.com/torvalds/linux/a74306e2e676f9775457366fc047a660fbf02f26/kernel/sched/core.c",303863,"9297982652b9810b3508993c06d3c6e097ebca5cbe1ef3a6246bccfa0c1128b1",41453,"50744a9e70d67d62c97f3f434f4f05788b6b8514c6bce46cf7dafbaf49e2abff"),
              ("structured","https://raw.githubusercontent.com/SchemaStore/schemastore/de76181a2ab215431d3e9314bc14f83cc3b01ad2/src/schemas/json/github-workflow.json",118601,"d10c9f4656e1bd5bc6727e9b35080e017dc167154726fca93da33c7a6bd1c4f3",14365,"2a97ba02bc5e479b1738f6f0c3e09318bb5a255350c84de014ddbcebea46af56"),
              ("technical_prose","https://raw.githubusercontent.com/rust-lang/book/1500248d8f230566e4ec9f27fcbb8fe9e2898ab1/src/ch01-03-hello-cargo.md",11025,"61369f359b84b646fc3773eb569a26bc18ba6edb4cf2be06a84472c7054c0e39",1454,"23c002a1984ed065abfdbafa82100ed54d6bf6276a947676e710a30c75d96017")],
            "fourth":[
              ("code","https://raw.githubusercontent.com/kubernetes/kubernetes/e7967bb9b76d43a6388abb7a4e90d2f899ef97ff/pkg/kubelet/kubelet.go",156626,"e0f247ef45cb281166b58ba1a013dc6925023388193bd74c1f126c695b770d34",41453,"283073d9f6c0dd868c39a913364bce6744ff1e29c038f6920197c0d33e0c2ac1"),
              ("structured","https://raw.githubusercontent.com/microsoft/TypeScript/50d70a3f5f453a79a4323b263165da51f656a4e3/package-lock.json",143844,"52b6c9bd0a26ef1b0fc27dfbfaa00df6a047cdddd587d07c4f6c1c3345faf5cf",14365,"a46fcfb7d862b03b750b61a5f667d4ac25a064df9ccb746e395db7e864068933"),
              ("technical_prose","https://raw.githubusercontent.com/django/django/a461af8ce48762d7ec602260aaff81014ddccbcb/docs/intro/tutorial01.txt",10844,"1cf1817e6211b7c0fa9e8044ee808fde1e8f16ca5f9d5ab5358510a5c9591b96",1454,"5d0c2efd139bd6094098bc893ed746020f03e0860a25f278348f43f47c236222")],
            "fifth":[
              ("code","https://raw.githubusercontent.com/pytorch/pytorch/496340f06ef7bda2800522429ba3f4e3473a92fa/torch/_inductor/scheduler.py",539420,"b13a89d0fd77430e2a637dae41980086909c4ad4a855b8418dc17286c39953b8",41453,"504b68653b5478b88216f6342a74bacc5982549657005fb486dd00d753b4ea9a"),
              ("structured","https://raw.githubusercontent.com/microsoft/vscode/6fad7188e7dbf7db564e5e4a85960eb2bf69bdf4/package-lock.json",784171,"73224989048e176e7eeafa8aa729df7e4d510f4bd453018902d95345db0fe886",14365,"5c0f3a215ba35b7fbcaae212d27a33ba5109e16d89809987d16fa89072534281"),
              ("technical_prose","https://raw.githubusercontent.com/numpy/numpy/2f1eca306857b641fb0fef0ab854a2d4137e1581/doc/source/user/absolute_beginners.rst",52653,"945a0a598d080ee7526c9bd5459ce615a5b49fe0331adfdf8bbd8812e908e7e3",1454,"527e21110a7f84a1939ccf6063fdfeb77905d9ec180e5fde18488d21b90c4f49")]}
          for group,sources in historical.items():
            for domain,url,full_n,full_h,prefix_n,prefix_h in sources:
              data=urllib.request.urlopen(urllib.request.Request(url,headers={"User-Agent":"wingless-r47"}),timeout=90).read(full_n+1)
              assert len(data)==full_n and hashlib.sha256(data).hexdigest()==full_h
              p=data[:prefix_n];assert hashlib.sha256(p).hexdigest()==prefix_h
              filename={"code":"code.bin","structured":"structured.bin","technical_prose":"technical-prose.bin"}[domain]
              (roots[group]/filename).write_bytes(p)
          manifest=json.load(open("docs/experiments/wlm-lm-external-future-data-r47-manifest.json"))
          assert manifest["manifest_sha256"]=="b71ff7db39450a120a700129dfb2ed3f38a6b134f5c23e5af1391685ed8801d5"
          for group in manifest["unseen"]:
            name=group["name"]
            for src in group["sources"]:
              url=f"https://raw.githubusercontent.com/{src['repo']}/{src['commit']}/{urllib.parse.quote(src['path'])}"
              data=urllib.request.urlopen(urllib.request.Request(url,headers={"User-Agent":"wingless-r47"}),timeout=90).read()
              got=hashlib.sha1((f"blob {len(data)}\0").encode()+data).hexdigest()
              assert got==src["git_blob"] and len(data)>=src["prefix_bytes"]
              p=data[:src["prefix_bytes"]]
              assert hashlib.sha256(p).hexdigest()==src["prefix_sha256"]
              filename={"code":"code.bin","structured":"structured.bin","technical_prose":"technical-prose.bin"}[src["domain"]]
              (roots[name]/filename).write_bytes(p)
          PY
          for n in transfer third fourth fifth fifteenth sixteenth seventeenth; do
            key="$(echo "$n" | tr '[:lower:]' '[:upper:]')_ROOT"
            echo "$key=$RUNNER_TEMP/r47-$n" >> "$GITHUB_ENV"
          done
      - name: Focused package tests
        run: |
          set -euo pipefail
          go test ./unitary -count=1
          go test ./cmd/wlm-lm-external-future-data-learned-raw-input-formation-r47 -count=1
      - name: Full Go regression
        run: go test ./... -count=1
      - name: Run frozen R47 twice
        shell: bash
        run: |
          set -euo pipefail
          args=(--transfer-root "$TRANSFER_ROOT" --third-root "$THIRD_ROOT" --fourth-root "$FOURTH_ROOT" --fifth-root "$FIFTH_ROOT" --fifteenth-root "$FIFTEENTH_ROOT" --sixteenth-root "$SIXTEENTH_ROOT" --seventeenth-root "$SEVENTEENTH_ROOT")
          go run ./cmd/wlm-lm-external-future-data-learned-raw-input-formation-r47 "${args[@]}" --resource-out /tmp/resource.json > /tmp/result1.json
          go run ./cmd/wlm-lm-external-future-data-learned-raw-input-formation-r47 "${args[@]}" > /tmp/result2.json
          cmp /tmp/result1.json /tmp/result2.json
          test -s /tmp/resource.json
          cat /tmp/result1.json
      - name: Classify frozen R47
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,math,pathlib
          r=json.loads(pathlib.Path("/tmp/result1.json").read_text());m=r["metrics"]
          valid=(m["historical_manifest_count"]==4 and m["unseen_manifest_count"]==3 and
                 m["candidate_mechanism_count"]==4 and len(r["candidate_history"])==4 and
                 m["state_dimension"]==6 and m["readout_parameter_count"]==7 and
                 m["candidate_pair_count"]==108 and m["non_tie_pair_count"]>=72 and
                 m["heldout_outcome_use_before_candidate_freeze"]==0 and
                 m["post_result_candidate_or_threshold_choice_count"]==0 and
                 m["capacity_growth_event_count"]==0 and m["external_model_call_count"]==0 and
                 m["tokenizer_use_count"]==0 and m["fixed_budget_mismatch_count"]==0 and
                 m["raw_state_source_mismatch_count"]==0 and m["source_identity_mismatch_count"]==0 and
                 m["fit_failure_count"]==0 and m["invalid_row_count"]==0 and
                 all(math.isfinite(float(v)) for v in m.values()))
          resource_ok=(m["selected_resource_eligible"]==1 and
                       m["selected_effective_state_former_scalars"]<=m["baseline_effective_state_former_scalars"])
          scientific_strong=(m["learned_minus_baseline_accuracy"]>=0.05 and m["positive_manifest_count"]>=2 and
                             m["learned_mean_decision_regret"]<=0.90*m["baseline_mean_decision_regret"])
          supported=valid and resource_ok and scientific_strong
          mixed=(valid and not supported and (
                 (m["learned_minus_baseline_accuracy"]>=0.015 and m["positive_manifest_count"]>=2 and
                  m["learned_mean_decision_regret"]<m["baseline_mean_decision_regret"]) or
                 (scientific_strong and not resource_ok)))
          cls="invalid" if not valid else "supported" if supported else "mixed" if mixed else "negative"
          nexts={
            "supported":"WLM-LM-EXTERNAL-FUTURE-DATA-LEARNED-STATE-FORMER-DISJOINT-REPLICATION-R48",
            "mixed":"WLM-LM-EXTERNAL-FUTURE-DATA-LEARNED-STATE-FORMER-RESOURCE-ATTRIBUTION-R48",
            "negative":"WLM-LM-EXTERNAL-FUTURE-DATA-LEARNED-STATE-FORMER-FEATURE-ATTRIBUTION-R48",
            "invalid":None}
          failure_class=None;failing_step=None;error_signature=None
          if cls=="invalid":
              failure_class="FROZEN_VALIDITY_FAILURE";failing_step="classification"
              error_signature=hashlib.sha256(json.dumps(m,sort_keys=True,separators=(",",":")).encode()).hexdigest()
          out={"schema":"wingless.research-classification.v1",
               "experiment":"WLM-LM-EXTERNAL-FUTURE-DATA-LEARNED-RAW-INPUT-FORMATION-R47",
               "classification":cls,"validity_pass":valid,
               "learned_mechanism_pilot_success":supported,
               "equal_or_lower_resource_cost":resource_ok,
               "scientific_strong":scientific_strong,
               "rsi_success":False,
               "rsi_success_reason":"This is a bounded learned-mechanism pilot. Full RSI evidence still requires frozen A/B successor-generation superiority on identical unseen tasks and equal/lower cost.",
               "next_successor":nexts[cls],
               "failure_class":failure_class,"failing_step":failing_step,"error_signature":error_signature,
               "authority_receipt_sha256":"d382f4595cd455386da94868293c7a6b0db3dcb00d586103f21184c9966614e4","metrics":m,
               "candidate_history":r["candidate_history"]}
          pathlib.Path("/tmp/classification.json").write_text(json.dumps(out,separators=(",",":")),encoding="utf-8")
          print(json.dumps(out,separators=(",",":")))
          PY
      - name: Delete external bytes
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP"/r47-*
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wingless-learned-raw-input-formation-r47
          path: |
            /tmp/authority.json
            /tmp/result1.json
            /tmp/result2.json
            /tmp/resource.json
            /tmp/classification.json
          if-no-files-found: error
