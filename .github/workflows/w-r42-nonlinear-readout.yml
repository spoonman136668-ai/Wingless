name: Wingless W-R42 frozen bounded nonlinear readout attribution
on:
  push:
    branches: [research/w-r42-nonlinear-readout-r1]
permissions:
  contents: read
jobs:
  science:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Exact source identity and freeze before first use
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 260dc136709f553e8369518605d5010fcfc4f34c HEAD
          test "$(git hash-object research/contrib/chatgpt/20261013-w-r41-feature-audit/execute.py)" = 1887bb8ad74f0e3aafffd567f7af620ef6ae31c2
          test "$(git hash-object research/contrib/chatgpt/20261013-w-r42-nonlinear/prereg.json)" = 6688dc54b96440c1cb31f8ea335d1620e105ac27
          test "$(git hash-object research/contrib/chatgpt/20261013-w-r42-nonlinear/execute.py)" = 503157c169b2572b3fbc07a0eb9c8275fca01aac
          python3 -m json.tool research/contrib/chatgpt/20261013-w-r42-nonlinear/prereg.json > /dev/null
          python3 -m py_compile research/contrib/chatgpt/20261013-w-r42-nonlinear/execute.py
      - name: One original frozen sealed nonlinear versus linear experiment
        run: |
          set -euo pipefail
          python3 -B research/contrib/chatgpt/20261013-w-r42-nonlinear/execute.py > /tmp/W-R42-original.json
          python3 -m json.tool /tmp/W-R42-original.json > /dev/null
          python3 - <<'PY'
          import json
          a=json.load(open('/tmp/W-R42-original.json'))
          assert a['development_seeds']==list(range(2032,2048))
          assert a['sealed_heldout_seeds']==list(range(2048,2064))
          assert len(a['rows'])==4 and all(len(r['cells'])==6 for r in a['rows'])
          assert a['tree_candidate_split_tests']==3*16*33
          print('CLASSIFICATION',a['classification'])
          print('TREE_GAIN',a['tree_identity_minus_linear_accuracy'])
          print('TRAINING_UPDATES',a['linear_training_updates'])
          print('TREE_TRAIN_CORRECT',a['tree_train_correct'])
          for r in a['rows']: print('ARM',r['arm'],r['condition'],r['accuracy'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: W-R42-original-nonlinear-readout
          path: /tmp/W-R42-original.json
          retention-days: 90
          if-no-files-found: error
      - name: One full required Wingless regression and build
        run: go test ./... && go build ./...
