name: Wingless W-R31 genuine marker value downstream falsification
on:
  push:
    branches: [research/w-r31-legitimate-marker-sequence-r1]
permissions:
  contents: read
jobs:
  science:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Immutable parent and frozen first-use verification
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 8e648949b708666d153320ef5fc3f8b77cae0b37 HEAD
          test "$(git hash-object research/contrib/chatgpt/20261013-w-r30-marker-alias/execute.py)" = 4dd2510a89fd8d142f62724dea529499530b221d
          test "$(git hash-object research/contrib/chatgpt/20261013-w-r31-legitimate-markers/prereg.json)" = 58a372bfee7d1a978a20b4289de80162fbb539ea
          test "$(git hash-object research/contrib/chatgpt/20261013-w-r31-legitimate-markers/execute.py)" = f6aa5ebeca31093df08e2818efd6032cc4f14c94
          python3 -m json.tool research/contrib/chatgpt/20261013-w-r31-legitimate-markers/prereg.json >/dev/null
          python3 -m py_compile research/contrib/chatgpt/20261013-w-r31-legitimate-markers/execute.py
      - name: Original first-use frozen downstream sequence science
        run: |
          set -euo pipefail
          python3 -B research/contrib/chatgpt/20261013-w-r31-legitimate-markers/execute.py > /tmp/W-R31-original.json
          python3 -m json.tool /tmp/W-R31-original.json >/dev/null
          python3 - <<'PY'
          import json
          a=json.load(open("/tmp/W-R31-original.json"))
          assert a["heldout_seeds"]==list(range(1024,1040))
          assert len(a["arms"])==3 and all(len(m["cells"])==24 for m in a["arms"])
          print("CLASSIFICATION",a["classification"])
          print("MULTI_MINUS_ALL_OBSERVED",a["multi_marker_minus_all_observed_noncontrol"])
          for m in a["arms"]:
              print("ARM",m["arm"],m["aggregate_accuracy"],
                    [(c["format"],c["generator"],c["tail_swap_index"],c["accuracy"])
                     for c in m["cells"]])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: W-R31-original-legitimate-marker-cost
          path: /tmp/W-R31-original.json
          if-no-files-found: error
          retention-days: 90
      - name: Single full Wingless regression
        run: go test ./... && go build ./...
