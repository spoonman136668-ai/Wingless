name: Qualify Wingless repo-local autonomy

on:
  push:
    branches:
      - autonomy/repo-local-research-r1
      - research/glm-provider-promotion-r1
    paths:
      - '.research-autonomy/**'
      - 'scripts/Invoke-RepoLocalResearchCycle.ps1'
      - 'scripts/Invoke-NemotronRepoAgent.ps1'
      - 'scripts/Invoke-RepoLocalCutover.ps1'
      - '.github/workflows/research-continuation-controller.yml'
      - '.github/workflows/research-auto-launch.yml'
      - '.github/workflows/repo-local-autonomy-qualify.yml'
  pull_request:
    branches:
      - main
    paths:
      - '.research-autonomy/**'
      - 'scripts/Invoke-RepoLocalResearchCycle.ps1'
      - 'scripts/Invoke-NemotronRepoAgent.ps1'
      - 'scripts/Invoke-RepoLocalCutover.ps1'
      - '.github/workflows/research-continuation-controller.yml'
      - '.github/workflows/research-auto-launch.yml'
      - '.github/workflows/repo-local-autonomy-qualify.yml'

permissions:
  contents: read

jobs:
  qualify:
    runs-on: [self-hosted, Windows, X64, wingless-up-c]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Parse controller and validate contract
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference='Stop'
          $Path=(Resolve-Path 'scripts\Invoke-RepoLocalResearchCycle.ps1').Path
          $Tokens=$null
          $Errors=$null
          [void][System.Management.Automation.Language.Parser]::ParseFile($Path,[ref]$Tokens,[ref]$Errors)
          if(@($Errors).Count -gt 0){
            @($Errors)|ForEach-Object{Write-Host "PARSE_ERROR line=$($_.Extent.StartLineNumber) message=$($_.Message)"}
            throw "CONTROLLER_PARSE_FAILED count=$(@($Errors).Count)"
          }
          $AgentPath=(Resolve-Path 'scripts\Invoke-NemotronRepoAgent.ps1').Path
          $AgentTokens=$null
          $AgentErrors=$null
          [void][System.Management.Automation.Language.Parser]::ParseFile($AgentPath,[ref]$AgentTokens,[ref]$AgentErrors)
          if(@($AgentErrors).Count -gt 0){
            @($AgentErrors)|ForEach-Object{Write-Host "AGENT_PARSE_ERROR line=$($_.Extent.StartLineNumber) message=$($_.Message)"}
            throw "NEMOTRON_AGENT_PARSE_FAILED count=$(@($AgentErrors).Count)"
          }
          $C=Get-Content -Raw '.research-autonomy\config.json'|ConvertFrom-Json
          if($C.schema -cne 'research.autonomy.v2'){throw 'CONFIG_SCHEMA_FAILED'}
          if(-not[bool]$C.enabled){
            if('${{ github.event_name }}' -cne 'pull_request' -or '${{ github.head_ref }}' -cne 'proposal/event-driven-research-continuation-r1'){throw 'CONFIG_MUST_BE_ENABLED_POST_CUTOVER'}
            $Changed=@(git diff --name-only '${{ github.event.pull_request.base.sha }}' HEAD)
            if($LASTEXITCODE -ne 0){throw 'DISABLED_WITNESS_DIFF_FAILED'}
            $Allowed=@('.github/workflows/research-continuation-controller.yml','.github/workflows/repo-local-autonomy-qualify.yml','.github/workflows/hosted-fanout-completion-witness.yml')
            if(@($Changed|Where-Object{$_ -notin $Allowed}).Count -ne 0){throw 'DISABLED_WITNESS_SCOPE_DRIFT'}
            Write-Host 'DISABLED_AUTONOMY_READONLY_WIRING_QUALIFICATION=PASS'
          }
          if($C.mode -cne 'repo-local-self-chain'){throw 'CONFIG_MODE_FAILED'}
          if($C.authority -cne 'research-only'){throw 'CONFIG_AUTHORITY_FAILED'}
          if($C.ckb_plane_role -cne 'governance-only'){throw 'CONFIG_CKB_ROLE_FAILED'}
          if($C.active_branch -cne 'research/autonomy-wingless-active'){throw 'CONFIG_ACTIVE_BRANCH_FAILED'}
          if($C.north_star_sha256 -cne 'e9a7b9b7371d6636d791e47fb1fb166c143687d8d41013a8fb5826ef3a6ac465'){throw 'CONFIG_NORTH_STAR_IDENTITY_FAILED'}
          if($C.research_executor -cne 'disabled'){throw 'STAGED_FREE_RESEARCH_EXECUTOR_MUST_REMAIN_DISABLED'}
          $Text=Get-Content -Raw $Path
          foreach($Needle in @(
            'CKB-plane is governance-only',
            'PREREG_NOT_FIRST_AND_ALONE',
            'QUALIFICATION_BASELINE_MISMATCH',
            'qualified-scientific-result',
            'MIND_PALACE_CONTEXT_UNAVAILABLE_FALLBACK',
            'RESEARCH_EXECUTOR_UNATTENDED=NOT_CONFIGURED_NO_MODEL_INVOCATION'
          )){
            if(-not$Text.Contains($Needle)){throw "CONTROLLER_INVARIANT_MISSING $Needle"}
          }
          foreach($Needle in @('Resolve-Codex','RESEARCH_AGENT_ATTEMPT','Start-Process -FilePath $Codex','--approve-for-me','gpt-5.6-sol','gpt-5.6-luna')){
            if($Text.Contains($Needle)){throw "UNATTENDED_CODEX_INVOCATION_FORBIDDEN $Needle"}
          }
          foreach($Guard in @(
            'RESEARCH_FREE_EXECUTOR_EXPLICIT_OWNER_GATE_REQUIRED',
            'RESEARCH_FREE_EXECUTOR_PUBLIC_SOURCE_REQUIRED',
            'RESEARCH_FREE_EXECUTOR_REQUIRES_EPHEMERAL_RUNNER',
            'RESEARCH_EXTERNAL_PRIVATE_CONTEXT=EXCLUDED',
            'nvidia/nemotron-3-ultra-550b-a55b:free',
            '-MaxRounds 8'
          )){
            if(-not$Text.Contains($Guard)){throw "FREE_RESEARCH_EXECUTOR_GUARD_MISSING $Guard"}
          }
          $RetiredText=Get-Content -Raw 'scripts\Invoke-RepoLocalResearchContinuation.ps1'
          if(-not$RetiredText.Contains('RESEARCH_CONTINUATION_NOT_DISPATCHED=NO_UNATTENDED_MODEL')){throw 'LEGACY_CODEX_ADAPTER_NOT_DISABLED'}
          foreach($Needle in @('Start-Process','CODEX_HOME','codex.exe')){
            if($RetiredText.Contains($Needle)){throw "LEGACY_CODEX_INVOCATION_FORBIDDEN $Needle"}
          }
          $AgentText=Get-Content -Raw $AgentPath
          foreach($Guard in @(
            'Test-PublicTrackedFile',
            'NEMOTRON_READ_REQUIRES_PUBLIC_TRACKED_SOURCE',
            'mind-palace-context',
            'NEMOTRON_PUBLIC_TRACKED_CATALOG_FAILED'
          )){
            if(-not$AgentText.Contains($Guard)){throw "NEMOTRON_PUBLIC_SOURCE_GUARD_MISSING $Guard"}
          }
          foreach($Needle in @(
            'z-ai/glm-5.3',
            'integrate.api.nvidia.com/v1/chat/completions',
            'NVIDIA_API_KEY',
            'reasoning_content',
            'IsTransientNvidia',
            'nvidia/nemotron-3-ultra-550b-a55b:free',
            'openrouter.ai/api/v1/chat/completions',
            'openrouter.dpapi',
            'NEMOTRON_PATH_ESCAPE',
            'Test-WritablePath',
            'git_commit',
            'run_repo_process'
          )){
            if(-not$AgentText.Contains($Needle)){throw "NEMOTRON_AGENT_INVARIANT_MISSING $Needle"}
          }
          if($AgentText.Contains('Invoke-Expression')){throw 'NEMOTRON_AGENT_INVOKE_EXPRESSION_FORBIDDEN'}
          $LauncherText=Get-Content -Raw '.github/workflows/research-auto-launch.yml'
          if(-not$LauncherText.Contains("cron: '49 * * * *'")){throw 'RESEARCH_QUOTA_REFRESH_WAKE_DRIFT'}
          $WorkflowText=Get-Content -Raw '.github/workflows/research-continuation-controller.yml'
          if($WorkflowText.Contains('NVIDIA_API_KEY:')){throw 'EXTERNAL_API_KEY_BINDING_FORBIDDEN'}
          if(-not$Text.Contains('RESEARCH_AGENT_POLICY=GPT_CHAT_GITHUB_SOURCE_ONLY_NO_CODEX_NO_EXTERNAL_APIS')){throw 'NO_CODEX_EXECUTION_POLICY_MISSING'}
          if(-not$Text.Contains('gpt-authored-research-required-no-unattended-model')){throw 'NO_MODEL_WAIT_RECORD_MISSING'}
          if($Text.Contains('-Provider nvidia') -or $Text.Contains('-Provider openrouter')){throw 'EXTERNAL_API_EXECUTION_FORBIDDEN'}
          Write-Host 'WINGLESS_REPO_LOCAL_CONTROLLER_STATIC_PASS'

      - name: Verify no subscription-backed research executor
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference='Stop'
          Write-Host 'WINGLESS_RESEARCH_EXECUTOR=GPT_CHAT_GITHUB_ONLY_NO_CODEX'
          Write-Host 'WINGLESS_UNATTENDED_MODEL_CALLS=ZERO'

      - name: Full Wingless regression
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference='Stop'
          go test ./...
          if($LASTEXITCODE-ne0){throw "GO_TEST_FAILED exit=$LASTEXITCODE"}
          Write-Host 'WINGLESS_REPO_LOCAL_FULL_REGRESSION_PASS'
