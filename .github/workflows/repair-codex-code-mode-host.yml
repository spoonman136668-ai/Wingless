name: Repair Codex code mode host

on:
  push:
    branches:
      - diagnostic/repo-local-cutover-r1
    paths:
      - 'scripts/Repair-CodexCodeModeHost.ps1'
      - '.github/workflows/repair-codex-code-mode-host.yml'

permissions:
  contents: read

jobs:
  repair:
    runs-on: [self-hosted, Windows, X64, wingless-up-b]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Install verified Codex 0.154 code-mode host and smoke test
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          ./scripts/Repair-CodexCodeModeHost.ps1
