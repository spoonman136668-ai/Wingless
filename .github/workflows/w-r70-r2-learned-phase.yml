name: Wingless W-R70 R2 equal-budget learned phase first-use
on:
  push:
    branches: [research/w-r70-r2-equal-budget-learned-phase-20261014-r1]
permissions:
  contents: read
jobs:
  science:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Exact frozen SHA and new source cohort
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 9b1eac075006442c7e426ac0cb627d58102958b8 HEAD
          test "$(git hash-object research/contrib/chatgpt/20261014-w-r68-minus1-replication/execute.py)" = 04222695ef33a1f5a0c9c67baf6cc1d286a304e1
          test "$(git hash-object research/contrib/chatgpt/20261014-w-r70-r2-learned-phase/execute.py)" = 7c6419850010bc8c33bf10a8dcf0e0946ed84778
          test "$(git hash-object research/contrib/chatgpt/20261014-w-r70-r2-learned-phase/prereg.json)" = 0faaf01b4d19b354c4f8734d6a4f89f10fb00b8e
          python3 -m json.tool research/contrib/chatgpt/20261014-w-r70-r2-learned-phase/prereg.json >/dev/null
          python3 -m py_compile research/contrib/chatgpt/20261014-w-r70-r2-learned-phase/execute.py
          python3 - <<'PY'
          import json
          p=json.load(open("research/contrib/chatgpt/20261014-w-r70-r2-learned-phase/prereg.json"))
          assert p["sealed_heldout_seeds"]==[13344,13360]
          held=set(range(*p["sealed_heldout_seeds"]))
          for other in ((10112,10136),(10208,10232),(10432,10456),(12672,12688),(13312,13328)):
              assert held.isdisjoint(range(*other))
          print("R2_KNOWN_SEALED_NONOVERLAP=PASS")
          PY
      - name: Development-only import and full fit qualification before sealed use
        run: |
          set -euo pipefail
          python3 -B - <<'PY'
          import importlib.util
          p="research/contrib/chatgpt/20261014-w-r70-r2-learned-phase/execute.py"
          spec=importlib.util.spec_from_file_location("w70_r2_qualified_dev",p)
          assert spec and spec.loader
          mod=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)
          assert mod.w67 is mod.w68
          trained=mod.fit()
          assert len(trained)==9
          assert all(x["examples"]==1728 and len(x["weights"])==16 for x in trained.values())
          assert all(x["source_counts"]["xorshift_independent"]==0 for x in trained.values())
          print("R2_DEVELOPMENT_IMPORT_AND_EQUAL_BUDGET_FIT=PASS")
          PY
      - name: One original frozen source first-use
        run: |
          set -euo pipefail
          python3 -B research/contrib/chatgpt/20261014-w-r70-r2-learned-phase/execute.py > /tmp/W-R70-R2-original.json
          python3 -m json.tool /tmp/W-R70-R2-original.json >/dev/null
          python3 - <<'PY'
          import json
          a=json.load(open("/tmp/W-R70-R2-original.json"))
          assert a["sealed_heldout_seeds"]==list(range(13344,13360))
          assert a["training_examples_per_fit"]==1728 and a["model_width"]==16
          assert len(a["all_heldout_records"])==1728
          assert a["model_calls"]==0 and a["accepted_ref_mutation"] is False
          assert a["classification"] in ("EQUAL_BUDGET_LEARNED_PHASE_TRANSFER",
                   "PARTIAL_LEARNED_PHASE_TRANSFER","NO_EQUAL_BUDGET_PHASE_GAIN")
          print("CLASSIFICATION",a["classification"])
          print("ARM_ACCURACIES",a["aggregate_accuracy"])
          print("PAIRED_DELTA",a["balanced_minus_baseline"])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: W-R70-R2-original-learned-phase
          path: /tmp/W-R70-R2-original.json
          if-no-files-found: error
          retention-days: 90
      - name: Full Wingless repository regression and build
        run: go test ./... && go build ./...
